"2026-10-09 (after fix)", "enrichNotes": "(unmarked, minor) The intro is now readable alone and keeps the book's meaning (P.4.9: make all the denominators the same first; the 'expand' wording now sits on 025T). But the example 1/2 + 1/3 = 3/6 + 2/6 = 5/6 and the phrase 'as we do for fractions' are not in the book. P.4.5 and P.4.27 say 'similar to fractions' only for multiplication and division, and the card has no inferred note. Both are true. Record them as authored in an inferred note; no text change."}, "inferred": "The book says make all the denominators the same first (P.4.9). The fraction example and 'as we do for fractions' are ours, so the intro needs nothing taught later.", "parent": null, "role": null, "short": "Make the denominators the same", "treeOrder": 20}, {"id": "S2C4-025T", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "keyIdea": "K4-5", "level": "core", "sources": [{"page": "Page09", "printed": "4.9", "where": "main text"}, {"page": "Page27", "printed": "4.27", "where": "summary"}], "nonFoundation": false, "teacherOnly": false, "inSummary": true, "splitFrom": "S2C4-025", "title": "Different denominators, step by step", "statement": "Find a common denominator, such as the L.C.M., and expand the fraction(s) to it. Then add or subtract the numerators, and keep the denominator unchanged.", "inferred": "The steps are the book's (P.4.9: expand, then add or subtract the numerators), with finding the L.C.M. from its More to Learn box ('We may regard $6x$ as the L.C.M.') written as Step 1.", "visual": {"type": "table", "head": "col", "words": false, "rows": [["Step 1", "The L.C.M. of $2x$ and $3x$ is $6x$."], ["Step 2", "$\\frac{1}{2x} + \\frac{1}{3x} = \\frac{3}{6x} + \\frac{2}{6x}$"], ["Step 3", "$= \\frac{3 + 2}{6x} = \\frac{5}{6x}$"]]}, "check": {"pages": ["4.27", "4.9"], "date": "2026-10-09", "result": "split from S2C4-025", "notes": "", "enrich": "kept: Tree check (9 Oct): its proposal had a 21-word sentence; the stage file says the same in two short sentences, in the table's order.", "enrichNotes": "(ambiguous, minor) The statement says 'First expand ...', but the table's Step 1 is 'The L.C.M. of 2x and 3x is 6x', and expanding is Step 2. The book's own Step 1 is 'Expand' and its Step 2 is 'Add/subtract the numerators' (P.4.9). So a student reads 'first expand' and then sees a different first step. The maths in every row is correct (3/6x + 2/6x = 5/6x). Change the statement so that its order matches the table, keeping the book's 'may' for the L.C.M. ('We may regard 6x as the L.C.M.').; (unmarked, minor, record) The card has no inferred note. Step 1 comes from the 'More to Learn' box on P."}, "joins": ["S2C4-026", "S2C4-029", "S2C4-031"], "parent": null, "role": null, "short": "Different denominators, step by step", "treeOrder": 25}, {"id": "S2C4-026", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "How to expand an algebraic fraction", "statement": "To expand an algebraic fraction, multiply its numerator and its denominator by the same number or expression. We do this to make all the denominators the same.", "example": "$\\frac{4}{x} = \\frac{4 \\times y}{x \\times y} = \\frac{4y}{xy}$", "sources": [{"page": "Page09", "printed": "4.9", "where": "margin note"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page10", "printed": "4.10", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book uses the word 'expand' (4.9) and shows the multiplication in a thought bubble and in margin notes beside Examples 6 and 7; it does not define the word in a sentence. The book also uses 'expand' for removing brackets ('to expand $(3x + 5)(3x - 5)$', P.4.36) and does not point out the two meanings.", "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.10", "4.9"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'to give two fractions the same denominator' narrows the book's purpose, which is 'to make all the denominators the same' (P.4.9); Exercise 4B Q18 has three fractions.; (unmarked) The inferred note explains 'Keeps its value', a phrase that is no longer on the card. | final: (unmarked) The short label 'Expanding keeps the value' states a fact the audit removed from this card: 'keeps its value' is not on the card, and the book does not say it. The label should name what the card says. The card text and example ($\\frac{4}{x} = \\frac{4y}{xy}$, Example 7(b), P.4.10) are correct.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-025", "role": "method", "short": "Expanding an algebraic fraction", "treeOrder": 21}, {"id": "S2C4-027", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Least common multiple (L.C.M.) of denominators", "statement": "For $\\frac{1}{2x}$ and $\\frac{1}{3x}$, we use the least common multiple (L.C.M.) of $2x$ and $3x$ as the common denominator. Line up the factors as in the table, then take one factor from each column: $2 \\cdot 3 \\cdot x = 6x$.", "sources": [{"page": "Page09", "printed": "4.9", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the 'More to Learn' box on P.4.9, printed in black for students; the term 'least common multiple' is in purple italics and in the glossary strip. The book writes 'We may regard $6x$ as the L.C.M.' and lines up the factors $2$, $3$ and $x$ in columns; the table copies that layout, and 'take one factor from each column' is a reading of it. The box shows the L.C.M. only for $2x$ and $3x$; the definition of L.C.M. is in teacher notes N6 and N7 (separate card).", "keyIdea": "K4-5", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["$2x$", "$2$", "", "$x$"], ["$3x$", "", "$3$", "$x$"], ["L.C.M.", "$2$", "$3$", "$x$"]], "words": false}, "check": {"pages": ["4.9"], "date": "2026-10-07", "result": "fixed", "notes": "(ambiguous) 'Write $2x = 2 \\cdot x$ and $3x = 3 \\cdot x$, so the L.C.M. is $2 \\cdot 3 \\cdot x$' hides how the book gets it. The book lines the factors up in columns, so the common factor $x$ is used once. In one line of text a student cannot see why it is not $2 \\cdot x \\cdot 3 \\cdot x$. A table keeps the book's layout.", "final": "pass", "enrich": "2026-10-09 (after fix)", "enrichNotes": "(modality, minor) The new first sentence, 'The common denominator of 1/(2x) and 1/(3x) is the L.C.M. of 2x and 3x', says there is only one common denominator. But 12x is also a common denominator; the book says only 'We may regard 6x as the L.C.M. of 2x and 3x' (P.4.9 More to Learn). The card no longer leans on 025's example, and it refers to nothing read later. The table and 2·3·x = 6x are correct."}, "parent": "S2C4-025", "role": "method", "short": "The L.C.M. of the denominators", "treeOrder": 22}, {"id": "S2C4-028", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "definition", "title": "What the L.C.M. means", "statement": "The L.C.M. is one of the common multiples of the expressions, and it is also a factor of all the other common multiples.", "example": "Multiples of $2x$: $2x, 4x, 6x, 8x, 10x, 12x, \\ldots$; multiples of $3x$: $3x, 6x, 9x, 12x, 15x, \\ldots$; common multiples: $6x, 12x, \\ldots$; so the L.C.M. of $2x$ and $3x$ is $6x$. N7 practice pairs: the L.C.M. of $x$ and $4x$ is $4x$; of $2x$ and $y$ is $2xy$; of $4k$ and $6k$ is $12k$; of $m$ and $m+1$ is $m(m+1)$; of $p-1$ and $3(p-1)$ is $3(p-1)$; of $x+1$ and $2x-1$ is $(x+1)(2x-1)$.", "sources": [{"page": "Page09", "printed": "4.9", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher notes N6 (two stars, the definition and the multiples example) and N7 (two stars, the practice pairs with answers), printed in magenta.", "keyIdea": "K4-5", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note beyond the revision focus."}, {"id": "S2C4-029", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "One denominator is a multiple of the other", "statement": "If one denominator is a multiple of the other denominator, use this multiple as the common denominator. Then ==only== the other fraction needs to be expanded.", "example": "$\\frac{1}{8x} + \\frac{1}{2x} = \\frac{1}{8x} + \\frac{4}{8x} = \\frac{5}{8x}$: ==only== $\\frac{1}{2x}$ is expanded.", "sources": [{"page": "Page09", "printed": "4.9", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Shown in Example 6 and its margin notes; the book does not state this as a rule.", "keyIdea": "K4-5", "level": "supporting", "check": {"pages": ["4.9"], "date": "2026-10-07", "result": "fixed", "notes": "(ambiguous) In 'If one denominator is already a multiple of the other, use it as the common denominator', the nearest noun to 'it' is 'the other'. A weak reader may use the smaller denominator. Name the multiple.", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-027", "role": "property", "short": "One denominator is the other's multiple", "treeOrder": 23}, {"id": "S2C4-030", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "common-mistake", "title": "Never add numerators and denominators separately", "statement": "When we add or subtract algebraic fractions, we ==cannot== add or subtract the numerators and the denominators separately.", "example": "$\\frac{1}{2} + \\frac{1}{2} = 1$, not $\\frac{1+1}{2+2} = \\frac{1}{2}$. In the same way, $\\frac{1}{x} + \\frac{1}{x} = \\frac{2}{x}$, not $\\frac{2}{2x}$.", "sources": [{"page": "Page10", "printed": "4.10", "where": "main text"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}, {"page": "Page33", "printed": "4.33", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The example with halves is ours (overnight audit, 7 October), so that the wrong way visibly gives a wrong answer; the book's example is Example 6(b).", "keyIdea": "K4-4", "level": "core", "check": {"pages": ["4.10", "4.28", "4.33"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07", "enrich": "2026-10-09", "enrichNotes": ""}, "parent": "S2C4-023", "role": "warning", "short": "Never add the denominators", "treeOrder": 18}, {"id": "S2C4-031", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "No common factor: multiply the denominators", "statement": "If the denominators have no common factor, use their product as the common denominator. Expand each fraction by multiplying its numerator and denominator by the other denominator.", "example": "$\\frac{4}{x} - \\frac{1}{y} = \\frac{4y}{xy} - \\frac{x}{xy} = \\frac{4y-x}{xy}$", "sources": [{"page": "Page10", "printed": "4.10", "where": "example"}, {"page": "Page12", "printed": "4.12", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Shown in Examples 7(b) and 10 and their margin notes; the book does not state the rule in words. Teacher note N7 includes such pairs (for example $m$ and $m+1$, L.C.M. $m(m+1)$).", "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.10", "4.12"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-027", "role": "property", "short": "No common factor: multiply denominators", "treeOrder": 24}, {"id": "S2C4-032", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "property", "title": "Where the negative sign of a fraction goes", "statement": "For polynomials $P$ and $Q$ ($Q \\neq 0$), $\\frac{-P}{Q} = \\frac{P}{-Q} = -\\frac{P}{Q}$. So a negative sign in front of the whole numerator or the whole denominator can move to the front of the fraction.", "example": "$\\frac{1}{-(x-4)} = -\\frac{1}{x-4}$", "sources": [{"page": "Page10", "printed": "4.10", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The second sentence is a plain reading of the margin formula.", "keyIdea": "K4-6", "level": "core", "check": {"pages": ["4.10"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "confirmed": "2026-10-07"}, "parent": null, "role": null, "short": "$\\frac{-P}{Q} = \\frac{P}{-Q} = -\\frac{P}{Q}$", "treeOrder": 27}, {"id": "S2C4-033", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Denominators that are negatives of each other", "statement": "If one denominator is the negative of the other, rewrite one of them, for example $4 - x = -(x - 4)$. Then the denominators are the same, and the sign between the fractions changes.", "example": "$\\frac{2}{x-4} + \\frac{1}{4-x} = \\frac{2}{x-4} - \\frac{1}{x-4} = \\frac{1}{x-4}$", "sources": [{"page": "Page10", "printed": "4.10", "where": "example"}, {"page": "Page11", "printed": "4.11", "where": "example"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}, {"page": "Page30", "printed": "4.30", "where": "exercise"}, {"page": "Page33", "printed": "4.33", "where": "exercise"}, {"page": "Page37", "printed": "4.37", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Shown in Example 8 (red ribbon badge). The general sentence is a reading of the worked steps. The magenta Clue to Supplementary Exercise Q53(a) (P.4.31) states $2 - x = -(x - 2)$ for the same purpose. Supplementary Exercise Q37 (P.4.30), MC Q66 (P.4.33) and HKCEE 2008 Q11 (P.4.37) test the same idea.", "keyIdea": "K4-6", "level": "core", "check": {"pages": ["4.10", "4.11", "4.30", "4.31", "4.33", "4.37"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-013", "role": "method", "short": "$x - 4$ and $4 - x$ as denominators", "treeOrder": 30}, {"id": "S2C4-034", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "common-mistake", "title": "When does a fraction equal $-1$?", "statement": "If the denominator is the negative of the numerator, the fraction is $-1$: $\\frac{a+b}{-a-b} = \\frac{a+b}{-(a+b)} = -1$. But $\\frac{a+b}{-a+b}$ does not simplify to $-1$, because $-a + b = -(a - b)$.", "example": "$\\frac{x-5y}{5y-x} = -1$, because $5y - x = -(x - 5y)$.", "sources": [{"page": "Page11", "printed": "4.11", "where": "teacher note"}, {"page": "Page07", "printed": "4.7", "where": "exercise"}, {"page": "Page13", "printed": "4.13", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The words are only in teacher note N8 (two stars, 'For P.4.10'), printed in magenta at the foot of P.4.11; the N8 tag sits beside Example 8(a) on P.4.10. Students meet the result in Exercise 4A Q31 (P.4.7) and Exercise 4B Q25 (P.4.13), whose printed answers are $-1$, so the card is not teacher-only. The book writes $-\\frac{a+b}{a-b} \\neq -1$; strictly, it is not $-1$ in general (it equals $-1$ only when $b = 0$).", "keyIdea": "K4-6", "level": "core", "check": {"pages": ["4.11", "4.13", "4.7"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-013", "role": "consequence", "short": "When a fraction is $-1$", "treeOrder": 31}, {"id": "S2C4-035", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Write a whole number as a fraction", "statement": "To add or subtract a whole number and "], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-032", "role": "warning", "short": "Brackets round a subtracted numerator", "treeOrder": 33}, {"id": "S2C4-037", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "property", "title": "One answer can be written in several forms", "statement": "The same answer can be written in different forms. You ==may== rewrite an answer, for example to match an option in a multiple-choice question.", "example": "$-\\frac{2}{(2x+1)(2x-1)}$ can also be written as $\\frac{2}{(2x+1)(1-2x)}$.", "sources": [{"page": "Page12", "printed": "4.12", "where": "margin note"}, {"page": "Page35", "printed": "4.35", "where": "DSE support"}, {"page": "Page23", "printed": "4.23", "where": "teacher note"}, {"page": "Page36", "printed": "4.36", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book gives only examples: the margin note beside Example 10 (P.4.12), the speech bubble in the Short Question Tutor (P.4.35), teacher note N16 ($v = \\frac{2s-ut}{t} = \\frac{2s}{t} - u$, P.4.23) and the MC Question Tutor, which writes $\\frac{-10}{9x^2-25} = \\frac{10}{25-9x^2}$ to match option D (P.4.36). The general sentences are a plain reading of these.", "keyIdea": "K4-6", "level": "supporting", "check": {"pages": ["4.12", "4.23", "4.35", "4.36"], "date": "2026-10-07", "result": "fixed", "notes": "(context) The example $x = \\frac{9-2y}{3} = 3 - \\frac{2}{3}y$ comes from the change-of-subject tutor (P.4.35, section 4.3). This card sits in addition and subtraction (K4-5), where students have not met formulae or a subject yet. The book gives its own example in this section: the margin note beside Example 10 (P.4.12).", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-013", "role": "property", "short": "One answer, different forms", "treeOrder": 32}, {"id": "S2C4-038", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Factorize the denominators first", "statement": "When working with algebraic fractions, factorize the denominators first if you can, for example $2x + 2y = 2(x + y)$ and $3x + 3y = 3(x + y)$.", "sources": [{"page": "Page31", "printed": "4.31", "where": "exercise"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Given only as the magenta Clue to Supplementary Exercise Q55, a change-of-subject question with the fractions $\\frac{a}{2x+2y}$ and $\\frac{b}{3x+3y}$.", "keyIdea": "K4-5", "level": "supporting", "hidden": true, "hiddenWhy": "A magenta Clue for one exercise question, not a knowledge point to revise."}, {"id": "S2C4-039", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "link", "title": "Use $(a+b)(a-b) \\equiv a^2 - b^2$ for denominators", "statement": "The identity $(a + b)(a - b) \\equiv a^2 - b^2$ can be used to expand a product of denominators, for example $(3x + 5)(3x - 5) = 9x^2 - 25$.", "sources": [{"page": "Page36", "printed": "4.36", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-5", "level": "extra", "hidden": true, "hiddenWhy": "An identity from an earlier chapter, used in one DSE question."}, {"id": "S2C4-040", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "definition", "title": "Formula", "statement": "A **formula** is an equality showing the relation among variables. We learnt this in Book 1A Chapter 4.", "example": "The area $A$ of a triangle with base $b$ and height $h$ is given by the formula $A = \\frac{1}{2}bh$.", "sources": [{"page": "Page14", "printed": "4.14", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book recalls the definition from Book 1A Chapter 4 (P.4.14).", "keyIdea": "K4-7", ], "fill": "tint"}, {"poly": [[190, 100], [320, 100], [240, 30]], "fill": "warm"}, {"line": [[240, 30], [240, 100]], "style": "dashed"}, {"path": [[240, 92], [248, 92], [248, 100]], "style": "muted"}, {"line": [[190, 114], [320, 114]], "style": "muted", "arrows": "both"}], "labels": [{"x": 80, "y": 104, "tex": "$\\ell$", "pos": "below"}, {"x": 144, "y": 65, "tex": "$w$", "pos": "right"}, {"x": 243, "y": 62, "tex": "$h$", "pos": "right"}, {"x": 255, "y": 114, "tex": "$b$"}, {"x": 80, "y": 150, "tex": "Perimeter: $P = 2(\\ell + w)$"}, {"x": 255, "y": 150, "tex": "Area: $A = \\frac{1}{2}bh$"}], "maxw": 460, "alt": "A rectangle with length l and width w, perimeter P equals 2 times (l plus w); a triangle with base b and height h, area A equals one half b h."}, "check": {"pages": ["4.14"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'The letters in a formula are its variables' says every letter is a variable. The book only lists 'Variables: P, ℓ, w' and 'A, b, h'. Its own formulae have letters that are not variables, such as π in V = ⅓πr²h (P.4.15) and C = 2πr (P.4.17). Say each variable is a letter that stands for a quantity, not the reverse. | final: (scope) The short label 'Its letters are variables' repeats the fault the audit fixed in the statement. It says every letter in a formula is a variable, but $\\pi$ in $V = \\frac{1}{3}\\pi r^2 h$ (P.4.15) is not. The statement and the table are correct.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-040", "role": "notation", "short": "Variables stand for quantities", "treeOrder": 35}, {"id": "S2C4-043", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "link", "title": "Formulae describe how quantities are related", "statement": "Scientists use formulae to describe the relations among different quantities.", "example": "STEM Zone: if $V$, $I$, $R$ and $P$ are the voltage, current, resistance and power of an electric circuit, then $V = IR$ and $P = VI$.", "sources": [{"page": "Page14", "printed": "4.14", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the STEM Zone box beside 4.2. The physics formulae are only an example of what formulae describe; students are not expected to learn them.", "keyIdea": "K4-7", "level": "extra", "hidden": true, "hiddenWhy": "A STEM Zone remark that repeats what a formula is."}, {"id": "S2C4-044", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "method-idea", "title": "Substitution: find a value from a formula", "statement": "When all the other variables in a formula have given values, we can find the value of the unknown. We put the given values in place of the letters: this is the **method of substitution**.", "example": "A rectangle has length $\\ell$ cm, width $w$ cm and perimeter $P$ cm; when $\\ell = 5$ and $w = 3$, $P = 2(5 + 3) = 16$.", "sources": [{"page": "Page14", "printed": "4.14", "where": "main text"}, {"page": "Page01", "printed": "4.1", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book names 'the method of substitution' but does not define it here; 'put the given values in place of the letters' is a reading of the worked example. The opener Q&A answer (156 cm) is printed in magenta.", "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.1", "4.14"], "date": "2026-10-07", "result": "fixed", "notes": "(condition) 'If the values of some variables ... are given, we can find the value of another variable' drops 'all'. In P = 2(ℓ + w), the book gives both ℓ and w to find P. If only ℓ is given, P cannot be found.; (context) The example writes 'ℓ = 5 cm'. The book writes the letter as a number with the unit after it: 'length ℓ m', 'When ℓ = 5 and w = 3, P = 2(5 + 3) = 16'.", "final": "pass"}, "parent": "S2C4-040", "role": "method", "short": "Substitution", "treeOrder": 38}, {"id": "S2C4-045", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "method-idea", "title": "One way: substitute first, then solve the equation", "statement": "A rectangle has perimeter $P$ cm, length $\\ell$ cm and width $w$ cm, so $P = 2(\\ell + w)$. To find $w$ when $P$ and $\\ell$ are given, we can substitute the given values first, then solve the equation.", "example": "When $P = 16$ and $\\ell = 5$, we get $16 = 2(5 + w)$, so $8 = 5 + w$ and the width is 3 cm.", "sources": [{"page": "Page14", "printed": "4.14", "where": "main text"}, {"page": "Page14", "printed": "4.14", "where": "example"}, {"page": "Page16", "printed": "4.16", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The magenta Exercise Objective on 4.16 names this skill: 'Find the value of a variable by the method of substitution and the techniques in solving equations.' Example 11 (P.4.14) substitutes first; Example 17 (P.4.23) shows the other way, changing the subject first. The numbers in the example are written for this card.", "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.14", "4.16"], "date": "2026-10-07", "result": "fixed", "notes": "(modality) 'substitute the given values first' reads as the only way. Example 11 substitutes first, but Example 17 (P.4.23) changes the subject first and then substitutes. Write 'we can'.; (context) P, ℓ and w are used in the statement without saying they are the perimeter, length and width of a rectangle. The example also writes 'P = 16 cm', but the book writes the letter as a number with the unit after it ('perimeter P m', 'When P = 330 and ℓ = 100').; (unmarked) The example (16, 5, 3) is written for the card; the book's Example 11 uses 330 m and 100 m. The inferred note still talks about a  | final: (modality) The title 'Substitute first, then solve the equation' reads as the only order. The audit changed the statement to 'we can substitute ... first' because Example 17 (P.4.23) changes the subject first. The sister card S2C4-073 is titled 'One way: change the subject, then substitute", "final": "fixed", "confirmed": "2026-10-07", "enrich": "2026-10-09 (after fix)", "enrichNotes": "(english) In the example, '$\\ell = 5$, $16 = 2(5 + w)$' puts the 5 and the 16 side by side with only a comma between them, so a weak reader can read '5, 16' as a list. Also, 'and $8 = 5 + w$' joins a step of solving with 'and', where the logic is 'so' (we divide both sides by 2). The card's claim is 'substitute first, then solve', so the example should show the substitution and then the solving step. The maths is correct ($16 \\div 2 = 8$, $8 - 5 = 3$). The statement matches P.4.14 ('to find $w$ with a given $P$ and $\\ell$ ... apply the techniques in solving equations'), and 'we can' is right b"}, "parent": "S2C4-044", "role": "extends", "short": "Substitute, then solve", "treeOrder": 40}, {"id": "S2C4-046", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "notation", "title": "Letters stand for numbers; units go outside", "statement": "In a formula problem, a letter stands for a number ==only==, and the unit is written after the letter, as in '$\\ell$ m' or '$A$ cm$^2$'. We substitute the numbers, and we write the unit in the final answer.", "example": "Example 11: the pitch has length $\\ell$ m, width $w$ m and perimeter $P$ m. We substitute $P = 330$ and $\\ell = 100$, and the answer is '*The width of the pitch is 65 m.*' Instant Drill 11 and Example 12 write '$A$ cm$^2$', '$b$ cm', '$h$ cm' and '$V$ cm$^3$' in the same way.", "sources": [{"page": "Page14", "printed": "4.14", "where": "example"}, {"page": "Page15", "printed": "4.15", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book never states this in words; it is read from how the problems are written. The questions write '$\\ell$ m', '$P$ m', '$A$ cm$^2$' and '$V$ cm$^3$'; the solutions substitute numbers only ($P = 330$, $\\ell = 100$ in Example 11; $r = 3$, $h = 7$ in Example 12) and give the unit in the concluding sentence ('The width of the pitch is 65 m.'). Example 12 does show units inside a later division step (1 000 cm³ divided by 65.94 cm³).", "keyIdea": "K4-7", "level": "supporting", "hidden": true, "hiddenWhy": "Read from the working only; the book never states it."}, {"id": "S2C4-047", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "method-idea", "title": "Answering 'Explain your answer' with a formula", "statement": "To answer a question such as '*Is it enough? Explain your answer.*', work out the needed quantity with the formula, compare the result with the given number, and write down the conclusion.", "example": "Example 12 (paper cup, $V = \\frac{1}{3}\\pi r^2 h$): find the capacity of each cup (65.94 cm$^3$); find how many cups 1 000 cm$^3$ of water can fill (15.17, cor. to 2 d.p.); since $15.17 > 15$, 1 000 cm$^3$ of water is enough to fill up 15 such cups.", "figure": "A paper cup drawn as an upside-down cone, with base radius $r$ cm marked across the top circle and height $h$ cm marked down the side.", "sources": [{"page": "Page15", "printed": "4.15", "where": "margin note"}, {"page": "Page15", "printed": "4.15", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the 'Explain Tutor' box beside Example 12 (black text, for students), which lists the three steps for this example. The general wording of the first sentence is a reading of those steps. Example 12 and Exercise 4C Questions 25 and 26(b) carry an 'Explain' tag.", "keyIdea": "K4-7", "level": "supporting", "hidden": true, "hiddenWhy": "Exam technique (answering 'Explain your answer'), not a knowledge point."}, {"id": "S2C4-048", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "link", "title": "Sum of 1 to m and triangular numbers", "statement": "The formula $S = \\frac{m(m+1)}{2}$ means $1 + 2 + 3 + \\cdots + m = \\frac{m(m+1)}{2}$. Also, $\\frac{m(m+1)}{2}$ is the general term of the sequence of triangular numbers learnt in Book 1A Chapter 4. Abler students ==may== deduce that the sum $S'$ of the first $n$ positive even numbers is $S' = n(n+1)$, and the sum $S''$ of the first $k$ positive odd numbers is $S'' = k^2$.", "sources": [{"page": "Page16", "printed": "4.16", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N11 (three stars), printed in magenta beside Class Practice 4.3 Question 4. The formula itself is printed for students only inside that question.", "keyIdea": "K4-7", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note beyond the revision focus."}, {"id": "S2C4-049", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "method-idea", "title": "Substituting a negative value", "statement": "A variable can have a negative value. When you substitute a negative number, put it in brackets.", "example": "If $x = -3$, then $x^2 = (-3)^2 = 9$ and $2x = 2 \\times (-3) = -6$.", "sources": [{"page": "Page16", "printed": "4.16", "where": "exercise"}, {"page": "Page17", "printed": "4.17", "where": "exercise"}, {"page": "Page18", "printed": "4.18", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. The text of 4.2 never substitutes a negative number; Exercise 4C Q8, Q14 and Q20 (P.4.16 to 4.18) give $x = -6$, $v = -2$ and $b = -6$. The advice to use brackets is not printed in the book. The example is written for this card.", "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.16", "4.17", "4.18"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-044", "role": "warning", "short": "Brackets for a negative value", "treeOrder": 39}, {"id": "S2C4-050", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "notation", "title": "Small numbers below a letter: different variables", "statement": "$r_1$ and $r_2$ are two different variables, so they ==may== have different values. The small numbers 1 and 2 below the letter only show that they are different variables.", "sources": [{"page": "Page18", "printed": "4.18", "where": "exercise"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. Exercise 4C Q23 (P.4.18) uses $r_1$ and $r_2$, and Supplementary Exercise Q56 (P.4.31) uses $h_1$, $h_2$ and $h_3$ for the three heights of a triangle. The book does not use the word 'subscript'.", "keyIdea": "K4-7", "level": "supporting", "example": "The three heights of a triangle can be called $h_1$, $h_2$ and $h_3$.", "check": {"pages": ["4.18", "4.31"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-042", "role": "notation", "short": "$r_1$ and $r_2$: two variables", "treeOrder": 36}, {"id": "S2C4-051", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "definition", "title": "The subject of a formula", "statement": "The **subject of a formula** is the variable that stands ==alone== on one side and does not appear on the other side.", "example": "For a parallelogram with base $b$ and height $h$, the area is $A = bh$, and $A$ is the subject.", "sources": [{"page": "Page19", "printed": "4.19", "where": "main text"}, {"page": "Page27", "printed": "4.27", "where": "summary"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "Checkpoint Q5 (P.4.28) tests the definition for students.", "keyIdea": "K4-8", "level": "core", "term": "subject of a formula", "positive": {"example": "$p$ in $p = q + 4r$", "why": "$p$ stands ==alone== on one side and does not appear on the other side.", "source": "book (P.4.28)"}, e is the student margin note on P.4.19. The Q&A on P.4.34 and Exercise 4D Q22 and Q23 use 'Express ... in terms of ...' as an instruction.", "keyIdea": "K4-8", "level": "core", "check": {"pages": ["4.19", "4.20", "4.34"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-09", "enrichNotes": "(record, minor) The text is correct, and the card no longer uses 'making x the subject' before K4-9. But its inferred note still says 'The second is teacher note N13 (P.4.20), which says similar to', and its sources still list the P.4.20 teacher note. That sentence has moved to S2C4-058, so update this note."}, "parent": "S2C4-051", "role": "wording", "short": "Expressed in terms of", "treeOrder": 42}, {"id": "S2C4-053", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "condition", "title": "Not the subject: other terms beside it", "statement": "In $y + 1 = 4x - x$, $y$ is not the subject, because $y$ is not the ==only== term on the left-hand side.", "sources": [{"page": "Page19", "printed": "4.19", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N12(a), printed in magenta on P.4.19.", "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.19"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-051", "role": "warning", "short": "Not alone: not the subject", "treeOrder": 43}, {"id": "S2C4-054", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "condition", "title": "Not the subject: it appears on both sides", "statement": "In $y = 1 - x + 2y$, $y$ is not the subject, because $y$ appears on __both sides__ of the formula.", "sources": [{"page": "Page19", "printed": "4.19", "where": "teacher note"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Stated in words only in teacher note N12(b) (magenta, P.4.19). Checkpoint Q6 (P.4.28) tests the same point for students.", "keyIdea": "K4-8", "level": "core", "example": "$c$ is not the subject of $c = \\frac{3b-bc}{a}$, because $c$ also appears on the right-hand side.", "check": {"pages": ["4.19", "4.28"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-051", "role": "warning", "short": "On both sides: not the subject", "treeOrder": 44}, {"id": "S2C4-055", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "property", "title": "The subject can be on the right-hand side", "statement": "The subject may be on the right-hand side. It ==only== needs to stand ==alone== on one side and not appear on the other side.", "sources": [{"page": "Page19", "printed": "4.19", "where": "Q&A"}, {"page": "Page22", "printed": "4.22", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The Quick Quiz answers ($A$, $S$ and $c$) are printed in magenta, and teacher note N14 states the idea in words. For students it follows from the words 'stands alone on one side'.", "keyIdea": "K4-8", "level": "core", "example": "In $P + I = A$ and $\\frac{a}{1-r} = S$, the subjects are $A$ and $S$.", "check": {"pages": ["4.19", "4.22"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-051", "role": "property", "short": "Subject may be on the right", "treeOrder": 45}, {"id": "S2C4-056", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "notation", "title": "L.H.S. and R.H.S.", "statement": "L.H.S. means the left-hand side of a formula, and R.H.S. means the right-hand side.", "sources": [{"page": "Page19", "printed": "4.19", "where": "teacher note"}, {"page": "Page22", "printed": "4.22", "where": "teacher note"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}, {"page": "Page04", "printed": "4.4", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "The abbreviations appear only in magenta teacher material: N4 (P.4.4), N12 (P.4.19), N14 (P.4.22) and the Clue to Supplementary Exercise Q54 (P.4.31). The student text writes 'left-hand side' in full (P.4.20, P.4.21). The book does not define them; the meaning is read from use.", "keyIdea": "K4-8", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only abbreviation (L.H.S. and R.H.S.)."}, {"id": "S2C4-057", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Why we change the subject", "statement": "In $P = 2x + 3$, it is easy to find $P$ from a value of $x$: just substitute. Finding $x$ from a value of $P$ takes more work each time, so to make it simpler we first rewrite the formula so that $x$ becomes the subject.", "example": "Class Activity 4.1: the perimeter of an isosceles triangle with two equal sides of $x$ cm and a base of 3 cm is $P = 2x + 3$. Rewritten with $x$ as the subject, it is $x = \\frac{P-3}{2}$.", "figure": "An isosceles triangle $ABC$ with $AB = AC = x$ cm and $BC = 3$ cm.", "sources": [{"page": "Page20", "printed": "4.20", "where": "activity"}, {"page": "Page20", "printed": "4.20", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-9", "level": "supporting", "hidden": true, "hiddenWhy": "A lead-in from the Class Activity: why we change the subject."}, {"id": "S2C4-058", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "definition", "title": "Changing the subject of a formula", "statement": "Rewriting a formula so that another variable becomes the subject is called **changing the subject of the formula**. Making $x$ the subject of $P = 2x + 3$ is similar to expressing $x$ in terms of $P$.", "example": "$P = 2x + 3$ is rewritten as $x = \\frac{P-3}{2}$, so the subject changes from $P$ to $x$.", ect on the left-hand side. So we write $\\frac{P-3}{2} = x$ as $x = \\frac{P-3}{2}$.", "sources": [{"page": "Page20", "printed": "4.20", "where": "margin note"}, {"page": "Page21", "printed": "4.21", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-9", "level": "supporting", "check": {"pages": ["4.20", "4.21"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "confirmed": "2026-10-07 (after fix)"}, "parent": "S2C4-059", "role": "notation", "short": "Subject usually on the left", "treeOrder": 51}, {"id": "S2C4-063", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "wording", "title": "Ways to ask for a change of subject", "statement": "Questions ask for a change of subject in different words. A letter in square brackets after a formula, such as $[y]$, is the new subject.", "sources": [{"page": "Page20", "printed": "4.20", "where": "example"}, {"page": "Page22", "printed": "4.22", "where": "example"}, {"page": "Page23", "printed": "4.23", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-9", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["The question says", "The new subject"], ["Change the subject of the formula to $v$.", "$v$"], ["Make $y$ the subject of the formula.", "$y$"], ["$x = 4y - 2 \\quad [y]$", "$y$"]], "words": true}, "check": {"pages": ["4.20", "4.22", "4.23"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-058", "role": "wording", "short": "Asking for a new subject", "treeOrder": 47}, {"id": "S2C4-064", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "The order of steps depends on the formula", "statement": "The order of the steps depends on the formula. In $x = 4y - 2$, transpose the term $-2$ first; in $a = \\frac{b+8}{3}$, convert '$\\div 3$' into '$\\times 3$' first.", ich": "2026-10-09", "enrichNotes": "Figure labels checked against x = 4y − 2 (P.4.21). Top row: y, ×4 gives 4y, −2 gives 4y − 2, into the box 'x = 4y − 2'. Bottom row, back from the same box: +2 gives x + 2 (= 4y, true because x + 2 = 4y − 2 + 2), ÷4 gives (x + 2)/4, into the box y. Each undo box sits under the step it undoes, in the same colour, with a dashed 'undoes' arrow. All arrows end on box edges. The alt text describes the same picture in the same order. The statement ('multiplied by 4 first, and then 2 is subtracted ... add 2, then divide by 4') and the remember line ('the last step done to b is ÷3, so multiply both sid"}, "parent": "S2C4-064", "role": "why", "short": "Why we undo the last step first", "treeOrder": 54}, {"id": "S2C4-065", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "When a letter multiplies the new subject", "statement": "The new subject may be multiplied by a letter instead of a number. We can still divide both sides by that letter, because we assume it is not zero.", "sources": [{"page": "Page21", "printed": "4.21", "where": "example"}, {"page": "Page02", "printed": "4.2", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "No margin note explains this step; it is read from Example 14(a) (P.4.21). The reason 'we assume it is not zero' comes from the Note on P.4.2: all the algebraic fractions in this chapter have non-zero denominators, so in $x = \\frac{1-b}{a}$ we assume $a \\neq 0$. The book does not repeat this at Example 14(a).", "keyIdea": "K4-10", "level": "core", "example": "$ax + b = 1$, so $ax = 1 - b$ and $x = \\frac{1-b}{a}$.", "check": {"pages": ["4.2", "4.21"], "date": "2026-10-07", "result": "fixed", "notes": "(condition) 'We can still divide both sides by that letter' drops the non-zero condition. The card cites the P.4.2 note but does not say it. Dividing by $a$ is allowed only because the book assumes that every algebraic ctionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "New subject in a denominator", "statement": "Sometimes one whole side of a formula is a fraction with the new subject in its denominator. Then we can first multiply both sides by that denominator.", "sources": [{"page": "Page22", "printed": "4.22", "where": "example"}, {"page": "Page24", "printed": "4.24", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "No margin note names this step; it is read from Example 15. Exercise 4D Q4 and Q12 (P.4.24) test the same idea with a new subject alone in a denominator.", "keyIdea": "K4-10", "level": "core", "example": "$a = \\frac{3-y}{x+y}$ $[y]$ gives $a(x + y) = 3 - y$, so $ax + ay = 3 - y$.", "check": {"pages": ["4.22", "4.24"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'When the new subject is in a denominator, first multiply both sides by that denominator' turns one example into a general rule, and the book breaks it. In Example 16 (P.4.22), the new subject m is in a denominator, but the first step moves a/n across to get 1/m alone. The book multiplies by m only once 1/m is a whole side. Instant Drill 16 (2/x = p − 1/y, find y) is the same kind.; (modality) 'first' presents one order as the required order. Write 'we can first' and state the case the book shows: one whole side is a fraction.", "final": "pass", "enrich": "2026-10-09", "enrichNotes": ""}, "parent": "S2C4-064", "role": "method", "short": "Subject in a denominator", "treeOrder": 57}, {"id": "S2C4-068", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "New subject in more than one term: group, then factorize", "statement": "When the new subject is in more than one term, put all the terms containing it on one side. Then extract it as a common factor, and divide.", "sources": [{"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The magenta objective of Example 15 calls this 'changing the subject of a formula by grouping terms'. The last step, dividing by $(a + 1)$, has no margin note.", "keyIdea": "K4-10", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Step", "Working"], ["Start", "$ax + ay = 3 - y$"], ["Put all the terms containing $y$ on one side", "$ay + y = 3 - ax$"], ["Extract the common factor $y$", "$y(a + 1) = 3 - ax$"], ["Divide both sides by $a + 1$", "$y = \\frac{3-ax}{a+1}$"]], "words": true}, "check": {"pages": ["4.22"], "date": "2026-10-07", "result": "equivalent", "notes": " | final: (scope) The title says 'several terms' and the short label says 'In two terms', but the statement says 'in more than one term'. 'In two terms' narrows the case, and 'several' usually means more than two. Use the statement's words for the same thing.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-067", "role": "method", "short": "Subject in more than one term", "treeOrder": 58}, {"id": "S2C4-069", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Adding or subtracting algebraic fractions in a formula", "statement": "If a formula adds or subtracts algebraic fractions, we can first get the fraction with the new subject alone on one side. Then we make the other side into one fraction with a common denominator.", "sources": [{"page": "Page22", "printed": "4.22", "where": "example"}, {"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "core", "example": "$\\frac{1}{m} + \\frac{a}{n} = \\frac{1}{k}$ $[m]$ gives $\\frac{1}{m} = \\frac{1}{k} - \\frac{a}{n} = \\frac{n-ak}{kn}$.", "check": {"pages": ["4.22"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'When a formula has algebraic fractions' is wider than the book's case. The objective of Example 16 is a formula 'involving addition/subtraction of algebraic fractions'. Example 15, a = (3 − y)/(x + y), also has an algebraic fraction, but the book uses a different method there.; (english) The first sentence has 23 words. | final: (ambiguous) 'get the fraction with the new subject alone' can be read as 'the fraction in which the new subject is alone'. The book's step is $\\frac{1}{m} = \\frac{1}{k} - \\frac{a}{n}$ (Example 16, P.4.22): the fraction stands alone on one side. Add 'on one side'.; (scope) The title 'Formulae with algebraic fractions' and the short label 'With algebraic fractions' keep the wide scope the audit narrowed in the statement. Example 15, $a = \\frac{3-y}{x+y}$, also has an algebraic fraction, and the book uses a different method there (S2C4-067). The objective o", "final": "fixed", "confirmed": "2026-10-07 (after fix)", "enrich": "2026-10-09", "enrichNotes": ""}, "inferred": "The book gives no rule in words; the steps are read from Example 16 (P.4.22), whose magenta objective is 'Change the subject of a formula involving addition/subtraction of algebraic fractions'. Teacher note N15 (P.4.23) shows another way: multiply both sides by the L.C.M. of $m$, $n$ and $k$.", "parent": "S2C4-064", "role": "method", "short": "Formula that adds or subtracts fractions", "treeOrder": 59}, {"id": "S2C4-070", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Making $m$ the subject from $\\frac{1}{m}$", "statement": "If $\\frac{1}{m}$ equals a single fraction, multiply both sides by $m$ and by the denominator of that fraction. Then divide both sides by the factor that multiplies $m$.", "sources": [{"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "supporting", "example": "$\\frac{1}{m} = \\frac{n-ak}{kn}$, so $kn = m(n - ak)$ and $m = \\frac{kn}{n-ak}$.", "check": {"pages": ["4.22"], "date": "2026-10-07", "result": "fixed", "notes": "(ambiguous) 'the other denominator' does not say which denominator. 'Then divide both sides to get m alone' does not say what to divide by. The book's lines are kn = m(n − ak), then kn/(n − ak) = m: it divides by (n − ak), the factor that multiplies m. | final: (unmarked) The card has no inferred note, but both sentences are a reading of the margin working beside Example 16 (P.4.22); the book gives no words for these steps. The statement and example are correct ($kn = m(n - ak)$, $m = \\frac{kn}{n-ak}$).", "final": "fixed", "confirmed": "2026-10-07"}, "inferred": "The book gives no words for these steps; they are read from the margin working beside Example 16 (P.4.22): $\\frac{1}{m} = \\frac{n-ak}{kn}$, $kn = m(n - ak)$, $\\frac{kn}{n-ak} = m$.", "parent": "S2C4-069", "role": "method", "short": "From $\\frac{1}{m}$ to $m$", "treeOrder": 60}, {"id": "S2C4-071", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "property", "title": "Some formulae have no explicit subject", "statement": "Some formulae have no explicit subject. For example, $\\frac{1}{m} + \\frac{a}{n} = \\frac{1}{k}$ has no explicit subject, and the lens formula in Physics, $\\frac{1}{u} + \\frac{1}{v} = \\frac{1}{f}$, is seldom written with a subject, such as $f = \\frac{uv}{u+v}$, $v = \\frac{uf}{u-f}$ or $u = \\frac{vf}{v-f}$.", "watchOut": "Students ==may== think that every formula must have a subject, and that it must be on the L.H.S.", "sources": [{"page": "Page22", "printed": "4.22", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N14 (magenta, P.4.22).", "keyIdea": "K4-10", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note beyond the revision focus."}, {"id": "S2C4-072", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Clear all fractions with the L.C.M.", "statement": "To remove the fractions in a formula, you can multiply both sides by the L.C.M. of the denominators. For $\\frac{1}{m} + \\frac{a}{n} = \\frac{1}{k}$, multiplying both sides by $kmn$ gives $kn + amk = mn$, so $kn = m(n - ak)$ and $m = \\frac{kn}{n-ak}$.", "example": "Clue to Supplementary Exercise Q54: multiply both sides of $\\frac{1}{r} = \\frac{1+p}{1-p} - \\frac{1}{q}$ by $(1-p)qr$ to eliminate the denominators.", "sources": [{"page": "Page23", "printed": "4.23", "where": "teacher note"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only alternative method; the card on formulae with algebraic fractions carries the idea."}, {"id": "S2C4-073", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "One way: change the subject, then substitute", "statement": "To find a variable that is not the subject, one way is to make it the subject first. Then substitute the given values.", "example": "A triangle has sides $x$ cm, $x$ cm and 3 cm, and its perimeter $P$ cm is $P = 2x + 3$. Make $x$ the subject, $x = \\frac{P-3}{2}$, then substitute $P = 11$ to get $x = 4$.", "sources": [{"page": "Page20", "printed": "4.20", "where": "activity"}, {"page": "Page20", "printed": "4.20", "where": "main text"}, {"page": "Page22", "printed": "4.22", "where": "main text"}, {"page": "Page23", "printed": "4.23", "where": "example"}, {"page": "Page26", "printed": "4.26", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The example and the figure are from Class Activity 4.1 and the text below it (P.4.20): the isosceles triangle with sides $x$ cm, $x$ cm and 3 cm, $P = 2x + 3$, and $P = 11$ giving $x = 4$ (the activity's answers are printed in magenta). The P.4.26 source is the magenta Clue to Exercise 4D Q44(b): 'Substitute $r = 2$ and $A = 88$ into the formula us the old $x$.", "example": "Here $x = \\frac{9-2y}{3}$ comes from $3x - 2y = 3(2x - 3)$. So if $y$ is decreased by 3, then $x$ will be increased by 2.", "sources": [{"page": "Page35", "printed": "4.35", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-11", "level": "core", "visual": {"type": "table", "head": "both", "words": false, "rows": [["", "Old", "New", "$\\text{New} - \\text{old}$"], ["$y$", "$y$", "$y - 3$", "$-3$"], ["$x$", "$\\frac{9-2y}{3}$", "$\\frac{9-2(y-3)}{3} = \\frac{15-2y}{3}$", "$2$"]]}, "check": {"pages": ["4.35"], "date": "2026-10-07", "result": "fixed", "notes": "(context) The statement uses x, y and 'when y is decreased by 3' before any formula is given. The formula appears only in the visual, and the book's starting formula, 3x − 2y = 3(2x − 3), never appears. The example starts with 'So' and only makes sense after the visual.; (scope) The card leaves out the book's first step, part (a): make x the subject. The K4-11 summary says to make the right variable the subject first. | final: (unmarked) The card has no inferred note, but its general method is read from one worked example, Example 1 of the Short Question Tutor (P.4.35). The statement, the example and every cell of the table are correct ($x = \\frac{9-2y}{3}$, new $x = \\frac{15-2y}{3}$, difference 2).", "final": "fixed", "confirmed": "2026-10-07", "enrich": "2026-10-09", "enrichNotes": "Compared with Example 1 of the Short Question Tutor (P.4.35, Page35.jpg). The book's working is: 3x − 2y = 3(2x − 3); 3x − 2y = 6x − 9; 9 − 2y = 3x; x = (9 − 2y)/3. (b) New y = y − 3; new x = (9 − 2(y − 3))/3 = (15 − 2y)/3; increase in x = (15 − 2y)/3 − (9 − 2y)/3 = 2; 'If y is decreased by 3, x will be increased by 2.' The card has the same meaning. The statement gives the same three steps (make x the subject; write the new x in terms of y; new x minus old x). Every table cell is right: y: y, y − 3, −3. x: (9 − 2y)/3, (9 − 2(y − 3))/3 = (15 − 50 (P.4.30) and Public Exam Question 6 (P.4.37). The source note is wrong. The statement and the visual are correct (b = 5a: +3 gives +15; n = (7 − 5m)/2: +2 gives −5).", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-075", "role": "property", "short": "Other variable may increase or decrease", "treeOrder": 63}, {"id": "S2C4-078", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "common-mistake", "title": "Make the variable asked for the subject", "statement": "DSE exam report: in a question asking to make $n$ the subject of $2(3m + n) = m + 7$, a few candidates wrongly made $m$ the subject.", "sources": [{"page": "Page35", "printed": "4.35", "where": "DSE support"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "From the magenta Exam Information on P.4.35. The report refers to DSE 2014 (I) Q5, printed in the book as Public Exam Question 6 on P.4.37.", "keyIdea": "K4-11", "level": "extra", "hidden": true, "hiddenWhy": "Exam technique from a DSE exam report, not a knowledge point."}, {"id": "S2C4-079", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "common-mistake", "title": "State the change clearly", "statement": "DSE exam report: many candidates could substitute $m + 2$ into their result from part (a), but did not write down the change in the value of $n$ correctly. The answer should say by how much the value changes, and whether it increases or decreases.", "example": "'If $y$ is decreased by 3, $x$ will be increased by 2.' (Short Question Tutor, P.4.35)", "sources": [{"page": "Page35", "printed": "4.35", "where": "DSE support"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "The second sentence of the statement is read from the model answers on P.4.35 and P.4.37 ('decreased by 5'), not from the report itself.", "keyIdea": "K4-11", "level": "extra", "hidden": true, "hiddenWhy": "Exam technique from a DSE exam report, not a knowledge point."}, {"id": "S2C4-080", "section": "Application of Maths", "sectionTitle": "Height and Tibia Length", "kind": "link", "title": "Height from tibia length", "statement": "Formulae are used in real life. A man's approximate height $H$ cm can be found from the length $L$ cm of his tibia by $H = 2.1L + 93$; for example, a tibia of 40 cm gives a height of about 177 cm.", "example": "For a woman, the book gives $L' = \\frac{H'-72}{2.6}$, with $L'$ as the subject. To find a woman's height from her tibia (for example, from remains found by archaeologists), first express $H'$ in terms of $L'$.", "sources": [{"page": "Page34", "printed": "4.34", "where": "activity"}, {"page": "Page34", "printed": "4.34", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-11", "level": "extra", "hidden": true, "hiddenWhy": "The Application of Maths page (tibia length): an application, not a knowledge point."}], "keyIdeas": [{"id": "K4-1", "title": "Algebraic fractions", "summary": "If $A$ and $B$ are polynomials, $B$ contains a variable and ==$B \\neq 0$==, then $\\frac{A}{B}$ is an algebraic fraction. In this chapter, we assume every denominator is ==non-zero==.", "shape": "tree"}, {"id": "K4-2", "title": "Simplifying algebraic fractions", "summary": "To simplify an algebraic fraction, cancel the common factors of the numerator and the denominator. We ==may== need to factorize first, and we ==never== cancel common terms.", "shape": "tree"}, {"id": "K4-3", "title": "Multiplying and dividing", "summary": "We multiply and divide algebraic fractions in a similar way to fractions.", "shape": "tree"}, {"id": "K4-4", "title": "Adding and subtracting: same denominator", "summary": "For algebraic fractions with the same denominator, add or subtract the numerators. The denominator stays the same.", "shape": "tree"}, {"id": "K4-5", "title": "Adding and subtracting: different denominators", "summary": "For algebraic fractions with different denominators, first expand them so that all the denominators are the same. Then add or subtract the numerators.", "shape": "tree"}, {"id": "K4-6", "title": "Negative signs", "summary": "For polynomials $P$ and $Q$ ($Q \\neq 0$), $\\frac{-P}{Q} = \\frac{P}{-Q} = -\\frac{P}{Q}$. Also, $1 - 5m$ is the negative of $5m - 1$: $5m - 1 = -(1 - 5m)$.", "shape": "tree"}, {"id": "K4-7", "title": "Formulae and substitution", "summary": "A formula is an equality showing the relation among variables. To find the unknown, we substitute the given values of the other variables, and sometimes we then solve an equation.", "shape": "tree"}, {"id": "K4-8", "title": "The subject of a formula", "summary": "The subject of a formula is the variable that stands ==alone== on one side and does not appear on the other side.", "shape": "tree"}, {"id": "K4-9", "title": "Changing the subject", "summary": "The techniques used to change the subject of a formula are similar to those used in solving an equation.", "shape": "tree"}, {"id": "K4-10", "title": "Harder changes of subject", "summary": "The order of the steps depends on the formula. We ==may== need to remove brackets, multiply both sides by a denominator, or extract the new subject as a common factor.", "shape": "tree"}, {"id": "K4-11", "title": "When one variable changes", "summary": "To find the change in $x$ when $y$ changes, first make $x$ the subject. Then work out the new $x$ minus the old $x$.", "shape": "tree"}], "chapter": {"title": "Algebraic fractions and formulae", "w": 1000, "h": 790, "nodes": [{"k": "K4-1", "label": "Algebraic fractions", "sub": "$\\frac{A}{B}$, where $B$ contains a variable", "x": 500, "y": 54, "part": "key"}, {"k": "K4-2", "label": "Simplify", "sub": "cancel common factors, never terms", "x": 125, "y": 192, "part": "kind"}, {"k": "K4-3", "label": "Multiply and divide", "sub": "in a similar way to fractions", "x": 375, "y": 192, "part": "kind"}, {"k": "K4-4", "label": "Same denominator", "sub": "add or subtract the numerators", "x": 625, "y": 192, "part": "kind"}, {"k": "K4-5", "label": "Different denominators", "sub": "make them the same first", "x": 875, "y": 192, "part": "kind"}, {"k": "K4-6", "label": "Negative signs", "sub": "$5m - 1 = -(1 - 5m)$", "x": 500, "y": 326, "part": "kind"}, {"k": "K4-7", "label": "Formulae and substitution", "sub": "an equality relating variables", "x": 500, "y": 440, "part": "extkey"}, {"k": "K4-8", "label": "The subject", "sub": "alone on one side, not on the other", "x": 330, "y": 572, "part": "kind"}, {"k": "K4-9", "label": "Changing the subject", "sub": "like solving an equation", "x": 670, "y": 572, "part": "kind"}, {"k": "K4-10", "label": "Harder changes of subject", "sub": "brackets, denominators, several terms", "x": 440, "y": 716, "part": "step"}, {"k": "K4-11", "label": "When one variable changes", "sub": "the new value minus the old value", "x": 800, "y": 716, "part": "step"}], "branches": [["K4-1", "K4-2"], ["K4-1", "K4-3"], ["K4-1", "K4-4"], ["K4-1", "K4-5"], ["K4-7", "K4-8"], ["K4-7", "K4-9"]], "merge": [{"from": ["K4-2", "K4-3", "K4-4", "K4-5"], "to": "K4-6", "y": 268}, {"from": ["K4-8", "K4-9"], "to": "K4-10", "y": 640}], "flow": [["K4-10", "K4-11"]], "zones": [{"label": "New knowledge", "x": 18, "y": 12, "kind": "new"}, {"label": "Revision from S1 knowledge", "x": 18, "y": 390, "kind": "ext"}, {"label": "New knowledge", "x": 18, "y": 518, "kind": "new"}, {"label": "Skills: use them when you need them", "x": 18, "y": 662, "kind": "skill"}], "bands": [{"kind": "new", "x": -8, "y": -6, "w": 1016, "h": 384}, {"kind": "ext", "x": -8, "y": 382, "w": 1016, "h": 122}, {"kind": "new", "x": -8, "y": 508, "w": 1016, "h": 140}, {"kind": "skill", "x": -8, "y": 652, "w": 1016, "h": 138}], "drillGroups": [{"drills": [1, 2], "title": "Cancel common factors", "task": "", "needs": ["S2C4-008", "S2C4-011", "S2C4-009", "S2C4-010", "S2C4-013"], "recall": [], "pages": ["4.4"], "gaps": ["ID 1: Factorizing by extracting common factors (Book 2A Ch2) is assu  "S2C4-W02"]}, {"gen": "undo-order", "needs": ["S2C4-W02"]}], "S2C4-065": [{"gen": "letter-times", "needs": ["S2C4-065"]}], "S2C4-066": [{"gen": "brackets-collect", "needs": ["S2C4-066"]}], "S2C4-067": [{"gen": "denominator", "needs": ["S2C4-067"]}], "S2C4-068": [{"gen": "group-factor", "needs": ["S2C4-068"]}], "S2C4-069": [{"gen": "fraction-alone", "needs": ["S2C4-069"]}], "S2C4-070": [{"gen": "reciprocal", "needs": ["S2C4-070"]}]}, "released": true}, {"key": "s2c5", "label": "Ch5 Linear Equations in Two Unknowns", "pageDir": "", "form": "S2", "book": "2A", "number": 5, "title": "Linear Equations in Two Unknowns", "pageExt": ".jpg", "origin": "merged", "cards": [{"id": "S2C5-001", "section": "Opener", "sectionTitle": "Linear Equations in Two Unknowns", "kind": "link", "title": "Special cases are now a foundation topic", "statement": "Teacher note N1: exploring simultaneous equations that are inconsistent, or that have no unique solution, is now a foundation topic in the junior secondary mathematics curriculum (see 5.3C, P.5.35). Before, it was an enrichment topic.", "sources": [{"page": "Page01", "printed": "5.1", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N1 (two stars), printed in magenta on the chapter opener; an N1 tag also sits beside 5.3 in the contents list. The content of 5.3C is in part b.", "keyIdea": "K5-1", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note on the curriculum (special cases are now a foundation topic)."}, {"id": "S2C5-002", "section": "5.0 A", "sectionTitle": "Solving Linear Equations in One Unknown", "kind": "link", "title": "Review: solving an equation in one unknown", "statement": "To solve a linear equation in one unknown, we transpose terms, combine the like terms, and then divide both sides by the same number.", "example": "$4 - 3x = 6 - 5x$ gives $5x - 3x = 6 - 4$ (transpose terms), then $2x = 2$ (combine the like terms), then $x = \\frac{2}{2} = 1$ (divide both sides by 2).", "sources": [{"page": "Page02", "printed": "5.2", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Pre-Learning revision. The book shows the three steps on one worked equation only; 'divide both sides by the same number' is our general wording for 'Divide both sides by 2'.", "keyIdea": "K5-1", "level": "extra", "hidden": true, "hiddenWhy": "Revision of S1 work (5.0 Pre-Learning), basic for this chapter."}, {"id": "S2C5-003", "section": "5.0 A", "sectionTitle": "Solving Linear Equations in One Unknown", "kind": "method-idea", "title": "Check a solution: L.H.S. = R.H.S.", "statement": "To check a solution, substitute the value into the left-hand side (L.H.S.) and the right-hand side (R.H.S.) of the equation. If L.H.S. = R.H.S., the value is the solution of the equation.", "example": "When $x = 1$, L.H.S. $= 4 - 3(1) = 1$ and R.H.S. $= 6 - 5(1) = 1$ = L.H.S. $\\therefore$ 1 is the solution of $4 - 3x = 6 - 5x$.", "sources": [{"page": "Page02", "printed": "5.2", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the dashed 'Check:' box beside the worked equation. The book does not write out 'left-hand side' and 'right-hand side'; the meaning of L.H.S. and R.H.S. is read from use.", "keyIdea": "K5-1", "level": "extra", "hidden": true, "hiddenWhy": "Revision of S1 work (5.0 Pre-Learning), basic for this chapter."}, {"id": "S2C5-004", "section": "5.0 B", "sectionTitle": "Coordinates of Points", "kind": "definition", "title": "Coordinates: an ordered pair $(a, b)$", "statement": "In a rectangular coordinate plane, we can use an ordered pair $(a, b)$ to show the position of a point. $a$ is called the $x$-coordinate and $b$ is called the $y$-coordinate of the point.", "example": "In the figure, the coordinates of $P$ and $Q$ are $(2, 1)$ and $(3, -1)$ respectively.", "watchOut": "The book says '$a$ and $b$ are called the $x$-coordinate and $y$-coordinate of the point respectively'. '*Respectively*' means '*in the same order*': the first number is the $x$-coordinate, and the second number is the $y$-coordinate.", "figure": "A small grid with the x-axis from 0 to 3 and the y-axis from -1 to 2. P is marked at (2, 1) and Q at (3, -1), with dashed lines from each point to the two axes.", "sources": [{"page": "Page02", "printed": "5.2", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Pre-Learning revision. The watch-out is our reading of the word 'respectively'.", "keyIdea": "K5-1", "level": "extra", "hidden": true, "hiddenWhy": "Revision of S1 work (5.0 Pre-Learning), basic for this chapter."}, {"id": "S2C5-005", "section": "5.1 A", "sectionTitle": "Solutions of Linear Equations in Two Unknowns", "kind": "link", "title": "Review: a linear equation in one unknown", "statement": "Equation $25x = 200$ contains ==only== one unknown, $x$, and the degree of $x$ is 1. This kind of equation is called a linear equation in one unknown. It has only one solution, $x = 8$.", "sources": [{"page": "Page03", "printed": "5.3", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Recalled from Book 1A Chapter 3 on P.5.3.", "keyIdea": "K5-1", "level": "extra", "hidden": true, "hiddenWhy": "Revision of S1 work (5.0 Pre-Learning), basic for this chapter."}, {"id": "S2C5-006", "section": "5.1 A", "sectionTitle": "Solutions of Linear Equations in Two Unknowns", "kind": "method-idea", "title": "From a real situation to an equation", "statement": "When a situation has two unknown quantities, we ==may== let $x$ and $y$ stand for them. Then we can set up an equation that connects them.", "example": "Flora cuts a piece of ribbon of length 20 cm into two portions of $x$ cm and $y$ cm, so $x + y = 20$. Vincent mixes $x$ cm$^3$ of liquid $A$ with $y$ cm$^3$ of liquid $B$ and gets 100 cm$^3$ of mixture, so $x + y = 100$.", "sources": [{"page": "Page01", "printed": "5.1", "where": "main text"}, {"page": "Page04", "printed": "5.4", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The general sentences are our summary of the book's two examples (the STEM story 'Mixing Liquids' on the opener, and P.5.4: 'we may let x cm and y cm be the lengths ... Then, we can set up the following equation'). The formal steps for word problems are in 5.4 (part b).", "keyIdea": "K5-1", "level": "supporting", "hidden": true, "hiddenWhy": "A lead-in: the application cards carry how to let letters stand for unknowns."}, {"id": "S2C5-007", "section": "5.1 A", "sectionTitle": "Solutions of Linear Equations in Two Unknowns", "kind": "definition", "title": "Linear equation in two unknowns", "statement": "Suppose an equation contains two unknowns, and the highest degree of all its terms is 1. Then the equation is called a **linear equation in two unknowns**.", "example": "Flora cuts a 20 cm ribbon into two pieces, $x$ cm and $y$ cm long, so $x + y = 20$. This equation has two unknowns, and the highest degree of its terms is 1.", "watchOut": "$25x = 200$ has ==only== one unknown $x$, and the degree of $x$ is 1. So it is a linear equation in one unknown, not in two unknowns.", "sources": [{"page": "Page04", "printed": "5.4", "where": "main text"}, {"page": "Page03", "printed": "5.3", "where": "main text"}, {"page": "Page49", "printed": "5.49", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "P.5.4 gives the definition through equation (**), $x + y = 20$; the summary (P.5.49) states it in general, in the words used here. Neither page, nor any other page in the chapter, gives a general form (such as $ax + by = c$) or a condition on the coefficients, so none is added. The contrast with $25x = 200$ (P.5.3) comes from the merged card S2C5a-008; that card's reading of the words 'linear' and 'two unknowns' was not printed in
