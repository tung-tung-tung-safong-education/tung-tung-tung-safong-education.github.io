    // Review: squares only, as on the card and in the book; no m + n (the card's own example).
    const [a, b] = rnd(LET2), h = rnd([1, 2, 3]);
    const f = rnd([`${a} - ${b}`, `${a} + ${h}`, `${a} - ${h}`, `2${a} - ${h}`]);
    const up = rnd([true, false]);          // (f)^2 over f, or f over (f)^2
    return { type: "choice", eq: true, prompt: `$${up ? fr(`(${f})^2`, f) : fr(f, `(${f})^2`)}$ simplifies to …`,
             why: `$(${f})^2$ means $(${f})(${f})$, so it has the factor $${f}$ twice. Cancel one, and one $${f}$ is left in the ${up ? "numerator" : "denominator"}.`,
             options: shuffle([{ label: up ? `$${f}$` : `$${fr(1, f)}$`, ok: true }, { label: "$1$", ok: false }, { label: up ? `$${fr(1, f)}$` : `$${f}$`, ok: false }]) };
  },
  // ---- K4-3 Multiplying and dividing ----
  // Card "Dividing: convert division to multiplication": turn only the second fraction upside down.
  "flip-second": () => {
    const [x, y] = rnd(LET2), [c, d] = nums(2);
    const A = fr(x, c), B = fr(y, d);
    return { type: "choice", eq: true, prompt: `$${A} \\div ${B}$ is the same as …`,
             why: "Change $\\div$ to $\\times$ and turn only the second fraction upside down.",
             options: shuffle([{ label: `$${A} \\times ${fr(d, y)}$`, ok: true }, { label: `$${fr(c, x)} \\times ${B}$`, ok: false },
                               { label: `$${A} \\times ${B}$`, ok: false }, { label: `$${fr(c, x)} \\times ${fr(d, y)}$`, ok: false }]) };
  },
  // Card "Cancel common factors before multiplying": a factor in any numerator with the same factor in any denominator.
  "cancel-across": () => {
    const [x, y] = rnd(LET2);
    let c, d; do { [c, d] = nums(2); } while (gcd(c, d) > 1);   // two numbers with a common factor could be cancelled too
    const yes = [[`${fr(x, y)} \\times ${fr(y, c)}`, `$${y}$`], [`${fr(c, x)} \\times ${fr(x, d)}`, `$${x}$`],
                 [`${fr(`${c}${x}`, y)} \\times ${fr(y, `${d}${x}`)}`, `$${x}$ and $${y}$`], [`${fr(`${x} + ${c}`, y)} \\times ${fr(y, d)}`, `$${y}$`]];
    const no = [[`${fr(x, c)} \\times ${fr(d, y)}`, "no common factor"], [`${fr(c, y)} \\times ${fr(`${y} + ${d}`, x)}`, `$${y}$ is only a term of $${y} + ${d}$`],
                [`${fr(x, `${x} + ${c}`)} \\times ${fr(d, y)}`, `$${x}$ is only a term of $${x} + ${c}$`], [`${fr(`${x} - ${y}`, c)} \\times ${fr(d, x)}`, `$${x}$ is only a term of $${x} - ${y}$`]];
    const nYes = rnd([1, 2, 3]);
    return { type: "sort", prompt: "Before multiplying, can a common factor be cancelled?", chips: ["Yes", "No"],
             why: "A factor in any numerator can be cancelled with the same factor in any denominator. A letter that is only one term of a sum or difference cannot be cancelled.",
             rows: shuffle([...pickN(yes, nYes).map(([t, n]) => ({ label: `$${t}$`, answer: 0, note: `cancel ${n}` })),
                            ...pickN(no, 4 - nYes).map(([t, n]) => ({ label: `$${t}$`, answer: 1, note: n }))]) };
  },
  // Card "Only multiplication and division: left to right".
  "left-to-right": () => {
    const x = rnd(LET1), a = rnd([2, 3]), m = rnd([2, 3, 4].filter(m => a * m <= 9)), b = a * m;   // one-digit numbers
    const c = rnd([2, 3, 4].filter(c => c !== m && m * c <= 9));
    const lr = m * c, rl = m / c;
    const rlTex = Number.isInteger(rl) ? `$${rl}$` : `$${fr(m / gcd(m, c), c / gcd(m, c))}$`;
    const third = c / m, thirdTex = Number.isInteger(third) ? `$${third}$` : `$${fr(c / gcd(m, c), m / gcd(m, c))}$`;
    const opts = [{ label: `$${lr}$`, ok: true }, { label: rlTex, ok: false }, { label: thirdTex, ok: false }];
    return { type: "choice", eq: true, prompt: `$${fr(x, a)} \\div ${fr(x, b)} \\times ${c}$ is equal to …`,
             why: `Work from left to right: $${fr(x, a)} \\div ${fr(x, b)} = ${m}$, then $${m} \\times ${c} = ${lr}$.`,
             options: shuffle(opts.filter((o, i) => opts.findIndex(p => p.label === o.label) === i)) };
  },
  // ---- K4-4 Same denominator ----
  // Card "Never add numerators and denominators separately".
  "same-denominator": () => {
    // Review: the right answer is in its simplest form (no factor shared with k).
    const x = rnd(LET1), k = rnd([1, 1, 3]);
    let p, q; do { [p, q] = pickN([1, 2, 3, 4, 5], 2); } while (gcd(p, k) > 1 || gcd(q, k) > 1 || gcd(p + q, k) > 1);
    const L = k === 1 ? x : `${k}${x}`, L2 = `${2 * k}${x}`, Lsq = k === 1 ? `${x}^2` : `${k * k}${x}^2`;
    return { type: "choice", eq: true, prompt: `$${fr(p, L)} + ${fr(q, L)}$ is equal to …`,
             why: `Add the numerators only. The denominator stays $${L}$.`,
             options: shuffle([{ label: `$${fr(p + q, L)}$`, ok: true }, { label: `$${fr(p + q, L2)}$`, ok: false }, { label: `$${fr(p + q, Lsq)}$`, ok: false }]) };
  },
  // ---- K4-5 Different denominators ----
  // Card "One denominator is a multiple of the other": sort the pairs by their L.C.M.
  "lcm-sort": () => {
    const x = rnd(LET1.filter(l => l !== "x")), L = n => (n === 1 ? x : `${n}${x}`);   // not x: the card's own 1/(8x) + 1/(2x) (values panel, 15 Oct)
    const pairsOf = T => { const out = []; for (let a = 1; a < T; a++) for (let b = a + 1; b <= T; b++) if (T % a === 0 && T % b === 0 && (a * b) / gcd(a, b) === T) out.push([a, b]); return out; };
    const [T1, T2] = pickN([4, 6, 8, 9], 2);   // one-digit L.C.M.s
    const row = pr => { const [a, b] = shuffle(pr); return `$${fr(1, L(a))} ${rnd(["+", "-"])} ${fr(1, L(b))}$`; };
    const n1 = rnd([1, 2, 3]);
    return { type: "sort", prompt: "What is the L.C.M. of the two denominators?", chips: [`$${L(T1)}$`, `$${L(T2)}$`],
             why: "When one denominator is a multiple of the other, this multiple is the L.C.M. Otherwise, line up the factors and take one from each column.",
             rows: shuffle([...pickN(pairsOf(T1), n1).map(pr => ({ label: row(pr), answer: 0 })), ...pickN(pairsOf(T2), 4 - n1).map(pr => ({ label: row(pr), answer: 1 }))]) };
  },
  // Card "No common factor: multiply the denominators".
  "product-denominator": () => {
    // Review: one-digit products, and no numerator that shares a factor with its own denominator.
    const [x, y] = rnd(LET2), [c, d] = rnd([[1, 1], [1, 1], [2, 3], [3, 2], [1, 2], [3, 1]]);
    let p, q; do { [p, q] = nums(2); } while (gcd(p, c) > 1 || gcd(q, d) > 1);
    const A = c === 1 ? x : `${c}${x}`, B = d === 1 ? y : `${d}${y}`, AB = c * d === 1 ? `${x}${y}` : `${c * d}${x}${y}`;
    return { type: "choice", eq: true, prompt: `For $${fr(p, A)} ${rnd(["+", "-"])} ${fr(q, B)}$, the common denominator is …`,
             why: `$${A}$ and $${B}$ have no common factor, so use their product $${AB}$.`,
             options: shuffle([{ label: `$${AB}$`, ok: true }, { label: `$${A} + ${B}$`, ok: false }, { label: `$${A}$`, ok: false }]) };
  },
  // Card "Write a whole number as a fraction".
  "whole-number": () => {
    const x = rnd(LET1), n = rnd([1, 2, 3]), p = rnd([2, 3, 5, 7].filter(p => p !== n && n + p <= 9));
    const nx = n === 1 ? x : `${n}${x}`;
    return { type: "choice", eq: true, prompt: `$${n} + ${fr(p, x)}$ is equal to …`,
             why: `Write $${n}$ as $${fr(nx, x)}$: $${fr(nx, x)} + ${fr(p, x)} = ${fr(`${nx} + ${p}`, x)}$.`,
             options: shuffle([{ label: `$${fr(`${nx} + ${p}`, x)}$`, ok: true }, { label: `$${fr(n + p, x)}$`, ok: false }, { label: `$${fr(n + p, `1 + ${x}`)}$`, ok: false }]) };
  },

  // ---- K4-6 Negative signs ----
  // Card "Where the negative sign of a fraction goes".
  "sign-sort": () => {
    const x = rnd(LET1), p = rnd([1, 2, 3, 4, 5, 7]);
    const neg = [`\\frac{-${p}}{${x}}`, `\\frac{${p}}{-${x}}`], pos = [`\\frac{-${p}}{-${x}}`, `-\\frac{-${p}}{${x}}`, `-\\frac{${p}}{-${x}}`];
    const n0 = rnd([1, 2]);
    return { type: "sort", prompt: `Is each fraction equal to $-${fr(p, x)}$ or to $${fr(p, x)}$?`, chips: [`$-${fr(p, x)}$`, `$${fr(p, x)}$`],
             why: `A negative sign can move to the front of the fraction. It must be in front of the whole numerator or the whole denominator. One negative sign gives $-${fr(p, x)}$; two give $${fr(p, x)}$.`,
             rows: shuffle([...pickN(neg, n0).map(t => ({ label: `$${t}$`, answer: 0 })), ...pickN(pos, 3 - n0).map(t => ({ label: `$${t}$`, answer: 1 }))]) };
  },
  // Card "When does a fraction equal -1?"
  "minus-one": () => {
    // Review: every sign changed in place (reordered pairs are asked on the sibling card), and not the card's own fractions.
    const [x, y] = rnd([["x", "y"], ["m", "n"], ["p", "q"]]), c = rnd([2, 3, 4, 5]);
    const yes = [[fr(`${x} + ${y}`, `-${x} - ${y}`), `$-${x} - ${y} = -(${x} + ${y})$`], [fr(`-${x} - ${c}`, `${x} + ${c}`), `$-${x} - ${c} = -(${x} + ${c})$`],
                 [fr(`${x} + ${c}${y}`, `-${x} - ${c}${y}`), `$-${x} - ${c}${y} = -(${x} + ${c}${y})$`], [fr(`-${x} + ${y}`, `${x} - ${y}`), `$-${x} + ${y} = -(${x} - ${y})$`]];
    const no = [[fr(`${x} + ${y}`, `-${x} + ${y}`), `$-${x} + ${y} = -(${x} - ${y})$`], [fr(`${x} - ${c}`, `-${x} - ${c}`), `$-${x} - ${c} = -(${x} + ${c})$`],
                [fr(`${x} + ${c}`, `-${x} + ${c}`), `$-${x} + ${c} = -(${x} - ${c})$`], [fr(`${x} - ${c}`, `${x} + ${c}`), `only the sign of $${c}$ changes`]];
    const nYes = rnd([1, 2, 3]);
    return { type: "multi", prompt: "Tap every fraction that simplifies to $-1$.", ask: "Tap every one, then Check.",
             why: "A fraction simplifies to $-1$ when its denominator is the negative of its numerator. The sign of every term must change.",
             options: shuffle([...pickN(yes, nYes).map(([l, n]) => ({ label: `$${l}$`, ok: true, note: n })), ...pickN(no, 4 - nYes).map(([l, n]) => ({ label: `$${l}$`, ok: false, note: n }))]) };
  },
  // Card "Put brackets round a numerator you subtract".
  "bracket-subtract": () => {
    const x = rnd(LET1), d = rnd([1, 2, 3]), c = rnd([4, 5, 6]), plus = rnd([true, false]);   // c + d at most 9
    const inner = `${x} ${plus ? "+" : "-"} ${d}`, k = plus ? c - d : c + d, wrongK = plus ? c + d : c - d;
    return { type: "choice", eq: true, prompt: `$${fr(c, x)} - ${fr(inner, x)}$ is equal to …`,
             why: `$${c} - (${inner}) = ${c} - ${x} ${plus ? "-" : "+"} ${d} = ${k} - ${x}$: the sign of every term in the brackets changes.`,
             options: shuffle([{ label: `$${fr(`${k} - ${x}`, x)}$`, ok: true }, { label: `$${fr(`${wrongK} - ${x}`, x)}$`, ok: false }, { label: `$${fr(`${k} + ${x}`, x)}$`, ok: false }]) };
  },

  // ---- K4-7 Formulae and substitution (revision from S1) ----
  // Card "The variables of a formula": a fresh formula each time.
  "variables": () => {
    // Review: never the card's own figure (P = 2(l + w), A = bh/2); the book writes a length as \ell.
    // No formulae with pi: the card never says pi is a constant, so a weak reader may count it (accuracy audit, 8 Oct).
    const F = [
      { say: "A square has side $s$ cm and perimeter $P$ cm, and $P = 4s$.", ok: "$P$ and $s$", wrong: ["$s$ only", "$P$ only"], why: "$P$ and $s$ both stand for lengths. $4$ is a number." },
      { say: "A rectangle has length $\\ell$ cm, width $w$ cm and area $A$ cm$^2$, and $A = \\ell w$.", ok: "$A$, $\\ell$ and $w$", wrong: ["$\\ell$ and $w$ only", "$A$ only"], why: "$A$, $\\ell$ and $w$ all stand for quantities." },
      { say: "An equilateral triangle has side $x$ cm and perimeter $P$ cm, and $P = 3x$.", ok: "$P$ and $x$", wrong: ["$x$ only", "$P$, $x$ and $3$"], why: "$P$ and $x$ both stand for lengths. $3$ is a number." },
      { say: "A cuboid has length $\\ell$ cm, width $w$ cm, height $h$ cm and volume $V$ cm$^3$, and $V = \\ell wh$.", ok: "$V$, $\\ell$, $w$ and $h$", wrong: ["$\\ell$, $w$ and $h$ only", "$V$ only"], why: "$V$, $\\ell$, $w$ and $h$ all stand for quantities." },
      { say: "A car travels $s$ km in $t$ hours at $v$ km/h, and $s = vt$.", ok: "$s$, $v$ and $t$", wrong: ["$v$ and $t$ only", "$s$ only"], why: "$s$, $v$ and $t$ all stand for quantities." },
      { say: "A cube has side $\\ell$ cm and volume $V$ cm$^3$, and $V = \\ell^3$.", ok: "$V$ and $\\ell$", wrong: ["$V$, $\\ell$ and $3$", "$\\ell$ only"], why: "$V$ and $\\ell$ stand for quantities. The index $3$ is a number." }];
    const f = rnd(F);
    return { type: "choice", prompt: `${f.say} The variables in this formula are …`, why: f.why,
             options: shuffle([{ label: f.ok, ok: true }, ...f.wrong.map(w => ({ label: w, ok: false }))]) };
  },
  // Card "Substituting a negative value": put the negative number in brackets.
  "negative-sub": () => {
    const v = rnd(["x", "y", "a", "b", "t"]), n = rnd([1, 2, 3]);   // every value shown at most 9
    if (rnd([true, false])) {
      return { type: "choice", eq: true, prompt: `To find $${v}^2$ when $${v} = -${n}$, we work out …`,
               why: `Put the negative number in brackets: $(-${n})^2 = ${n * n}$, but $-${n}^2 = -${n * n}$.`,
               options: [{ label: `$(-${n})^2$`, ok: true }, { label: `$-${n}^2$`, ok: false }] };
    }
    const c = rnd([2, 3]);
    return { type: "choice", eq: true, prompt: `To find $${c}${v}$ when $${v} = -${n}$, we work out …`,
             why: `$${c}${v}$ means $${c} \\times ${v}$, so it is $${c} \\times (-${n}) = ${-c * n}$.`,
             options: [{ label: `$${c} \\times (-${n})$`, ok: true }, { label: `$${c} - ${n}$`, ok: false }] };
  },

  // ---- K4-8 The subject ----
  // Card "Expressed in terms of the other variables".
  "in-terms-of": () => {
    let S, v, w, a, b;
    do { [S, v, w] = pickN(["A", "P", "V", "y", "s"], 1).concat(pickN(["x", "b", "h", "t", "r"], 2)); [a, b] = nums(2); }
    while ((S === "A" && [v, w].includes("b") && [v, w].includes("h")) || (S === "P" && a === 2 && b === 3));   // not the card's own sentences (any letter for x: writer, 15 Oct)
    const forms = [
      { f: `${S} = ${a}${v} + ${b}`, ok: `$${S}$ in terms of $${v}$`, no: [`$${v}$ in terms of $${S}$`] },
      { f: `${v} = ${fr(`${S} - ${b}`, a)}`, ok: `$${v}$ in terms of $${S}$`, no: [`$${S}$ in terms of $${v}$`] },
      { f: `${S} = ${v}${w}`, ok: `$${S}$ in terms of $${v}$ and $${w}$`, no: [`$${v}$ in terms of $${S}$ and $${w}$`, `$${v}$ and $${w}$ in terms of $${S}$`] }];
    const F = rnd(forms);
    return { type: "choice", prompt: `$${F.f}$ expresses …`,
             why: `The letter that stands alone on one side is expressed in terms of the letters on the other side.`,
             options: shuffle([{ label: F.ok, ok: true }, ...F.no.map(n => ({ label: n, ok: false }))]) };
  },

  // ---- K4-9 Changing the subject ----
  // Card "Transpose a term".
  "transpose": () => {
    let S, v, a, b; do { S = rnd(["P", "A", "y", "s"]); v = rnd(["x", "t", "b"]); [a, b] = nums(2); } while (S === "P" && v === "x" && a === 2 && b === 3);   // not the card's example
    const plus = rnd([true, false]);
    const term = plus ? `${b}` : `-${b}`;
    return { type: "choice", eq: true, prompt: `In $${S} = ${a}${v} ${plus ? "+" : "-"} ${b}$, transposing the term $${term}$ gives …`,
             why: `The term $${term}$ moves to the other side, and its sign changes from $${plus ? "+" : "-"}$ to $${plus ? "-" : "+"}$.`,
             options: shuffle([{ label: `$${S} ${plus ? "-" : "+"} ${b} = ${a}${v}$`, ok: true }, { label: `$${S} ${plus ? "+" : "-"} ${b} = ${a}${v}$`, ok: false },
                               { label: `$${S} = ${a}${v} ${plus ? "-" : "+"} ${b}$`, ok: false }]) };
  },
  // Card "Convert x into ÷, or ÷ into x, on the other side".
  "convert-op": () => {
    let S, v, a, b;
    do { S = rnd(["P", "A", "y", "s"]); v = rnd(["x", "t", "b"]); [a, b] = nums(2); }
    while ((S === "P" && a === 2 && b === 3) || (v === "b" && a === 3 && b === 8));   // never the card's P - 3 = 2x (nor its (P - 3)/2, S2C4-052) or a = (b + 8)/3 (any subject: values panel and writer, 15 Oct)
    if (rnd([true, false])) {
      return { type: "choice", eq: true, prompt: `To make $${v}$ the subject of $${S} - ${b} = ${a}${v}$, the next step gives …`,
               why: `Convert '$\\times ${a}$' on the right to '$\\div ${a}$' on the left. The whole of $${S} - ${b}$ is divided by ${a}.`,
               options: shuffle([{ label: `$${fr(`${S} - ${b}`, a)} = ${v}$`, ok: true }, { label: `$${a}(${S} - ${b}) = ${v}$`, ok: false }, { label: `$${S} - ${fr(b, a)} = ${v}$`, ok: false }]) };
    }
    return { type: "choice", eq: true, prompt: `To make $${v}$ the subject of $${S} = ${fr(`${v} + ${b}`, a)}$, the first step gives …`,
             why: `Convert '$\\div ${a}$' on the right to '$\\times ${a}$' on the left: $${a}${S} = ${v} + ${b}$.`,
             options: shuffle([{ label: `$${a}${S} = ${v} + ${b}$`, ok: true }, { label: `$${fr(S, a)} = ${v} + ${b}$`, ok: false }, { label: `$${S} = ${a}(${v} + ${b})$`, ok: false }]) };
  },

  // ---- K4-10 Harder changes of subject ----
  // Teacher, 8 October 2026: "this section's pure goal is to achieve change of subject and it's also abstract", so
  // every card here gets a multiple-choice check whose options are different sequences of steps, only one of them
  // right. Each option is a short working in the book's layout (one line per step); each wrong one is a slip the
  // card warns about. The stress test checks that every wrong option has a false line or leaves the new subject on
  // both sides, and that the right one is true line by line.

  // Card "The order of steps depends on the formula": the book's two kinds, x = 4y - 2 and a = (b + 8)/3.
  "order-steps": () => {
    let S, v, a, b, form;
    do { [S, v] = rnd(PAIRS); [a, b] = nums(2); form = rnd(["A+", "A-", "B+", "B-"]); }
    while ((S === "x" && form === "A-" && a === 4 && b === 2) || (S === "a" && form === "B+" && a === 3 && b === 8));   // never the card's own two
    const p = form.endsWith("+"), op = p ? "+" : "-", inv = p ? "-" : "+", term = p ? `${b}` : `-${b}`;
    if (form[0] === "A") {
      return stepsItem(`${S} = ${a}${v} ${op} ${b}`, v,
        `$${v}$ is multiplied by ${a} first, and then ${b} is ${p ? "added" : "subtracted"}. So transpose the term $${term}$ first, then convert '$\\times ${a}$' on the right to '$\\div ${a}$' on the left.`,
        [[`${S} ${inv} ${b}`, `${a}${v}`], [fr(`${S} ${inv} ${b}`, a), v]],
        pickN([[[fr(S, a), `${v} ${op} ${b}`], [`${fr(S, a)} ${inv} ${b}`, v]],          // divides one term only
               [[`${S} ${op} ${b}`, `${a}${v}`], [fr(`${S} ${op} ${b}`, a), v]],          // the sign does not change
               [[`${S} ${inv} ${b}`, `${a}${v}`], [`${a}(${S} ${inv} ${b})`, v]]], 3));   // x instead of ÷
    }
    return stepsItem(`${S} = ${fr(`${v} ${op} ${b}`, a)}`, v,
      `${b} is ${p ? "added to" : "subtracted from"} $${v}$ first, and then the result is divided by ${a}. So convert '$\\div ${a}$' on the right to '$\\times ${a}$' on the left first, then transpose the term $${term}$.`,
      [[`${a}${S}`, `${v} ${op} ${b}`], [`${a}${S} ${inv} ${b}`, v]],
      [[[`${S} ${inv} ${b}`, fr(v, a)], [`${a}(${S} ${inv} ${b})`, v]],                  // transposes a term out of the fraction
       [[fr(S, a), `${v} ${op} ${b}`], [`${fr(S, a)} ${inv} ${b}`, v]],                  // ÷ instead of x
       [[`${a}${S}`, `${v} ${op} ${b}`], [`${a}${S} ${op} ${b}`, v]]]);                   // the sign does not change
  },

  // Card "Why we undo the last step first": the steps done to v, then the steps that undo them, as on the card's picture.
  "undo-order": () => {
    let S, v, a, b, f;
    do { [S, v] = rnd(PAIRS); [a, b] = nums(2); f = rnd([0, 1, 2, 3, 4, 5]); }
    while ((S === "x" && f === 1 && a === 4 && b === 2) || (S === "a" && f === 4 && a === 3 && b === 8));
    const T = `\\times ${a}`, D = `\\div ${a}`, P = `+\\,${b}`, M = `-\\,${b}`;
    const [formula, [s1, s2]] = [[`${a}${v} + ${b}`, [T, P]], [`${a}${v} - ${b}`, [T, M]], [`${fr(v, a)} + ${b}`, [D, P]],
                                 [`${fr(v, a)} - ${b}`, [D, M]], [fr(`${v} + ${b}`, a), [P, D]], [fr(`${v} - ${b}`, a), [M, D]]][f];
    const undo = { [T]: D, [D]: T, [P]: M, [M]: P }, u1 = undo[s2], u2 = undo[s1];

//           steps: the options are workings (one line per step), four in a row on a wide card
//   pics    {type:"pics", prompt, why, options:[{plot, ok}]}
//   multi   {type:"multi", prompt, ask?, show?, table?, options:[{label | plot | table, ok, note?}], why}   tap every one that fits
//   sort    {type:"sort", prompt, ask?, chips:[...], rows:[{label | plot, answer (chip index), note?}], why}   classify each
// `table` is {rows: [["$x$", ...], ["$y$", ...]], reveal: {label, cells, odd: [column indices]}}; the reveal row is

  if (b.kind === "sort") return { type: "sort", prompt: b.say, ask: b.ask, card: b.card, why: b.why, chips: b.chips,
    rows: shuffle(b.rows.map(r => ({ label: r[0], answer: r[1], note: r[2] }))) };
  if (b.kind === "asn") return { type: "choice", prompt: b.say, ask: "Always, sometimes or never?", card: b.card, why: b.why,
    options: ["always", "sometimes", "never"].map(a => ({ label: a[0].toUpperCase() + a.slice(1), ok: a === b.answer })) };

    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
    sx = sy = null;
  });
}
function go(step) {
  const items = buildItems(DATA[state.ch]);
  const i = state.idx + step;
  if (i < 0 || i >= items.length) return;
  state.idx = i;
  state.step = step;
  state.cardCheck = null;
  state.refreshUndo = null;
  state.arrived = true;
  renderBody();
}
function itemKey(it) { return it.type === "chapter" ? "chapter" : it.type === "done" ? "done" : it.type === "map" ? "map-" + it.k.id : it.c.id; }
function jumpTo(key) {
  let items = buildItems(DATA[state.ch]);
  let i = items.findIndex(x => itemKey(x) === key);
  if (i < 0 && state.path !== null) { state.path = null; items = buildItems(DATA[state.ch]); i = items.findIndex(x => itemKey(x) === key); }
  if (i < 0) return;
  state.home = false;
  state.mode = "one";
  state.idx = i;
  state.cardCheck = null;
  state.refreshUndo = null;
  state.arrived = true;
  renderHeader();
  renderBody();
  window.scrollTo({ top: 0 });
}
function renderOverview(body, ch, items) {
  const main = el("main", "overview");
  const addGrid = cards => {
    const grid = el("div", "grid");
    cards.forEach(c => {
      const e = cardEl(c, ch, false);
      if (c.hidden) e.classList.add("isdropped");
      else e.onclick = () => jumpTo(c.id);
      grid.appendChild(e);
    });
    main.appendChild(grid);
  };
  const cards = items.filter(x => x.type === "card").map(x => x.c);
  if (grouped(ch)) {
    ch.keyIdeas.forEach(k => {
      const inK = cards.filter(c => c.keyIdea === k.id);
      const dropped = state.teacher ? ch.cards.filter(c => c.keyIdea === k.id && c.hidden) : [];
      if (!inK.length && !dropped.length) return;
      const head = el("div", "ki");
      head.appendChild(el("h2", "", `${k.title}  ·  ${inK.length} cards`));
      head.appendChild(rich("p", "", k.summary || ""));
      main.appendChild(head);
      addGrid(inK);
      if (dropped.length) {
        main.appendChild(el("h2", "sec", `Dropped from revision (${dropped.length})`));
        addGrid(dropped);
      }
    });
  } else {
    let cur = null, buf = [];
    cards.forEach(c => {
      if (c.section !== cur) {
        if (buf.length) addGrid(buf);
        buf = [];
        cur = c.section;
        main.appendChild(el("h2", "sec", `${c.section || "?"}  ${c.sectionTitle || ""}`));
      }
      buf.push(c);
    });
    if (buf.length) addGrid(buf);
  }
  body.appendChild(main);
  typeset(main);
}

// ---- Remember the place in the URL, so a reload or bookmark returns to the same card ----
function saveHash(it) {
  if (state.path !== null || state.home) return;
  try { history.replaceState(null, "", `#${DATA[state.ch].key}/${itemKey(it)}`); } catch (e) {}
}
function readHash() {
  if (/^#quiz(?:\/|$)/.test(location.hash)) {
    state.quizScreen = quizRun ? (quizRun.finished ? "results" : "run") : "setup";
    if (location.hash === "#quiz/setup" || location.hash === "#quiz") state.quizScreen = "setup";
    state.home = false; return true;
  }
  const m = /^#([^/]+)\/(.+)$/.exec(location.hash || "");
  if (!m) return false;
  const ci = DATA.findIndex(c => c.key === m[1]);
  if (ci < 0) return false;
  state.ch = ci;
  const i = buildItems(DATA[ci]).findIndex(x => itemKey(x) === decodeURIComponent(m[2]));
  state.idx = Math.max(0, i);
  return true;
}

function renderAll() { applyMode(); renderHeader(); renderFilters(); renderBody(); }
// Student view: clean, finished chapters only. Debug view: everything, including the top panel.
function applyMode() {
  const student = studentView();
  document.body.classList.toggle("student", student);
  if (student) {
    state.teacher = false;
    state.mode = "one";
    if (!live(DATA[state.ch])) state.ch = Math.max(0, DATA.findIndex(live));
  }
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
}
const refilter = () => { state.idx = 0; renderBody(); };
document.getElementById("view").onchange = e => { state.view = e.target.value; refilter(); };
document.getElementById("lvl").onchange = e => { state.lvl = e.target.value; refilter(); };
document.getElementById("sec").onchange = e => { state.sec = e.target.value; refilter(); };
document.getElementById("sum").onchange = e => { state.sum = e.target.value; refilter(); };
document.getElementById("nf").onchange = e => { state.nf = e.target.value; refilter(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; refilter(); };
document.getElementById("ttoggle").onclick = e => {
  state.teacher = !state.teacher;
  try { localStorage.setItem("kc-teacher", state.teacher ? "1" : "0"); } catch (err) {}
  e.currentTarget.classList.toggle("on", state.teacher);
  renderHeader();
  renderBody();
};
document.getElementById("ftoggle").onclick = e => {
  const f = document.getElementById("filters");
  f.classList.toggle("open");
  e.currentTarget.classList.toggle("on", f.classList.contains("open"));
};
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; renderHeader(); renderBody(); });
document.addEventListener("keydown", e => {
  if (state.quizScreen) return;
  if (state.mode !== "one" || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "Escape") {
    if (state.home) return;
    const at = buildItems(DATA[state.ch])[state.idx];
    if (state.path !== null) exitPath("chapter"); else if (at && at.type === "chapter") goHome(); else jumpTo("chapter");
  }
});
// Rotating the iPad switches between the rail and the path line.
WIDE.addEventListener("change", () => renderBody());
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.mode === "one") renderBody(); }, 200); });
window.addEventListener("DOMContentLoaded", () => {
  quizRestore();
  // Open on the card in the URL, otherwise on the first chapter that has key ideas.
  state.teacher = false; // Public export always opens the student view.
  try { state.railOpen = localStorage.getItem("kc-rail") !== "0"; } catch (err) {}
  state.debug = false; // No debug switch in the public export.
  applyMode();
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
  // Open on the card in the address; otherwise on the home screen (choose a form, then a chapter).
  if (!readHash()) { state.ch = Math.max(0, DATA.findIndex(MODE === "student" ? live : c => c.chapter), 0); state.home = true; }
  renderAll();
});
// KaTeX loads after this script; typeset again once it is ready.
window.addEventListener("load", () => typeset(document.getElementById("body")));
</script>
</body>
