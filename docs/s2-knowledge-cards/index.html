<script>
const DATA = [{"key": "s2c4", "label": "Ch4 Algebraic Fractions and Formulae", "pageDir": "../S2 Ch4 pages/", "form": "S2", "book": "2A", "number": 4, "title": "Algebraic Fractions and Formulae", "pageExt": ".jpg", "origin": "merged", "cards": [{"id": "S2C4-001", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "link", "title": "Review: what a fraction is", "statement": "We already know that when $a$ and $b$ are integers and $b \\neq 0$, the number $\\frac{a}{b}$ is a fraction.", "example": "$\\frac{1}{4}$, $\\frac{10}{3}$ and $-\\frac{7}{12}$ are fractions.", "sources": [{"page": "Page02", "printed": "4.2", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-1", "level": "supporting", "hidden": true, "hiddenWhy": "Background from earlier work: what a fraction is."}, {"id": "S2C4-002", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "definition", "title": "Algebraic fraction", "statement": "If $A$ and $B$ are polynomials, $B$ contains variable(s) and ==$B \\neq 0$==, then $\\frac{A}{B}$ is called an **algebraic fraction**.", "example": "$\\frac{2}{x}$, $\\frac{a}{a-1}$, $-\\frac{y^2+1}{xy}$ and $\\frac{2bx-5ay}{x+y}$ are algebraic fractions.", "sources": [{"page": "Page02", "printed": "4.2", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-1", "level": "core", "term": "algebraic fraction", "positive": {"example": "$\\frac{2}{x}$", "why": "Its denominator $x$ contains a variable.", "source": "book (P.4.2)"}, "negative": {"example": "$\\frac{x}{3}$", "why": "Its denominator 3 has no variable. It is the polynomial $\\frac{1}{3}x$.", "source": "book (P.4.2)"}, "check": {"pages": ["4.2"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": null, "role": null, "short": "Algebraic fraction", "treeOrder": 0}, {"id": "S2C4-003", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "condition", "title": "The denominator must contain a variable", "statement": "The denominator of an algebraic fraction ==must contain a variable==. A variable ==only== in the numerator is not enough.", "sources": [{"page": "Page02", "printed": "4.2", "where": "main text"}, {"page": "Page02", "printed": "4.2", "where": "Q&A"}, {"page": "Page02", "printed": "4.2", "where": "teacher note"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The student text lists $\\frac{x}{3}$ and $\\frac{2a-b}{4}$ as 'not' algebraic fractions without giving the reason in words. The reason (their denominators do not contain any variable) is printed only in teacher note N2, and it follows from the definition. The Think-box answer is printed in magenta; the Think question is printed for students. Checkpoint Q1 and Q2 (P.4.28) test the same point for students.", "keyIdea": "K4-1", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Algebraic fraction", "Not an algebraic fraction"], ["$\\frac{4}{x}$", "$\\frac{x}{4}$"], ["$\\frac{x}{4y}$", "$\\frac{xy}{4}$"], ["$\\frac{2}{x+1}$", "$\\frac{2a-b}{4}$"]], "words": false}, "check": {"pages": ["4.2", "4.28"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-002", "role": "condition", "short": "A variable in the denominator", "treeOrder": 1}, {"id": "S2C4-004", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "property", "title": "Algebraic fractions are not polynomials", "statement": "The numerator and the denominator of an algebraic fraction are both polynomials. But the algebraic fraction itself is not a polynomial.", "sources": [{"page": "Page02", "printed": "4.2", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N1 (two stars), printed in magenta.", "keyIdea": "K4-1", "level": "supporting", "check": {"pages": ["4.2"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-002", "role": "property", "short": "Algebraic fractions: not polynomials", "treeOrder": 3}, {"id": "S2C4-005", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "property", "title": "$\\frac{x}{3}$ and $\\frac{2a-b}{4}$ are polynomials", "statement": "$\\frac{x}{3}$ can be written as $\\frac{1}{3}x$, and $\\frac{2a-b}{4}$ as $\\frac{1}{2}a - \\frac{1}{4}b$. So they are polynomials, not algebraic fractions.", "sources": [{"page": "Page02", "printed": "4.2", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N2 (two stars), printed in magenta.", "keyIdea": "K4-1", "level": "supporting", "check": {"pages": ["4.2"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-003", "role": "consequence", "short": "$\\frac{x}{3}$ is a polynomial", "treeOrder": 2}, {"id": "S2C4-006", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "condition", "title": "We assume every denominator is non-zero", "statement": "In this chapter, we assume that every algebraic fraction has a ==non-zero== denominator.", "example": "In $\\frac{a}{a-1}$, we assume that $a - 1 \\neq 0$, that is, $a \\neq 1$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-1", "level": "core", "check": {"pages": ["4.2"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-002", "role": "condition", "short": "Denominators are non-zero", "treeOrder": 4}, {"id": "S2C4-007", "section": "4.1", "sectionTitle": "Algebraic Fractions", "kind": "wording", "title": "Numerator and denominator", "statement": "In a fraction $\\frac{A}{B}$, the top part $A$ is called the numerator and the bottom part $B$ is called the denominator. The book uses these two words all through the chapter.", "example": "In $\\frac{a}{a-1}$, the numerator is $a$ and the denominator is $a - 1$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "main text"}, {"page": "Page08", "printed": "4.8", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book uses the words numerator and denominator (on 4.2, 4.8 and elsewhere) but has no definition box for them; the meaning given here is the usual one, recorded because students must recognise the English terms. The example is built from the book's own fraction on 4.2.", "keyIdea": "K4-1", "level": "supporting", "hidden": true, "hiddenWhy": "Basic: the words numerator and denominator are known from primary school and S1."}, {"id": "S2C4-008", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "method-idea", "title": "Simplest form: cancel the common factors", "statement": "Like a fraction, an algebraic fraction can be reduced to its simplest form. To do this, cancel the common factor(s) of the numerator and the denominator.", "example": "$\\frac{y}{xy} = \\frac{1 \\times y}{x \\times y} = \\frac{1}{x}$: cancel the common factor $y$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "main text"}, {"page": "Page02", "printed": "4.2", "where": "example"}, {"page": "Page27", "printed": "4.27", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-2", "level": "core", "check": {"pages": ["4.2", "4.27"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Cancel common factors", "treeOrder": 5}, {"id": "S2C4-009", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "method-idea", "title": "Factorize first, then cancel", "statement": "We ==may== need to factorize the numerator and the denominator first, and then cancel the common factors. Use the two methods from Chapter 2: extracting common factors and grouping terms.", "sources": [{"page": "Page03", "printed": "4.3", "where": "main text"}, {"page": "Page03", "printed": "4.3", "where": "margin note"}, {"page": "Page04", "printed": "4.4", "where": "margin note"}, {"page": "Page06", "printed": "4.6", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Example 4(b) on 4.6 does the same inside a multiplication: $by - xb$ is factorized as $b(y-x)$ before cancelling. The two Clue boxes beside Examples 1 and 2 are printed in black for students.", "keyIdea": "K4-2", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Method", "Example"], ["Extracting common factors", "$\\frac{8x+2y}{2y} = \\frac{2(4x+y)}{2y} = \\frac{4x+y}{y}$"], ["Grouping terms", "$\\frac{xy+4x+3y+12}{x(y+4)} = \\frac{(y+4)(x+3)}{x(y+4)} = \\frac{x+3}{x}$"]], "words": true}, "check": {"pages": ["4.3", "4.4", "4.6"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-008", "role": "method", "short": "Factorize first", "treeOrder": 8}, {"id": "S2C4-010", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "property", "title": "A whole bracket can be a common factor", "statement": "A common factor can be a whole expression in brackets. Cancel it as one factor, just like a single letter.", "example": "$\\frac{5x(2m-n)}{2y(2m-n)} = \\frac{5x}{2y}$: cancel the common factor $2m - n$.", "sources": [{"page": "Page03", "printed": "4.3", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book shows this in Example 1(d) and its margin note ('Cancel the common factor 2m - n') but does not state it as a rule in the text.", "keyIdea": "K4-2", "level": "core", "check": {"pages": ["4.3"], "date": "2026-10-07", "result": "equivalent", "notes": " | final: (scope) The short label 'A bracket is one factor' reads as a rule for every bracket. A bracket that is only part of a term is not a factor: in $\\frac{m-(m+7n)}{m+7n}$ (Example 9(b), P.4.11) the bracket $(m + 7n)$ in the numerator must not be cancelled, and S2C4-011 says never cancel terms. The card itself says a whole bracket 'can be' a common factor.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-009", "role": "property", "short": "A bracket as a common factor", "treeOrder": 9}, {"id": "S2C4-011", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "common-mistake", "title": "Cancel common factors, never common terms", "statement": "When we simplify an algebraic fraction, we cancel ==only== the common __factors__ of the numerator and the denominator. We ==never== cancel their common __terms__.", "example": "Cancelling $4y$ in $\\frac{4y}{4y+2}$ to get $\\frac{1}{2}$ is wrong, because $4y$ is ==only== a term of $4y + 2$.", "sources": [{"page": "Page04", "printed": "4.4", "where": "main text"}, {"page": "Page04", "printed": "4.4", "where": "Q&A"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}, {"page": "Page33", "printed": "4.33", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The rule is printed in black main text on P.4.4, beside the teacher-note tag N4, and refers to Example 1(b). The example is Checkpoint Q3 (P.4.28), where cancelling $4y$ to get $\\frac{1}{2}$ is marked wrong. The reason '$4y$ is only a term of $4y + 2$' is a plain reading; the book gives no reason in words for Q3. The answer to the Think box (P.4.4) is printed in magenta. MC Q62 (P.4.33) tests the same point.", "keyIdea": "K4-2", "level": "core", "check": {"pages": ["4.28", "4.33", "4.4"], "date": "2026-10-07", "result": "fixed", "notes": "(unmarked) The card is right and its example is the book's own (Checkpoint Q3, P.4.28: 4y/(4y + 2) = 1/2 marked wrong). But the inferred note talks about a sentence '2y is only a term of the numerator' that is not on the card, and it does not say where the 4y example comes from. Only the teacher's note needs correcting.", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-008", "role": "warning", "short": "Never cancel common terms", "treeOrder": 6}, {"id": "S2C4-W01", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "explanation", "keyIdea": "K4-2", "level": "core", "sources": [{"page": "Page04", "printed": "4.4", "where": "main text"}, {"page": "Page04", "printed": "4.4", "where": "Q&A"}], "nonFoundation": false, "teacherOnly": false, "inSummary": false, "authored": true, "explains": "S2C4-011", "title": "Why we cancel factors but never terms", "statement": "Cancelling a common factor divides the whole numerator and the whole denominator by the same number. A common term is ==only== one part of the numerator or the denominator, so it ==cannot== be cancelled.", "remember": "If you are not sure whether you can cancel, try small numbers other than 0: $\\frac{2+3}{5+3} = \\frac{5}{8}$, not $\\frac{2}{5}$.", "visual": {"type": "table", "head": "both", "words": true, "rows": [["", "$3$ is a factor", "$3$ is a term"], ["The fraction", "$\\frac{2 \\times 3}{5 \\times 3} = \\frac{6}{15}$", "$\\frac{2 + 3}{5 + 3} = \\frac{5}{8}$"], ["Cancel the 3s", "$\\frac{2}{5}$: right", "$\\frac{2}{5}$: wrong"]]}, "check": {"pages": ["4.4"], "date": "2026-10-09", "result": "added explanation", "notes": "", "enrich": "2026-10-09 (after fix)", "enrichNotes": "(consistency) The card it explains, S2C4-011, has the example 'Cancelling $4y$ in $\\frac{4y}{4y+2}$ ... is wrong, because $4y$ is only a term of $4y + 2$'. There the common term is part of the DENOMINATOR, and $4y$ is the whole numerator. The statement 'A term is only one part of the numerator' does not cover this case, and a weak student could even read it as 'the whole numerator $4y$ may be cancelled'. Say 'a  4(b) (P.4.6), $3 - 2a = -(2a - 3)$ in the magenta Clue to Exercise 4A Q48 (P.4.8) and $4 - x = -(x - 4)$ in Example 8(a) (P.4.10). The rule in words, 'when we take out a negative sign, every term inside the brackets changes its sign', is written for this card from the book's step $5m - 1 = -(-5m + 1) = -(1 - 5m)$ (P.4.4 margin). The short label $a - b = -(b - a)$ is a general reading of the book's cases.", "keyIdea": "K4-6", "level": "core", "check": {"pages": ["4.4", "4.6", "4.8"], "date": "2026-10-07", "result": "fixed", "notes": "(english) 'Writing a subtraction the other way round brings a negative sign' uses an idiom ('the other way round') and an odd verb ('brings') for a weak reader.; (term) '$5m - 1$ can cancel with $1 - 5m$' blurs the book's step. The two brackets are not common factors as written. The book first rewrites $5m - 1 = -(1 - 5m)$ and only then cancels the common factor $1 - 5m$.; (scope) The book never states $a - b = -(b - a)$ as a general rule. It prints only particular cases: $5m - 1 = -(1 - 5m)$ (P.4.4), $b(y - x) = -b(x - y)$ (P.4.6), $3 - 2a = -(2a - 3)$ (P.4.8), $4 - x = -(x - 4)$ (P.4.10). Th | final: (term) 'Swapping the two terms of a subtraction gives its negative' is false in the book's own use of 'term'. The book calls $-2$ a term ('Transpose the term $-2$', P.4.21), so the two terms of $5m - 1$ are $5m$ and $-1$, and swapping them gives $-1 + 5m$, which equals $5m - 1$. Sister car", "final": "fixed", "confirmed": "2026-10-07", "enrich": "2026-10-09 (after fix)", "enrichNotes": "Student-visible text PASSES. The statement uses the book's own step $5m - 1 = -(-5m + 1) = -(1 - 5m)$ (P.4.4 margin), it is correct, it has two sentences, and the equation is not split at either size. The example matches Example 2(a).; (unmarked, teacher note only) The `inferred` note is now stale. It still says 'The words \"change places, but the minus sign stays between them\" are written for this card', but this enrich removed those words. It does not say that the new rule in words is ours. Fix: replace that sentence with 'The rule in words, \"when we take out a negative sign, every term insid"}, "parent": "S2C4-032", "role": "property", "short": "$a - b = -(b - a)$", "treeOrder": 28}, {"id": "S2C4-014", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "property", "title": "$n + 1$ and $n - 1$ are different factors", "statement": "$n + 1$ and $n - 1$ look alike, but they are __different factors__. So they ==cannot== cancel each other.", "example": "$\\frac{4n(n+1)}{12n(n-1)} = \\frac{n+1}{3(n-1)}$: ==only== the common factor $4n$ is cancelled.", "sources": [{"page": "Page07", "printed": "4.7", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. The example is Exercise 4A Q8 (P.4.7); its printed answer $\\frac{n+1}{3(n-1)}$ keeps both brackets. The sentence 'they are different factors' is a plain reading.", "keyIdea": "K4-2", "level": "core", "check": {"pages": ["4.7"], "date": "2026-10-07", "result": "fixed", "notes": "(unmarked) The inferred note says the example 'is written for this card; it is not from the book'. In fact it is Exercise 4A Q8 (P.4.7) with its printed answer $\\frac{n+1}{3(n-1)}$. The card text is correct; only the note is wrong.", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-010", "role": "warning", "short": "$n + 1$ and $n - 1$ differ", "treeOrder": 11}, {"id": "S2C4-015", "section": "4.1 A", "sectionTitle": "Simplification of Algebraic Fractions", "kind": "property", "title": "$(m + n)^2$ has the factor $m + n$ twice", "statement": "$(m + n)^2$ means $(m + n)(m + n)$, so it has the factor $m + n$ twice. If you cancel one $m + n$, one $m + n$ is still left.", "example": "$\\frac{m+n}{(m+n)^2} = \\frac{m+n}{(m+n)(m+n)} = \\frac{1}{m+n}$", "sources": [{"page": "Page07", "printed": "4.7", "where": "exercise"}, {"page": "Page08", " erOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book shows this rule only in the colour-coded Quick Example on 4.5; it does not state it in words.", "keyIdea": "K4-3", "level": "core", "check": {"pages": ["4.5"], "date": "2026-10-07", "result": "equivalent", "notes": " | final: (term) The short label 'Multiply tops, multiply bottoms' swaps the book's terms numerator and denominator for 'tops' and 'bottoms'. The junior rule keeps the book's maths terms exactly, and every other card says numerator and denominator.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-018", "role": "method", "short": "Multiply numerators; multiply denominators", "treeOrder": 13}, {"id": "S2C4-020", "section": "4.1 B I", "sectionTitle": "Operations of Algebraic Fractions: Multiplication and Division", "kind": "method-idea", "title": "Dividing: convert division to multiplication", "statement": "To divide by an algebraic fraction, first convert the division to multiplication. Change $\\div$ to $\\times$ and turn the second fraction upside down, then multiply.", "example": "$\\frac{x}{y} \\div \\frac{x}{z} = \\frac{x}{y} \\times \\frac{z}{x} = \\frac{z}{y}$", "sources": [{"page": "Page05", "printed": "4.5", "where": "margin note"}, {"page": "Page05", "printed": "4.5", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The margin note says only 'Convert division to multiplication.' The words 'turn the second fraction upside down' describe what the colour-coded Quick Example shows; the book does not use the word 'reciprocal' here.", "keyIdea": "K4-3", "level": "core", "check": {"pages": ["4.5"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-09", "enrichNotes": "Note only: the table copies the book's Quick Example (b) on P.4.5 exactly, with the cancelling (6 with 3, b with 2b) left out. This is fine because S2C4-021 (cancel before multiplying) is now read first. 1/3 × 6/5 = 2/5 and 3a/b × 2b/c = 6a/c are both correct. The card is clean at both sizes."}, "visual": {"type": "table", "head": "row", "words": false, "rows": [["Fractions", "Algebraic fractions"], ["$\\frac{1}{3} \\div \\frac{5}{6} = \\frac{1}{3} \\times \\frac{6}{5} = \\frac{2}{5}$", "$\\frac{3a}{b} \\div \\frac{c}{2b} = \\frac{3a}{b} \\times \\frac{2b}{c} = \\frac{6a}{c}$"]]}, "parent": "S2C4-018", "role": "method", "short": "Divide: change to $\\times$", "treeOrder": 15}, {"id": "S2C4-021", "section": "4.1 B I", "sectionTitle": "Operations of Algebraic Fractions: Multiplication and Division", "kind": "method-idea", "title": "Cancel common factors before multiplying", "statement": "Before we multiply, we can cancel a factor in any numerator with the same factor in any denominator.", "example": "$\\frac{x}{y} \\times \\frac{3y}{4x} = \\frac{3}{4}$: cancel $x$ and $y$ first.", "sources": [{"page": "Page05", "printed": "4.5", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Shown by the cancellation marks in Example 3 and the Quick Example on 4.5; the book does not state it in words.", "keyIdea": "K4-3", "level": "core", "check": {"pages": ["4.5"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-09", "enrichNotes": ""}, "parent": "S2C4-018", "role": "method", "short": "Cancel before multiplying", "treeOrder": 14}, {"id": "S2C4-022", "section": "4.1 B I", "sectionTitle": "Operations of Algebraic Fractions: Multiplication and Division", "kind": "property", "title": "Only multiplication and division: left to right", "statement": "If an expression has ==only== multiplication and division, do the operations from left to right.", "example": "In $\\frac{b^4}{2a^3} \\div \\frac{3b^2}{a^2} \\times 4c$, do the $\\div$ first, then the $\\times$.", "sources": [{"page": "Page06", "printed": "4.6", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSum he common factor(s).", "sources": [{"page": "Page08", "printed": "4.8", "where": "margin note"}, {"page": "Page08", "printed": "4.8", "where": "example"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page08", "printed": "4.8", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The margin note says 'Express the result in its simplest form.' The words 'factorize the numerator if needed' describe Example 5(b). Teacher note N5 (magenta) breaks Example 5(b) into three steps for less able students: add or subtract the numerators, factorize the numerator, then cancel the common factor(s).", "keyIdea": "K4-4", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Step", "Working"], ["Add or subtract the numerators", "$\\frac{8x}{2x-y} - \\frac{4y}{2x-y} = \\frac{8x-4y}{2x-y}$"], ["Factorize the numerator", "$= \\frac{4(2x-y)}{2x-y}$"], ["Cancel the common factor", "$= 4$"]], "words": true}, "check": {"pages": ["4.8", "4.9"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-023", "role": "method", "short": "Then simplify", "treeOrder": 19}, {"id": "S2C4-025", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Different denominators: make them the same first", "statement": "For algebraic fractions with __different denominators__, first make all the denominators the same, as we do for fractions.", "example": "$\\frac{1}{2} + \\frac{1}{3} = \\frac{3}{6} + \\frac{2}{6} = \\frac{5}{6}$", "sources": [{"page": "Page09", "printed": "4.9", "where": "main text"}, {"page": "Page27", "printed": "4.27", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.27", "4.9"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07", "enrich":  its proposal had a 21-word sentence; the stage file says the same in two short sentences, in the table's order.", "enrichNotes": "(ambiguous, minor) The statement says 'First expand ...', but the table's Step 1 is 'The L.C.M. of 2x and 3x is 6x', and expanding is Step 2. The book's own Step 1 is 'Expand' and its Step 2 is 'Add/subtract the numerators' (P.4.9). So a student reads 'first expand' and then sees a different first step. The maths in every row is correct (3/6x + 2/6x = 5/6x). Change the statement so that its order matches the table, keeping the book's 'may' for the L.C.M. ('We may regard 6x as the L.C.M.').; (unmarked, minor, record) The card has no inferred note. Step 1 comes from the 'More to Learn' box on P."}, "joins": ["S2C4-026", "S2C4-029", "S2C4-031"], "parent": null, "role": null, "short": "Different denominators, step by step", "treeOrder": 25}, {"id": "S2C4-026", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "How to expand an algebraic fraction", "statement": "To expand an algebraic fraction, multiply its numerator and its denominator by the same number or expression. We do this to make all the denominators the same.", "example": "$\\frac{4}{x} = \\frac{4 \\times y}{x \\times y} = \\frac{4y}{xy}$", "sources": [{"page": "Page09", "printed": "4.9", "where": "margin note"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page10", "printed": "4.10", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book uses the word 'expand' (4.9) and shows the multiplication in a thought bubble and in margin notes beside Examples 6 and 7; it does not define the word in a sentence. The book also uses 'expand' for removing brackets ('to expand $(3x + 5)(3x - 5)$', P.4.36) and does not point out the two meanings.", "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.10", "4.9"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'to give two fractions the same denominator' narrows the book's purpose, which is 'to make all the denominators the same' (P.4.9); Exercise 4B Q18 has three fractions.; (unmarked) The inferred note explains 'Keeps its value', a phrase that is no longer on the card. | final: (unmarked) The short label 'Expanding keeps the value' states a fact the audit removed from this card: 'keeps its value' is not on the card, and the book does not say it. The label should name what the card says. The card text and example ($\\frac{4}{x} = \\frac{4y}{xy}$, Example 7(b), P.4.10) are correct.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-025", "role": "method", "short": "Expanding an algebraic fraction", "treeOrder": 21}, {"id": "S2C4-027", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Least common multiple (L.C.M.) of denominators", "statement": "For $\\frac{1}{2x}$ and $\\frac{1}{3x}$, we use the least common multiple (L.C.M.) of $2x$ and $3x$ as the common denominator. Line up the factors as in the table, then take one factor from each column: $2 \\cdot 3 \\cdot x = 6x$.", "sources": [{"page": "Page09", "printed": "4.9", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the 'More to Learn' box on P.4.9, printed in black for students; the term 'least common multiple' is in purple italics and in the glossary strip. The book writes 'We may regard $6x$ as the L.C.M.' and lines up the factors $2$, $3$ and $x$ in columns; the table copies that layout, and 'take one factor from each column' is a reading of it. The box shows the L.C.M. only for $2x$ and $3x$; the definition of L.C.M. is in teacher notes N6 and N7 (separate card).", "keyIdea": "K4-5", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["$2x$", "$2$", "", "$x$"], ["$3x$", "", "$3$", "$x$"], ["L.C.M.", "$2$", "$3$", "$x$"]], "words": false}, "check": {"pages": ["4.9"], "date": "2026-10-07", "result": "fixed", "notes": "(ambiguous) 'Write $2x = 2 \\cdot x$ and $3x = 3 \\cdot x$, so the L.C.M. is $2 \\cdot 3 \\cdot x$' hides how the book gets it. The book lines the factors up in columns, so the common factor $x$ is used once. In one line of text a student cannot see why it is not $2 \\cdot x \\cdot 3 \\cdot x$. A table keeps the book's layout.", "final": "pass", "enrich": "2026-10-09 (after fix)", "enrichNotes": "(modality, minor) The new first sentence, 'The common denominator of 1/(2x) and 1/(3x) is the L.C.M. of 2x and 3x', says there is only one common denominator. But 12x is also a common denominator; the book says only 'We may regard 6x as the L.C.M. of 2x and 3x' (P.4.9 More to Learn). The card no longer leans on 025's example, and it refers to nothing read later. The table and 2·3·x = 6x are correct."}, "parent": "S2C4-025", "role": "method", "short": "The L.C.M. of the denominators", "treeOrder": 22}, {"id": "S2C4-028", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "definition", "title": "What the L.C.M. means", "statement": "The L.C.M. is one of the common multiples of the expressions, and it is also a factor of all the other common multiples.", "example": "Multiples of $2x$: $2x, 4x, 6x, 8x, 10x, 12x, \\ldots$; multiples of $3x$: $3x, 6x, 9x, 12x, 15x, \\ldots$; common multiples: $6x, 12x, \\ldots$; so the L.C.M. of $2x$ and $3x$ is $6x$. N7 practice pairs: the L.C.M. of $x$ and $4x$ is $4x$; of $2x$ and $y$ is $2xy$; of $4k$ and $6k$ is $12k$; of $m$ and $m+1$ is $m(m+1)$; of $p-1$ and $3(p-1)$ is $3(p-1)$; of $x+1$ and $2x-1$ is $(x+1)(2x-1)$.", "sources": [{"page": "Page09", "printed": "4.9", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher notes N6 (two stars, the definition and the multiples example) and N7 (two stars, the practice pairs with answers), printed in magenta.", "keyIdea": "K4-5", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note beyond the revision focus."}, {"id": "S2C4-029", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "One denominator is a multiple of the other", "statement": "If one denominator is a multiple of the other denominator, use this multiple as the common denominator. Then ==only== the other fraction needs to be expanded.", "example": "$\\frac{1}{8x} + \\frac{1}{2x} = \\frac{1}{8x} + \\frac{4}{8x} = \\frac{5}{8x}$: ==only== $\\frac{1}{2x}$ is expanded.", "sources": [{"page": "Page09", "printed": "4.9", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Shown in Example 6 and its margin notes; the book does not state this as a rule.", "keyIdea": "K4-5", "level": "supporting", "check": {"pages": ["4.9"], "date": "2026-10-07", "result": "fixed", "notes": "(ambiguous) In 'If one denominator is already a multiple of the other, use it as the common denominator', the nearest noun to 'it' is 'the other'. A weak reader may use the smaller denominator. Name the multiple.", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-027", "role": "property", "short": "One denominator is the other's multiple", "treeOrder": 23}, {"id": "S2C4-030", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "common-mistake", "title": "Never add numerators and denominators separately", "statement": "When we add or subtract algebraic fractions, we ==cannot== add or subtract the numerators and the denominators separately.", "example": "$\\frac{1}{2} + \\frac{1}{2} = 1$, not $\\frac{1+1}{2+2} = \\frac{1}{2}$. In the same way, $\\frac{1}{x} + \\frac{1}{x} = \\frac{2}{x}$, not $\\frac{2}{2x}$.", "sources": [{"page": "Page10", "printed": "4.10", "where": "main text"}, {"page  II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "method-idea", "title": "Factorize the denominators first", "statement": "When working with algebraic fractions, factorize the denominators first if you can, for example $2x + 2y = 2(x + y)$ and $3x + 3y = 3(x + y)$.", "sources": [{"page": "Page31", "printed": "4.31", "where": "exercise"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Given only as the magenta Clue to Supplementary Exercise Q55, a change-of-subject question with the fractions $\\frac{a}{2x+2y}$ and $\\frac{b}{3x+3y}$.", "keyIdea": "K4-5", "level": "supporting", "hidden": true, "hiddenWhy": "A magenta Clue for one exercise question, not a knowledge point to revise."}, {"id": "S2C4-039", "section": "4.1 B II", "sectionTitle": "Operations of Algebraic Fractions: Addition and Subtraction", "kind": "link", "title": "Use $(a+b)(a-b) \\equiv a^2 - b^2$ for denominators", "statement": "The identity $(a + b)(a - b) \\equiv a^2 - b^2$ can be used to expand a product of denominators, for example $(3x + 5)(3x - 5) = 9x^2 - 25$.", "sources": [{"page": "Page36", "printed": "4.36", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-5", "level": "extra", "hidden": true, "hiddenWhy": "An identity from an earlier chapter, used in one DSE question."}, {"id": "S2C4-040", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "definition", "title": "Formula", "statement": "A **formula** is an equality showing the relation among variables. We learnt this in Book 1A Chapter 4.", "example": "The area $A$ of a triangle with base $b$ and height $h$ is given by the formula $A = \\frac{1}{2}bh$.", "sources": [{"page": "Page14", "printed": "4.14", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book recalls the definition from Book 1A Chapter 4 (P.4.14).", "keyIdea": "K4-7", ], "fill": "tint"}, {"poly": [[190, 100], [320, 100], [240, 30]], "fill": "warm"}, {"line": [[240, 30], [240, 100]], "style": "dashed"}, {"path": [[240, 92], [248, 92], [248, 100]], "style": "muted"}, {"line": [[190, 114], [320, 114]], "style": "muted", "arrows": "both"}], "labels": [{"x": 80, "y": 104, "tex": "$\\ell$", "pos": "below"}, {"x": 144, "y": 65, "tex": "$w$", "pos": "right"}, {"x": 243, "y": 62, "tex": "$h$", "pos": "right"}, {"x": 255, "y": 114, "tex": "$b$"}, {"x": 80, "y": 150, "tex": "Perimeter: $P = 2(\\ell + w)$"}, {"x": 255, "y": 150, "tex": "Area: $A = \\frac{1}{2}bh$"}], "maxw": 460, "alt": "A rectangle with length l and width w, perimeter P equals 2 times (l plus w); a triangle with base b and height h, area A equals one half b h."}, "check": {"pages": ["4.14"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'The letters in a formula are its variables' says every letter is a variable. The book only lists 'Variables: P, ℓ, w' and 'A, b, h'. Its own formulae have letters that are not variables, such as π in V = ⅓πr²h (P.4.15) and C = 2πr (P.4.17). Say each variable is a letter that stands for a quantity, not the reverse. | final: (scope) The short label 'Its letters are variables' repeats the fault the audit fixed in the statement. It says every letter in a formula is a variable, but $\\pi$ in $V = \\frac{1}{3}\\pi r^2 h$ (P.4.15) is not. The statement and the table are correct.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-040", "role": "notation", "short": "Variables stand for quantities", "treeOrder": 35}, {"id": "S2C4-043", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "link", "title": "Formulae describe how quantities are related", "statement": "Scientists use formulae to describe the relations among different quantities.", "example": "STEM Zone: if $V$, $I$, $R$ and $P$ are the voltage, current, resistance and power of an electric circuit, then $V = IR$ and $P = VI$.", "sources": [{"page": "Page14", "printed": "4.14", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the STEM Zone box beside 4.2. The physics formulae are only an example of what formulae describe; students are not expected to learn them.", "keyIdea": "K4-7", "level": "extra", "hidden": true, "hiddenWhy": "A STEM Zone remark that repeats what a formula is."}, {"id": "S2C4-044", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "method-idea", "title": "Substitution: find a value from a formula", "statement": "When all the other variables in a formula have given values, we can find the value of the unknown. We put the given values in place of the letters: this is the **method of substitution**.", "example": "A rectangle has length $\\ell$ cm, width $w$ cm and perimeter $P$ cm; when $\\ell = 5$ and $w = 3$, $P = 2(5 + 3) = 16$.", "sources": [{"page": "Page14", "printed": "4.14", "where": "main text"}, {"page": "Page01", "printed": "4.1", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book names 'the method of substitution' but does not define it here; 'put the given values in place of the letters' is a reading of the worked example. The opener Q&A answer (156 cm) is printed in magenta.", "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.1", "4.14"], "date": "2026-10-07", "result": "fixed", "notes": "(condition) 'If the values of some variables ... are given, we can find the value of another variable' drops 'all'. In P = 2(ℓ + w), the book gives both ℓ and w to find P. If only ℓ is given, P cannot be found.; (context) The example writes 'ℓ = 5 cm'. The book writes the letter as a number with the unit after it: 'length ℓ m', 'When ℓ = 5 and w = 3, P = 2(5 + 3) = 16'.", "final": "pass"}, "parent": "S2C4-040", "role": "method", "short": "Substitution", "treeOrder": 38}, {"id": "S2C4-045", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "method-idea", "title": "One way: substitute first, then solve the equation", "statement": "A rectangle has perimeter $P$ cm, length $\\ell$ cm and width $w$ cm, so $P = 2(\\ell + w)$. To find $w$ when $P$ and $\\ell$ are given, we can substitute the given values first, then solve the equation.", "example": "When $P = 16$ and $\\ell = 5$, we get $16 = 2(5 + w)$, so $8 = 5 + w$ and the width is 3 cm.", "sources": [{"page": "Page14", "printed": "4.14", "where": "main text"}, {"page": "Page14", "printed": "4.14", "where": "example"}, {"page": "Page16", "printed": "4.16", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The magenta Exercise Objective on 4.16 names this skill: 'Find the value of a variable by the method of substitution and the techniques in solving equations.' Example 11 (P.4.14) substitutes first; Example 17 (P.4.23) shows the other way, changing the subject first. The numbers in the example are written for this card.", "keyIdea": "K4-7", "level": "core", "check": {"pages": ["4.14", "4.16"], "date": "2026-10-07", "result": "fixed", "notes": "(modality) 'substitute the given values first' reads as the only way. Example 11 substitutes first, but Example 17 (P.4.23) changes the subject first and then substitutes. Write 'we can'.; (context) P, ℓ and w are used in the statement without saying they are the perimeter, length and width of a rectangle. The example also writes 'P = 16 cm', but the book writes the letter as a number with the unit after it ('perimeter P m', 'When P = 330 and ℓ = 100').; (unmarked) The example (16, 5, 3) is written for the card; the book's Example 11 uses 330 m and 100 m. The inferred note still talks about a  | final: (modality) The title 'Substitute first, then solve the equation' reads as the only order. The audit changed the statement to 'we can substitute ... first' because Example 17 (P.4.23) changes the subject first. The sister card S2C4-073 is titled 'One way: change the subject, then substitute", "final": "fixed", "confirmed": "2026-10-07", "enrich": "2026-10-09 (after fix)", "enrichNotes": "(english) In the example, '$\\ell = 5$, $16 = 2(5 + w)$' puts the 5 and the 16 side by side with only a comma between them, so a weak reader can read '5, 16' as a list. Also, 'and $8 = 5 + w$' joins a step of solving with 'and', where the logic is 'so' (we divide both sides by 2). The card's claim is 'substitute first, then solve', so the example should show the substitution and then the solving step. The maths is correct ($16 \\div 2 = 8$, $8 - 5 = 3$). The statement matches P.4.14 ('to find $w$ with a given $P$ and $\\ell$ ... apply the techniques in solving equations'), and 'we can' is right b"}, "parent": "S2C4-044", "role": "extends", "short": "Substitute, then solve", "treeOrder": 40}, {"id": "S2C4-046", "section": "4.2", "sectionTitle": "Formulae and Substitution", "kind": "notation", "title": "Letters stand for numbers; units go outside", "statement": "In a formula problem, a letter stands for a number ==only==, and the unit is written after the letter, as in '$\\ell$ m' or '$A$ cm$^2$'. We substitute the numbers, and we write the unit in the final answer.", "example": "Example 11: the pitch has length $\\ell$ m, width $w$ m and perimeter $P$ m. We substitute $P = 330$ and $\\ell = 100$, and the answer is '*The width of the pitch is 65 m.*' Instant Drill 11 and Example 12 write '$A$ cm$^2$', '$b$ cm', '$h$ cm' and '$V$ cm$^3$' in the same way.", "sources": [{"page": "Page14", "printed": "4.14", "where": "example"}, {"page": "Page15", "printed": "4.15", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book never states this in words; it is read from how the problems are written. The questions write '$\\ell$ m', '$P$ m', '$A$ cm$^2$' and '$V$ cm$^3$'; the solutions substitute numbers only ($P = 330$, $\\ell = 100$ in Example 11; $r = 3$, $h = 7$ in Example 12) and give the erent variables", "statement": "$r_1$ and $r_2$ are two different variables, so they ==may== have different values. The small numbers 1 and 2 below the letter only show that they are different variables.", "sources": [{"page": "Page18", "printed": "4.18", "where": "exercise"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. Exercise 4C Q23 (P.4.18) uses $r_1$ and $r_2$, and Supplementary Exercise Q56 (P.4.31) uses $h_1$, $h_2$ and $h_3$ for the three heights of a triangle. The book does not use the word 'subscript'.", "keyIdea": "K4-7", "level": "supporting", "example": "The three heights of a triangle can be called $h_1$, $h_2$ and $h_3$.", "check": {"pages": ["4.18", "4.31"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-042", "role": "notation", "short": "$r_1$ and $r_2$: two variables", "treeOrder": 36}, {"id": "S2C4-051", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "definition", "title": "The subject of a formula", "statement": "The **subject of a formula** is the variable that stands ==alone== on one side and does not appear on the other side.", "example": "For a parallelogram with base $b$ and height $h$, the area is $A = bh$, and $A$ is the subject.", "sources": [{"page": "Page19", "printed": "4.19", "where": "main text"}, {"page": "Page27", "printed": "4.27", "where": "summary"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "Checkpoint Q5 (P.4.28) tests the definition for students.", "keyIdea": "K4-8", "level": "core", "term": "subject of a formula", "positive": {"example": "$p$ in $p = q + 4r$", "why": "$p$ stands ==alone== on one side and does not appear on the other side.", "source": "book (P.4.28)"}, e is the student margin note on P.4.19. The Q&A on P.4.34 and Exercise 4D Q22 and Q23 use 'Express ... in terms of ...' as an instruction.", "keyIdea": "K4-8", "level": "core", "check": {"pages": ["4.19", "4.20", "4.34"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-09", "enrichNotes": "(record, minor) The text is correct, and the card no longer uses 'making x the subject' before K4-9. But its inferred note still says 'The second is teacher note N13 (P.4.20), which says similar to', and its sources still list the P.4.20 teacher note. That sentence has moved to S2C4-058, so update this note."}, "parent": "S2C4-051", "role": "wording", "short": "Expressed in terms of", "treeOrder": 42}, {"id": "S2C4-053", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "condition", "title": "Not the subject: other terms beside it", "statement": "In $y + 1 = 4x - x$, $y$ is not the subject, because $y$ is not the ==only== term on the left-hand side.", "sources": [{"page": "Page19", "printed": "4.19", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N12(a), printed in magenta on P.4.19.", "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.19"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S2C4-051", "role": "warning", "short": "Not alone: not the subject", "treeOrder": 43}, {"id": "S2C4-054", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "condition", "title": "Not the subject: it appears on both sides", "statement": "In $y = 1 - x + 2y$, $y$ is not the subject, because $y$ appears on __both sides__ of the formula.", "sources": [{"page": "Page19", "printed": "4.19", "where": "teacher note"}, {"page": "Page28", "printed": "4.28", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Stated in words only in teacher note N12(b) (magenta, P.4.19). Checkpoint Q6 (P.4.28) tests the same point for students.", "keyIdea": "K4-8", "level": "core", "example": "$c$ is not the subject of $c = \\frac{3b-bc}{a}$, because $c$ also appears on the right-hand side.", "check": {"pages": ["4.19", "4.28"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-051", "role": "warning", "short": "On both sides: not the subject", "treeOrder": 44}, {"id": "S2C4-055", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "property", "title": "The subject can be on the right-hand side", "statement": "The subject may be on the right-hand side. It ==only== needs to stand ==alone== on one side and not appear on the other side.", "sources": [{"page": "Page19", "printed": "4.19", "where": "Q&A"}, {"page": "Page22", "printed": "4.22", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The Quick Quiz answers ($A$, $S$ and $c$) are printed in magenta, and teacher note N14 states the idea in words. For students it follows from the words 'stands alone on one side'.", "keyIdea": "K4-8", "level": "core", "example": "In $P + I = A$ and $\\frac{a}{1-r} = S$, the subjects are $A$ and $S$.", "check": {"pages": ["4.19", "4.22"], "date": "2026-10-07", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-07"}, "parent": "S2C4-051", "role": "property", "short": "Subject may be on the right", "treeOrder": 45}, {"id": "S2C4-056", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "notation", "title": "L.H.S. and R.H.S.", "statement": "L.H.S. means the left-hand side of a formula, and R.H.S. means the right-hand side.", "sources": [{"page": "Page19", "printed": "4.19", "where": "teacher note"}, {"page": "Page22", "printed": "4.22", "where": "teacher note"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}, {"page": "Page04", "printed": "4.4", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "The abbreviations appear only in magenta teacher material: N4 (P.4.4), N12 (P.4.19), N14 (P.4.22) and the Clue to Supplementary Exercise Q54 (P.4.31). The student text writes 'left-hand side' in full (P.4.20, P.4.21). The book does not define them; the meaning is read from use.", "keyIdea": "K4-8", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only abbreviation (L.H.S. and R.H.S.)."}, {"id": "S2C4-057", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Why we change the subject", "statement": "In $P = 2x + 3$, it is easy to find $P$ from a value of $x$: just substitute. Finding $x$ from a value of $P$ takes more work each time, so to make it simpler we first rewrite the formula so that $x$ becomes the subject.", "example": "Class Activity 4.1: the perimeter of an isosceles triangle with two equal sides of $x$ cm and a base of 3 cm is $P = 2x + 3$. Rewritten with $x$ as the subject, it is $x = \\frac{P-3}{2}$.", "figure": "An isosceles triangle $ABC$ with $AB = AC = x$ cm and $BC = 3$ cm.", "sources": [{"page": "Page20", "printed": "4.20", "where": "activity"}, {"page": "Page20", "printed": "4.20", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-9", "level": "supporting", "hidden": true, "hiddenWhy": "A lead-in from the Class Activity: why we change the subject."}, {"id": "S2C4-058", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "definition", "title": "Changing the subject of a formula", "statement": "Rewriting a formula so that another variable becomes the subject is called **changing the subject of the formula**. Making $x$ the subject of $P = 2x + 3$ is similar to expressing $x$ in terms of $P$.", "example": "$P = 2x + 3$ is rewritten as $x = \\frac{P-3}{2}$, so the subject changes from $P$ to $x$.", ich": "2026-10-09", "enrichNotes": "Figure labels checked against x = 4y − 2 (P.4.21). Top row: y, ×4 gives 4y, −2 gives 4y − 2, into the box 'x = 4y − 2'. Bottom row, back from the same box: +2 gives x + 2 (= 4y, true because x + 2 = 4y − 2 + 2), ÷4 gives (x + 2)/4, into the box y. Each undo box sits under the step it undoes, in the same colour, with a dashed 'undoes' arrow. All arrows end on box edges. The alt text describes the same picture in the same order. The statement ('multiplied by 4 first, and then 2 is subtracted ... add 2, then divide by 4') and the remember line ('the last step done to b is ÷3, so multiply both sid"}, "parent": "S2C4-064", "role": "why", "short": "Why we undo the last step first", "treeOrder": 54}, {"id": "S2C4-065", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "When a letter multiplies the new subject", "statement": "The new subject may be multiplied by a letter instead of a number. We can still divide both sides by that letter, because we assume it is not zero.", "sources": [{"page": "Page21", "printed": "4.21", "where": "example"}, {"page": "Page02", "printed": "4.2", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "No margin note explains this step; it is read from Example 14(a) (P.4.21). The reason 'we assume it is not zero' comes from the Note on P.4.2: all the algebraic fractions in this chapter have non-zero denominators, so in $x = \\frac{1-b}{a}$ we assume $a \\neq 0$. The book does not repeat this at Example 14(a).", "keyIdea": "K4-10", "level": "core", "example": "$ax + b = 1$, so $ax = 1 - b$ and $x = \\frac{1-b}{a}$.", "check": {"pages": ["4.2", "4.21"], "date": "2026-10-07", "result": "fixed", "notes": "(condition) 'We can still divide both sides by that letter' drops the non-zero condition. The card cites the P.4.2 note but does not say it. Dividing by $a$ is allowed only because the book assumes that every algebraic ctionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "New subject in a denominator", "statement": "Sometimes one whole side of a formula is a fraction with the new subject in its denominator. Then we can first multiply both sides by that denominator.", "sources": [{"page": "Page22", "printed": "4.22", "where": "example"}, {"page": "Page24", "printed": "4.24", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "No margin note names this step; it is read from Example 15. Exercise 4D Q4 and Q12 (P.4.24) test the same idea with a new subject alone in a denominator.", "keyIdea": "K4-10", "level": "core", "example": "$a = \\frac{3-y}{x+y}$ $[y]$ gives $a(x + y) = 3 - y$, so $ax + ay = 3 - y$.", "check": {"pages": ["4.22", "4.24"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'When the new subject is in a denominator, first multiply both sides by that denominator' turns one example into a general rule, and the book breaks it. In Example 16 (P.4.22), the new subject m is in a denominator, but the first step moves a/n across to get 1/m alone. The book multiplies by m only once 1/m is a whole side. Instant Drill 16 (2/x = p − 1/y, find y) is the same kind.; (modality) 'first' presents one order as the required order. Write 'we can first' and state the case the book shows: one whole side is a fraction.", "final": "pass", "enrich": "2026-10-09", "enrichNotes": ""}, "parent": "S2C4-064", "role": "method", "short": "Subject in a denominator", "treeOrder": 57}, {"id": "S2C4-068", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "New subject in more than one term: group, then factorize", "statement": "When the new subject is in more than one term, put all the terms containing it on one side. Then extract it as a common factor, and divide.", "sources": [{"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The magenta objective of Example 15 calls this 'changing the subject of a formula by grouping terms'. The last step, dividing by $(a + 1)$, has no margin note.", "keyIdea": "K4-10", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Step", "Working"], ["Start", "$ax + ay = 3 - y$"], ["Put all the terms containing $y$ on one side", "$ay + y = 3 - ax$"], ["Extract the common factor $y$", "$y(a + 1) = 3 - ax$"], ["Divide both sides by $a + 1$", "$y = \\frac{3-ax}{a+1}$"]], "words": true}, "check": {"pages": ["4.22"], "date": "2026-10-07", "result": "equivalent", "notes": " | final: (scope) The title says 'several terms' and the short label says 'In two terms', but the statement says 'in more than one term'. 'In two terms' narrows the case, and 'several' usually means more than two. Use the statement's words for the same thing.", "final": "fixed", "confirmed": "2026-10-07"}, "parent": "S2C4-067", "role": "method", "short": "Subject in more than one term", "treeOrder": 58}, {"id": "S2C4-069", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Adding or subtracting algebraic fractions in a formula", "statement": "If a formula adds or subtracts algebraic fractions, we can first get the fraction with the new subject alone on one side. Then we make the other side into one fraction with a common denominator.", "sources": [{"page": "Page22", "printed": "4.22", "where": "example"}, {"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "core", "example": "$\\frac{1}{m} + \\frac{a}{n} = \\frac{1}{k}$ $[m]$ gives $\\frac{1}{m} = \\frac{1}{k} - \\frac{a}{n} = \\frac{n-ak}{kn}$.", "check": {"pages": ["4.22"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) 'When a formula has algebraic fractions' is wider than the book's case. The objective of Example 16 is a formula 'involving addition/subtraction of algebraic fractions'. Example 15, a = (3 − y)/(x + y), also has an algebraic fraction, but the book uses a different method there.; (english) The first sentence has 23 words. | final: (ambiguous) 'get the fraction with the new subject alone' can be read as 'the fraction in which the new subject is alone'. The book's step is $\\frac{1}{m} = \\frac{1}{k} - \\frac{a}{n}$ (Example 16, P.4.22): the fraction stands alone on one side. Add 'on one side'.; (scope) The title 'Formulae with algebraic fractions' and the short label 'With algebraic fractions' keep the wide scope the audit narrowed in the statement. Example 15, $a = \\frac{3-y}{x+y}$, also has an algebraic fraction, and the book uses a different method there (S2C4-067). The objective o", "final": "fixed", "confirmed": "2026-10-07 (after fix)", "enrich": "2026-10-09", "enrichNotes": ""}, "inferred": "The book gives no rule in words; the steps are read from Example 16 (P.4.22), whose magenta objective is 'Change the subject of a formula involving addition/subtraction of algebraic fractions'. Teacher note N15 (P.4.23) shows another way: multiply both sides by the L.C.M. of $m$, $n$ and $k$.", "parent": "S2C4-064", "role": "method", "short": "Formula that adds or subtracts fractions", "treeOrder": 59}, {"id": "S2C4-070", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Making $m$ the subject from $\\frac{1}{m}$", "statement": "If $\\frac{1}{m}$ equals a single fraction, multiply both sides by $m$ and by the denominator of that fraction. Then divide both sides by the factor that multiplies $m$.", "sources": [{"page": "Page22", "printed": "4.22", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "supporting", "example": "$\\frac{1}{m} = \\frac{n-ak}{kn}$, so $kn = m(n - ak)$ and $m = \\frac{kn}{n-ak}$.", "check": {"pages": ["4.22"], "date": "2026-10-07", "result": "fixed", "notes": "(ambiguous) 'the other denominator' does not say which denominator. 'Then divide both sides to get m alone' does not say what to divide by. The book's lines are kn = m(n − ak), then kn/(n − ak) = m: it divides by (n − ak), the factor that multiplies m. | final: (unmarked) The card has no inferred note, but both sentences are a reading of the margin working beside Example 16 (P.4.22); the book gives no words for these steps. The statement and example are correct ($kn = m(n - ak)$, $m = \\frac{kn}{n-ak}$).", "final": "fixed", "confirmed": "2026-10-07"}, "inferred": "The book gives no words for these steps; they are read from the margin working beside Example 16 (P.4.22): $\\frac{1}{m} = \\frac{n-ak}{kn}$, $kn = m(n - ak)$, $\\frac{kn}{n-ak} = m$.", "parent": "S2C4-069", "role": "method", "short": "From $\\frac{1}{m}$ to $m$", "treeOrder": 60}, {"id": "S2C4-071", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "property", "title": "Some formulae have no explicit subject", "statement": "Some formulae have no explicit subject. For example, $\\frac{1}{m} + \\frac{a}{n} = \\frac{1}{k}$ has no explicit subject, and the lens formula in Physics, $\\frac{1}{u} + \\frac{1}{v} = \\frac{1}{f}$, is seldom written with a subject, such as $f = \\frac{uv}{u+v}$, $v = \\frac{uf}{u-f}$ or $u = \\frac{vf}{v-f}$.", "watchOut": "Students ==may== think that every formula must have a subject, and that it must be on the L.H.S.", "sources": [{"page": "Page22", "printed": "4.22", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N14 (magenta, P.4.22).", "keyIdea": "K4-10", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note beyond the revision focus."}, {"id": "S2C4-072", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Clear all fractions with the L.C.M.", "statement": "To remove the fractions in a formula, you can multiply both sides by the L.C.M. of the denominators. For $\\frac{1}{m} + \\frac{a}{n} = \\frac{1}{k}$, multiplying both sides by $kmn$ gives $kn + amk = mn$, so $kn = m(n - ak)$ and $m = \\frac{kn}{n-ak}$.", "example": "Clue to Supplementary Exercise Q54: multiply both sides of $\\frac{1}{r} = \\frac{1+p}{1-p} - \\frac{1}{q}$ by $(1-p)qr$ to eliminate the denominators.", "sources": [{"page": "Page23", "printed": "4.23", "where": "teacher note"}, {"page": "Page31", "printed": "4.31", "where": "exercise"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only alternative method; the card on formulae with algebraic fractions carries the idea."}, {"id": "S2C4-073", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "One way: change the subject, then substitute", "statement": "To find a variable that is not the subject, one way is to make it the subject first. Then substitute the given values.", "example": "A triangle has sides $x$ cm, $x$ cm and 3 cm, and its perimeter $P$ cm is $P = 2x + 3$. Make $x$ the subject, $x = \\frac{P-3}{2}$, then substitute $P = 11$ to get $x = 4$.", "sources": [{"page": "Page20", "printed": "4.20", "where": "activity"}, {"page": "Page20", "printed": "4.20", "where": "main text"}, {"page": "Page22", "printed": "4.22", "where": "main text"}, {"page": "Page23", "printed": "4.23", "where": "example"}, {"page": "Page26", "printed": "4.26", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The example and the figure are from Class Activity 4.1 and the text below it (P.4.20): the isosceles triangle with sides $x$ cm, $x$ cm and 3 cm, $P = 2x + 3$, and $P = 11$ giving $x = 4$ (the activity's answers are printed in magenta). The P.4.26 source is the magenta Clue to Exercise 4D Q44(b): 'Substitute $r = 2$ and $A = 88$ into the formula obtained in (a).'", "keyIdea": "K4-9", "level": "core", "visual": {"type": "figure", "w": 260, "h": 150, "shapes": [{"poly": [[85, 125], [175, 125], [130, 14]], "fill": "tint"}], "labels": [{"x": 104, "y": 70, "tex": "$x$ cm", "pos": "left"}, {"x": 156, "y": 70, "tex": "$x$ cm", "pos": "right"}, {"x": 130, "y": 129, "tex": "$3$ cm", "pos": "below"}], "maxw": 300, "alt": "A triangle with two sides of x cm and a base of 3 cm."}, "check": {"pages": ["4.20", "4.22", "4.23", "4.26"], "date": "2026-10-07", "result": "fixed", "notes": "(context) The example says 'its perimeter is P = 2x + 3 cm', which puts the unit on the expression, and then uses P = 11 as a plain number. The book has 'The perimeter P cm of △ABC ... P = 2x + 3'.; (term) The statement says 'the known values', but the sister cards say 'the given values'. Use the same word for the same thing.", "final": "pass", "confirmed": "2026-10-07 (after fix)"}, "parent": "S2C4-058", "role": "method", "short": "Change the subject, then substitute", "treeOrder": 52}, {"id": "S2C4-074", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "More than one order of steps works", "statement": "A subject can often be changed in more than one way. For $s = \\frac{(u+v)t}{2}$, instead of dividing by $t$ first, you can expand first: $2s = ut + vt$, so $2s - ut = vt$ and $v = \\frac{2s-ut}{t}$.", "sources": [{"page": "Page23", "printed": "4.23", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-10", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only note; the card on the order of steps carries the idea."}, {"id": "S2C4-075", "section": "4.3", "sectionTitle": "Change of Subject of a Formula", "kind": "method-idea", "title": "Change in one variable when another changes", "statement": "To find the change in $x$ when $y$ changes, first make $x$ the subject. Then write the new $x$ in terms of $y$, and find the new $x$ min function secKey(s) {
  s = String(s || "");
  // Opener first, numbered sections next, end matter (summary, highlight, DSE support) last.
  const group = /^opener/i.test(s) ? "0" : /^\d/.test(s) ? "1" : "2";
  return group + s.split(/[\s.]+/).map(t => /^\d+$/.test(t) ? t.padStart(4, "0") : t).join(".");
}
function inSummary(c) {
  if (typeof c.inSummary === "boolean") return c.inSummary;
  return (c.sources || []).some(s => s.where === "summary");
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function richHTML(text) {
  const maths = [];
  let t = String(text || "").replace(/\$[^$]*\$/g, m => { maths.push(m); return "\u0000" + (maths.length - 1) + "\u0000"; });
  t = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // The card font (KaTeX_Main) draws a straight ' as a closing quote, so 'the rest' showed as ’the rest’.
  // Curl them outside the maths: opening after a space, a bracket or the start; closing (and apostrophes) otherwise.
  t = t.replace(/(^|[\s(\[\u2014\u2013-])'/g, "$1\u2018").replace(/'/g, "\u2019");
  // Double quotes too (overnight audit, 7 October: a title began with a backwards closing quote).
  t = t.replace(/(^|[\s(\[\u2014\u2013-])"/g, "$1\u201C").replace(/"/g, "\u201D");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/==(.+?)==/g, "<mark>$1</mark>")
       .replace(/__(.+?)__/g, "<u>$1</u>")
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  t = t.replace(/(^|[\s(>])((?:[A-Za-z\d]|\u0000\d+\u0000)+(?:-[A-Za-z]+)+)/g, '$1<span class="nw">$2</span>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => maths[+i].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"));
}
function rich(tag, cls, text) {
  const e = el(tag, cls);
  e.innerHTML = richHTML(text);
  return e;
}
function typeset(node) {
  if (window.renderMathInElement) {
    // Fractions are shown full-size (as in DSE papers) so they stay readable on a tablet, except inside a
    // subscript or a superscript, where a full-size fraction is huge: \log_{\frac{1}{2}} keeps a small one.
    const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode())

// A figure without axes: a bar model, a labelled fraction, a geometry shape. Shapes sit on a w × h canvas with
// y downwards; labels are KaTeX, placed like graph labels. Chapter-neutral, drawn in the graph's ink.
function figureEl(v) {

  if (v.maxw) wrap.style.setProperty("--fw", v.maxw + "px");
  wrap.dataset.need = Math.min(W, v.maxw || 420);   // the width its labels were placed for (fitCard)
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  if (v.alt) s.setAttribute("aria-label", v.alt);
  wrap.appendChild(s);

  const FILL = { none: "none", tint: "#dce7f8", soft: "#eef1f5", warm: "#f6e7c8" };

  const pen = st => ({ stroke: st === "fill-only" ? "none" : st === "muted" || st === "dashed" ? muted : ink,

                       "stroke-dasharray": st === "dashed" ? "5 4" : "none", "stroke-linejoin": "round" });

  };

    else if (g.poly) svg("polygon", { points: pts(g.poly), fill, ...pen(g.style) }, s);
    else if (g.path) svg("polyline", { points: pts(g.path), fill: "none", ...pen(g.style) }, s);

      if (g.arrows === "both") head(x2, y2, x1, y1, p.stroke, L);

    const sp = el("span", "vlab" + (t.bare ? " bare" : ""), t.tex);
    sp.style.left = (t.x / W * 100) + "%";
    sp.style.top = (t.y / H * 100) + "%";
    sp.style.transform = LABEL_POS[t.pos] || "translate(-50%,-50%)";
    if (t.size) sp.style.fontSize = (0.74 * t.size) + "em";

  });

}
