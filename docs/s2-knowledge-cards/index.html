 rough grid gives a rough approximation of the intersection. A finer grid lets us read more closely.", "example": "", "sources": [{"page": "Page20", "printed": "5.20", "where": "note"}, {"page": "Page20", "printed": "5.20", "where": "example"}, {"page": "Page49", "printed": "5.49", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "Teacher correction, 28 October 2026: whole-unit grid reads (1,-1) to the nearest whole unit; tenths grid reads (1.4,-0.7) to the nearest tenth. The exact intersection (10/7,-5/7) positions the graph only; neither reading is presented as exact.", "keyIdea": "K5-4", "level": "core", "check": {"pages": ["5.20", "5.49"], "date": "2026-10-08", "result": "fixed", "notes": "(unmarked) The student text is right: the statement is the book's Note word for word, and the example keeps 'close to' and 'approximately'. But the inferred note describes a watch-out the card does not have. Only the teacher's note needs correcting.", "final": "pass", "markers": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "plot", "x": ["c==0?-0.5:1.1", "c==0?3:1.8"], "y": ["c==0?-2:-0.95", "c==0?1:-0.45"], "curves": [{"f": "-x/2", "style": "main", "label": "$x+2y=0$", "lx": "c==0?0.3:1.3", "ly": "c==0?0.3:-0.53", "pos": "right"}, {"f": "(2*x-5)/3", "style": "main", "label": "$3y=2x-5$", "lx": "c==0?1.8:1.47", "ly": "c==0?-1.8:-0.9", "pos": "right"}], "points": [{"x": 1.4285714285714286, "y": -0.7142857142857143, "label": "$P$", "pos": "above-right", "on": 0}], "segments": [{"x1": 1.4285714285714286, "y1": "c==0?0:-0.95", "x2": 1.4285714285714286, "y2": -0.7142857142857143, "style": "dashed"}, {"x1": "c==0?0:1.1", "y1": -0.7142857142857143, "x2": 1.4285714285714286, "y2": -0.7142857142857143, "style": "dashed"}], "live": {"choices": ["Whole-unit grid", "Tenths grid"], "c": 0, "readout": "[[say(0)]]", "fns": {"say": "[\"Each square is 1 unit. To the nearest whole unit, the solution is approximately $(1,-1)$.\", \"Each square is $0.1$ unit. To the nearest tenth, the solution is approximately $(1.4,-0.7)$.\"][c]"}}, "grid": {"step": "c==0?1:0.1", "every": 1, "dp": "c==0?0:1"}}, "remember": "", "parent": "S2C5-048", "role": "warning", "short": "Graph readings may be approximate", "treeOrder": 36}, {"id": "S2C5-054", "section": "5.3", "sectionTitle": "Solving Simultaneous Linear Equations in Two Unknowns — Algebraic Methods", "kind": "property", "title": "Algebraic methods give the exact value", "statement": "Algebraic methods can give an exact solution. A rounded graph reading and an exact answer ==may== describe the same intersection.", "example": "Compare the solutions of $\\begin{cases}x+2y=0\\\\3y=2x-5\\end{cases}$.", "sources": [{"page": "Page26", "printed": "5.26", "where": "main text"}, {"page": "Page20", "printed": "5.20", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "P.5.26 says that, for Example 7, the graphical method can only give an approximate value, and that algebraic methods give the exact value. Teacher note N16 (P.5.20), merged from S2C5a-054, says the same for Example 7.", "keyIdea": "K5-4", "level": "core", "check": {"pages": ["5.20", "5.26"], "date": "2026-10-08", "result": "fixed", "notes": "(modality) The example says 'the graphs give only $x = 1.4$, $y = -0.7$'. This drops the book's word 'approximate', so a student may think the graphs give a wrong answer, not an approximate one. The exact solution $x = \\frac{10}{7}$, $y = -\\frac{5}{7}$ is right: $\\frac{10}{7} + 2(-\\frac{5}{7}) = 0$ and $3(-\\frac{5}{7}) = 2(\\frac{10}{7}) - 5 = -\\frac{15}{7}$.", "final": "pass", "markers": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Graph reading", "$x\\approx1.4$, $y\\approx-0.7$"], ["Exact answer", "$x=\\frac{10}7$, $y=-\\frac57$"], ["Rounded exact values", "$\\frac{10}7\\approx1.4$, $-\\frac57\\approx-0.7$"]], "words": false}, "hidden": true, "hiddenWhy": "Removed at the teacher's request on 28 October 2026 to avoid confusion."}, {"id": "S2C5-055", "section": "5.3", "sectionTitle": "Solving Simultaneous Linear Equations in Two Unknowns — Algebraic Methods", "kind": "method-idea", "title": "Test a solution read from graphs", "statement": "Teacher note N17: teachers ==may== ask students to substitute $x = 1.4$, $y = -0.7$ (read from the graphs) into $x + 2y = 0$ and $3y = 2x - 5$, and see whether they satisfy the equations. This shows that the graphical method could ==only== give an approximate solution.", "example": "$1.4 + 2(-0.7) = 0$ works. But $3(-0.7) = -2.1$ while $2(1.4) - 5 = -2.2$, so the pair does not satisfy $3y = 2x - 5$ exactly.", "sources": [{"page": "Page26", "printed": "5.26", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N17. The arithmetic in the example is ours; N17 does not print the result.", "keyIdea": "K5-5", "level": "extra", "hidden": true, "hiddenWhy": "A teaching suggestion for the teacher."}, {"id": "S2C5-056", "section": "5.3", "sectionTitle": "Solving Simultaneous Linear Equations in Two Unknowns — Algebraic Methods", "kind": "wording", "title": "The principle of substitution", "statement": "Make one unknown the subject of one equation, then substitute that expression into the other equation. This reduces two unknowns to one.", "sources": [{"page": "Page26", "printed": "5.26", "where": "main text"}, {"page": "Page50", "printed": "5.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K5-5", "level": "core", "check": {"pages": ["5.26", "5.50"], "date": "2026-10-08", "result": "fixed", "notes": "(scope) 'Two commonly used algebraic methods are ...' suggests there are other commonly used ones. The book says 'The commonly used algebraic methods are' these two. | final: (scope) The title 'The two algebraic methods' says there are only two algebraic methods. The book says 'The commonly used algebraic methods are' these two (P.5.26), and the audit fixed the statement for exactly this reason. The title keeps the old fault.", "final": "fixed", "confirmed": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "example": "", "remember": "", "inferred": "Authored conceptual introduction using x+y=7 and 3x-y=5. The complete solution continues in animation S2C5-060.", "visual": {"type": "table", "head": "col", "words": false, "rows": [["Two unknowns", "$\\begin{cases}x+y=7\\\\3x-y=5\\end{cases}$"], ["Change the subject", "$y=7-x$"], ["Substitute into the other equation", "$3x-(7-x)=5$"], ["One unknown", "Only $x$ remains."]]}, "parent": null, "role": null, "short": "Substitution reduces the unknowns", "treeOrder": 37}, {"id": "S2C5-057", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Substitution leaves one unknown only", "statement": "Make one unknown the subject of one equation, then substitute it into the other equation. This leaves one unknown.", "example": "From $\\begin{cases}x+2y=0\\\\x=-2y\\end{cases}$; into $3y=2x-5$: $3y=2(-2y)-5$.", "sources": [{"page": "Page26", "printed": "5.26", "where": "main text"}, {"page": "Page50", "printed": "5.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "P.5.26. The summary (P.5.50) names the method of substitution and works an example: from $x - y = 1$, $x = y + 1$; substituting into $2x = 3y$ gives $2(y + 1) = 3y$, so $y = 2$ and $x = 3$.", "keyIdea": "K5-5", "level": "core", "check": {"pages": ["5.26", "5.50"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "watchOut": "Substituting back into the same equation gives no new information: $-2y+2y=0$.", "hidden": true, "hiddenWhy": "The substitution principle is on 056; the complete method follows on animation 060."}, {"id": "S2C5-058", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "notation", "title": "Label the equations (1), (2), (3)", "statement": "In the working, we label the equations (1), (2), (3), and so on. Each step then names the equations it uses, such as '*Substitute (3) into (2).*' or '(1) + (2):'.", "example": "$x + 2y = 0$ is (1) and $3y = 2x - 5$ is (2); from (1), $x = -2y$ is (3), so we '*Substitute (3) into (2).*'", "sources": [{"page": "Page26", "printed": "5.26", "where": "main text"}, {"page": "Page32", "printed": "5.32", "where": "main text"}, {"page": "Page34", "printed": "5.34", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K5-5", "level": "supporting", "check": {"pages": ["5.26", "5.32", "5.34"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Folded into the complete route on S2C5-060 (26 October 2026)."}, {"id": "S2C5-059", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Check the solution in both equations", "statement": "Substitute the solution into both given equations. It must make L.H.S. equal R.H.S. in each equation.", "example": "", "sources": [{"page": "Page26", "printed": "5.26", "where": "main text"}, {"page": "Page27", "printed": "5.27", "where": "margin note"}, {"page": "Page28", "printed": "5.28", "where": "margin note"}, {"page": "Page29", "printed": "5.29", "where": "margin note"}, {"page": "Page32", "printed": "5.32", "where": "margin note"}, {"page": "Page33", "printed": "5.33", "where": "margin note"}, {"page": "Page41", "printed": "5.41", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K5-5", "level": "core", "check": {"pages": ["5.26", "5.27", "5.28", "5.29", "5.32", "5.33", "5.41"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "Check $(6,9)$ in $x=y-3$, $y=2x-3$"], ["First equation", "$6=9-3=6$"], ["Second equation", "$9=2(6)-3=9$"], ["Conclusion", "Both equations are satisfied."]], "words": false}, "hidden": true, "hiddenWhy": "The teacher removed the separate checking card and its check as unnecessary."}, {"id": "S2C5-060", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Solve by substitution", "statement": "", "example": "", "sources": [{"page": "Page27", "printed": "5.27", "where": "main text"}, {"page": "Page27", "printed": "5.27", "where": "example"}, {"page": "Page26", "printed": "5.26", "where": "teacher note"}, {"page": "Page27", "printed": "5.27", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Complete authored route, replacing a graph that exposed the intersection before the algebra.", "keyIdea": "K5-5", "level": "core", "visual": {"type": "manim-vector", "scene": "algebraic-substitution", "steps": [{"label": "Original simultaneous equations", "start": 0.0, "time": 3.85}, {"label": "Make y the subject of equation (1)", "start": 4.0, "time": 8.3}, {"label": "Replace y in the other equation", "start": 8.45, "time": 13.65}, {"label": "Remove the brackets with the minus sign", "start": 13.8, "time": 17.95}, {"label": "Solve the equation in x", "start": 18.1, "time": 23.15}, {"label": "Substitute x=3 to find y", "start": 23.3, "time": 29.4}, {"label": "State both unknowns", "start": 29.55, "time": 32.8}, {"label": "Check both original equations", "start": 32.95, "time": 37.7}], "alt": "Solve x+y=7 and 3x-y=5 by substitution. Make y=7-x, replace y in the other equation with the whole bracketed expression, solve x=3 and y=4, and check both original equations."}, "check": {"pages": ["5.26", "5.27"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-26", "enrichNotes": ""}, "remember": "", "parent": "S2C5-056", "role": "method", "short": "Solve by substitution", "treeOrder": 38}, {"id": "S2C5-061", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Step 1 may already be done", "statement": "If one equation already has an unknown as its subject, such as $x = y - 3$, then Step 1 is given. We can go straight to Step 2.", "example": "In $x = y - 3$, $x$ is already the subject, so we substitute it into $y = 2x - 3$ at once.", "sources": [{"page": "Page27", "printed": "5.27", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K5-5", "level": "supporting", "check": {"pages": ["5.27"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Too minor (as S5 Ch1's 'choose a suitable subject', teacher f6): an equation that already has a subject skips Step 1."}, {"id": "S2C5-062", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Remove the brackets after substituting", "statement": "Put a substituted expression in brackets. The number outside, with its sign, multiplies every term inside.", "example": "", "sources": [{"page": "Page27", "printed": "5.27", "where": "margin note"}, {"page": "Page28", "printed": "5.28", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book puts the substituted expression in brackets whenever the unknown has a number in front (Example 8; Example 9 and its other way on P.5.28; Example 10; the Alternative of Example 15), and also in the Alternatives on P.5.27 and P.5.35. Examples 16 (P.5.40) and 19 (P.5.42) substitute into a lone $x$ without brackets. The book never states 'put it in brackets' as a rule; the rule is ours, as safe practice. The margin notes 'Remove the brackets' (P.5.27, P.5.28) show the number in front, with its sign, multiplying every term inside.", "keyIdea": "K5-5", "level": "core", "check": {"pages": ["5.27", "5.28"], "date": "2026-10-08", "result": "fixed", "notes": "(ambiguous) 'the number in front multiplies every term inside, with its sign': 'its' can mean the sign of the number in front or the sign of each term. The book's margin $-3(12 - 8x) = -3(12) - 3(-8x)$ shows that the number in front keeps its own sign. Put 'with its sign' right after 'the number in front'. Both worked lines are right. | final: (unmarked) Teacher note only; the student text is right and both worked lines are checked. The inferred note says 'The book shows the brackets in every substitution'. That is not so: Example 16 writes '2y + 1 + y = 10' (P.5.40) and Example 19 writes '12y − 88 = 2y + 2' (P.5.42), both without brackets. The book brackets the expression whenever the unknown has a number in front. Whether the student rule should stay general is left to the teacher (forTeacher).", "final": "fixed", "confirmed": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "row", "rows": [["Expression", "Expand", "Simplify"], ["$2(y-3)$", "$2y-2(3)$", "$2y-6$"], ["$-3(12-8x)$", "$-3(12)-3(-8x)$", "$-36+24x$"]], "words": false}, "parent": "S2C5-060", "role": "warning", "short": "Multiply every bracketed term", "treeOrder": 40}, {"id": "S2C5-063", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "property", "title": "Any choice gives the same solution", "statement": "We can choose a different unknown as the subject, or a different equation to start from. We still get the same solution, but a poor choice can make the calculation after substitution long and tiring.", "example": "For $5x - 3y = 22$ and $8x + y = 12$, $y = 12 - 8x$ is quick to use. Using $x = \\frac{12 - y}{8}$ gives the same $x = 2$, $y = -4$, but the calculation is long and tiring.", "sources": [{"page": "Page27", "printed": "5.27", "where": "example"}, {"page": "Page27", "printed": "5.27", "where": "teacher note"}, {"page": "Page28", "printed": "5.28", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "P.5.28 solves Example 9 another way and says 'We can still obtain x = 2, y = −4, but the calculation is quite tedious.' Teacher note N20 (P.5.27) says that in many cases choosing an inappropriate equation can make the computation tedious after substitution. 'Poor choice' is our plain word for 'inappropriate', and 'long and tiring' is our plain wording for 'tedious', as on card S2C5-070.", "keyIdea": "K5-5", "level": "supporting", "check": {"pages": ["5.27", "5.28"], "date": "2026-10-08", "result": "fixed", "notes": "(context) The example says 'In Example 9' but does not give Example 9's equations, so the student cannot see why $y = 12 - 8x$ is quick. Give the two equations.; (english) 'Another choice of subject, or of the equation to substitute into, still gives ...' leaves out words in the middle of the sentence. Weak readers find this hard. Use two plain sentences. | final: (english) 'tedious' (statement and example) is a hard word for weak readers, and card S2C5-070 says the same thing as 'long and tiring'. Use one wording for one idea. The meaning is kept: the book says the other way 'is quite tedious' (P.5.28), and N20 says a poor choice can make the computation tedious after substitution. Maths checked: $x = \\frac{12 - y}{8}$ gives $5(12 - y) - 24y = 176$, so $y = -4$ and $x = 2$.", "final": "fixed", "confirmed": "2026-10-08"}, "hidden": true, "hiddenWhy": "Folded into the complete route on S2C5-064 (26 October 2026)."}, {"id": "S2C5-064", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Choose an easy subject", "statement": "An unknown with coefficient 1 is often an easy subject. Other choices give the same solution, but ==may== give longer working.", "example": "For $8x+y=12$, use $y=12-8x$; $x=\\frac{12-y}{8}$ is also valid.", "sources": [{"page": "Page28", "printed": "5.28", "where": "example"}, {"page": "Page29", "printed": "5.29", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The reason (coefficient 1) is stated only in teacher note N22. The student Clue on P.5.28 just says 'Make y the subject of equation (2) first.'", "keyIdea": "K5-5", "level": "supporting", "check": {"pages": ["5.28", "5.29"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-26", "enrichNotes": ""}, "parent": "S2C5-060", "role": "method", "short": "Choose an easy subject", "treeOrder": 39}, {"id": "S2C5-065", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Clear fractions: multiply every term", "statement": "Multiply every term on both sides by the L.C.M. of the denominators. Then solve the equations without fractions.", "example": "", "sources": [{"page": "Page28", "printed": "5.28", "where": "margin note"}, {"page": "Page31", "printed": "5.31", "where": "exercise"}, {"page": "Page38", "printed": "5.38", "where": "exercise"}, {"page": "Page39", "printed": "5.39", "where": "exercise"}, {"page": "Page53", "printed": "5.53", "where": "exercise"}, {"page": "Page61", "printed": "5.61", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Authored fraction-clearing example with the full simultaneous solve.", "keyIdea": "K5-6", "level": "core", "check": {"pages": ["5.28", "5.31", "5.38", "5.39", "5.53", "5.61"], "date": "2026-10-08", "result": "fixed", "notes": "(unmarked) The card text matches the book (margin note 'Multiply both sides by 8', P.5.28; example checked: $5(12 - y) - 24y = 176$). But the inferred note says equations with decimals 'appear only in exercises'. Example 20 (P.5.43) is a worked example with decimals ($0.3x + 0.45y = 150$, (1) $\\times$ 0.3). Only the teacher's note needs correcting.", "final": "pass", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$\\begin{cases}\\frac{x}{2}+\\frac{y}{3}=4\\\\x-y=3\\end{cases}$"], ["Clear fractions", "$\\times6$: $3x+2y=24$"], ["Substitute", "$x=y+3$: $3(y+3)+2y=24$"], ["Solve", "$5y+9=24$; $y=3$"], ["Solution", "$x=3+3=6$, $y=3$"]], "words": false}, "hidden": true, "hiddenWhy": "The teacher removed the whole More forms branch as unnecessary after sound learning of substitution and elimination."}, {"id": "S2C5-066", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "notation", "title": "Solve a chained equality", "statement": "$A=B=C$ means all three expressions are equal. Choose two equations that connect all three expressions, then solve them.", "example": "", "sources": [{"page": "Page29", "printed": "5.29", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K5-6", "level": "core", "check": {"pages": ["5.29"], "date": "2026-10-08", "result": "fixed", "notes": "(term) The card calls $A = B = C$ 'an equation'. The book calls $2m + 5n = m - \\frac{5}{2}n - 1 = 0$ 'the following simultaneous equations', and its Clue says '$A = B = C$ means' a pair of equations. Say it means two simultaneous equations, not that it is one equation.", "final": "pass", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$x+y=2x-y=9$"], ["Two equations", "(1) $x+y=9$; (2) $2x-y=9$"], ["Add", "(1)+(2): $3x=18$, so $x=6$"], ["Find $y$", "$6+y=9$, so $y=3$"], ["Check the chain", "$6+3=2(6)-3=9$"]], "words": false}, "remember": "$A=C$ and $B=C$, or $A=B$ and $B=C$, both connect all three expressions.", "inferred": "Authored complete chained-equality route; connects all three expressions explicitly.", "hidden": true, "hiddenWhy": "The teacher removed the whole More forms branch as unnecessary after sound learning of substitution and elimination."}, {"id": "S2C5-067", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "property", "title": "Two of the three equations are enough", "statement": "Teacher note N21: $2m + 5n = m - \\frac{5}{2}n - 1 = 0$ is also equivalent to three equations: $2m + 5n = 0$, $m - \\frac{5}{2}n - 1 = 0$ and $2m + 5n = m - \\frac{5}{2}n - 1$. The first two are enough to give the solution; the third is redundant, and calculating with it is more complicated.", "sources": [{"page": "Page29", "printed": "5.29", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "inferred": "Teacher note N21 (three stars), which says teachers may explain this to abler students.", "keyIdea": "K5-6", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only remark beyond the revision focus; the A = B = C card carries the idea."}, {"id": "S2C5-068", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "title": "Known solution: substitute to find the constants", "statement": "Substitute the known solution into both equations. Solve the resulting equations for the unknown constants.", "example": "", "sources": [{"page": "Page31", "printed": "5.31", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. Ex 5C Q30 (P.5.31), with the magenta Clue 'Substitute x = 2, y = 1 into the given simultaneous equations'. The example is ours.", "keyIdea": "K5-6", "level": "supporting", "check": {"pages": ["5.31"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$(2,3)$ solves $\\begin{cases}px+qy=28\\\\px-qy=-8\\end{cases}$"], ["Substitute", "$2p+3q=28$; $2p-3q=-8$"], ["Add", "$4p=20$, so $p=5$"], ["Find $q$", "$10+3q=28$, so $q=6$"], ["Constants", "$p=5$, $q=6$"]], "words": false}, "hidden": true, "hiddenWhy": "The teacher removed the whole More so $a = \\frac{1}{7}$, $b = \\frac{1}{3}$.", "final": "fixed", "confirmed": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$\\begin{cases}\\frac1a+\\frac1b=10\\\\\\frac1a-\\frac1b=4\\end{cases}$; $a,b\\ne0$"], ["New unknowns", "Let $u=\\frac1a$, $v=\\frac1b$: $\\begin{cases}u+v=10\\\\u-v=4\\end{cases}$"], ["Solve for $u$", "Add: $2u=14$, so $u=7$"], ["Solve for $v$", "$7+v=10$, so $v=3$"], ["Original unknowns", "$\\frac1a=7$, $\\frac1b=3$, so $a=\\frac17$, $b=\\frac13$"]], "words": false}, "remember": "The new unknowns are reciprocals: $u=7$ means $a=\\frac17$, not $a=7$.", "hidden": true, "hiddenWhy": "The teacher removed the whole More forms branch as unnecessary after sound learning of substitution and elimination."}, {"id": "S2C5-M01", "section": "5.3 A", "sectionTitle": "Method of Substitution", "kind": "method-idea", "keyIdea": "K5-6", "level": "supporting", "sources": [{"page": "Page31", "printed": "5.31", "where": "exercise"}, {"page": "Page39", "printed": "5.39", "where": "exercise"}, {"page": "Page56", "printed": "5.56", "where": "exercise"}], "nonFoundation": false, "teacherOnly": false, "inSummary": false, "splitFrom": "S2C5-069", "title": "Use new unknowns for repeated expressions", "statement": "Use a new unknown for each repeated expression. After solving, substitute back and find the original unknowns.", "visual": {"type": "table", "head": "col", "rows": [["Given", "$\\begin{cases}2(p-q)+(p+q)=8\\\\(p-q)-(p+q)=-2\\end{cases}$"], ["New unknowns", "$u=p-q$, $v=p+q$: $\\begin{cases}2u+v=8\\\\u-v=-2\\end{cases}$"], ["Solve", "Add: $3u=6$, so $u=2$; $v=4$."], ["Substitute back", "$\\begin{cases}p-q=2\\\\p+q=4\\end{cases}$"], ["Original unknowns", "Add: $2p=6$, so $p=3$; $q=1$."]], "words": false}, "inferred": "Authored illustration of repeated compound expressions in 5.31 and 5.39 exercises; full reconstruction shown.", "check": {"pages": ["5.31", "5.39", "5.56"], "date": "2026-10-2 $4x + 3y = 1$ and $5x - 3y = 8$ (P.5.32).", "check": {"pages": ["5.32"], "date": "2026-10-08", "result": "fixed", "notes": "(unmarked) The card text matches P.5.32. The example ($3x + 2y = 10$, $5x - 2y = 22$; checked: $x = 4$, $y = -1$) is not the book's ($4x + 3y = 1$, $5x - 3y = 8$), and the card has no inferred note. | final: (term) The title 'Opposite coefficients: add to eliminate' uses a phrase the book does not use. A weak reader can take 'opposite' to mean 'opposite signs' only, for example $3y$ and $-2y$; adding those does not eliminate $y$. The book's condition is 'equal in magnitude but opposite in sign' (P.5.32), as the statement says. Statement and example are right (checked: $8x = 32$, $x = 4$, $y = -1$).", "final": "fixed", "confirmed": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$\\begin{cases}3x+2y=10\\\\5x-2y=22\\end{cases}$"], ["Add", "$8x+(2y-2y)=32$"], ["Solve", "$8x=32$, so $x=4$"], ["Find $y$", "$12+2y=10$, so $y=-1$"], ["Solution", "$x=4$, $y=-1$"]], "words": false}, "hidden": true, "hiddenWhy": "The elimination principle is on 072; the complete animation follows on 074."}, {"id": "S2C5-W01", "section": "5.3 B", "sectionTitle": "Method of Elimination", "kind": "explanation", "keyIdea": "K5-7", "level": "core", "sources": [{"page": "Page32", "printed": "5.32", "where": "main text"}], "nonFoundation": false, "teacherOnly": false, "inSummary": false, "authored": true, "explains": "S2C5-071", "title": "Why adding the equations eliminates $y$", "statement": "Adding the two equations keeps the sides equal. The opposite $y$-terms cancel.", "remember": "The resulting equation is $8x=32$.", "visual": {"type": "table", "head": "col", "rows": [["$\\mathrm{(1)}$", "$3x$", "$+\\,2y$", "$=$", "$10$"], ["$\\mathrm{(2)}$", "$5x$", "$-\\,2y$", "$=$", "$22$"], ["$\\mathrm{(1)}+\\mathrm{(2)}$", "$8x$", "$+\\,0$", "$=$", "$32$"]], "words": false, "layout": "elimination"}, "check": {"pages": ["5.32"], "date": "2026-10-26", "result": "added explanation", "notes": "", "enrich": "2026-10-26", "enrichNotes": ""}, "hidden": true, "hiddenWhy": "The elimination animation carries the cancellation explanation."}, {"id": "S2C5-072", "section": "5.3 B", "sectionTitle": "Method of Elimination", "kind": "definition", "title": "The principle of elimination", "statement": "Add or subtract the equations so that one unknown cancels, leaving an equation in one unknown. For coefficients equal in magnitude, add opposite signs or subtract matching signs.", "example": "", "sources": [{"page": "Page32", "printed": "5.32", "where": "main text"}, {"page": "Page33", "printed": "5.33", "where": "main text"}, {"page": "Page50", "printed": "5.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "P.5.32 says 'The above method of solving simultaneous equations is called the method of elimination'; 'adding or subtracting' is taken from the general steps on P.5.33. The example is ours; the book's subtraction case is $3x + 2y = 4$ and $3x + y = -1$ (P.5.33).", "keyIdea": "K5-7", "level": "core", "check": {"pages": ["5.32", "5.33", "5.50"], "date": "2026-10-08", "result": "fixed", "notes": "(unmarked) The card text is right. The example ($3x + 4y = 23$, $x + 4y = 13$; checked: $2x = 10$, $x = 5$, $y = 2$) is not in the book, and the inferred note does not say so.", "final": "pass", "markers": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "remember": "", "visual": {"type": "table", "head": "col", "words": false, "rows": [["Two unknowns", "$\\begin{cases}3x+4y=23\\\\x+4y=13\\end{cases}$"], ["Subtract the equations", "$(3x+4y)-(x+4y)=23-13$"], ["One unknown", "$2x=10$"]]}, "parent": null, "role": null, "short": "Eliminate one unknown", "treeOrder": 41}, {"id": "S2C5-073", "section": "5.3 B", "sectionTitle": "Method of Elimination", "kind": "link", "title": "Qin Jiushao used elimination", "statement": "The Chinese mathematician Qin Jiushao (1202–1261) used the method of elimination to solve simultaneous equations in his book '*Mathematical Treatise in Nine Sections*'.", "sources": [{"page": "Page32", "printed": "5.32", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "From the 'Interesting Maths' box.", "keyIdea": "K5-7", "level": "extra", "hidden": true, "hiddenWhy": "History (Qin Jiushao), not a knowledge point."}, {"id": "S2C5-074", "section": "5.3 B", "sectionTitle": "Method of Elimination", "kind": "method-idea", "title": "Solve by elimination", "statement": "", "sources": [{"page": "Page33", "printed": "5.33", "where": "main text"}, {"page": "Page33", "printed": "5.33", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K5-7", "level": "core", "visual": {"type": "manim-vector", "scene": "elimination", "steps": [{"label": "Original simultaneous system", "start": 0.0, "time": 3.65}, {"label": "Multiply the whole second equation by 3", "start": 5.1, "time": 11.2}, {"label": "Add both sides", "start": 11.35, "time": 14.9}, {"label": "Cancel the opposite y terms", "start": 15.05, "time": 18.45}, {"label": "Solve the remaining equation in x", "start": 18.6, "time": 22.95}, {"label": "Substitute x=4 into equation (1)", "start": 23.1, "time": 27.25}, {"label": "Recover y", "start": 27.4, "time": 31.567}, {"label": "State the simultaneous solution", "start": 31.717, "time": 34.867}, {"label": "Check both original equations", "start": 35.017, "time": 39.467}], "alt": "Solve 2x+3y=17 and 3x-y=9 by elimination. Multiply the whole second equation by 3, add and eliminate y, solve x=4 and y=3, and check both original equations."}, "check": {"pages": ["5.33"], "date": "2026-10-08", "result": "fixed", "notes": "(term) The steps match P.5.33 and the working matches Example 11 (checked: $10x = 30$, $x = 3$, $y = -1$). But the Step 1 cell 'Given: $2y$ and $-2y$' lists terms, while Step 1 is about t card carries the idea."}, {"id": "S2C5-080", "section": "5.3 B", "sectionTitle": "Method of Elimination", "kind": "method-idea", "title": "Multiply both equations using the L.C.M.", "statement": "Use the L.C.M. of the coefficient magnitudes to match one unknown's coefficients. Choose the unknown that gives easier working.", "example": "", "sources": [{"page": "Page34", "printed": "5.34", "where": "example"}, {"page": "Page35", "printed": "5.35", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The general sentence about the L.C.M. is teacher note N24 (point 1); Example 13 and its Clue show it to students.", "keyIdea": "K5-7", "level": "supporting", "check": {"pages": ["5.34", "5.35"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass", "markers": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$\\begin{cases}3x+25y+22=0\\quad(1)\\\\2x+15y+13=0\\quad(2)\\end{cases}$"], ["Choose $x$", "L.C.M. of 3 and 2: 6; of 25 and 15: 75."], ["Multiply both", "$\\begin{cases}6x+50y+44=0\\quad(1)\\times2\\\\6x+45y+39=0\\quad(2)\\times3\\end{cases}$"], ["Subtract", "$5y+5=0$, so $y=-1$"], ["Solution", "$2x-15+13=0$, so $x=1$, $y=-1$"]], "words": false}, "parent": "S2C5-078", "role": "extends", "short": "Multiply both equations", "treeOrder": 45}, {"id": "S2C5-081", "section": "5.3 B", "sectionTitle": "Method of Elimination", "kind": "method-idea", "title": "Eliminate the unknown with the easier L.C.M.", "statement": "Look at the coefficients of both unknowns. Choose to eliminate the unknown with the smaller L.C.M. of coefficients, or with an L.C.M. that is easier to find.", "example": "In $3x + 25y + 22 = 0$ and $2x + 15y + 13 = 0$, eliminate $x$: the L.C.M. of 3 and 2 is 6, but the L.C.M. of 25 and 15 is 75.", "sources": [{"page": "Page34", "printed": "5.34", "where": "example"}, {"page": "Page35", "printed": "5.35", "where": "te at …'), not a 'must'.; (unmarked) The inferred note cites Ex 5D Q2, Q6, Q10, Q11 and Q14 (P.5.37) and Supp Ex Q40, but in all of these the like terms are already on the same side (only the order differs). Like terms on different sides appear in Supp Ex Q41 and Q43 (P.5.56, 'by the method of elimination') and in Ex 5D Q17, Q21, Q25 and Q26 (P.5.", "final": "pass", "confirmed": "2026-10-08 (after fix)", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "(1) $y=11-2x$; (2) $2x+4y=26$"], ["Same side", "Rewrite (1): $2x+y=11$ (3)"], ["Subtract", "(2)-(3): $3y=15$, so $y=5$"], ["Find $x$", "$5=11-2x$; $2x=6$; $x=3$"], ["Solution", "$x=3$, $y=5$"]], "words": false}, "hidden": true, "hiddenWhy": "The teacher removed this separate procedural reminder."}, {"id": "S2C5-083", "section": "5.3 C", "sectionTitle": "Special Cases of Simultaneous Equations in Two Unknowns", "kind": "definition", "title": "The unique solution", "statement": "A **unique solution** means exactly one pair of values satisfies both equations.", "sources": [{"page": "Page35", "printed": "5.35", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K5-8", "level": "core", "example": "$\\begin{cases}x+y=5\\\\x-y=1\\end{cases}$ has the unique solution $x=3$, $y=2$.", "inferred": "The example is ours.", "check": {"pages": ["5.35"], "date": "2026-10-08", "result": "fixed", "notes": "(unmarked) The statement matches P.5.35 ('known as' becomes 'is called'). The example ($x + y = 5$, $x - y = 1$; checked: $x = 3$, $y = 2$) is ours, and the card has no inferred note.", "final": "pass", "markers": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "parent": null, "role": null, "short": "One solution", "treeOrder": 46}, {"id": "S2C5-084", "section": "5.3 C", "sectionTitle": "Special Cases of Simultaneous Equations in Two Unknowns", "kind": "wording", "title": "No solutions, or more than one solution", "state metimes the letters do not stand for what the question asks for. Then, after solving, use the values of the unknowns to work out the answer.", "example": "", "sources": [{"page": "Page41", "printed": "5.41", "where": "teacher note"}, {"page": "Page45", "printed": "5.45", "where": "exercise"}, {"page": "Page46", "printed": "5.46", "where": "exercise"}, {"page": "Page47", "printed": "5.47", "where": "exercise"}, {"page": "Page48", "printed": "5.48", "where": "exercise"}, {"page": "Page59", "printed": "5.59", "where": "exercise"}, {"page": "Page61", "printed": "5.61", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Authored complete derived-answer example, with the original conditions included.", "keyIdea": "K5-9", "level": "supporting", "check": {"pages": ["5.41", "5.45", "5.46", "5.47", "5.48", "5.59", "5.61"], "date": "2026-10-08", "result": "fixed", "notes": "(english) 'The letters do not always stand for what the question asks for. Then, …' — 'Then' after 'not always' is hard to follow. Start with 'Sometimes' so that 'Then' clearly means 'in that case'.; (ambiguous) In the example, 'let them cost $x$ and $y$ dollars' leaves the reader to work out which letter is which. Name each one, as the book's 'Let' sentences do. Maths checked: $30 + 8 = 38$. | final: (context) The length cut removed what the question asks for. The example now starts 'Let a cake cost $x$ dollars ...' and never says that the question asks for the total price of 1 cake and 1 drink. That is the whole point of the card (the letters do not stand for what is asked), so the student has to guess it from the last words. The audit's proposal had this context. Put it back in one short sentence. Maths checked: $30 + 8 = 38$.", "final": "fixed", "confirmed": "2026-10-08", "enrich": "2026-10-26", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "Two cakes and a drink cost 32 dollars; a cake and a drink cost 20 dollars. Find the cost of one cake and two drinks."], ["Let", "A cake costs $x$ dollars; a drink costs $y$ dollars."], ["Equations", "$\\begin{cases}2x+y=32\\\\x+y=20\\end{cases}$"], ["Solve", "Subtract: $x=12$; $12+y=20$, so $y=8$."], ["Asked quantity", "$x+2y=12+2(8)=28$"], ["Answer", "One cake and two drinks cost 28 dollars."]], "words": false}, "hidden": true, "hiddenWhy": "The teacher retained only 092 in Setting up equations; the requested-quantity check moves to 092."}, {"id": "S2C5-104", "section": "5.4", "sectionTitle": "Applications of Simultaneous Linear Equations in Two Unknowns", "kind": "method-idea", "title": "Organise the information in a table", "statement": "A table or a diagram that organises the given information helps us with some complicated problems. This table organises Teddy's and Jimmy's ages at present, 8 years ago and 2 years later.", "sources": [{"page": "Page42", "printed": "5.42", "where": "example"}, {"page": "Page42", "printed": "5.42", "where": "teacher note"}, {"page": "Page43", "printed": "5.43", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The sentence is teacher note N30; the Clue tables in Examples 19 and 20 are printed for students.", "keyIdea": "K5-9", "level": "supporting", "visual": {"type": "table", "head": "both", "rows": [["", "At present", "8 years ago", "2 years later"], ["Teddy's age", "$x$", "$x - 8$", "$x + 2$"], ["Jimmy's age", "$y$", "$y - 8$", "$y + 2$"]], "words": true}, "check": {"pages": ["5.42", "5.43"], "date": "2026-10-08", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Folded into the complete route on S2C5-105 (26 October 2026)."}, {"id": "S2C5-105", "section": "5.4", "sectionTitle": "Applications of Simultaneous Linear Equations in Two Unknowns", "kind": "method-idea", "title": "Ages: use the correct time", "statement": "Let the unknowns be the present ages. In each condition, use both people's ages at the stated time.", " function secKey(s) {
  s = String(s || "");
  // Opener first, numbered sections next, end matter (summary, highlight, DSE support) last.
  const group = /^opener/i.test(s) ? "0" : /^\d/.test(s) ? "1" : "2";
  return group + s.split(/[\s.]+/).map(t => /^\d+$/.test(t) ? t.padStart(4, "0") : t).join(".");
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;

function richHTML(text) {
  const maths = [];
  let t = String(text || "").replace(/\$[^$]*\$/g, m => { maths.push(m); return "\u0000" + (maths.length - 1) + "\u0000"; });
  t = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // The card font (KaTeX_Main) draws a straight ' as a closing quote, so 'the rest' showed as ’the rest’.
  // Curl them outside the maths: opening after a space, a bracket or the start; closing (and apostrophes) otherwise.
  t = t.replace(/(^|[\s(\[\u2014\u2013-])'/g, "$1\u2018").replace(/'/g, "\u2019");
  // Double quotes too (overnight audit, 7 October: a title began with a backwards closing quote).
  t = t.replace(/(^|[\s(\[\u2014\u2013-])"/g, "$1\u201C").replace(/"/g, "\u201D");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/==(.+?)==/g, "<mark>$1</mark>")
       .replace(/__(.+?)__/g, "<u>$1</u>")
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  t = t.replace(/(^|[\s(>])((?:[A-Za-z\d]|\u0000\d+\u0000)+(?:-[A-Za-z]+)+)/g, '$1<span class="nw">$2</span>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => maths[+i].replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"));
}
function rich(tag, cls, text) {
  const e = el(tag, cls);
  e.innerHTML = richHTML(text);
  return e;
}

      wrap.classList.remove("invite");
      let i = 0, bd = Infinity;
      cands.forEach((t, j) => { if (Math.abs(t - S.cur.t) < bd) { bd = Math.abs(t - S.cur.t); i = j; } });
      i = e.key === "Home" ? 0 : e.key === "End" ? cands.length - 1 : Math.max(0, Math.min(cands.length - 1, i + step));

}

// A figure without axes: a bar model, a labelled fraction, a geometry shape. Shapes sit on a w × h canvas with
// y downwards; labels are KaTeX, placed like graph labels. Chapter-neutral, drawn in the graph's ink.
function figureEl(v) {
  const W = v.w || 300, H = v.h || 180;
  const wrap = el("div", "vis figure");
  if (v.maxw) wrap.style.setProperty("--fw", v.maxw + "px");
  wrap.dataset.need = Math.min(W, v.maxw || 420);   // the width its labels were placed for (fitCard)
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  if (v.alt) s.setAttribute("aria-label", v.alt);
  wrap.appendChild(s);
  const ink = "#1b2230", muted = "#8a96a8";
  const FILL = { none: "none", tint: "#dce7f8", soft: "#eef1f5", warm: "#f6e7c8" };
  // "bold": a flow-chart arrow, thicker and with a bigger head (teacher, 8 October 2026: thin arrows were not seen as a flow).
  const pen = st => ({ stroke: st === "fill-only" ? "none" : st === "muted" || st === "dashed" ? muted : ink,
                       "stroke-width": st === "fill-only" ? 0 : st === "muted" || st === "dashed" ? 1.2 : st === "bold" ? 2.6 : 1.6,
                       "stroke-dasharray": st === "dashed" ? "5 4" : "none", "stroke-linejoin": "round" });
  const head = (xa, ya, xb, yb, colour, L = 6) => {
    const a = Math.atan2(yb - ya, xb - xa);
    svg("path", { d: `M${xb},${yb} L${xb - L * Math.cos(a - 0.4)},${yb - L * Math.sin(a - 0.4)} L${xb - L * Math.cos(a + 0.4)},${yb - L * Math.sin(a + 0.4)} Z`, fill: colour }, s);
  };
  const pts = list => list.map(p => p.join(",")).join(" ");
  (v.shapes || []).forEach(g => {
    const fill = FILL[g.fill || "none"] || "none";
    if (g.rect) { const [x, y, w, h] = g.rect; svg("rect", { x, y, width: w, height: h, fill, ...pen(g.style) }, s); }
    else if (g.poly) svg("polygon", { points: pts(g.poly), fill, ...pen(g.style) }, s);
    else if (g.path) svg("polyline", { points: pts(g.path), fill: "none", ...pen(g.style) }, s);
    else if (g.line) {
      const [[x1, y1], [x2, y2]] = g.line, p = pen(g.style);
      svg("line", { x1, y1, x2, y2, ...p }, s);
      const L = g.style === "bold" ? 11 : 6;
      if (g.arrows === "end" || g.arrows === "both") head(x1, y1, x2, y2, p.stroke, L);
      if (g.arrows === "both") head(x2, y2, x1, y1, p.stroke, L);
    }
  });
  (v.labels || []).forEach(t => {
    const sp = el("span", "vlab" + (t.bare ? " bare" : ""), t.tex);
    sp.style.left = (t.x / W * 100) + "%";
    sp.style.top = (t.y / H * 100) + "%";
    sp.style.transform = LABEL_POS[t.pos] || "translate(-50%,-50%)";
    if (t.size) sp.style.fontSize = (0.74 * t.size) + "em";
    wrap.appendChild(sp);
  });
  return wrap;
}

// ---- The branch rail beside a card (wide screens) ----
function roleTag(role, cls) {
  const t = el("span", cls + (role === "warning" ? " trap" : role === "why" ? " why" : role === "joins" ? " join" : ""), ROLE[role] || "");
  return t;
}
function summaryNeeds(ch, id) {
  const slots=(ch.checks || {})[id] || [];
  return [...new Set(slots.flatMap(s => s.needs || [id]))];
}
function isSummaryCheck(ch, id) { return summaryNeeds(ch,id).length > 1; }
function summaryBranches(ch, tree) {
  const ids=new Set(tree.order.map(n=>n.c.id));
  return tree.order.filter(n=>isSummaryCheck(ch,n.c.id)).map(n=>({owner:n.c,needs:summaryNeeds(ch,n.c.id)}));
}
// Place after all covered material in the tree's reading order, even when the owner comes earlier.
function summaryAnchors(ch, tree) {
  const anchors=new Map();
  for(const branch of summaryBranches(ch,tree)){
    const covered=new Set(branch.needs);
    const anchor=tree.order.filter(n=>covered.has(n.c.id)).at(-1);
    if(anchor){if(!anchors.has(anchor.c.id))anchors.set(anchor.c.id,[]);anchors.get(anchor.c.id).push(branch);}
  }
  return anchors;
}
function summaryActionEl(ch, {owner,needs}) {

  const label=el("span","summary-label","Summary challenge");label.appendChild(el("small","",`${needs.length} cards`));
  button.append(stateIcon(cardState(ch,owner.id)||waitMark(ch,owner)||"bulb"),label);

  button.onclick=e=>{e.stopPropagation();jumpTo(owner.id);openCheck(ch,owner.id,false);};
  return button;
}

// ---- The map slide: a group's whole tree, laid out left to right ----
function mapSlideEl(item, host) {
  const { tree, k } = item;
  const sec = el("section", "mapslide");
  sec.appendChild(el("h2", "", k.title));
  sec.appendChild(rich("p", "lede", k.summary || ""));
  // The idea's revision line: where its checks stand, when, and a fresh start for the whole group.
  const recMap = recLoad(DATA[state.ch]);
  const line = ideaCheckEl(DATA[state.ch], k, tree);
  if (line) sec.appendChild(line);
  const wrap = el("div", "tmap-wrap");
  const map = el("div", "tmap");
  wrap.appendChild(map);
  sec.appendChild(wrap);
  const summaries=summaryAnchors(DATA[state.ch],tree);
  sec.appendChild(el("p", "maphint", "Tap any branch to open it, or press Next to start at the root."));

  // Rows: each leaf takes a row; a parent sits level with the middle of its children.
  let row = 0, maxDepth = 0;
  const clusters = [];
  const place = n => {
    n.x0 = 0;   // the column offset of a cluster placed side by side (below); a tree is laid out afresh each time
    maxDepth = Math.max(maxDepth, n.depth);
    if (n.joins && n.joins.length && !n.kids.length) n.row = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length;
    else if (n.joins && n.joins.length) {
      // A converging card with children sits level with the cards it joins: its children use the rows beside them
      // (the columns to its right are empty up there), so the arrows run straight across instead of dropping down.
      const leaves = m => (m.kids.length ? m.kids.reduce((a, k) => a + leaves(k), 0) : 1);

      row = Math.max(Math.min(...n.joins.map(j => j.row)), mid - (leaves(n) - 1) / 2);
      n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2;
      row = Math.max(saved, row);
    }
    else if (!n.kids.length) n.row = row++;
    else { n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; }
  };
  let lastCluster;
  tree.roots.forEach(r => {
    if (r.c.cluster && r.c.cluster !== lastCluster) {

  tree.order.forEach(n => {

    b.appendChild(rich("span", "", shortOf(n.c)));
    const st = isSummaryCheck(DATA[state.ch],n.c.id) ? "" : cardState(DATA[state.ch], n.c.id, recMap) || waitMark(DATA[state.ch], n.c);
    if (st) b.appendChild(stateIcon(st));

        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";

function sinceText(t) {

      { label: `$${fr(`${k}${a} + ${k * h}`, `${a} + ${k * h}`)}$`, note: `$${k}(${a} + ${h})$, not $${a} + ${k * h}$` },
      { label: `$${fr(`${a} + ${k + h}`, `${a} + ${h}`)}$`, note: "no common factor" },
      { label: `$${fr(`${a}^2 + ${a}`, `${a} + ${b}`)}$`, note: `$${a}(${a} + 1)$, not $${a} + ${b}$` },
      { label: `$${fr(`${a}${b} + ${a}`, `${b}(${a} + 1)`)}$`, note: `$${a}${b} + ${a} = ${a}(${b} + 1)$; no common factor` }];
    const nYes = rnd([2, 3]);
    return { type: "multi", prompt: "Tap every fraction that can be simplified by cancelling a common factor.", ask: "Tap every one, then Check.",
             why: "Factorize first. Only a common factor of the whole numerator and the whole denominator can be cancelled.",
             options: shuffle([...pickN(yes, nYes).map(o => ({ ...o, ok: true })), ...pickN(no, 5 - nYes).map(o => ({ ...o, ok: false }))]) };
  },
  // Card "(m + n)^2 has the factor m + n twice": cancel one factor, and count what is left.
  "power-cancel": () => {
    // Review: squares only, as on the card and in the book; no m + n (the card's own example).
    const [a, b] = rnd(LET2), h = rnd([1, 2, 3]);
    const f = rnd([`${a} - ${b}`, `${a} + ${h}`, `${a} - ${h}`, `2${a} - ${h}`]);
    const up = rnd([true, false]);          // (f)^2 over f, or f over (f)^2
    return { type: "choice", eq: true, prompt: `$${up ? fr(`(${f})^2`, f) : fr(f, `(${f})^2`)}$ simplifies to …`,
             why: `$(${f})^2$ means $(${f})(${f})$, so it has the factor $${f}$ twice. Cancel one, and one $${f}$ is left in the ${up ? "numerator" : "denominator"}.`,
             options: shuffle([{ label: up ? `$${f}$` : `$${fr(1, f)}$`, ok: true }, { label: "$1$", ok: false }, { label: up ? `$${fr(1, f)}$` : `$${f}$`, ok: false }]) };
  },
  // ---- K4-3 Multiplying and dividing ----
  // Card "Dividing: convert division to multiplication": turn only the second fraction upside down.
  "flip-second": () => {
    const [x, y] = rnd(LET2), [c, d] = nums(2);
    const A = fr(x, c), B = fr(y, d);
    return { type: "choice", eq: true, prompt: `$${A} \\div ${B}$ is the same as …`,
             why: "Change $\\div$ to $\\times$ and turn only the second fraction upside down.",
             options: shuffle([{ label: `$${A} \\times ${fr(d, y)}$`, ok: true }, { label: `$${fr(c, x)} \\times ${B}$`, ok: false },
                               { label: `$${A} \\times ${B}$`, ok: false }, { label: `$${fr(c, x)} \\times ${fr(d, y)}$`, ok: false }]) };
  },
  // Card "Cancel common factors before multiplying": a factor in any numerator with the same factor in any denominator.
  "cancel-across": () => {
    const [x, y] = rnd(LET2);
    let c, d; do { [c, d] = nums(2); } while (gcd(c, d) > 1);   // two numbers with a common factor could be cancelled too
    const yes = [[`${fr(x, y)} \\times ${fr(y, c)}`, `$${y}$`], [`${fr(c, x)} \\times ${fr(x, d)}`, `$${x}$`],
                 [`${fr(`${c}${x}`, y)} \\times ${fr(y, `${d}${x}`)}`, `$${x}$ and $${y}$`], [`${fr(`${x} + ${c}`, y)} \\times ${fr(y, d)}`, `$${y}$`]];
    const no = [[`${fr(x, c)} \\times ${fr(d, y)}`, "no common factor"], [`${fr(c, y)} \\times ${fr(`${y} + ${d}`, x)}`, `$${y}$ is only a term of $${y} + ${d}$`],
                [`${fr(x, `${x} + ${c}`)} \\times ${fr(d, y)}`, `$${x}$ is only a term of $${x} + ${c}$`], [`${fr(`${x} - ${y}`, c)} \\times ${fr(d, x)}`, `$${x}$ is only a term of $${x} - ${y}$`]];
    const nYes = rnd([1, 2, 3]);
    return { type: "sort", prompt: "Before multiplying, can a common factor be cancelled?", chips: ["Yes", "No"],
             why: "A factor in any numerator can be cancelled with the same factor in any denominator. A letter that is only one term of a sum or difference cannot be cancelled.",
             rows: shuffle([...pickN(yes, nYes).map(([t, n]) => ({ label: `$${t}$`, answer: 0, note: `cancel ${n}` })),
                            ...pickN(no, 4 - nYes).map(([t, n]) => ({ label: `$${t}$`, answer: 1, note: n }))]) };
  },
  // Card "Only multiplication and division: left to right".
  "left-to-right": () => {
    const x = rnd(LET1), a = rnd([2, 3]), m = rnd([2, 3, 4].filter(m => a * m <= 9)), b = a * m;   // one-digit numbers
    const c = rnd([2, 3, 4].filter(c => c !== m && m * c <= 9));
    const lr = m * c, rl = m / c;
    const rlTex = Number.isInteger(rl) ? `$${rl}$` : `$${fr(m / gcd(m, c), c / gcd(m, c))}$`;
    const third = c / m, thirdTex = Number.isInteger(third) ? `$${third}$` : `$${fr(c / gcd(m, c), m / gcd(m, c))}$`;
    const opts = [{ label: `$${lr}$`, ok: true }, { label: rlTex, ok: false }, { label: thirdTex, ok: false }];
    return { type: "choice", eq: true, prompt: `$${fr(x, a)} \\div ${fr(x, b)} \\times ${c}$ is equal to …`,
             why: `Work from left to right: $${fr(x, a)} \\div ${fr(x, b)} = ${m}$, then $${m} \\times ${c} = ${lr}$.`,
             options: shuffle(opts.filter((o, i) => opts.findIndex(p => p.label === o.label) === i)) };
  },
  // ---- K4-4 Same denominator ----
  // Card "Never add numerators and denominators separately".
  "same-denominator": () => {
    // Review: the right answer is in its simplest form (no factor shared with k).
    const x = rnd(LET1), k = rnd([1, 1, 3]);
    let p, q; do { [p, q] = pickN([1, 2, 3, 4, 5], 2); } while (gcd(p, k) > 1 || gcd(q, k) > 1 || gcd(p + q, k) > 1);
    const L = k === 1 ? x : `${k}${x}`, L2 = `${2 * k}${x}`, Lsq = k === 1 ? `${x}^2` : `${k * k}${x}^2`;
    return { type: "choice", eq: true, prompt: `$${fr(p, L)} + ${fr(q, L)}$ is equal to …`,
             why: `Add the numerators only. The denominator stays $${L}$.`,
             options: shuffle([{ label: `$${fr(p + q, L)}$`, ok: true }, { label: `$${fr(p + q, L2)}$`, ok: false }, { label: `$${fr(p + q, Lsq)}$`, ok: false }]) };
  },
  // ---- K4-5 Different denominators ----
  // Card "One denominator is a multiple of the other": sort the pairs by their L.C.M.
  "lcm-sort": () => {
    const x = rnd(LET1.filter(l => l !== "x")), L = n => (n === 1 ? x : `${n}${x}`);   // not x: the card's own 1/(8x) + 1/(2x) (values panel, 15 Oct)
    const pairsOf = T => { const out = []; for (let a = 1; a < T; a++) for (let b = a + 1; b <= T; b++) if (T % a === 0 && T % b === 0 && (a * b) / gcd(a, b) === T) out.push([a, b]); return out; };
    const [T1, T2] = pickN([4, 6, 8, 9], 2);   // one-digit L.C.M.s
    const row = pr => { const [a, b] = shuffle(pr); return `$${fr(1, L(a))} ${rnd(["+", "-"])} ${fr(1, L(b))}$`; };
    const n1 = rnd([1, 2, 3]);
    return { type: "sort", prompt: "What is the L.C.M. of the two denominators?", chips: [`$${L(T1)}$`, `$${L(T2)}$`],
             why: "When one denominator is a multiple of the other, this multiple is the L.C.M. Otherwise, line up the factors and take one from each column.",
             rows: shuffle([...pickN(pairsOf(T1), n1).map(pr => ({ label: row(pr), answer: 0 })), ...pickN(pairsOf(T2), 4 - n1).map(pr => ({ label: row(pr), answer: 1 }))]) };
  },
  // Card "No common factor: multiply the denominators".
  "product-denominator": () => {
    // Review: one-digit products, and no numerator that shares a factor with its own denominator.
    const [x, y] = rnd(LET2), [c, d] = rnd([[1, 1], [1, 1], [2, 3], [3, 2], [1, 2], [3, 1]]);
    let p, q; do { [p, q] = nums(2); } while (gcd(p, c) > 1 || gcd(q, d) > 1);
    const A = c === 1 ? x : `${c}${x}`, B = d === 1 ? y : `${d}${y}`, AB = c * d === 1 ? `${x}${y}` : `${c * d}${x}${y}`;
    return { type: "choice", eq: true, prompt: `For $${fr(p, A)} ${rnd(["+", "-"])} ${fr(q, B)}$, the common denominator is …`,
             why: `$${A}$ and $${B}$ have no common factor, so use their product $${AB}$.`,
             options: shuffle([{ label: `$${AB}$`, ok: true }, { label: `$${A} + ${B}$`, ok: false }, { label: `$${A}$`, ok: false }]) };
  },
  // Card "Write a whole number as a fraction".
  "whole-number": () => {
    const x = rnd(LET1), n = rnd([1, 2, 3]), p = rnd([2, 3, 5, 7].filter(p => p !== n && n + p <= 9));
    const nx = n === 1 ? x : `${n}${x}`;
    return { type: "choice", eq: true, prompt: `$${n} + ${fr(p, x)}$ is equal to …`,
             why: `Write $${n}$ as $${fr(nx, x)}$: $${fr(nx, x)} + ${fr(p, x)} = ${fr(`${nx} + ${p}`, x)}$.`,
             options: shuffle([{ label: `$${fr(`${nx} + ${p}`, x)}$`, ok: true }, { label: `$${fr(n + p, x)}$`, ok: false }, { label: `$${fr(n + p, `1 + ${x}`)}$`, ok: false }]) };
  },

  // ---- K4-6 Negative signs ----
  // Card "Where the negative sign of a fraction goes".
  "sign-sort": () => {
    const x = rnd(LET1), p = rnd([1, 2, 3, 4, 5, 7]);
    const neg = [`\\frac{-${p}}{${x}}`, `\\frac{${p}}{-${x}}`], pos = [`\\frac{-${p}}{-${x}}`, `-\\frac{-${p}}{${x}}`, `-\\frac{${p}}{-${x}}`];
    const n0 = rnd([1, 2]);
    return { type: "sort", prompt: `Is each fraction equal to $-${fr(p, x)}$ or to $${fr(p, x)}$?`, chips: [`$-${fr(p, x)}$`, `$${fr(p, x)}$`],
             why: `A negative sign can move to the front of the fraction. It must be in front of the whole numerator or the whole denominator. One negative sign gives $-${fr(p, x)}$; two give $${fr(p, x)}$.`,
             rows: shuffle([...pickN(neg, n0).map(t => ({ label: `$${t}$`, answer: 0 })), ...pickN(pos, 3 - n0).map(t => ({ label: `$${t}$`, answer: 1 }))]) };
  },
  // Card "When does a fraction equal -1?"
  "minus-one": () => {
    // Review: every sign changed in place (reordered pairs are asked on the sibling card), and not the card's own fractions.
    const [x, y] = rnd([["x", "y"], ["m", "n"], ["p", "q"]]), c = rnd([2, 3, 4, 5]);
    const yes = [[fr(`${x} + ${y}`, `-${x} - ${y}`), `$-${x} - ${y} = -(${x} + ${y})$`], [fr(`-${x} - ${c}`, `${x} + ${c}`), `$-${x} - ${c} = -(${x} + ${c})$`],
                 [fr(`${x} + ${c}${y}`, `-${x} - ${c}${y}`), `$-${x} - ${c}${y} = -(${x} + ${c}${y})$`], [fr(`-${x} + ${y}`, `${x} - ${y}`), `$-${x} + ${y} = -(${x} - ${y})$`]];
    const no = [[fr(`${x} + ${y}`, `-${x} + ${y}`), `$-${x} + ${y} = -(${x} - ${y})$`], [fr(`${x} - ${c}`, `-${x} - ${c}`), `$-${x} - ${c} = -(${x} + ${c})$`],
                [fr(`${x} + ${c}`, `-${x} + ${c}`), `$-${x} + ${c} = -(${x} - ${c})$`], [fr(`${x} - ${c}`, `${x} + ${c}`), `only the sign of $${c}$ changes`]];
    const nYes = rnd([1, 2, 3]);
    return { type: "multi", prompt: "Tap every fraction that simplifies to $-1$.", ask: "Tap every one, then Check.",
             why: "A fraction simplifies to $-1$ when its denominator is the negative of its numerator. The sign of every term must change.",
             options: shuffle([...pickN(yes, nYes).map(([l, n]) => ({ label: `$${l}$`, ok: true, note: n })), ...pickN(no, 4 - nYes).map(([l, n]) => ({ label: `$${l}$`, ok: false, note: n }))]) };
  },
  // Card "Put brackets round a numerator you subtract".
  "bracket-subtract": () => {
    const x = rnd(LET1), d = rnd([1, 2, 3]), c = rnd([4, 5, 6]), plus = rnd([true, false]);   // c + d at most 9
    const inner = `${x} ${plus ? "+" : "-"} ${d}`, k = plus ? c - d : c + d, wrongK = plus ? c + d : c - d;
    return { type: "choice", eq: true, prompt: `$${fr(c, x)} - ${fr(inner, x)}$ is equal to …`,
             why: `$${c} - (${inner}) = ${c} - ${x} ${plus ? "-" : "+"} ${d} = ${k} - ${x}$: the sign of every term in the brackets changes.`,
             options: shuffle([{ label: `$${fr(`${k} - ${x}`, x)}$`, ok: true }, { label: `$${fr(`${wrongK} - ${x}`, x)}$`, ok: false }, { label: `$${fr(`${k} + ${x}`, x)}$`, ok: false }]) };
  },

  // ---- K4-7 Formulae and substitution (revision from S1) ----
  // Card "The variables of a formula": a fresh formula each time.
  "variables": () => {
    // Review: never the card's own figure (P = 2(l + w), A = bh/2); the book writes a length as \ell.
    // No formulae with pi: the card never says pi is a constant, so a weak reader may count it (accuracy audit, 8 Oct).
    const F = [
      { say: "A square has side $s$ cm and perimeter $P$ cm, and $P = 4s$.", ok: "$P$ and $s$", wrong: ["$s$ only", "$P$ only"], why: "$P$ and $s$ both stand for lengths. $4$ is a number." },
      { say: "A rectangle has length $\\ell$ cm, width $w$ cm and area $A$ cm$^2$, and $A = \\ell w$.", ok: "$A$, $\\ell$ and $w$", wrong: ["$\\ell$ and $w$ only", "$A$ only"], why: "$A$, $\\ell$ and $w$ all stand for quantities." },
      { say: "An equilateral triangle has side $x$ cm and perimeter $P$ cm, and $P = 3x$.", ok: "$P$ and $x$", wrong: ["$x$ only", "$P$, $x$ and $3$"], why: "$P$ and $x$ both stand for lengths. $3$ is a number." },
      { say: "A cuboid has length $\\ell$ cm, width $w$ cm, height $h$ cm and volume $V$ cm$^3$, and $V = \\ell wh$.", ok: "$V$, $\\ell$, $w$ and $h$", wrong: ["$\\ell$, $w$ and $h$ only", "$V$ only"], why: "$V$, $\\ell$, $w$ and $h$ all stand for quantities." },
      { say: "A car travels $s$ km in $t$ hours at $v$ km/h, and $s = vt$.", ok: "$s$, $v$ and $t$", wrong: ["$v$ and $t$ only", "$s$ only"], why: "$s$, $v$ and $t$ all stand for quantities." },
      { say: "A cube has side $\\ell$ cm and volume $V$ cm$^3$, and $V = \\ell^3$.", ok: "$V$ and $\\ell$", wrong: ["$V$, $\\ell$ and $3$", "$\\ell$ only"], why: "$V$ and $\\ell$ stand for quantities. The index $3$ is a number." }];
    const f = rnd(F);
    return { type: "choice", prompt: `${f.say} The variables in this formula are …`, why: f.why,
             options: shuffle([{ label: f.ok, ok: true }, ...f.wrong.map(w => ({ label: w, ok: false }))]) };
  },
  // Card "Substituting a negative value": put the negative number in brackets.
  "negative-sub": () => {
    const v = rnd(["x", "y", "a", "b", "t"]), n = rnd([1, 2, 3]);   // every value shown at most 9
    if (rnd([true, false])) {
      return { type: "choice", eq: true, prompt: `To find $${v}^2$ when $${v} = -${n}$, we work out …`,
               why: `Put the negative number in brackets: $(-${n})^2 = ${n * n}$, but $-${n}^2 = -${n * n}$.`,
               options: [{ label: `$(-${n})^2$`, ok: true }, { label: `$-${n}^2$`, ok: false }] };
    }
    const c = rnd([2, 3]);
    return { type: "choice", eq: true, prompt: `To find $${c}${v}$ when $${v} = -${n}$, we work out …`,
             why: `$${c}${v}$ means $${c} \\times ${v}$, so it is $${c} \\times (-${n}) = ${-c * n}$.`,
             options: [{ label: `$${c} \\times (-${n})$`, ok: true }, { label: `$${c} - ${n}$`, ok: false }] };
  },

  // ---- K4-8 The subject ----
  // Card "Expressed in terms of the other variables".
  "in-terms-of": () => {
    let S, v, w, a, b;
    do { [S, v, w] = pickN(["A", "P", "V", "y", "s"], 1).concat(pickN(["x", "b", "h", "t", "r"], 2)); [a, b] = nums(2); }
    while ((S === "A" && [v, w].includes("b") && [v, w].includes("h")) || (S === "P" && a === 2 && b === 3));   // not the card's own sentences (any letter for x: writer, 15 Oct)
    const forms = [
      { f: `${S} = ${a}${v} + ${b}`, ok: `$${S}$ in terms of $${v}$`, no: [`$${v}$ in terms of $${S}$`] },
      { f: `${v} = ${fr(`${S} - ${b}`, a)}`, ok: `$${v}$ in terms of $${S}$`, no: [`$${S}$ in terms of $${v}$`] },
      { f: `${S} = ${v}${w}`, ok: `$${S}$ in terms of $${v}$ and $${w}$`, no: [`$${v}$ in terms of $${S}$ and $${w}$`, `$${v}$ and $${w}$ in terms of $${S}$`] }];
    const F = rnd(forms);
    return { type: "choice", prompt: `$${F.f}$ expresses …`,
             why: `The letter that stands alone on one side is expressed in terms of the letters on the other side.`,
             options: shuffle([{ label: F.ok, ok: true }, ...F.no.map(n => ({ label: n, ok: false }))]) };
  },

  // ---- K4-9 Changing the subject ----
  // Card "Transpose a term".
  "transpose": () => {
    let S, v, a, b; do { S = rnd(["P", "A", "y", "s"]); v = rnd(["x", "t", "b"]); [a, b] = nums(2); } while (S === "P" && v === "x" && a === 2 && b === 3);   // not the card's example
    const plus = rnd([true, false]);
    const term = plus ? `${b}` : `-${b}`;
    return { type: "choice", eq: true, prompt: `In $${S} = ${a}${v} ${plus ? "+" : "-"} ${b}$, transposing the term $${term}$ gives …`,
             why: `The term $${term}$ moves to the other side, and its sign changes from $${plus ? "+" : "-"}$ to $${plus ? "-" : "+"}$.`,
             options: shuffle([{ label: `$${S} ${plus ? "-" : "+"} ${b} = ${a}${v}$`, ok: true }, { label: `$${S} ${plus ? "+" : "-"} ${b} = ${a}${v}$`, ok: false },
                               { label: `$${S} = ${a}${v} ${plus ? "-" : "+"} ${b}$`, ok: false }]) };
  },
  // Card "Convert x into ÷, or ÷ into x, on the other side".
  "convert-op": () => {
    let S, v, a, b;
    do { S = rnd(["P", "A", "y", "s"]); v = rnd(["x", "t", "b"]); [a, b] = nums(2); }
    while ((S === "P" && a === 2 && b === 3) || (v === "b" && a === 3 && b === 8));   // never the card's P - 3 = 2x (nor its (P - 3)/2, S2C4-052) or a = (b + 8)/3 (any subject: values panel and writer, 15 Oct)
    if (rnd([true, false])) {
      return { type: "choice", eq: true, prompt: `To make $${v}$ the subject of $${S} - ${b} = ${a}${v}$, the next step gives …`,
               why: `Convert '$\\times ${a}$' on the right to '$\\div ${a}$' on the left. The whole of $${S} - ${b}$ is divided by ${a}.`,
               options: shuffle([{ label: `$${fr(`${S} - ${b}`, a)} = ${v}$`, ok: true }, { label: `$${a}(${S} - ${b}) = ${v}$`, ok: false }, { label: `$${S} - ${fr(b, a)} = ${v}$`, ok: false }]) };
    }
    return { type: "choice", eq: true, prompt: `To make $${v}$ the subject of $${S} = ${fr(`${v} + ${b}`, a)}$, the first step gives …`,
             why: `Convert '$\\div ${a}$' on the right to '$\\times ${a}$' on the left: $${a}${S} = ${v} + ${b}$.`,
             options: shuffle([{ label: `$${a}${S} = ${v} + ${b}$`, ok: true }, { label: `$${fr(S, a)} = ${v} + ${b}$`, ok: false }, { label: `$${S} = ${a}(${v} + ${b})$`, ok: false }]) };
  },

  // ---- K4-10 Harder changes of subject ----
  // Teacher, 8 October 2026: "this section's pure goal is to achieve change of subject and it's also abstract", so
  // every card here gets a multiple-choice check whose options are different sequences of steps, only one of them
  // right. Each option is a short working in the book's layout (one line per step); each wrong one is a slip the
  // card warns about. The stress test checks that every wrong option has a false line or leaves the new subject on
  // both sides, and that the right one is true line by line.

  // Card "The order of steps depends on the formula": the book's two kinds, x = 4y - 2 and a = (b + 8)/3.
  "order-steps": () => {
    let S, v, a, b, form;
    do { [S, v] = rnd(PAIRS); [a, b] = nums(2); form = rnd(["A+", "A-", "B+", "B-"]); }
    while ((S === "x" && form === "A-" && a === 4 && b === 2) || (S === "a" && form === "B+" && a === 3 && b === 8));   // never the card's own two
    const p = form.endsWith("+"), op = p ? "+" : "-", inv = p ? "-" : "+", term = p ? `${b}` : `-${b}`;
    if (form[0] === "A") {
      return stepsItem(`${S} = ${a}${v} ${op} ${b}`, v,
        `$${v}$ is multiplied by ${a} first, and then ${b} is ${p ? "added" : "subtracted"}. So transpose the term $${term}$ first, then convert '$\\times ${a}$' on the right to '$\\div ${a}$' on the left.`,
        [[`${S} ${inv} ${b}`, `${a}${v}`], [fr(`${S} ${inv} ${b}`, a), v]],
        pickN([[[fr(S, a), `${v} ${op} ${b}`], [`${fr(S, a)} ${inv} ${b}`, v]],          // divides one term only
               [[`${S} ${op} ${b}`, `${a}${v}`], [fr(`${S} ${op} ${b}`, a), v]],          // the sign does not change
               [[`${S} ${inv} ${b}`, `${a}${v}`], [`${a}(${S} ${inv} ${b})`, v]]], 3));   // x instead of ÷
    }
    return stepsItem(`${S} = ${fr(`${v} ${op} ${b}`, a)}`, v,
      `${b} is ${p ? "added to" : "subtracted from"} $${v}$ first, and then the result is divided by ${a}. So convert '$\\div ${a}$' on the right to '$\\times ${a}$' on the left first, then transpose the term $${term}$.`,
      [[`${a}${S}`, `${v} ${op} ${b}`], [`${a}${S} ${inv} ${b}`, v]],
