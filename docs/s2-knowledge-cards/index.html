const workT = lines => `$\\begin{aligned}${lines.map(q => `${q.pre ? q.pre + "\\ " : ""}${q.l} &= ${q.r}${q.tag ? `\\quad\\text{(${q.tag})}` : ""}`).join(" \\\\ ")}\\end{aligned}$`;
const stepsOpt = (lines, ok) => ({ label: workT(lines), ok, _t: lines.map(q => [js(q.l), js(q.r)]) });
// Every simultaneous system starts with a brace and row labels. Working names
// its source equations; derived labels are separate from executable maths.
const systemT = (first, second) => `\\begin{cases}${first}\\quad\\text{(1)}\\\\${second}\\quad\\text{(2)}\\end{cases}`;
const systemMath = (first, second) => `$${systemT(first, second)}$`;
const from = n => `\\text{From (${n}):}`;
const into = (value, n) => `${value}\\text{ into (${n}):}`;
const operation = text => `\\text{${text}:}`;
const routeOpt = (first, second, lines, ok) => ({
  ...stepsOpt(lines, ok),
  label: `$\\begin{gathered}${systemT(first, second)}\\\\${workT(lines).slice(1,-1)}\\end{gathered}$`
});
const rat = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(Math.abs(n), d) || 1; n /= g; d /= g;
                        return d === 1 ? `${n}` : (n < 0 ? `-\\frac{${-n}}{${d}}` : `\\frac{${n}}{${d}}`); };

const GEN_SELF = {};
return Object.assign(GEN_SELF, {
  // ---- K5-1 Linear equations in two unknowns ----
  // Card "With x^2 or xy: not a linear equation".
  "linear-sort": () => {
    let a, b, c; do { a = between(2, 9); b = between(2, 9); c = between(2, 20); } while (new Set([a, b, c]).size < 3 || a === 4);
    const yes = [`${a}x + ${b}y = ${c}`, `y = ${a}x - ${b}`, `x - ${b}y = ${c}`]
      .map(l => ({ label: `$${l}$`, note: "two unknowns, and the highest degree is 1" }));
    const no = [
      { label: `$y = x^2 + ${a}$`, note: "$x^2$ has degree 2" },
      { label: `$${a}xy = ${c}$`, note: "$xy$ has degree 2" },
      { label: `$${a}x + ${b} = ${c}$`, note: "it has only one unknown" }];
    return { type: "sort", prompt: "Is each one a linear equation in two unknowns?", chips: ["Yes", "No"],
             why: "It must have two unknowns, and the highest degree of all its terms must be 1. A term like $x^2$ or $xy$ has degree 2.",
             rows: sortRows(yes, no) };
  },

  // Card "Solutions written as ordered pairs".
  "pair-read": () => {
    let a, b; do { a = rnd([-1, 1]) * between(1, 9); b = rnd([-1, 1]) * between(1, 9); }
    while (Math.abs(a) === Math.abs(b) || (a === 19 && b === 1));
    return { type: "choice", eq: true, prompt: `The ordered pair $(${a}, ${b})$ is one solution of an equation in $x$ and $y$. This solution means …`,
             why: `In an ordered pair $(x, y)$, the value of $x$ comes first and the value of $y$ comes second.`,
             options: shuffle([
               { label: `$x = ${a}$ and $y = ${b}$`, ok: true },
               { label: `$x = ${b}$ and $y = ${a}$`, ok: false, note: "the value of $x$ comes first" },
               { label: `$x = ${a}$ and $x = ${b}$`, ok: false, note: "the second number is the value of $y$" }]) };
  },

  // ---- K5-3 Points and solutions ----
  // Card "Not on the graph: not a solution" (with "A point on the graph gives a solution"): read a picture.
  "on-line-pick": () => {
    const [m, c] = rnd([[1, 1], [1, 2], [2, 1], [2, -2], [-1, 6], [-1, 5]]);
    // off-line points are 2 above or below the line and never on an axis (a point on an axis looks 'on a line');
    // each label sits on the side away from the line
    const nOn = rnd([1, 2, 3]);
    let pts; do {
      pts = shuffle([0, 1, 2, 3, 4]).slice(0, 4)
        .map((x, i) => { const off = i < nOn ? 0 : rnd([-2, 2]); return { x, y: m * x + c + off, on: i < nOn, off }; })
        .sort((p, q) => p.x - q.x);
    } while (pts.some(p => (!p.on && (p.x === 0 || p.y === 0)) || (p.off < 0 ? p.y > 0 && p.y < 3 : p.y < 0 && p.y > -3)));
    const names = ["A", "B", "C", "D"], ys = [...pts.map(p => p.y), m * -1 + c, m * 5 + c];
    const side = p => (p.off < 0 ? "below" : "above") + (m > 0 === (p.off >= 0) ? "-left" : "-right");
    return { type: "multi", prompt: "The straight line is the graph of an equation. Which points have coordinates that are solutions of the equation?",
             plot: { type: "plot", x: [-1, 5], y: [Math.min(...ys) - 1, Math.max(...ys) + 1], curves: [{ f: `${m}*x+(${c})`, style: "main" }],
                     origin: false, points: pts.map(p => ({ x: p.x, y: p.y })), texts: pts.map((p, i) => ({ x: p.x, y: p.y, tex: `$${names[i]}$`, pos: side(p) })) },
             why: "A point on the graph has coordinates that satisfy the equation. A point not on the graph does not.",
             options: pts.map((p, i) => ({ label: `$${names[i]}$`, ok: p.on, note: p.on ? "it lies on the graph" : "it does not lie on the graph" })) };
  },

  // ---- K5-2 The graph of a linear equation ----
  // Card "Horizontal line: the graph of y = -3" (with the vertical line card).
  "vh-line": () => {
    let ks; do { ks = [1, 2, 3, 4].map(() => rnd([-1, 1]) * between(1, 9)); } while (new Set(ks.map(Math.abs)).size < 4 || ks[0] === 4 || ks[1] === 4 || ks[2] === -3 || ks[3] === -3);
    const vert = ks.slice(0, 2).map(k => ({ label: `$x = ${k}$`, note: `every point has $x$-coordinate $${k}$` }));
    const hori = ks.slice(2).map(k => ({ label: `$y = ${k}$`, note: `every point has $y$-coordinate $${k}$` }));
    return { type: "sort", prompt: "What is the graph of each equation?", chips: ["Vertical line", "Horizontal line"],
             why: `All the points on the graph of $x = ${ks[0]}$ have the same $x$-coordinate, so it is a vertical line. All the points on the graph of $y = ${ks[2]}$ have the same $y$-coordinate, so it is a horizontal line.`,
             rows: sortRows(vert, hori) };
  },

  // Card "Where a graph cuts the axes".
  "axis-cut": () => {
    let a, b; do { a = rnd([-1, 1]) * between(1, 9); b = rnd([-1, 1]) * between(1, 9); } while (Math.abs(a) === Math.abs(b) || a === 4 || a === 6);
    const xAxis = rnd([true, false]);
    return { type: "choice", prompt: `A graph cuts the ${xAxis ? "$x$" : "$y$"}-axis at the point $P$. $P$ could be …`,
             why: xAxis ? "A point on the $x$-axis has $y$-coordinate 0." : "A point on the $y$-axis has $x$-coordinate 0.",
             options: shuffle([
               { label: `$(${a}, 0)$`, ok: xAxis, note: "its $y$-coordinate is 0: it is on the $x$-axis" },
               { label: `$(0, ${a})$`, ok: !xAxis, note: "its $x$-coordinate is 0: it is on the $y$-axis" },
               { label: `$(${a}, ${b})$`, ok: false, note: "it is on neither axis" }]) };
  },

  // ---- K5-4 The graphical method ----
  // Card "Common solution" (with "Point of intersection: its coordinates satisfy both equations"): read a picture.
  "common-point": () => {
    // no point on an axis: a point on a line and an axis could look like a point on 'two lines'
    let p, m1, m2, q, d;
    do { p = between(1, 3); [m1, m2] = rnd([[1, -1], [2, -1], [1, -2], [2, -2]]); q = between(1, 4); d = rnd([2, 3]); }
    while (p - d === 0 || q - m1 * d === 0 || q + m2 * d === 0 || (m1 === 1 && m2 === -1 && p === 1 && q === 2));
    const c1 = q - m1 * p, c2 = q - m2 * p;
    // D is 3 above the line through B, on the side away from the other line, so it is clearly on neither graph
    const roles = [
      { x: p, y: q, ok: true, note: "it lies on both graphs" },
      { x: p - d, y: m1 * (p - d) + c1, ok: false, note: "it lies on one graph only" },
      { x: p + d, y: m2 * (p + d) + c2, ok: false, note: "it lies on one graph only" },
      { x: p + d, y: m1 * (p + d) + c1 + 3, ok: false, note: "it lies on neither graph" }];
    const names = shuffle(["A", "B", "C", "D"]);
    const lo = Math.min(...roles.map(r => r.y)) - 2, hi = Math.max(...roles.map(r => r.y)) + 2;
    return { type: "choice", prompt: "The two straight lines are the graphs of two simultaneous equations. Which point gives the solution of the simultaneous equations?",
             plot: { type: "plot", x: [p - 4, p + 4], y: [lo, hi], curves: [[m1, c1], [m2, c2]].map(([m, c]) => ({ f: `${m}*x+(${c})`, style: "main", when: `x < ${p + 3.5} && ${m}*x+(${c}) < ${hi - 1}` })),
                     origin: false, points: roles.map(r => ({ x: r.x, y: r.y })), texts: roles.map((r, i) => ({ x: r.x, y: r.y, tex: `$${names[i]}$`, pos: ["above", r.y === 1 ? "above-left" : "below-right", r.y === 1 ? "above-right" : "below-left", "left"][i] })) },
             why: "The coordinates of the point of intersection satisfy both equations: they are the solution.",
             options: roles.map((r, i) => ({ label: `$${names[i]}$`, ok: r.ok, note: r.note })).sort((u, v) => u.label.localeCompare(v.label)) };
  },

  // ---- K5-5 The method of substitution ----
  // Card "Remove the brackets after substituting" (with "Substitution leaves one unknown only").
  "subst-form": () => {
    let a, b, m, c, d; do { [a, b] = two(2, 5); m = between(2, 5); c = between(1, 9); d = between(1, 20); } while (new Set([a, b, m, c, d]).size < 5);
    return { type: "choice", eq: true, show: systemT(`y = ${m}x - ${c}`, `${a}x + ${b}y = ${d}`), prompt: "Substitute (1) into (2). We get …",
             why: `Substitute (1) into (2): put the whole expression for $y$ in brackets, giving $${a}x+${b}(${m}x-${c})=${d}$.`,
             options: shuffle([
               { label: `$${a}x + ${b}(${m}x - ${c}) = ${d}$`, ok: true },
               { label: `$${a}x + ${b} \\times ${m}x - ${c} = ${d}$`, ok: false, note: "the expression needs brackets" },
               { label: `$${a}(${m}x - ${c}) + ${b}y = ${d}$`, ok: false, note: "the expression takes the place of $y$, not $x$" }]) };
  },

  // ---- K5-7 The method of elimination ----
  // Card "Add or subtract? Look at the signs".
  "add-or-sub": () => {
    const make = (sg1, sg2) => {
      let a, d, b, c, e; do { [a, d] = two(1, 6); b = between(2, 7); c = between(1, 20); e = between(1, 20); } while (b === a || b === d || c === e || [a,d].some(v => (v === 3 && [2,4].includes(b)) || (v === 5 && b === 2)));
      return systemMath(`${term(a, "x")} ${plus(sg1 * b, "y")} = ${c}`, `${term(d, "x")} ${plus(sg2 * b, "y")} = ${e}`);
    };
    const add = [{ label: make(1, -1), note: "opposite signs" }, { label: make(-1, 1), note: "opposite signs" }];
    const sub = [{ label: make(1, 1), note: "the same sign" }, { label: make(-1, -1), note: "the same sign" }];
    return { type: "sort", prompt: "To eliminate $y$, which operation do we use?", chips: ["Add (1) + (2)", "Subtract (1) − (2)"],
             why: "The coefficients of $y$ are equal in magnitude. If they are opposite in sign, add. If they have the same sign, subtract.",
             rows: sortRows(add, sub) };
  },

  // Card "Multiply one equation to match coefficients" (with "Multiply by a non-zero constant: same solutions").
  "mult-all": () => {
    let a, b, c, e, f;
    do { a = between(2, 5); b = between(2, 9); c = between(1, 20); e = rnd([-1, 1]) * between(2, 5); f = between(1, 9); }
    while (new Set([a, b, c, Math.abs(e), f]).size < 5 || b === a * Math.abs(e) || (a === 3 && b === 4));
    return { type: "choice", eq: true, prompt: `$\\begin{cases}${a}x + ${b}y = ${c}\\quad(1)\\\\x ${plus(e, "y")} = ${f}\\quad(2)\\end{cases}$ Multiply (2) by ${a}, so that both equations have $${a}x$. (2) becomes …`,
             why: `Multiply every term on both sides of (2) by ${a}. The solutions stay the same.`,
             options: shuffle([
               { label: `$${a}x ${plus(a * e, "y")} = ${a * f}$`, ok: true },
               { label: `$${a}x ${plus(e, "y")} = ${f}$`, ok: false, note: "every term must be multiplied" },
               { label: `$${a}x ${plus(e, "y")} = ${a * f}$`, ok: false, note: `the $y$-term must be multiplied by ${a} too` }]) };
  },


  // ---- Method cards: choose the right working (teacher, 9 October 2026) ----
  // Card "Substitution leaves one unknown only": substitute into the OTHER equation.
  "subst-steps": () => {
    let p, q, b, a, c, X1, X2;
    do { p = between(1, 6); q = between(1, 6); b = between(2, 5); a = p + q; c = b * p - q;
         X1 = (c - a) / (b - 1); X2 = (c + a) / (b - 1); }
    while (c < 1 || p === q || !Number.isInteger(X1) || !Number.isInteger(X2) || X1 === p || X2 === p || (a === 7 && b === 3 && c === 5));
    const S1 = L3(from(1), "y", `${a} - x`, 3), S2 = L3(operation('(3) into (2)'), `${b}x - (${a} - x)`, `${c}`);
    const tail = (X,Y) => [L3(into(`x=${X}`,1), "y", `${a} - (${X})`), L3("", "y", `${Y}`)];
    const R = [S1, S2, L3("", "x", `${p}`), ...tail(p,q)];
    const W1 = [L3(from(1), "y", `x - ${a}`,3), L3(operation('(3) into (2)'), `${b}x - (x - ${a})`, `${c}`), L3("", "x", `${X1}`), L3(into(`x=${X1}`,3),'y',`${X1}-${a}`),L3('','y',`${X1-a}`)];
    const W2 = [S1, L3(operation('(3) into (2)'), `${b}x - ${a} - x`, `${c}`), L3("", "x", `${X2}`), ...tail(X2,a-X2)];
    const W3 = [S1, S2, L3("", "x", `${p}`), L3(into(`x=${p}`,1), "y", `${a} + ${p}`), L3("", "y", `${a+p}`)];
    return {annotated:true, type: "choice", eq: true, show: systemT(`x + y = ${a}`,`${b}x - y = ${c}`),
             prompt: "Which working solves the simultaneous equations by substitution correctly?",
             why: `From (1), $y = ${a} - x$ (3). Substitute (3) into (2): $${b}x - (${a} - x) = ${c}$, so $x = ${p}$. Substitute $x=${p}$ into (1): $y=${a}-${p}=${q}$.`,
             options: shuffle([stepsOpt(R, true), stepsOpt(rnd([W1,W2,W3]), false)]), _sol: [p, q] };
  },

  // Card "Choose an unknown with coefficient 1": the Step 1 with no fractions.
  "subst-subject": () => {
    let m, n, r, k, s;
    // (1) never simplifies to whole-number coefficients (review, 9 Oct: x = (30 + 6y)/2 = 15 + 3y was a second right answer)
    do { [m, n] = two(2, 7); k = between(2, 9); r = between(1, 30); s = between(1, 30); }
    while (k === m || (m === 5 && n === 3 && k === 8) || (k === 8 && s === 12) ||
           (n % m === 0 && r % m === 0) || (m % n === 0 && r % n === 0));
    return {annotated:true, type: "choice", eq: true, show: systemT(`${m}x - ${n}y = ${r}`,`${k}x + y = ${s}`),
             prompt: "Which Step 1 makes the substitution easiest, with no fractions?",
             why: `In (2), $y$ has coefficient 1, so make $y$ the subject of (2): $y = ${s} - ${k}x$. Each other choice gives a fraction.`,
             options: shuffle([
               { label: `$\\text{From (2): } y = ${s} - ${k}x$`, ok: true },
               { label: `$\\text{From (2): } x = \\frac{${s} - y}{${k}}$`, ok: false },
               { label: `$\\text{From (1): } x = \\frac{${r} + ${n}y}{${m}}$`, ok: false },
               { label: `$\\text{From (1): } y = \\frac{${m}x - ${r}}{${n}}$`, ok: false }]) };
  },

  // Complete elimination working: one correct route and one changing distractor.
  "elim-steps": () => {
    // Review, 9 Oct: all four workings the same length (each finds x, then y from (1)); no '1(3)'; no repeated line;
    // never a card's own pair; P and Q at most 4 in size.
    const own = [[1, 7, 3, 5, true], [2, 4, 3, 1, true], [2, 7, 3, 8, true]];   // [p, a, q, b, add]: cards 060, 075, 074
    const sub1 = (a, p, X) => `${a} - ${p === 1 ? "" : p}${X < 0 || p !== 1 ? `(${X})` : X}`;   // a - pX, as written
    let P, Q, p, q, add, a, b, xw, xc;
    for (;;) {
      P = between(1, 4) * rnd([1, -1]); Q = between(1, 4) * rnd([1, -1]); [p, q] = two(1, 5); add = rnd([true, false]);
      a = p * P + Q; b = add ? q * P - Q : q * P + Q;
      const sum = add ? p + q : p - q, wsum = add ? p - q : p + q;
      if (P === Q || a === 0 || b === 0 || sum === 0 || wsum === 0 || own.some(o => o[0] === p && o[1] === a && o[2] === q && o[3] === b && o[4] === add)) continue;
      xw = (add ? a - b : a + b) / wsum; xc = (add ? a - b : a + b) / sum;   // the wrong operation; the right sides combined wrongly
      if (Number.isInteger(xw) && Number.isInteger(xc) && xw !== P && xc !== P && xw !== xc) break;
    }
    const sum = add ? p + q : p - q, rhs = add ? a + b : a - b, op = add ? "+" : "-", nop = add ? "-" : "+";
    const tag = o => `\\text{(1)} ${o} \\text{(2):}`, e2 = add ? `${term(q, "x")} - y` : `${term(q, "x")} + y`;
    const xs = (coef, val) => (coef === 1 ? [] : [L3("", "x", `${val}`)]);   // no repeated 'x = ...' line
    const tail = (X, Y) => [L3(into(`x=${X}`,1), "y", sub1(a, p, X)), L3("", "y", `${Y}`)];
    const R = [L3(tag(op), term(sum, "x"), `${rhs}`), ...xs(sum, P), ...tail(P, Q)];
    const W1 = [L3(tag(nop), term(add ? p - q : p + q, "x"), `${add ? a - b : a + b}`), ...xs(add ? p - q : p + q, xw), ...tail(xw, a - p * xw)];
    const W2 = [L3(tag(op), term(sum, "x"), `${add ? a - b : a + b}`), ...xs(sum, xc), ...tail(xc, a - p * xc)];
    const W3 = [L3(tag(op), term(sum, "x"), `${rhs}`), ...xs(sum, P),
                L3(into(`x=${P}`,1), "y", `${a} + ${p === 1 ? "" : p}${P < 0 || p !== 1 ? `(${P})` : P}`), L3("", "y", `${a + p * P}`)];
    return {annotated:true, type: "choice", eq: true, show: systemT(`${term(p, "x")} + y = ${a}`,`${e2} = ${b}`),
             prompt: "Which working solves the simultaneous equations by elimination correctly?",
             why: `The coefficients of $y$ are equal in magnitude and ${add ? "opposite in sign, so add" : "have the same sign, so subtract"}: (1) ${op} (2) gives $${term(sum, "x")} = ${rhs}$, so $x = ${P}$. Then (1) gives $y = ${Q}$.`,
             options: shuffle([stepsOpt(R, true), stepsOpt(rnd([W1, W2, W3]), false)]), _sol: [P, Q] };
  },

  // Card "Like terms on the same side first".
  "lcm-multiply": () => {
    // Review, 9 Oct: never parallel equations (a n = b m); no common factor in an equation; numbers near 50 at most.
    const g3 = (u, v, w) => gcd(gcd(u, v), w);
    let a, b, m, n, r, s;
    do { [a, b] = rnd([[2, 3], [3, 2], [2, 5], [5, 2], [3, 4], [4, 3]]); m = between(2, 6); n = between(2, 6); r = between(1, 9); s = between(1, 9); }
    while (m === n || a * n === b * m || g3(a, m, r) !== 1 || g3(b, n, s) !== 1);
    const line = (k, A, B, C, tagN) => L3(`\\text{(${tagN})} \\times ${k}:`, `${A * k}x + ${B * k}y`, `${C * k}`);
    const R = [line(b, a, m, r, 1), line(a, b, n, s, 2)];
    const W1 = [line(a, a, m, r, 1), line(b, b, n, s, 2)];                              // the multipliers swapped
    const W2 = [line(b, a, m, r, 1), L3("\\text{(2):}", `${b}x + ${n}y`, `${s}`)];         // only one equation multiplied
    const W3 = [line(b, a, m, r, 1), line(b, b, n, s, 2)];                              // both multiplied by the same number
    return {annotated:true, type: "choice", eq: true, show: systemT(`${a}x + ${m}y = ${r}`,`${b}x + ${n}y = ${s}`),
             prompt: `Which working makes the coefficients of $x$ equal?`,
             why: `The L.C.M. of ${a} and ${b} is ${a * b}. Multiply (1) by ${b} and (2) by ${a}: both have $${a * b}x$.`,
             options: shuffle([stepsOpt(R, true), stepsOpt(W1, false), stepsOpt(W2, false), stepsOpt(W3, false)]), _equalX: true };
  },

  // ---- K5-8 No solutions or more than one solution ----
  // Card "An identity: more than one solution" (with "A statement that is not valid: no solutions").
  "statement-sort": () => {
    // each row has its own numbers; never the cards' 0 = 4, 0 = 5, 9 = 4, -2 = 5, 15x = 15x or 0 = 0
    // no number is shared by two of the rows shown, so no row looks as if it came from another
    const nums = r => (r.label.match(/[1-9]\d*/g) || []);
    let rows;
    do {
      const [a, b, c, d, e] = pickN([1, 2, 3, 6, 7, 8, 9], 5), [f, g, h, n] = pickN([2, 3, 5, 6, 7, 8, 9], 4);
      const none = [
        { label: `$0 = ${a}$`, note: "this is not valid" },
        { label: `$${b} = ${c}$`, note: "this is not valid" },
        { label: `$-${d} = ${e}$`, note: "this is not valid" }];
      const many = [
        { label: `$${f}x = ${f}x$`, note: "an identity: true for any value of $x$" },
        { label: `$${g}y - ${h} = ${g}y - ${h}$`, note: "an identity: true for any value of $y$" },
        { label: `$${n} - x = ${n} - x$`, note: "an identity: true for any value of $x$" }];
      rows = sortRows(none, many);
    } while (rows.some((r, i) => rows.slice(i + 1).some(q => nums(r).some(v => nums(q).includes(v)))));
    return { type: "sort", prompt: "For each pair of simultaneous linear equations, make one unknown the subject of one equation. Substitute into the other equation. The result is shown below. How many solutions does the pair have?",
             chips: ["No solutions", "More than one solution"],
             why: "After substituting into the other equation, a statement that is not valid means no solutions. An identity means more than one solution.",

function genItem(ch, slot) {
  const g = (GENERATORS[ch.key] || {})[slot.gen];
  return g ? g(slot) : null;
}
// Item shapes (written items and generators alike):
//   choice  {type:"choice", prompt, ask?, show?, table?, plot?, options:[{label, ok}], why, eq?, steps?}   plot: a graph to read;
//           steps: the options are workings (one line per step), four in a row on a wide card
//   pics    {type:"pics", prompt, why, options:[{plot, ok}]}
//   multi   {type:"multi", prompt, ask?, show?, table?, options:[{label | plot | table, ok, note?}], why}   tap every one that fits
//   sort    {type:"sort", prompt, ask?, chips:[...], rows:[{label | plot, answer (chip index), note?}], why}   classify each
// `table` is {rows: [["$x$", ...], ["$y$", ...]], reveal: {label, cells, odd: [column indices]}}; the reveal row is
// shown once the question is answered (the book's own x, y, y/x layout).
function bankItem(b) {
  if (b.kind === "odd") return { type: "choice", prompt: b.say, ask: "Which one does not fit?", card: b.card, why: b.why, eq: true,
    options: shuffle(b.options.map((o, i) => ({ label: o, ok: i === b.answer }))) };
  if (b.kind === "select") return { type: "multi", prompt: b.say, ask: b.ask || "Tap every one that fits.", card: b.card, why: b.why,
    options: shuffle((b.plots || b.options).map((o, i) => ({ [b.plots ? "plot" : "label"]: o, ok: b.correct.includes(i), note: (b.notes || [])[i] }))) };
  if (b.kind === "sort") return { type: "sort", prompt: b.say, ask: b.ask, card: b.card, why: b.why, chips: b.chips,
    rows: shuffle(b.rows.map(r => ({ label: r[0], answer: r[1], note: r[2] }))) };
  if (b.kind === "asn") return { type: "choice", prompt: b.say, ask: "Always, sometimes or never?", card: b.card, why: b.why,
    options: ["always", "sometimes", "never"].map(a => ({ label: a[0].toUpperCase() + a.slice(1), ok: a === b.answer })) };
  if (b.kind === "words") return { type: "choice", prompt: b.say, ask: "Which equation?", card: b.card, why: b.why, eq: true,
    options: shuffle(b.options.map((o, i) => ({ label: `$${o}$`, ok: i === b.answer }))) };
  if (b.kind === "pick") return { type: "choice", prompt: b.say + " …", card: b.card, why: b.why, eq: true,
    options: shuffle(b.options.map((o, i) => ({ label: o, ok: i === b.answer }))) };
  if (b.kind === "picture") return { type: "pics", prompt: b.say, card: b.card, why: b.why,
    options: shuffle(b.plots.map((p, i) => ({ plot: p, ok: i === b.answer }))) };
  return null;
}

}

  // Bottom bar: Map | Back (names where it goes) | where you are + progress | Next (names where it goes).
  const nav = el("div", "navbar");
  // The bottom-left button goes up one level: a card to its chapter map, the chapter map to all chapters.
  const up = it.type === "chapter" && state.path === null;
  const mapBtn = el("button", "nb-map");
  mapBtn.appendChild(icon(up ? "shelf" : "hub"));
  mapBtn.appendChild(el("span", "", up ? "Chapters" : "Map"));
  mapBtn.setAttribute("aria-label", up ? "All chapters" : "Chapter map");
  mapBtn.onclick = () => { if (up) goHome(); else if (state.path !== null) exitPath("chapter"); else jumpTo("chapter"); };
  const back = el("button", "nb-back");
  const bd = el("span", "dir");
  bd.append(icon("left"), "Back");
  back.appendChild(bd);
  const bl = backLabel(items, state.idx);
  if (bl) back.appendChild(rich("span", "to", bl));
  back.disabled = state.idx === 0;
  back.onclick = () => go(-1);
  const next = el("button", "primary nb-next");
  const nd = el("span", "dir");
  nd.append("Next", icon("right"));
  next.appendChild(nd);
  const to = nextLabel(items, state.idx);
  if (to) next.appendChild(rich("span", "to", to));
  next.disabled = state.idx === items.length - 1;
  next.onclick = () => go(1);
  const pos = el("div", "where");
  const maps = items.filter(x => x.type === "map");
  const cardItems = items.filter(x => x.type === "card");
  let wt = "", wsub = "";
  if (it.type === "chapter") { wt = `${ch.chapter ? ch.chapter.title : ch.label}: chapter map`; wsub = `${ch.keyIdeas.length} key ideas`; }
  else if (it.type === "done") { wt = "Ready for the drills"; wsub = `${drillName(ch)} ${drillRange(it.g.drills)}`; }
  else if (it.path) { wt = it.k ? it.k.title : ""; wsub = (it.skill ? "Skill · optional · " : "") + `${cardItems.indexOf(it) + 1} of ${cardItems.length} for ${drillName(ch)} ${drillRange(ch.chapter.drillGroups[state.path].drills)}`; }
  else if (it.type === "map") { wt = it.k.title; wsub = `Idea ${maps.indexOf(it) + 1} of ${maps.length} · ${it.tree.order.length} cards`; }
  else if (it.tree) { wt = it.k.title; wsub = `${it.tree.order.indexOf(it.node) + 1} of ${it.tree.order.length} in this idea · card ${cardItems.indexOf(it) + 1} of ${cardItems.length}`; }
  else if (it.c) { wt = it.c.sectionTitle || ""; wsub = `Card ${cardItems.indexOf(it) + 1} of ${cardItems.length}`; }
  pos.appendChild(rich("span", "wt", wt));
  const wsEl = el("span", "ws", wsub);
  if (it.path && it.skill) {
    const skip = el("button", "skip", "Skip skills");
    skip.onclick = () => { state.idx = items.length - 1; state.step = 1; renderBody(); };
    wsEl.appendChild(skip);
  }
  pos.appendChild(wsEl);
  const prog = el("div", "prog" + (state.path !== null ? " path" : ""));
  const bar = el("i");
  bar.style.transform = `scaleX(${items.length > 1 ? state.idx / (items.length - 1) : 1})`;
  prog.appendChild(bar);
  pos.appendChild(prog);
  nav.append(mapBtn, back, pos, next);
  body.appendChild(nav);
  // Arrive from the side we moved towards.
  const arrived = stage.firstElementChild;
  if (arrived && state.step) arrived.classList.add(state.step > 0 ? "enter-fwd" : "enter-back");
  state.step = 0;
  state.arrived = false;

  typeset(body);
  const fitNow = () => {
    const card = stage.querySelector(".card.big");
    fitWithTab(card);
    // Portrait: a tree with too little room under the card folds away, but its Refresh row stays when it fits.
    const panel = stage.querySelector(".branchpanel");
    if (panel) {
      panel.classList.remove("foot-only");
      panel.style.display = "";
      const h = panel.getBoundingClientRect().height;
      if (h < 180) {
        if (h >= 64 && panel.querySelector(".rail-foot")) panel.classList.add("foot-only");
        else panel.style.display = "none";
      }
    }
    // A tree that does not fit tightens first (smaller rows), and only then scrolls inside its box.
    body.querySelectorAll(".rail-inner").forEach(ri => {
      ri.classList.remove("compact", "tight");
      if (ri.scrollHeight > ri.clientHeight + 1) ri.classList.add("compact");
      if (ri.scrollHeight > ri.clientHeight + 1) ri.classList.add("tight");
    });
    // Keep the current branch in view inside the rail or panel (they scroll; the page never does).
    const cur = body.querySelector(".tnode.current");
    const box = cur && cur.closest(".rail-inner");
    if (box && box.offsetParent) box.scrollTop += cur.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 2;
  };
  requestAnimationFrame(fitNow);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (stage.isConnected) fitNow(); });
  const on = body.querySelector(".kchip.on");
  if (on) { const st = on.parentElement; st.scrollLeft = Math.max(0, on.offsetLeft - st.clientWidth / 2 + on.offsetWidth / 2); }
  saveHash(it);

  // Swipe left or right on the stage to move.
  // A media card reserves its entire stage for playback/scrolling. Native arrows
  // still navigate, including when a finger starts just outside the scrubber.
  let swipeTouch = null;
  const hasPlayer = () => !!stage.querySelector('.vis.manim-web,.kc-manim-host,.kc-substitution-video,video');
  const usesTouch = target => !!target?.closest?.('input,select,button,a,textarea,video,canvas,[contenteditable],.vis.plot.live,.kc-manim-controls,.kc-manim-timeline');
  stage.addEventListener("touchstart", e => {
    swipeTouch = null;
    if (hasPlayer() || e.touches.length !== 1 || usesTouch(e.target)) return;
    const t = e.touches[0];
    swipeTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
  }, { passive: true });
  stage.addEventListener("touchmove", e => {
    if (e.touches.length !== 1 || usesTouch(e.target) || hasPlayer()) swipeTouch = null;
  }, { passive: true });
  stage.addEventListener("touchcancel", () => { swipeTouch = null; }, { passive: true });
  stage.addEventListener("touchend", e => {
    const start = swipeTouch;
    swipeTouch = null;
    if (!start || hasPlayer() || usesTouch(e.target) || e.touches.length) return;
    const end = Array.from(e.changedTouches).find(t => t.identifier === start.id);
    if (!end) return;
    const dx = end.clientX - start.x, dy = end.clientY - start.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
  }, { passive: true });
}
function go(step) {
  const items = buildItems(DATA[state.ch]);
  const i = state.idx + step;
  if (i < 0 || i >= items.length) return;
  state.idx = i;
  state.step = step;
  state.cardCheck = null;
  state.refreshUndo = null;
  state.arrived = true;
  renderBody();
}
function itemKey(it) { return it.type === "chapter" ? "chapter" : it.type === "done" ? "done" : it.type === "map" ? "map-" + it.k.id : it.c.id; }
function jumpTo(key) {
  let items = buildItems(DATA[state.ch]);
  let i = items.findIndex(x => itemKey(x) === key);
  if (i < 0 && state.path !== null) { state.path = null; items = buildItems(DATA[state.ch]); i = items.findIndex(x => itemKey(x) === key); }
  if (i < 0) return;
  state.home = false;
  state.mode = "one";
  state.idx = i;
  state.cardCheck = null;
  state.refreshUndo = null;
  state.arrived = true;
  renderHeader();
  renderBody();
  window.scrollTo({ top: 0 });
}
function renderOverview(body, ch, items) {
  const main = el("main", "overview");
  const addGrid = cards => {
    const grid = el("div", "grid");
    cards.forEach(c => {
      const e = cardEl(c, ch, false);
      if (c.hidden) e.classList.add("isdropped");
      else e.onclick = () => jumpTo(c.id);
      grid.appendChild(e);
    });
    main.appendChild(grid);
  };
  const cards = items.filter(x => x.type === "card").map(x => x.c);
  if (grouped(ch)) {
    ch.keyIdeas.forEach(k => {
      const inK = cards.filter(c => c.keyIdea === k.id);
      const dropped = state.teacher ? ch.cards.filter(c => c.keyIdea === k.id && c.hidden) : [];
      if (!inK.length && !dropped.length) return;
      const head = el("div", "ki");
      head.appendChild(el("h2", "", `${k.title}  ·  ${inK.length} cards`));
      head.appendChild(rich("p", "", k.summary || ""));
      main.appendChild(head);
      addGrid(inK);
      if (dropped.length) {
        main.appendChild(el("h2", "sec", `Dropped from revision (${dropped.length})`));
        addGrid(dropped);
      }
    });
  } else {
    let cur = null, buf = [];
    cards.forEach(c => {
      if (c.section !== cur) {
        if (buf.length) addGrid(buf);
        buf = [];
        cur = c.section;
        main.appendChild(el("h2", "sec", `${c.section || "?"}  ${c.sectionTitle || ""}`));
      }
      buf.push(c);
    });
    if (buf.length) addGrid(buf);
  }
  body.appendChild(main);
  typeset(main);
}

// ---- Remember the place in the URL, so a reload or bookmark returns to the same card ----
function saveHash(it) {
  if (state.path !== null || state.home) return;
  try { history.replaceState(null, "", `#${DATA[state.ch].key}/${itemKey(it)}`); } catch (e) {}
}
function readHash() {
  if (/^#quiz(?:\/|$)/.test(location.hash)) {
    state.quizScreen = quizRun ? (quizRun.finished ? "results" : "run") : "setup";
    if (location.hash === "#quiz/setup" || location.hash === "#quiz") state.quizScreen = "setup";
    state.home = false; return true;
  }
  const m = /^#([^/]+)\/(.+)$/.exec(location.hash || "");
  if (!m) return false;
  const ci = DATA.findIndex(c => c.key === m[1]);
  if (ci < 0) return false;
  state.ch = ci;
  const i = buildItems(DATA[ci]).findIndex(x => itemKey(x) === decodeURIComponent(m[2]));
  state.idx = Math.max(0, i);
  return true;
}

function renderAll() { applyMode(); renderHeader(); renderFilters(); renderBody(); }
// Student view: clean, finished chapters only. Debug view: everything, including the top panel.
function applyMode() {
  const student = studentView();
  document.body.classList.toggle("student", student);
  if (student) {
    state.teacher = false;
    state.mode = "one";
    if (!live(DATA[state.ch])) state.ch = Math.max(0, DATA.findIndex(live));
  }
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
}
const refilter = () => { state.idx = 0; renderBody(); };
document.getElementById("view").onchange = e => { state.view = e.target.value; refilter(); };
document.getElementById("lvl").onchange = e => { state.lvl = e.target.value; refilter(); };
document.getElementById("sec").onchange = e => { state.sec = e.target.value; refilter(); };
document.getElementById("sum").onchange = e => { state.sum = e.target.value; refilter(); };
document.getElementById("nf").onchange = e => { state.nf = e.target.value; refilter(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; refilter(); };
document.getElementById("ttoggle").onclick = e => {
  state.teacher = !state.teacher;
  try { localStorage.setItem("kc-teacher", state.teacher ? "1" : "0"); } catch (err) {}
  e.currentTarget.classList.toggle("on", state.teacher);
  renderHeader();
  renderBody();
};
document.getElementById("ftoggle").onclick = e => {
  const f = document.getElementById("filters");
  f.classList.toggle("open");
  e.currentTarget.classList.toggle("on", f.classList.contains("open"));
};
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; renderHeader(); renderBody(); });
document.addEventListener("keydown", e => {
  if (state.quizScreen) return;
  if (state.mode !== "one" || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "Escape") {
    if (state.home) return;
    const at = buildItems(DATA[state.ch])[state.idx];
    if (state.path !== null) exitPath("chapter"); else if (at && at.type === "chapter") goHome(); else jumpTo("chapter");
  }
});
// Rotating the iPad switches between the rail and the path line.
WIDE.addEventListener("change", () => window.KCManimResize.render(renderBody));
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.mode === "one") window.KCManimResize.render(renderBody); }, 200); });
window.addEventListener("DOMContentLoaded", () => {
  quizRestore();
  // Open on the card in the URL, otherwise on the first chapter that has key ideas.
  state.teacher = false; // Public export always opens the student view.
  try { state.railOpen = localStorage.getItem("kc-rail") !== "0"; } catch (err) {}
  state.debug = false; // No debug switch in the public export.
  applyMode();
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
  // Open on the card in the address; otherwise on the home screen (choose a form, then a chapter).
  if (!readHash()) { state.ch = Math.max(0, DATA.findIndex(MODE === "student" ? live : c => c.chapter), 0); state.home = true; }
  renderAll();
});
// KaTeX loads after this script; typeset again once it is ready.
window.addEventListener("load", () => typeset(document.getElementById("body")));
</script>
</body>
</html>
