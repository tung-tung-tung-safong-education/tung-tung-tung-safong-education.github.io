tic graph, first find the axis of symmetry and the vertex. Then find the $y$-intercept and the discriminant $\\Delta$; the $x$-intercept(s) are found ==only== if $\\Delta\\geq 0$. A parabola is then drawn through these points, symmetric about the axis.", "example": "$y=(x-3)^2-4$: axis of symmetry $x=3$, vertex $(3, -4)$, $y$-intercept 5, $x$-intercepts 1 and 5.", "figure": "An upward-opening parabola with a dashed vertical axis $x=3$, lowest point $(3, -4)$, crossing the $x$-axis at 1 and 5 and the $y$-axis at 5.", "sources": [{"page": "Page010", "printed": "3.10", "where": "example"}, {"page": "Page011", "printed": "3.11", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The link between $\\Delta\\geq 0$ and the graph meeting the $x$-axis is not explained on these pages; the book only says to find the $x$-intercept(s) if $\\Delta\\geq 0$. Class Practice 3.1 Q3 adds a first step for a function not yet in the form $y=a(x-h)^2+k$ (rewrite it in that form); that item carries the scissors mark, so the step is not part of the statement.", "keyIdea": "K3-2", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-050", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Sketching a trigonometric graph", "statement": "To sketch a trigonometric graph over a given interval, mark the points where the graph cuts the $x$-axis, mark the maximum and minimum points, and then sketch a curve passing through all the marked points.", "example": "For $y=\\sin x$ with $0^\\circ\\leq x\\leq 360^\\circ$: it cuts the $x$-axis at $0^\\circ$, $180^\\circ$ and $360^\\circ$, has maximum point $(90^\\circ, 1)$ and minimum point $(270^\\circ, -1)$.", "sources": [{"page": "Page010", "printed": "3.10", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-3", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-051", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Sketching an exponential graph", "statement": "To sketch the graph of an exponential function $y=a^x$, first decide from $a$ whether the graph slopes upwards or downwards from left to right. Then sketch a curve passing through $(0, 1)$ and lying above the $x$-axis.", "example": "$y=3^x$ slopes upwards, passes through $(0, 1)$ and stays above the $x$-axis.", "sources": [{"page": "Page011", "printed": "3.11", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-4", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-052", "section": "3.1 B", "sectionTitle": "Common Functions and Their Graphs", "kind": "method-idea", "title": "Sketching a logarithmic graph", "statement": "To sketch the graph of a logarithmic function $y=\\log_a x$, first decide from $a$ whether the graph slopes upwards or downwards from left to right. Then sketch a curve passing through $(1, 0)$ and lying on the right of the $y$-axis.", "example": "$y=\\log_4 x$ slopes upwards, passes through $(1, 0)$ and stays to the right of the $y$-axis.", "sources": [{"page": "Page011", "printed": "3.11", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-5", "level": "supporting", "hidden": true, "hiddenWhy": "A sketching method, not a knowledge point; kept for the drill guide's recall line."}, {"id": "S5C3-053", "section": "3.2", "sectionTitle": "Solving Equations by Using Graphs of Functions", "kind": "link", "title": "Roots are x-intercepts (Book 4A)", "statement": "In Book 4A Chapter 3, the roots of the quadratic equation $ax^2+bx+c=0$ were ", "x": [-3, 3.4], "y": [-0.8, 5], "curves": [{"f": "f(x)", "style": "muted", "label": "$y = f(x)$", "lx": 2.25, "ly": 4.76, "pos": "left"}, {"f": "f(-x)", "style": "dashed"}, {"f": "f(1-x)", "style": "main", "label": "$y = f(1 - x)$", "lx": -1.25, "ly": 4.76, "pos": "left"}], "points": [{"x": "-t", "y": "f(t)", "on": 1}, {"x": "1-t", "y": "f(t)", "label": "$P'$", "pos": "below", "on": 2}], "segments": [{"x1": "t", "y1": "f(t)", "x2": "-t", "y2": "f(t)", "style": "thick", "arrow": true, "show": "t !== 0"}, {"x1": "-t", "y1": "f(t)+0.3", "x2": "1-t", "y2": "f(t)+0.3", "style": "thick", "arrow": true}], "live": {"t": 1, "handle": {"x": "t", "y": "f(t)", "label": "$P$", "pos": "=t === 2 ? 'right' : 'above'", "on": 0}, "hint": "Drag $P$ along $y = f(x)$", "snap": [-1, 0, 1, 2], "readout": "$P([[t]], [[f(t)]])$, reflected: $([[-t]], [[f(t)]])$, then right 1: $P'([[1 - t]], [[f(t)]])$", "fns": {"f": "Math.pow(2,x)"}}}, "parent": "S5C3-109", "role": "method", "short": "$f(1 - x) = f(-(x - 1))$", "treeOrder": 83}, {"id": "S5C3-116", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "property", "title": "$f(1 - x)$ in the other order", "statement": "$y = f(1 - x)$ comes from $y = f(x)$ by reflecting with respect to the $y$-axis and then translating to the right by 1 unit. It also comes from translating to the left by 1 unit first and then reflecting with respect to the $y$-axis.", "sources": [{"page": "Page059", "printed": "3.59", "where": "margin note"}, {"page": "Page063", "printed": "3.63", "where": "exercise"}, {"page": "Page076", "printed": "3.76", "where": "exercise"}, {"page": "Page091", "printed": "3.91", "where": "exercise"}, {"page": "Page092", "printed": "3.92", "where": "exercise"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The margin note on P.3.59 leaves the check to students. The printed answers on P.3.91 (Exercise 3D Q25(b)) and P.3.92 (Supplementary Exercise 3 Q30(a), (b)) give both orders in the same way, with the direction of the translation changed; the book states no general rule.", "keyIdea": "K3-13", "level": "supporting", "check": {"pages": ["3.59", "3.63", "3.76", "3.91", "3.92"], "date": "2026-10-07", "result": "fixed", "notes": "(scope) The first sentence, 'Sometimes the same graph comes from the other order only if one transformation is changed', is a general rule the book does not give; the margin note only states this one case and leaves the check to students. The title ('The other order needs a different translation') reads as a general rule too.; (ambiguous) '... translated to the left by 1 unit and then reflected' does not say with respect to which axis; the book says 'reflecting the resulting graph with respect to the $y$-axis'.", "final": "pass", "confirmed": "2026-10-07", "enrich": "2026-10-09", "enrichNotes": ""}, "visual": {"type": "plot", "x": [-3, 3.4], "y": [-0.8, 5], "curves": [{"f": "f(x)", "style": "muted", "label": "$y = f(x)$", "lx": 2.25, "ly": 4.76, "pos": "left"}, {"f": "f(-x)", "style": "dashed", "show": "c === 0"}, {"f": "f(x+1)", "style": "dashed", "show": "c === 1"}, {"f": "f(1-x)", "style": "main", "label": "$y = f(1 - x)$", "lx": -1.25, "ly": 4.76, "pos": "left"}], "points": [{"x": 2, "y": 4, "label": "$P$", "pos": "right", "hollow": true}, {"x": -2, "y": 4, "show": "c === 0"}, {"x": 1, "y": 4, "show": "c === 1"}, {"x": -1, "y": 4, "label": "$P'$", "pos": "below", "on": 3}], "segments": [{"x1": 2, "y1": 4, "x2": -2, "y2": 4, "style": "thick", "arrow": true, "show": "c === 0"}, {"x1": -2, "y1": 4.3, "x2": -1, "y2": 4.3, "style": "thick", "arrow": true, "show": "c === 0"}, {"x1": 2, "y1": 4, "x2": 1, "y2": 4, "style": "thick", "arrow": true, "show": "c === 1"}, {"x1": 1, "y1": 4.3, "x2": -1, "y2": 4.3, "style": "thick", "arrow": true, "show": "c === 1"}], "live": {"choices": ["Reflect, then right 1", "Left 1, then reflect"], "c": 0, "readout": "$P(2, 4)$ goes to $[[c ? \"(1, 4)\" : \"(-2, 4)\"]]$, then to $P'(-1, 4)$: the same graph either way", "fns": {"f": "Math.pow(2,x)"}}}, "parent": "S5C3-111", "role": "extends", "short": "$f(1 - x)$ in the other order", "treeOrder": 86}, {"id": "S5C3-117", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "method-idea", "title": "Track the vertex through each step", "statement": "The vertex of a transformed graph can be found by applying the same transformations to the vertex of the original graph.", "example": "$f(x) = (x - 2)^2 + 3$ has vertex $P(2, 3)$. Reflecting with respect to the $y$-axis takes $P$ to $P'(-2, 3)$ on $y = f(-x)$; translating to the right by 1 unit then takes $P'$ to $Q(-1, 3)$ on the new graph.", "sources": [{"page": "Page059", "printed": "3.59", "where": "example"}, {"page": "Page104", "printed": "T3.92l", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The general sentence is our summary; the book shows the moving vertex on its diagrams (Example 20(b), with a parameter k). The example with $(x - 2)^2 + 3$ is ours (overnight audit, 7 October).", "keyIdea": "K3-13", "level": "supporting", "check": {"pages": ["3.59", "T3.92l"], "date": "2026-10-07", "result": "fixed", "notes": "(context) The example uses $P$ and $k$ without introducing them. Here $k$ is the constant in Example 20's $f(x) = -x^2 + 2kx + k^2 + 6$ ($k > 1$), not the transformation constant $k$ used on every other card in this section, so a student may misread it.; (term) 'Reflecting in the $y$-axis': the book says 'reflected with respect to the $y$-axis'.", "final": "pass", "markers": "2026-10-07 (after fix)", "enrich": "2026-10-09 (after fix)", "enrichNotes": "(graph) Labels and arrows collide. P and P' (pos below) are printed on the arrow from P to P' drawn just under them at y = 2.6. Q (pos above) touches the head of the short arrow, and that arrow (at y = 3.4) crosses both the dashed curve and the dark curve. The label '$y = f(1 - x)$' (lx -2.9, ly 6.61, right) is printed across the dashed curve and next to the axis letter y. It lies inside both left parabolas, so it can be read as naming either.; (graph) The label '$y = f(1 - x)$' names the new graph one card before S5C3-115 (tree order 81, after this card at 80) teaches $f(1 - x) = f(-(x - 1))$"}, "visual": {"type": "plot", "x": [-4.5, 4.5], "y": [-0.5, 7], "curves": [{"f": "(x-2)*(x-2)+3", "style": "muted", "label": "$y = f(x)$", "lx": 3.9, "ly": 6.61, "pos": "left", "show": "c === 0"}, {"f": "(x+2)*(x+2)+3", "style": "main", "label": "$y = f(-x)$", "lx": -3.9, "ly": 6.61, "pos": "right", "show": "c === 0"}, {"f": "(x+2)*(x+2)+3", "style": "muted", "show": "c === 1"}, {"f": "(x+1)*(x+1)+3", "style": "main", "show": "c === 1"}], "points": [{"x": 2, "y": 3, "label": "$P$", "pos": "below", "hollow": true, "show": "c === 0", "on": 0}, {"x": -2, "y": 3, "label": "$P'$", "pos": "below", "hollow": "c === 1", "on": 1}, {"x": -1, "y": 3, "label": "$Q$", "pos": "below", "show": "c === 1", "on": 3}], "segments": [{"x1": 2, "y1": 3, "x2": -2, "y2": 3, "style": "thick", "arrow": true, "show": "c === 0"}, {"x1": -2, "y1": 3, "x2": -1, "y2": 3, "style": "thick", "arrow": true, "show": "c === 1"}], "live": {"choices": ["Reflect", "Then translate"], "c": 0, "readout": "[[c ? \"$P'(-2, 3)$ goes to $Q(-1, 3)$ on the new graph\" : \"$P(2, 3)$ goes to $P'(-2, 3)$ on $y = f(-x)$\"]]"}}, "parent": "S5C3-112", "role": "method", "short": "Track the vertex", "treeOrder": 82}, {"id": "S5C3-118", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Orthocentre gives perpendicular lines", "statement": "Questions on transformations can be combined with centres of a triangle. If $R$ is the orthocentre of $\\triangle OPQ$, then $OQ \\perp PR$, so the slope of $OQ$ equals $-\\frac{1}{\\text{slope of } PR}$.", "figure": "Diagram Clue: triangle $OPQ$ with its three altitudes drawn as dashed lines meeting at the orthocentre $R$; the line through $P$ and $R$ meets side $OQ$ at a right angle.", "sources": [{"page": "Page060", "printed": "3.60", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-119", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Negative discriminant shows a case is impossible", "statement": "To show that a condition is impossible, turn it into an equation. If the equation is quadratic and its discriminant $\\Delta$ is negative, it has no real roots, so the condition can never hold.", "example": "Assuming the slope of $PR$ is 2 leads to $4k^2 - k + 13 = 0$, with $\\Delta = (-1)^2 - 4(4)(13) = -207 < 0$. So it is impossible that the slope of $PR$ is 2.", "sources": [{"page": "Page060", "printed": "3.60", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The general sentence is our summary of the argument in Example 20(c).", "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-120", "section": "3.4 D", "sectionTitle": "Transformations of Functions", "kind": "link", "title": "Centroid lies on a median", "statement": "If the mid-point of $PQ$ lies on the $x$-axis, then a median of $\\triangle OPQ$ (the one from the origin $O$) coincides with the $x$-axis, so the centroid of $\\triangle OPQ$ lies on the $x$-axis.", "sources": [{"page": "Page104", "printed": "T3.92l", "where": "example"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "inferred": "The fact that the centroid lies on every median is background knowledge the solution uses but does not state.", "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-121", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "method-idea", "title": "Express g(x) in terms of f(x) first", "statement": "In a structured exam question, first express $g(x)$ in terms of $f(x)$ (for example $g(x) = f(-x) - 5$ for a reflection with respect to the $y$-axis followed by a translation downwards by 5 units). Then substitute and use completing the square to write $g(x)$ in the form $(x - h)^2 + k$ and read off the vertex. The marking scheme gives a mark for each of these steps.", "sources": [{"page": "Page081", "printed": "3.81", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Exam technique for one DSE question; writing g(x) in terms of f(x) is already a card."}, {"id": "S5C3-122", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "property", "title": "Smallest circle through two fixed points", "statement": "Suppose $P$ and $Q$ are fixed points. Among the circles passing through $P$ and $Q$, the area of the circle is the least when $PQ$ is a diameter of the circle.", "figure": "Star Tips: three circles all passing through $P$ and $Q$; the smallest one has the dashed segment $PQ$ as a diameter and is labelled 'circle with the least area'.", "sources": [{"page": "Page081", "printed": "3.81", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-123", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "link", "title": "Angle in a semicircle gives perpendicular slopes", "statement": "If $FO$ is a diameter of a circle and $U$ lies on the circle, then $\\angle FUO = 90^\\circ$. So the product of the slopes of $FU$ and $OU$ is $-1$, which gives an equation for the unknown constant.", "watchOut": "Before using the product of slopes, the solution writes down the excluded values $k \\neq -\\frac{1}{2}$ and $k \\neq \\frac{11}{2}$.", "sources": [{"page": "Page081", "printed": "3.81", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The reason for excluding these values (a slope with a zero denominator) is our reading; the book only states the exclusions.", "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-124", "section": "Extra DSE Support", "sectionTitle": "Extra DSE Support", "kind": "link", "title": "Testing whether four points are concyclic", "statement": "$V$ lies on the circle with diameter $FO$, so $\\angle FVO = 90^\\circ$. If the slope of $FE$ times the slope of $OE$ is not $-1$, then $\\angle FEO \\neq 90^\\circ$, so $E$, $F$, $O$ and $V$ are not concyclic.", "sources": [{"page": "Page082", "printed": "3.82", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The solution relies on the converse of the angle in a semicircle without naming it.", "keyIdea": "K3-13", "level": "extra", "hidden": true, "hiddenWhy": "Knowledge from other topics (triangle centres, circles, the discriminant) used in a cross-topic DSE question; not this chapter's new knowledge."}, {"id": "S5C3-125", "section": "Chapter Highlight", "sectionTitle": "Chapter Highlight", "kind": "method-idea", "title": "Why use graphs to solve problems", "statement": "Algebraic expressions are often used to represent the relations among variables in practical problems, but sometimes the problems are difficult to solve directly through the expressions. If the corresponding graphs are available, they can be used to solve the problems.", "sources": [{"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-6", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only chapter highlight (purpose, prerequisites or curriculum objective)."}, {"id": "S5C3-126", "section": "Chapter Highlight", "sectionTitle": "Chapter Highlight", "kind": "link", "title": "Prerequisites: functions and transforming points", "statement": "Before this chapter, students should recognise the concept of functions and know the transformations of points in a rectangular coordinate plane, including translation and reflection. Teachers ==may== ask students to do the Review Exercise in §3.0 Review (P.3.2) for better preparation.", "sources": [{"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K3-8", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only chapter highlight (purpose, prerequisites or curriculum objective)."}, {"id": "S5C3-127", "section": "Chapter Highlight", "sectionTitle": "Chapter Highlight", "kind": "link", "title": "Transformations from tabular, symbolic, graphical views", "statement": "The curriculum objective for §3.4 is to understand the transformations of the function $f(x)$, including $f(x) + k$, $f(x + k)$, $kf(x)$ and $f(kx)$, from tabular, symbolic and graphical perspectives.", "sources": [{"page": "Page093", "printed": "T3.92a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": true, "inSummary": false, "keyIdea": "K3-8", "level": "extra", "hidden": true, "hiddenWhy": "A teacher-only chapter highlight (purpose, prerequisites or curriculum objective)."}], "keyIdeas": [{"id": "K3-1", "title": "Comparing common functions", "summary": "Common functions are compared by their domains, whether they have maximum or minimum values, their symmetry and their period. A constant function has the form $y = c$, and a linear function has the form $y = mx + c$ with ==$m \\neq 0$==.", "shape": "tree"}, {"id": "K3-2", "title": "Quadratic functions", "summary": "For ==$a \\neq 0$==, the graph of $y = a(x - h)^2 + k$ is a parabola with vertex $(h, k)$. When $a > 0$, it opens upwards and $k$ is the minimum value; when $a < 0$, it opens downwards and $k$ is the maximum value.", "shape": "tree"}, {"id": "K3-3", "title": "Trigonometric functions", "summary": "The sine, cosine and tangent functions are periodic. Sine and cosine have period $360^\\circ$ and values from $-1$ to $1$; tangent has period $180^\\circ$ and no maximum or minimum value.", "shape": "tree"}, {"id": "K3-4", "title": "Exponential functions", "summary": "For $a > 0$ and ==$a \\neq 1$==, the graph of $y = a^x$ lies above the $x$-axis and passes through $(0, 1)$. It slopes upwards when $a > 1$ and downwards when $0 < a < 1$.", "shape": "tree"}, {"id": "K3-5", "title": "Logarithmic functions", "summary": "For $a > 0$ and ==$a \\neq 1$==, the graph of $y = \\log_a x$ lies on the right of the $y$-axis and passes through $(1, 0)$. It is the reflection of the graph of $y = a^x$ with respect to the line $y = x$.", "shape": "tree"}, {"id": "K3-6", "title": "Solving equations by using graphs", "summary": "The roots of $f(x) = k$ are the $x$-coordinates of the points where the graphs of $y = f(x)$ and $y = k$ meet.", "shape": "tree"}, {"id": "K3-7", "title": "Solving inequalities by using graphs", "summary": "The solutions of $f(x) > k$ are the values of $x$ for which the graph of $y = f(x)$ is above the line $y = k$, and those of $f(x) < k$ where it is below. With $\\geq$ or $\\leq$, the solutions also include the $x$-coordinates of the points of intersection.", "shape": "tree"}, {"id": "K3-8", "title": "Transformations of functions", "summary": "The graph of a function is made up of points, so transforming every point transforms the graph: it can be translated, reflected, or enlarged or reduced along an axis.", "shape": "tree"}, {"id": "K3-9", "title": "Translation", "summary": "For ==$k > 0$==, translating the graph of $y = f(x)$ upwards by $k$ units gives $y = f(x) + k$, and downwards gives $y = f(x) - k$. Translating it to the left by $k$ units gives $y = f(x + k)$, and to the right gives $y = f(x - k)$.", "shape": "tree"}, {"id": "K3-10", "title": "Reflection", "summary": "Reflecting the graph of $y = f(x)$ with respect to the $x$-axis gives $y = -f(x)$, and with respect to the $y$-axis gives $y = f(-x)$.", "shape": "tree"}, {"id": "K3-11", "title": "Enlargement and reduction along the $y$-axis", "summary": "Enlarging the graph of $y = f(x)$ to $k$ times the original (==$k > 1$==), or reducing it to $k$ of the original (==$0 < k < 1$==), along the $y$-axis gives $y = kf(x)$.", "shape": "tree"}, {"id": "K3-12", "title": "Enlargement and reduction along the $x$-axis", "summary": "Along the $x$-axis, $y = f(kx)$ is the graph of $y = f(x)$ reduced to $\\frac{1}{k}$ of the original when ==$k > 1$==, and enlarged to $\\frac{1}{k}$ times the original when ==$0 < k < 1$==.", "shape": "tree"}, {"id": "K3-13", "title": "Two transformations", "summary": "When the graph of $y = f(x)$ undergoes two transformations to become the graph of $y = g(x)$, the 1st transformation is applied first, and then the 2nd to the resulting graph.", "shape": "tree"}], "chapter": {"title": "Graphs of functions", "w": 1000, "h": 786, "nodes": [{"k": "K3-1", "label": "Common functions", "sub": "domain, max/min, symmetry, period", "x": 600, "y": 50, "part": "extkey"}, {"k": "K3-2", "label": "Quadratic", "sub": "$y = a(x - h)^2 + k$", "x": 125, "y": 160, "part": "ext"}, {"k": "K3-3", "label": "Trigonometric", "sub": "$\\sin x$, $\\cos x$, $\\tan x$", "x": 375, "y": 160, "part": "ext"}, {"k": "K3-4", "label": "Exponential", "sub": "$y = a^x$", "x": 625, "y": 160, "part": "ext"}, {"k": "K3-5", "label": "Logarithmic", "sub": "$y = \\log_a x$", "x": 875, "y": 160, "part": "ext"}, {"k": "K3-6", "label": "Solve equations", "sub": "$x$ where $y = f(x)$ meets $y = k$", "x": 330, "y": 295, "part": "ext"}, {"k": "K3-7", "label": "Solve inequalities", "sub": "above or below $y = k$", "x": 670, "y": 295, "part": "ext"}, {"k": "K3-8", "label": "Transformations", "sub": "$y = f(x)$ becomes $y = g(x)$", "x": 500, "y": 415, "part": "key"}, {"k": "K3-9", "label": "Translation", "sub": "$f(x) \\pm k$, $f(x \\pm k)$", "x": 125, "y": 562, "part": "kind"}, {"k": "K3-10", "label": "Reflection", "sub": "$-f(x)$, $f(-x)$", "x": 375, "y": 562, "part": "kind"}, {"k": "K3-11", "label": "$kf(x)$, $k > 0$", "sub": "enlarge or reduce along $y$-axis", "x": 625, "y": 562, "part": "kind"}, {"k": "K3-12", "label": "$f(kx)$, $k > 0$", "sub": "enlarge or reduce along $x$-axis", "x": 875, "y": 562, "part": "kind"}, {"k": "K3-13", "label": "Two transformations", "sub": "one after the other", "x": 500, "y": 722, "part": "step"}], "branches": [["K3-1", "K3-2"], ["K3-1", "K3-3"], ["K3-1", "K3-4"], ["K3-1", "K3-5"], ["K3-8", "K3-9"], ["K3-8", "K3-10"], ["K3-8", "K3-11"], ["K3-8", "K3-12"]], "merge": [{"from": ["K3-2", "K3-3", "K3-4", "K3-5"], "to": "K3-6", "y": 226}, {"from": ["K3-9", "K3-10", "K3-11", "K3-12"], "to": "K3-13", "y": 652}], "flow": [["K3-6", "K3-7"]], "zones": [{"label": "Extended from S4 · worth going through", "x": 18, "y": 12, "kind": "ext"}, {"label": "New knowledge (non-foundation)", "x": 18, "y": 382, "kind": "new"}, {"label": "Skills (non-foundation)", "x": 18, "y": 750, "kind": "skill"}], "bands": [{"kind": "ext", "x": -8, "y": -6, "w": 1016, "h": 364}, {"kind": "new", "x": -8, "y": 366, "w": 1016, "h": 262}, {"kind": "skill", "x": -8, "y": 634, "w": 1016, "h": 154}], "drillGroups": [{"drills": [1], "title": "Sketching common graphs", "task": "", "needs": ["S5C3-019", "S5C3-020", "S5C3-021", "S  "needs": ["S5C3-089", "S5C3-097", "S5C3-102", "S5C3-114"]}]}, "released": true}, {"key": "ch4", "label": "Ch4 Variations", "pageDir": "../S5 Ch4 pages/", "form": "S5", "book": "5A", "number": 4, "title": "Variations", "pageExt": ".jpg", "origin": "merged", "cards": [{"id": "S5C4-001", "section": "Opener", "sectionTitle": "Relation among Quantities", "kind": "link", "title": "Quantities can be linked by a relation", "statement": "In the dim sum example, Lily spends $T$ dollars on $x$ small, $y$ medium and $z$ large dishes. If she buys more dishes, she has to spend more money, so there is a relation among $T$, $x$, $y$ and $z$, and it can be shown by an equation.", "example": "Small, medium and large dishes cost 20, 30 and 40 dollars each, and Lily also pays 0.5 dollars for a plastic bag: $T = 20x + 30y + 40z + 0.5$.", "sources": [{"page": "Page01", "printed": "4.1 (not printed)", "where": "main text"}, {"page": "Page01", "printed": "4.1 (not printed)", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The equation in the example is printed only in magenta (teacher edition).", "keyIdea": "K4-1", "level": "supporting", "check": {"pages": ["4.1 (not printed)"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) The card turns one example into a general rule ('the relation among them can be written as an equation'). The book only says there is a relation among $T$, $x$, $y$ and $z$ here, and asks for an equation in this one case. | final: (context) The statement and the example use $T$, $x$, $y$ and $z$ without saying what they stand for, and the example's 20, 30, 40 and 0.5 come from facts the card never gives (the unit prices of the dishes and the plastic bag, P.4.1 Q&A).", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "hidden": true, "hiddenWhy": "Chapter-opener motivation, not a knowledge point to revise."}, {"id": "S5C4-002", "section": "4.0 A", "sectionTitle": "Direct Proportions and Inverse Proportions", "kind": "link", "title": "Direct proportion: equal ratios", "statement": "In junior forms, we learnt that if $x$ and $y$ are in direct proportion, then $x_1 : x_2 = y_1 : y_2$ for any two pairs of values. Direct variation develops from this idea.", "example": "At 20 km/h, time $1 : 2$ gives distance $20 : 40 = 1 : 2$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page02", "printed": "4.2", "where": "note"}, {"page": "Page05", "printed": "4.5", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-2", "level": "supporting", "check": {"pages": ["4.2", "4.5"], "date": "2026-10-06", "result": "fixed", "notes": "(direction) The book says: if $x$ and $y$ are in direct proportion, then $x_1 : x_2 = y_1 : y_2$. The card turns this round into a test ('are in direct proportion when ...'). Both directions happen to be true here, so the risk is low, but the card should keep the book's direction.", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of direct proportion."}, {"id": "S5C4-003", "section": "4.0 A", "sectionTitle": "Direct Proportions and Inverse Proportions", "kind": "link", "title": "Inverse proportion: reciprocal ratios", "statement": "In junior forms, we learnt that if $x$ and $y$ are in inverse proportion, then $x_1 : x_2 = y_2 : y_1$, that is $x_1y_1 = x_2y_2$, for any two pairs of values. Inverse variation develops from this idea.", "example": "Anna spends 60 dollars on masks: at 2 and 3 dollars each she gets 30 and 20 masks, and $2 : 3 = 20 : 30$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page02", "printed": "4.2", "where": "note"}, {"page": "Page13", "printed": "4.13", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-3", "level": "supporting", "check": {"pages": ["4.13", "4.2"], "date": "2026-10-06", "result": "fixed", "notes": "(direction) The book says: if $x$ and $y$ are in inverse proportion, then $x_1 : x_2 = y_2 : y_1$. The card turns this round into a test ('are in inverse proportion when ...'). Both directions happen to be true here, so the risk is low, but the card should keep the book's direction. | final: (context) The mask example does not say that the total spent is fixed at 60 dollars (P.4.4, P.4.13), so the inverse proportion between price and number of masks is not justified.", "final": "fixed", "confirmed": "2026-10-06"}, "hidden": true, "hiddenWhy": "Junior-form review of inverse proportion."}, {"id": "S5C4-004", "section": "4.0 B", "sectionTitle": "Percentage Change", "kind": "property", "title": "Percentage change formula", "statement": "Percentage change $= \\frac{\\text{new value} - \\text{original value}}{\\text{original value}} \\times 100\\%$.", "example": "25 cm to 30 cm: $+20\\%$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page09", "printed": "4.9", "where": "margin note"}, {"page": "Page18", "printed": "4.18", "where": "margin note"}, {"page": "Page25", "printed": "4.25", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-7", "level": "supporting", "check": {"pages": ["4.18", "4.2", "4.25", "4.9"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "hidden": true, "hiddenWhy": "Junior-form review of the percentage change formula."}, {"id": "S5C4-005", "section": "4.0 B", "sectionTitle": "Percentage Change", "kind": "property", "title": "New value after a percentage change", "statement": "After a change of $r\\%$, the new value is the original value $\\times (1 + r\\%)$, where $r$ is negative for a decrease.", "example": "$w$ up 44%: $1.44w$. $q$ down 60%: $0.4q$.", "sources": [{"page": "Page02", "printed": "4.2", "where": "review"}, {"page": "Page09", "printed": "4.9", "where": "example"}, {"page": "Page18", "printed": "4.18", "where": "example"}, {"page": "Page25", "print ", "notes": "", "final": "pass"}, "parent": "S5C4-042", "role": "reverse", "short": "Two 'when fixed' results", "treeOrder": 30}, {"id": "S5C4-050", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "definition", "title": "Partial variation", "statement": "When a variable is the __sum__ of two or more different parts, where one part ==may== be a constant and the other part(s) may vary directly or inversely as other variable(s), the relation is a **partial variation**.", "sources": [{"page": "Page30", "printed": "4.30", "where": "main text"}, {"page": "Page39", "printed": "4.39", "where": "main text"}, {"page": "Page50", "printed": "4.50", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-6", "level": "core", "term": "partial variation", "positive": {"example": "Phone bill: $B$ dollars for $m$ minutes of calls, with a fixed fee of 100 dollars plus 0.5 dollars per minute, so $B = 100 + 0.5m$", "why": "A ==non-zero== constant part, 100, plus a part that varies directly as $m$, with non-zero constant 0.5.", "source": "authored"}, "negative": {"example": "Rectangle with area $A$ cm$^2$, length $l$ cm and width $w$ cm: $A = lw$", "why": "One constant ($k = 1$) times the product $lw$, not a sum of parts, so it is a joint variation.", "source": "authored"}, "watchOut": "Use a separate symbol for each variation constant, as in $y = k_1 + k_2x$, where $k_1$ and $k_2$ are ==non-zero== constants; the values of $k_1$ and $k_2$ may be different, but they ==need not== be.", "check": {"pages": ["4.30", "4.39", "4.50"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) Drops 'different' from 'two or more different parts', so a sum like $k_1x + k_2x$ (really one direct variation) would seem to count.; (modality) 'the others vary directly or inversely' drops the book's 'the other part(s) may vary'.; (ambiguous) watchOut 'Each part has its own non-zero constant' can be read as 'the constants must have different values'. The book says to use different symbols (N9) and that the constants 'may be different' (Note, p.4.31). P.4.53 Q15 gives $y = 2x + 2x^2$, where they are equal. | final: (context) The authored examples $B = 100 + 0.5m$ and $A = lw$ use letters that are never introduced, and the 100 and 0.5 need a real-life reason.; (unmarked) The watch-out's 'but they need not be' is not in the book: the Note on P.4.31 says only that the constants may be different. Equal constants appear in Supplementary Exercise 4 Q15 (P.4.53). The card has no inferr", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "inferred": "The positive and negative examples are authored. In the watch-out, 'but they need not be' is added to the Note on P.4.31: Supplementary Exercise 4 Q15 on P.4.53 has $y = 2x + 2x^2$, where both constants are 2.", "parent": null, "role": null, "short": "Partial variation", "treeOrder": 31}, {"id": "S5C4-051", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "wording", "title": "Reading partial-variation statements as equations", "statement": "A partial variation is written as a sum of parts, using a separate symbol ($k_1$, $k_2$) for each ==non-zero== variation constant. Its wording ==may== be '*partly … and partly …*', '*the sum of two parts*', '*consists of two parts*' or '*one part … and the other part …*'.", "sources": [{"page": "Page31", "printed": "4.31", "where": "main text"}, {"page": "Page31", "printed": "4.31", "where": "activity"}, {"page": "Page35", "printed": "4.35", "where": "exercise"}, {"page": "Page36", "printed": "4.36", "where": "exercise"}, {"page": "Page42", "printed": "4.42", "where": "example"}, {"page": "Page43", "printed": "4.43", "where": "example"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page60", "printed": "4.60", "where": "DSE support"}, {"page": "Page75", "printed": "T4.68g", "where": "example"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K4-6", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Words", "Equation"], ["partly constant and partly varies directly as $x$", "$z = k_1 + k_2x$"], ["partly constant and partly varies inversely as $x$", "$z = k_1 + \\frac{k_2}{x}$"], ["partly varies directly as $x$ and partly directly as $y$", "$z = k_1x + k_2y$"], ["partly varies directly as $x$ and partly inversely as $y$", "$z = k_1x + \\frac{k_2}{y}$"], ["partly varies directly as $x$ and partly directly as $x^2$", "$z = k_1x + k_2x^2$"]], "words": true}, "check": {"pages": ["4.31", "4.35", "4.36", "4.42", "4.43", "4.50", "4.60", "T4.68g", "T4.68j"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'Its wording says …' reads as a complete list, but the book also uses 'One part of m is a constant and the other part varies …' (QQ 4.2 Q2, Ex 4D Q2–3) and 'divided into two parts' (T4.68j).; (condition) 'a separate constant for each part' drops 'non-zero' (the table on p.4.31 says $k_1$ and $k_2$ are non-zero constants).; (ambiguous) Table row 5 switches to $h$ and $t$, and the words name no $h$, so the row does not match its own wording. The book's row (e) is z partly varies directly as x and partly directly as x², giving $z = k_1x + k_2x^2$.", "final": "pass"}, "parent": "S5C4-050", "role": "wording", "short": "Partial wording to an equation", "treeOrder": 32}, {"id": "S5C4-052", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "common-mistake", "title": "Use two different symbols for the constants", "statement": "Use two different __symbols__, such as $k_1$ and $k_2$, for the variation constants of a partial variation, because their values ==may== be different. So $z = k + kx$ and $z = kx + ky$ are wrong set-ups, even if the values found later turn out equal.", "sources": [{"page": "Page31", "printed": "4.31", "where": "margin note"}, {"page": "Page31", "printed": "4.31", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-6", "level": "core", "check": {"pages": ["4.31"], "date": "2026-10-06", "result": "fixed", "notes": "(ambiguous) '$z = kx + ky$ is wrong' can be read as 'the two constants can never be equal'. The book's reason is that the constants may be different (Note, p.4.31), and P.4.53 Q15 has $y = 2x + 2x^2$. The card should state the reason and say that only the set-up is wrong. | final: (unmarked) Two parts of the statement are not in the book and have no inferred note: the reason 'because their values may be different' joins teacher note N9 to the Note on P.4.31, which the book does not link; and 'even if the values found later turn out equal' is added (equal constants occur in Supplementary Exercise 4 Q15, P.4.53).", "final": "fixed", "confirmed": "2026-10-06"}, "inferred": "Teacher note N9 (P.4.31) says to use two different symbols for the two variation constants. The reason 'because their values may be different' is my link to the Note on P.4.31; the book does not join the two with 'because'. The words 'even if the values found later turn out equal' are added: Supplementary Exercise 4 Q15 on P.4.53 has $y = 2x + 2x^2$, where both constants are 2.", "parent": "S5C4-051", "role": "warning", "short": "Two symbols, $k_1$ and $k_2$", "treeOrder": 33}, {"id": "S5C4-053", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "property", "title": "Partial variation constants may differ", "statement": "The constants of a partial variation __may be different__, so $z = k_1x + k_2y$ with $k_1 \\neq k_2$ ==cannot== be written as $z \\propto (x + y)$.", "sources": [{"page": "Page31", "printed": "4.31", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-6", "level": "supporting", "check": {"pages": ["4.31"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-052", "role": "consequence", "short": "The constants may , "short": "In general, no $\\propto$", "treeOrder": 35}, {"id": "S5C4-056", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "method-idea", "title": "Two sets of values find $k_1$ and $k_2$", "statement": "For a partial variation with two parts, two sets of values give two simultaneous equations. Here $y=k_1+k_2x$, with $y=11$ at $x=1$ and $y=13$ at $x=3$.", "sources": [{"page": "Page03", "printed": "4.3", "where": "review"}, {"page": "Page32", "printed": "4.32", "where": "example"}, {"page": "Page33", "printed": "4.33", "where": "example"}, {"page": "Page34", "printed": "4.34", "where": "example"}, {"page": "Page42", "printed": "4.42", "where": "example"}, {"page": "Page43", "printed": "4.43", "where": "example"}, {"page": "Page50", "printed": "4.50", "where": "summary"}, {"page": "Page60", "printed": "4.60", "where": "DSE support"}, {"page": "Page75", "printed": "T4.68g", "where": "example"}, {"page": "Page76", "printed": "T4.68h", "where": "example"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "The book does not say in words that two unknown constants need two sets of values. This is read from the worked solutions (Examples 13 to 15, Example 19, the summary example on P.4.50 and the suggested solution on P.4.60), which always set up equations (1) and (2) and solve them together.", "keyIdea": "K4-8", "level": "core", "check": {"pages": ["4.3", "4.32", "4.33", "4.34", "4.42", "4.43", "4.50", "4.60", "T4.68g", "T4.68h", "T4.68j"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'A partial variation has two unknown constants' narrows the definition. The definition allows 'two or more different parts' (p.4.30), and the two-constant case is only what the examples show. | final: (context) The example's equations appear without the variation and the given values they come from (Example 13, P.4.32).", "final": "fixed", "confirmed": "2026-10-06"}, "v .62", "4.63", "4.64", "T4.68h"], "date": "2026-10-06", "result": "fixed", "notes": "(condition) The example equation drops 'where $k_1$ and $k_2$ are non-zero constants', which the book's solution states.", "final": "pass"}, "parent": "S5C4-041", "role": "wording", "short": "'Varies as'", "treeOrder": 21}, {"id": "S5C4-058", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "link", "title": "Partial variation with functions and graphs", "statement": "A partial variation can define a function, such as $f(x) = k_1 + k_2(x - 2)^2$. Find $k_1$ and $k_2$ first, then use the function for values, intercepts or its graph.", "example": "$f(x) = -18 + 2(x - 2)^2$: $y$-intercept $-10$, $x$-intercepts $-1$ and $5$.", "sources": [{"page": "Page34", "printed": "4.34", "where": "example"}, {"page": "Page34", "printed": "4.34", "where": "note"}, {"page": "Page34", "printed": "4.34", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.34"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-056", "role": "method", "short": "Partial variation as a function", "treeOrder": 44}, {"id": "S5C4-059", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "wording", "title": "Joint variation versus partial variation", "statement": "In a joint variation, a variable varies with the __product__ of two or more variables, directly and/or inversely, using one ==non-zero== constant $k$. In a partial variation, a variable is the __sum__ of two or more different parts, using a separate non-zero constant ($k_1$, $k_2$) for each part.", "sources": [{"page": "Page22", "printed": "4.22", "where": "main text"}, {"page": "Page30", "printed": "4.30", "where": "main text"}, {"page": "Page31", "printed": "4.31", "where": "note"}, {"page": "Page32", "printed": "4.32", "where": "teacher note"}, {"page": "Page39", "printed": "4.39", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "This side-by-side contrast is my own summary. The book defines the two kinds separately and places them next to each other in the table on P.4.39 and in the summary on P.4.50. The claim that partial variations cannot use the symbol comes from teacher note N11; see the card on that note for the exception when the two constants are equal.", "keyIdea": "K4-6", "level": "core", "visual": {"type": "table", "head": "both", "rows": [["", "Joint", "Partial"], ["Built from", "the product of two or more variables (direct and/or inverse)", "the sum of two or more different parts"], ["Constants", "one: $k$ (non-zero)", "one per part: $k_1$, $k_2$ (non-zero, may be different)"], ["Example", "$z = \\frac{kx}{y}$", "$z = k_1 + k_2x$"], ["Symbol $\\propto$", "$z \\propto \\frac{x}{y}$", "in general, cannot be used"]], "words": false}, "check": {"pages": ["4.22", "4.30", "4.31", "4.32", "4.39"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'built from a product or quotient with one constant' also fits a plain direct or inverse variation ($y = kx$, $y = \\frac{k}{x}$), but joint variation needs the product of two or more variables (p.4.22).; (modality) Table cell 'Symbol $\\propto$: not used' drops N11's 'in general'. P.4.53 Q15(b) says $y = 2x + 2x^2$ does vary directly as $(x + x^2)$.; (ambiguous) 'each with its own constant' / 'one per part' can be read as 'the constants must differ'. The book says they may be different (p.4.31).; (condition) The table and statement drop 'non-zero' for $k$, $k_1$ and $k_2$. Partial also ", "final": "pass"}, "parent": "S5C4-050", "role": "contrast", "short": "Joint or partial?", "treeOrder": 38}, {"id": "S5C4-060", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "wording", "title": "Directly and inversely together: one joint variation", "statement": "'$p$ varies inversely as $\\sqrt{q}$ and directly as $r$' is __one joint variation__, $p = \\frac{kr}{\\sqrt{q}}$, __not a sum__ of two parts. A sum is used ==only== when the wording describes separate parts, such as '*partly … and partly …*', '*the sum of two parts*', '*consists of two parts*' or '*one part … and the other part …*'.", "sources": [{"page": "Page51", "printed": "4.51", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. The source is the Checkpoint on P.4.51 (item 3). The last sentence summarises the wordings the book uses for partial variations (P.4.31).", "keyIdea": "K4-5", "level": "core", "check": {"pages": ["4.51"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'A sum is used only when the wording says partly … and partly … or the sum of two parts' is too narrow. The book also signals partial variation by 'consists of two parts' (Ex 4D Q7), 'One part of P is a constant and the other part …' (Ex 4D Q2) and 'divided into two parts' (T4.68j), so a student would wrongly reject those.", "final": "pass"}, "parent": "S5C4-046", "role": "warning", "short": "One joint variation, not a sum", "treeOrder": 27}, {"id": "S5C4-061", "section": "4.2 B", "sectionTitle": "Partial Variations", "kind": "graph-feature", "title": "A slanting line not through the origin: partial, not direct", "statement": "On a graph of $y$ against $x$, a __slanting__ straight line that cuts the $y$-axis at $k_1 \\neq 0$ shows the partial variation $y = k_1 + k_2x$. It does not show that $y$ varies directly as $x$, because the graph of $y = kx$ always passes through the origin.", "sources": [{"page": "Page54", "printed": "4.54", "where": "exercise"}, {"page": "Page59", "printed": "4.59", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. The sources are Supplementary Exercise 4 Q19 on P.4.54 and Multiple-choice Q50 on P.4.59. Teacher note N10 (P.4.31) draws the graph of $z = k_1 + k_2x$ but does not contrast it with direct variation.", "keyIdea": "K4-6", "level": "core", "visual": {"type": "plot", "x": [-0.5, 7.6], "y": [-0.5, 5], "curves": [{"f": "1.2*x", "dom": [0, 3.5], "style": "main", "label": "$y = kx$", "lx": 3.5, "ly": 4.2, "pos": "right"}, {"f": "1.5+0.4*x", "dom": [0, 5], "style": "main", "label": "$y = k_1 + k_2x$", "lx": 5, "ly": 3.5, "pos": "right"}], "points": [{"x": 0, "y": 1.5, "label": "$k_1$", "pos": "left"}]}, "check": {"pages": ["4.54", "4.59"], "date": "2026-10-06", "result": "equivalent", "notes": " | final: (unmarked, teacher-mode note only) The inferred note says 'The watchOut about a horizontal line is my own check', but the card has no watch-out.", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "parent": "S5C4-054", "role": "contrast", "short": "Not through $O$: not direct", "treeOrder": 37}, {"id": "S5C4-062", "section": "4.3", "sectionTitle": "Real-life Applications of Variations", "kind": "method-idea", "title": "Using variations in real-life problems", "statement": "Turn the situation into a variation statement, write its equation, find the variation constant(s) from the data, then answer the question.", "example": "A metal bar $\\ell$ m long is worth $P$ dollars, with $P \\propto \\ell^2$; a 5 m bar is worth 100 dollars, so $P = 4\\ell^2$.", "sources": [{"page": "Page39", "printed": "4.39", "where": "main text"}, {"page": "Page39", "printed": "4.39", "where": "example"}, {"page": "Page40", "printed": "4.40", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The step-by-step description is my summary of Examples 16 and 17.", "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.39", "4.40"], "date": "2026-10-06", "result": "fixed", "notes": "(scope) 'find the constant from the data' fits Examples 16–17 only. Section 4.3 also has partial variations (Examples 19–20), which need two constants from two sets of data. | final: (context) The example says 'Value $P$' but never says that $\\ell$ is the length of the bar in metres or that $P$ is in dollars (Example 16, P.4.39).", "final": "fixed", "confirmed": "2026-10-06"}, "parent": "S5C4-020", "role": "method", "short": "Real-life problems", "treeOrder": 45}, {"id": "S5C4-063", "section": "4.3", "sectionTitle": "Real-life Applications of Variations", "kind": "link", "title": "Law of gravity is a joint variation", "statement": "The gravitational force of $F$ units between two objects of masses $M$ kg and $m$ kg that are $d$ m apart is a joint variation: $F \\propto \\frac{Mm}{d^2}$.", "sources": [{"page": "Page41", "printed": "4.41", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The source is the 'STEM Zone' box, recorded as a note.", "keyIdea": "K4-5", "level": "extra", "check": {"pages": ["4.41"], "date": "2026-10-06", "result": "equivalent", "notes": " | final: (context) $F$ is used without being introduced, and no units are given. The STEM Zone on P.4.41 says the force is $F$ units, the masses are $M$ kg and $m$ kg and the distance is $d$ m.", "final": "fixed", "confirmed": "2026-10-06"}, "hidden": true, "hiddenWhy": "Extra real-life link from physics, not needed for the concept."}, {"id": "S5C4-064", "section": "4.3", "sectionTitle": "Real-life Applications of Variations", "kind": "method-idea", "title": "Check answers against real-life restrictions", "statement": "Some variables have real-life restrictions, such as a number of copies being a positive integer. If a given value leads to a value that breaks the restriction, that given value is impossible.", "example": "Printing $n$ copies costs $C$ dollars per copy, with $C = 50 + \\frac{1000}{n}$: $C = 80$ gives $n = 33\\frac{1}{3}$, not a positive integer, so a cost of 80 dollars per copy is impossible.", "sources": [{"page": "Page42", "printed": "4.42", "where": "example"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-8", "level": "supporting", "check": {"pages": ["4.42", "T4.68j"], "date": "2026-10-06", "result": "fixed", "notes": "(ambiguous) 'the situation is impossible' can be read as 'the whole problem is invalid'. The book's conclusion is narrower: the given value (a cost of 80 dollars per copy) cannot happen. | final: (context) The example uses $C$ and $n$ without saying what they are, and '$C = 80$ gives $n = 33\\frac{1}{3}$' needs the relation $C = 50 + \\frac{1000}{n}$, which the card never gives (Example 19, P.4.42).", "final": "fixed", "confirmed": "2026-10-06"}, "parent": "S5C4-062", "role": "warning", "short": "Real-life limits", "treeOrder": 46}, {"id": "S5C4-065", "section": "4.3", "sectionTitle": "Real-life Applications of Variations", "kind": "method-idea", "title": "Find the maximum by completing the square", "statement": "If a height $h$ is given in terms of the time $t$ by $h = k_1t + k_2t^2$ with ==$k_2 < 0$==, complete the square to find the greatest value of $h$. Compare this greatest value with a stated height to decide whether $h$ can exceed that height.", "example": "Javelin $h$ m above its starting position $t$ s after the throw, with $h = 25t - 5t^2$: can $h$ exceed 32 m? $h = -5(t - 2.5)^2 + 31.25$, so the maximum is 31.25 m, which is less than 32 m, so $h$ ==cannot== exceed 32 m.", "sources": [{"page": "Page43", "printed": "4.43", "where": "example"}, {"page": "Page43", "printed": "4.43", "where": "margin note"}, {"page": "Page78", "printed": "T4.68j", "where": "example"}], "teacherOnly": false, "nonFoundation": true, "inSummary": false, "inferred": "The three steps come from the 'Explain Tutor' box beside Example 20. The book does not call the equation a quadratic here; linking it to completing the square of a quadratic is how the worked solution proceeds. The condition $k_2 < 0$ is my addition: in Example 20, $k_2 = -5$, and in Supplementary Example 20, $k_2 = -2$.", "keyIdea": "K4-8", "level": "extra", "check": {"pages": ["4.43", "T4.68j"], "date": "2026-10-06", "result": "equivalent", "notes": " | final: (context) The statement and the example use $h$ and $t$ without saying what they are or their units. In Example 20 (P.4.43), $h$ m is the height of a javelin above its starting position $t$ s after it is thrown.", "final": "fixed", "confirmed": "2026-10-06 (after fix)"}, "hidden": true, "hiddenWhy": "Extra non-foundation exam technique (completing the square)."}, {"id": "S5C4-066", "section": "Extra DSE Support", "sectionTitle": "Exam Get Set Go", "kind": "method-idea", "title": "How marks are given in a DSE question", "statement": "In the suggested solution on P.4.60, part (a) gives 1 mark each for setting up the equation, either one of the two equations from the data, the correct expression and the correct answer. Part (b) gives 1 mark for correct substitution and 1 mark for the correct conclusion with reasons.", "sources": [{"page": "Page60", "printed": "4.60", "where": "DSE support"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-8", "level": "extra", "check": {"pages": ["4.60"], "date": "2026-10-06", "result": "fixed", "notes": "(maths) 'each equation from the data' is wrong: the book gives 1 mark 'for either one' of equations (1) and (2), not one per equation. The card also omits the mark 'for correct substitution' in (b).; (scope) The card turns one suggested solution (P.4.60, ref. DSE 2020 Paper 1 Q10) into a rule for every 'DSE partial-variation question'.", "final": "pass"}, "hidden": true, "hiddenWhy": "Exam-marking detail, not a concept."}, {"id": "S5C4-067", "section": "Extra DSE Support", "sectionTitle": "Exam Get Set Go", "kind": "method-idea", "title": "Must be constant: make $k$ the subject, then use $\\frac{1}{k}$", "statement": "Rearrange the variation equation to make $k$ the subject, and remember that $\\frac{1}{k}$ is also a constant.", "example": "$z = \\frac{kx}{y^2}$ gives $\\frac{x}{y^2z} = \\frac{1}{k}$, a constant.", "sources": [{"page": "Page61", "printed": "4.61", "where": "DSE support"}, {"page": "Page74", "printed": "T4.68f", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The two steps are the 'Star Tips' of the MC Question Tutor. The illustration is taken from the teacher's Supplementary Example 12 rather than from the tutor question itself.", "keyIdea": "K4-9", "level": "core", "check": {"pages": ["4.61", "T4.68f"], "date": "2026-10-06", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "S5C4-048", "role": "method", "short": "Make $k$ the subject", "treeOrder": 50, "cluster": "Must it be constant?"}, {"id": "S5C4-068", "section": "Teacher's pages", "sectionTitle": "Chapter Highlight", "kind": "link", "title": "Variations describe systematic real-life change", "statement": "In some real-life situations, a variable ==may== change in a systematic way when related variables change. For example, a triangle's area $A$ may change when its base $b$ and height $h$ change, but the values always follow $A = \\frac{1}{2}bh$.", "sources": [{"page": "Page69", "printed": "T4.68a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-1", "level": "extra", "check": {"pages": ["T4.68a"], "date": "2026-10-06", "result": "fixed", "notes": "(modality) The book says 'In some real-life situations, a variable may change'. The card says a variable 'often changes'.; (modality) 'A triangle's area changes with its base and height' drops 'may'. The area need not change (double the base and halve the height). The book says the area may change. | final: (context) The statement shows $A = \\frac{1}{2}bh$ without saying that $A$, $b$ and $h$ are the area, base and height.", "final": "fixed", "confirmed": "2026-10-06"}, "hidden": true, "hiddenWhy": "Teacher-only introduction that repeats the variation card."}, {"id": "S5C4-069", "section": "Teacher's pages", "sectionTitle": "Chapter Highlight", "kind": "link", "title": "Prerequisites for the Variations chapter", "statement": "Before this chapter, students should know percentages, direct and inverse proportions, and how to solve simultaneous linear equations in two unknowns. Teachers ==may== ask students who need better preparation to do the Review Exercise in §4.0.", "sources": [{"page": "Page69", "printed": "T4.68a", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K4-1", "level": "extra", "check": {"pages": ["T4.68a"], "date": "2026-10-06", "result": "fixed", "notes": "(ambiguous) In 'The review in 4.0 prepares them', 'them' could mean the students or the topics.; (modality) The book says teachers may ask students to do the §4.0 Review Exercise if they need better preparation. The card presents it as what the review does for everyone.", "final": "pass"}, "hidden": true, "hiddenWhy": "Prerequisite list for teachers that dilutes the focus (the teacher's example)."}], "keyIdeas": [{"id": "K4-1", "title": "Variables that change together", "summary": "Variables that change together according to a specific relation vary with each other. The constant $k$ in a variation is called the variation constant, and it is ==non-zero==.", "shape": "chain"}, {"id": "K4-2", "title": "Direct variation", "summary": "If $y$ varies directly as $x$, then $y = kx$, where $k$ is a ==non-zero== constant. The ratio $\\frac{y}{x}$ stays the same for every non-zero $x$, and the graph is a straight line through the origin.", "shape": "tree"}, {"id": "K4-3", "title": "Inverse variation", "summary": "If $y$ varies inversely as $x$, then $y = \\frac{k}{x}$, where $k$ is a ==non-zero== constant. The product $xy$ stays the same, and the graph is a pair of curves that do not pass through the origin.", "shape": "tree"}, {"id": "K4-4", "title": "From words to an equation", "summary": "The wording of a variation decides exactly which quantity takes the place of $x$ in $y = kx$ or $y = \\frac{k}{x}$.", "shape": "chain"}, {"id": "K4-5", "title": "Joint variation", "summary": "In a joint variation, a variable varies with the product of two or more variables, possibly with some or all of them in the denominator, and there is ==only== one variation constant $k$.", "shape": "tree"}, {"id": "K4-6", "title": "Partial variation", "summary": "In a partial variation, a variable is the sum of two or more different parts: one part ==may== be a constant, and the other part(s) may vary directly or inversely as other variable(s). The parts have separate variation constants ($k_1$, $k_2$, ...), whose values may be different.", "shape": "tree"}, {"id": "K4-7", "title": "Percentage change in a variation", "summary": "In a direct, inverse or joint variation, find a percentage change by writing each new value as a multiple of its old value, substituting, and comparing the new value with the old one. The value of $k$ is not needed.", "shape": "tree"}, {"id": "K4-8", "title": "Finding and using the variation equation", "summary": "Use the given values to find the variation constant or constants, then use the equation and check that the answer makes sense.", "shape": "tree"}, {"id": "K4-9", "title": "Rearranging and combining variations", "summary": "A variation can give new ones: square both sides, or chain two variations by substitution. Substituting its equation into an expression shows whether that expression must be constant.", "shape": "clusters"}], "chapter": {"title": "Variations", "w": 900, "h": 720, "nodes": [{"k": "K4-1", "label": "Variation", "sub": "e.g. $y = 20x$; constant $k \\neq 0$", "x": 450, "y": 54, "part": "key"}, {"k": "K4-2", "label": "Direct variation", "sub": "$y = kx$", "x": 110, "y": 186, "part": "kind"}, {"k": "K4-3", "label": "Inverse variation", "sub": "$y = \\frac{k}{x}$", "x": 336, "y": 186, "part": "kind"}, {"k": "K4-5", " function richHTML(text) {
  const maths = [];
  let t = String(text || "").replace(/\$[^$]*\$/g, m => { maths.push(m); return "\u0000" + (maths.length - 1) + "\u0000"; });
  t = t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // The card font (KaTeX_Main) draws a straight ' as a closing quote, so 'the rest' showed as ’the rest’.
  // Curl them outside the maths: opening after a space, a bracket or the start; closing (and apostrophes) otherwise.
  t = t.replace(/(^|[\s(\[\u2014\u2013-])'/g, "$1\u2018").replace(/'/g, "\u2019");

  t = t.replace(/(^|[\s(\[\u2014\u2013-])"/g, "$1\u201C").replace(/"/g, "\u201D");

       .replace(/==(.+?)==/g, "<mark>$1</mark>")
       .replace(/__(.+?)__/g, "<u>$1</u>")

    const w = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);

// An opening bracket before an equation, and a closing bracket or punctuation after it, stay on its line:
// "(k > 0)" once broke as "(" at the end of one line and "k > 0)" on the next.
function glueMath(node) {
  if (!node) return;
  node.querySelectorAll(".katex").forEach(k => {
    if (k.closest(".nw, .katex-display")) return;
    // Glue the outermost wrapper: the renderer's own plain span, and a highlight or underline around it.
    let el = k;
    const wrapper = q => q && q.childNodes.length === 1 && (/^(MARK|U|STRONG|EM)$/.test(q.tagName) || (q.tagName === "SPAN" && !q.className));
    while (wrapper(el.parentNode)) el = el.parentNode;
    const before = el.previousSibling, after = el.nextSibling;
    const lead = before && before.nodeType === 3 && /[(\[]$/.test(before.data) ? before.data.slice(-1) : "";
    const tail = after && after.nodeType === 3 ? (after.data.match(/^[)\].,;:!?]+/) || [""])[0] : "";
    if (!lead && !tail) return;
    const w = document.createElement("span");
    w.className = "nw";
    el.parentNode.insertBefore(w, el);
    if (lead) { before.data = before.data.slice(0, -1); w.append(lead); }
    w.appendChild(el);
    if (tail) { after.data = after.data.slice(tail.length); w.append(tail); }

}

// but a paragraph that holds a long equation is set flush left: justifying around an equation that cannot
// break left wide gaps between the words (teacher, 7 October 2026, on Ch3's "Which way a parabola opens").
function raggedMath(node) {
  if (!node || !node.isConnected) return;
  node.querySelectorAll(".statement, .ex > span, .box > span, .mapslide .lede, .ck-prompt").forEach(p => {
    const fs = parseFloat(getComputedStyle(p).fontSize) || 16;
    p.classList.toggle("ragged", [...p.querySelectorAll(".katex")].some(k => k.getBoundingClientRect().width > 5 * fs));

}
