<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S5 Knowledge Cards and Quiz · Chapters 3–5</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --navy: #1d2b45;
    --navy-soft: #33476b;
    --blue: #2463c7;
    --page: #eef1f5;
    --rail: #e6eaf0;
    --card: #ffffff;
    --ink: #1b2230;
    --muted: #5a6577;
    --faint: #8a94a5;
    --line: #d5dbe5;
    --edge: #b9c2d0;
    --trap: #a23a32;
    --ok: #2c6e49;
    --ok-bg: #edf6f0;
    --no-bg: #faefee;
    --warm-bg: #fbf5ea;
    --k-definition: #2b6cb0; --k-notation: #6b46c1; --k-property: #2f855a; --k-condition: #b7791f;
    --k-graph-feature: #0f7b8a; --k-method-idea: #3c5a99; --k-link: #718096; --k-wording: #9c4221; --k-common-mistake: #c53030;
    --k-explanation: #2463c7;
    --serif: KaTeX_Main, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); min-height: 100dvh; display: flex; flex-direction: column;
         font: 16px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
  button, select, input { font: inherit; }
  /* One-card view: header, strip, card area and bottom bar fill exactly one screen. */
  html.onecard, body.onecard { height: 100dvh; overflow: hidden; overscroll-behavior: none; }
  /* Scroll boxes are positioned, so KaTeX's hidden screen-reader text stays inside them. */
  .dp-list, .rail-inner, .branchpanel, .drillpanel, .card { position: relative; }
  #body { min-height: 0; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---- Top bar ---- */
  header { background: var(--navy); color: #fff; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; }
  .tabs, .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button, .seg button { background: transparent; color: #c9d4e8; border: 1px solid transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .tabs button:hover, .seg button:hover { color: #fff; }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 600; }
  .seg { margin-left: auto; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px; }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; }
  .hbtn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .hbtn.on { background: #fff; color: var(--ink); }

  /* ---- Filter panel ---- */
  .filters { display: none; background: #fff; border-bottom: 1px solid var(--line); padding: 12px 20px; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filters.open { display: flex; }
  .filters select, .filters input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .chip.on { border-color: var(--blue); color: var(--blue); background: #e8f0fc; }
  .origin { color: var(--muted); font-size: 12px; width: 100%; }

  /* ---- Key-idea strip: each chip carries a glyph of its group's shape ---- */
  .kstrip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px 6px; scrollbar-width: thin; }
  .kchip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
           border-radius: 999px; padding: 7px 14px 7px 11px; cursor: pointer; font-size: 14px; }
  .kchip:hover { border-color: var(--navy-soft); }
  .kchip svg { width: 22px; height: 14px; flex: none; }
  .kchip small { color: var(--muted); }
  .kchip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .kchip.on small { color: #c9d4e8; }

  /* ---- Workspace: branch rail beside the big card on wide screens ---- */
  .workspace { flex: 1; display: flex; min-height: 0; }
  .workspace.with-rail { display: grid; grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .stage { flex: 1; display: flex; padding: 14px 20px 10px; touch-action: pan-y; min-width: 0; min-height: 0; overflow: hidden; }
  .stage > * { width: 100%; max-width: 1040px; margin: 0 auto; }

  .rail { background: var(--rail); border-right: 1px solid var(--line); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .rail-inner { flex: 1 1 auto; min-height: 0; padding: 18px 14px 18px 18px; overflow-y: auto; }
  /* Portrait: the same branch map sits under the card instead of beside it. */
  .branchpanel { max-width: 1040px; margin: 12px auto 0; width: 100%; background: var(--rail); border-radius: 14px; padding: 14px 18px;
                 flex: 1 1 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .branchpanel .rail-inner { padding: 0; flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  /* The idea's Refresh at the foot of the tree beside a card: outside the scrolling branches, so always in sight. */
  .rail-foot { flex: none; display: flex; flex-direction: column; align-items: stretch; gap: 7px; padding: 12px 14px 14px 18px;
               border-top: 1px solid var(--line); }
  .rail-foot .ic-refresh { margin: 0; justify-content: center; padding: 9px 14px 9px 11px; border-color: var(--navy-soft); color: var(--navy); }
  .rail-foot .ic-refresh:hover:not(:disabled) { background: var(--navy); color: #fff; }
  .rail-foot .ic-refresh:disabled { border-color: var(--line); color: var(--faint); }
  .rail-foot .ic-undo { margin: 0; align-self: flex-start; }
  .rail-foot .ic-note { font: 13px/1.35 var(--sans); }
  .rf-sub { font: 13px/1.3 var(--sans); color: var(--muted); text-align: center; text-wrap: balance; }
  .branchpanel .rail-foot { flex-direction: row; align-items: center; flex-wrap: wrap; gap: 6px 14px; padding: 10px 0 0; margin-top: 8px; }
  .branchpanel .rail-foot .rf-sub { text-align: left; }
  .branchpanel.foot-only { padding-top: 12px; padding-bottom: 12px; }
  .branchpanel.foot-only .rail-inner { display: none; }
  .branchpanel.foot-only .rail-foot { border-top: 0; margin-top: 0; padding-top: 0; }
  .rail-inner h2 { margin: 0 0 4px; font: 600 18px/1.25 var(--serif); color: var(--navy); }
  .rail-inner .tomap { background: none; border: 0; padding: 0; margin: 0 0 14px; color: var(--blue); cursor: pointer; font-size: 14px; }
  .rail-inner .tomap:hover { text-decoration: underline; }
  .cluster-label { font: italic 14px/1.3 var(--serif); color: var(--muted); margin: 14px 0 6px; }
  .tree, .tree ol { list-style: none; margin: 0; padding: 0; }
  .tree li { position: relative; }
  .tree ol { margin-left: 13px; }
  .tree ol > li { padding-left: 16px; }
  /* Connectors: a vertical spine per child list and an elbow into each child. */
  .tree ol > li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--edge); }
  .tree ol > li:last-child::before { bottom: auto; height: 20px; }
  .tree ol > li::after { content: ""; position: absolute; left: 0; top: 20px; width: 11px; border-top: 1.5px solid var(--edge); }
  .tree ol > li.path::after, .tree ol > li.path::before { border-color: var(--navy-soft); }
  .tnode { display: flex; container-type: inline-size; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; width: 100%; text-align: left; background: none; border: 0; border-radius: 8px;
           padding: 8px 10px; margin: 1px 0; cursor: pointer; color: var(--ink); font: 16px/1.3 var(--serif); }
  .tnode:hover { background: rgba(29,43,69,.06); }
  .tnode .role { font: 600 11px/1 var(--sans); color: var(--faint); letter-spacing: .02em; flex: none; }
  .tnode .role.trap { color: var(--trap); }
  .tnode .role.why { color: var(--blue); }
  .tnode .role.join { color: var(--navy); }
  .rail li.join { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--edge); }
  .tnode .lab { flex: 1; min-width: 0; }
  @container (max-width: 180px) { .tnode .role { flex-basis: 100%; } }
  .tnode .lab .nw { white-space: normal; }
  .rail-inner.measure-density .tnode .lab .nw { white-space: nowrap; }
  /* Choose the rail font tier with the established inline layout; wrapping may then scroll. */
  .rail-inner.measure-density .tnode { container-type: normal; flex-wrap: nowrap; gap: 6px; }
  .rail-inner.measure-density .tnode .role { flex: none; }
  .rail-inner.measure-density .tnode .lab { flex: 0 1 auto; }
  .tnode .seen { margin-left: auto; flex: none; width: 14px; height: 14px; color: var(--ok); opacity: .8; align-self: center; }
  .tnode.path { color: var(--navy); font-weight: 700; }
  .tnode.current { background: var(--navy); color: #fff; font-weight: 700; }
  .tnode.current .role { color: #c9d4e8; }
  .tnode.current .seen { color: #c9d4e8; }
  /* A long tree on a short screen tightens before its box has to scroll (fitNow adds these). */
  .rail-inner.compact .tnode { padding: 5px 9px; font-size: 15px; }
  .rail-inner.compact .tree ol > li::after { top: 15px; }
  .rail-inner.compact .tree ol > li:last-child::before { height: 15px; }
  .rail-inner.tight .tnode { padding: 3px 8px; font-size: 14px; line-height: 1.2; }
  .rail-inner.tight .tree ol > li::after { top: 12px; }
  .rail-inner.tight .tree ol > li:last-child::before { height: 12px; }
  .rail-inner.tight .cluster-label { margin: 8px 0 4px; }

  /* ---- Map slide: the group's tree, shown as a showcase ---- */
  .mapslide { display: flex; flex-direction: column; gap: 10px; padding: 8px 4px 4px; min-height: 0; overflow: hidden; }
  .mapslide h2 { margin: 0; font: 700 34px/1.15 var(--serif); color: var(--navy); text-wrap: balance; }
  .mapslide .lede { margin: 0; font: 21px/1.5 var(--serif); color: var(--ink); }
  .tmap-wrap { position: relative; margin-top: 18px; }
  .tmap { position: relative; transform-origin: 0 0; }
  .tmap svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .tmap svg.edges path { fill: none; stroke: var(--edge); stroke-width: 1.6; }
  .tmap svg.edges rect { fill: none; stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 3 5; }
  .mnode { position: absolute; transform: translateY(-50%); transition-property: opacity, transform; display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
           background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px 10px; cursor: pointer;
           font: 18px/1.3 var(--serif); color: var(--ink); text-align: left; box-shadow: 0 1px 2px rgba(27,34,48,.06), 0 4px 14px rgba(27,34,48,.05); }
  .mnode:hover { border-color: var(--navy-soft); }
  .mnode .role { font: 600 11px/1 var(--sans); color: var(--faint); letter-spacing: .02em; }
  .mnode .role.trap { color: var(--trap); }
  .mnode .role.why { color: var(--blue); }
  .mnode.root .role.join { color: #c9d4e8; }
  .tmap svg.edges path.join { stroke: var(--navy); stroke-width: 2; }
  .tmap svg.edges path.joinhead { fill: var(--navy); stroke: none; stroke-dasharray: none; }
  .mnode.root { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; font-size: 20px; padding: 12px 16px; }
  .mnode .seen { position: absolute; right: -6px; top: -6px; width: 16px; height: 16px; color: var(--ok); background: #fff; border-radius: 50%; }
  .cl-label { position: absolute; font: italic 16px/1.2 var(--serif); color: var(--muted); }
  .maphint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  /* The one authored moment: the tree grows from its root when a group opens. */
  .grow .mnode { opacity: 0; transform: translate(-8px, -50%); transition: opacity .35s cubic-bezier(.16,1,.3,1), transform .45s cubic-bezier(.16,1,.3,1); }
  .grow svg.edges path { transition: stroke-dashoffset .55s cubic-bezier(.16,1,.3,1); }
  .grown .mnode { opacity: 1; transform: translate(0, -50%); }
  @media (prefers-reduced-motion: reduce) {
    .grow .mnode, .grow svg.edges path { transition: none; }
  }

  /* ---- Chapter map: a tree of the kinds above a flow of the working steps, with the drill guide beside it ---- */
  .stage > .chapslide { max-width: none; }
  .chapslide { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr); gap: 22px; min-height: 0; overflow: hidden; }
  .chap-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .chap-main h2 { margin: 2px 0 6px; font: 700 30px/1.15 var(--serif); color: var(--navy); }
  .chart-wrap { position: relative; flex: 1; min-height: 0; }
  .chart { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .chart svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .chart .lk { fill: none; stroke: var(--edge); stroke-width: 2; transition: stroke .2s, opacity .2s; }
  .chart .lk.flow, .chart .lk.bar, .chart .lk.stub { stroke: #8f9bb0; }
  /* New knowledge (top) and skills (bottom) differ in every channel: zone, box, colour, line, badge, button. */
  .band { position: absolute; border-radius: 24px; }
  .band.new { background: #e6edf8; }
  .band.skill { background: rgba(255,255,255,.35); border: 1.5px dashed #b6c4cb; }
  /* Extended from earlier work (teacher, 7 October: Ch3's graphs extend S4): worth going through, not new. */
  .band.ext { background: #edf2ee; }
  .zone.ext { font: 700 18px/1 var(--sans); color: #45624f; letter-spacing: .01em; }
  .zone { position: absolute; white-space: nowrap; }
  .zone.new { font: 700 19px/1 var(--sans); color: var(--navy); letter-spacing: .01em; }
  .zone.skill { font: italic 18px/1 var(--serif); color: #4f6f78; }
  .cnode.part-kind { border: 2px solid var(--navy-soft); }
  .cnode.part-ext { border: 2px solid #9fb8a6; }
  .cnode.part-step { background: rgba(255,255,255,.72); border: 1.5px dashed #8ea6ae; box-shadow: none; color: #33505a; }
  .cnode.part-step b { font-weight: 600; }
  .cnode.part-step small { color: #5d7680; }
  .chart .lk.flow, .chart .lk.drop { stroke-dasharray: 6 5; }
  .cnode { position: absolute; transform: translate(-50%, -50%); width: 204px; background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
           padding: 10px 14px 11px; text-align: center; cursor: pointer; font-family: var(--serif); color: var(--ink);
           box-shadow: 0 1px 2px rgba(27,34,48,.06), 0 6px 18px rgba(27,34,48,.06);
           transition: opacity .22s, transform .22s cubic-bezier(.16,1,.3,1), background .22s, border-color .22s, box-shadow .22s, filter .22s; }
  .cnode b { display: block; font-size: 22px; line-height: 1.18; }
  .cnode small { display: block; margin-top: 4px; font-size: 16px; line-height: 1.3; color: var(--muted); }
  .cnode .katex { white-space: nowrap; }
  .cnode.part-step { width: 214px; }
  .cnode.part-key { width: 340px; background: var(--navy); border-color: var(--navy); color: #fff; padding: 14px 18px; }
  .cnode.part-extkey { width: 340px; background: #45624f; border-color: #45624f; color: #fff; padding: 14px 18px; }
  .cnode.part-extkey b { font-size: 32px; }
  .cnode.part-extkey small { color: #d5e3d9; }
  .cnode.part-key b { font-size: 32px; }
  .cnode.part-key small { color: #c9d4e8; }
  .cnode.part-step { border-radius: 6px; }
  .cnode:hover { border-color: var(--navy-soft); }
  .cnode .badge { position: absolute; left: -15px; top: -15px; width: 32px; height: 32px; border-radius: 50%; background: var(--navy); color: #fff;
                  font: 700 17px/32px var(--sans); display: none; box-shadow: 0 0 0 3px #fff; }
  .cnode .cnt { position: absolute; right: -12px; top: -13px; background: #fff; border: 1px solid #d9a400; color: #6e5100; border-radius: 999px;
                padding: 2px 9px; font: 600 13px/1.4 var(--sans); display: none; }
  /* Focus: the groups a drill set needs light up in reading order; the rest step back. */
  .chart.focus .cnode { opacity: .26; filter: grayscale(.7); }
  .chart.focus .cnode.need { opacity: 1; filter: none; }
  /* Must read: filled amber, solid badge, a little lift. */
  .chart.focus .cnode.need-new { background: #ffefb8; border: 2.5px solid #c99400; transform: translate(-50%, -50%) scale(1.07);
                                 box-shadow: 0 2px 4px rgba(27,34,48,.08), 0 12px 26px rgba(27,34,48,.16); }
  .chart.focus .cnode.part-key.need-new { background: var(--navy); color: #fff; }
  .chart.focus .cnode.part-extkey.need-new { background: #45624f; color: #fff; }
  /* Optional skill: dashed amber outline, hollow badge, no lift. */
  .chart.focus .cnode.need-skill { background: #fff; border: 2px dashed #c99400; }
  .chart.focus .cnode.need .badge, .chart.focus .cnode.need .cnt { display: block; }
  .chart.focus .cnode.need-skill .badge { background: #fff; color: #8a6400; box-shadow: 0 0 0 2px #c99400 inset, 0 0 0 3px #fff; }
  .chart.focus .cnode.need-skill .cnt { border-style: dashed; color: #7a6a3a; }
  .cnode .badge.first { animation: startHere 1.1s cubic-bezier(.16,1,.3,1) 1; }
  @keyframes startHere { 0% { transform: scale(1); } 35% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .chart.focus .lk { opacity: .2; }
  .chart.focus .lk.hot { opacity: 1; stroke: #c99400; stroke-width: 3.5; stroke-dasharray: none; }
  .chart.focus .lk.hot.soft { stroke-dasharray: 7 6; stroke-width: 2.6; }
  @media (prefers-reduced-motion: reduce) { .cnode { transition: none; } }

  .drillpanel { background: #fff; border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .dp-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .dp-head h3 { margin: 0; font: 700 21px/1.2 var(--serif); color: var(--navy); }
  .dp-head p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .dp-list { overflow-y: auto; padding: 6px; min-height: 0; }
  .drow { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left;
          background: none; border: 1px solid transparent; border-radius: 12px; padding: 10px 10px; cursor: pointer; color: var(--ink); margin: 1px 0; }
  .drow:hover, .drow:focus-visible { background: #fffaea; border-color: #f1d27a; }
  .drow.on { background: #fff4cc; border-color: #e0b100; }
  .drow .dn { font: 700 18px/1.1 var(--serif); color: var(--navy); text-align: center; }
  .drow .dn small { display: block; font: 600 10px/1.3 var(--sans); color: var(--muted); letter-spacing: .04em; }
  .drow .dt b { display: block; font: 700 16px/1.25 var(--serif); }
  .drow .dt > span { display: block; font: 14px/1.35 var(--serif); color: var(--muted); margin-top: 2px; }   /* > : not the maths in a title (9 Oct) */
  .drow .dc { font: 600 12px/1 var(--sans); color: #6e5100; background: #ffefb8; border-radius: 999px; padding: 5px 8px; white-space: nowrap; }
  .drow .dc small { font-weight: 500; color: #7a6a3a; margin-left: 3px; }
  .dread { margin: 2px 4px 10px; padding: 0; }
  .doneslide .recall-line { font-size: 17px; color: var(--muted); }
  .dread ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .dread li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: start; }
  .dread .badge { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font: 700 13px/24px var(--sans); text-align: center; }
  .dread .kt { font: 600 13px/1.3 var(--sans); color: var(--navy); }
  .dread .cards { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .dread .cards button { font: 15px/1.25 var(--serif); background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; cursor: pointer; color: var(--ink); text-align: left; }
  .dread .cards button:hover { border-color: var(--navy-soft); }
  .dread .recall { margin-top: 12px; font: 14px/1.45 var(--serif); color: var(--ink); }
  .dread .recall b { font: 600 12px/1 var(--sans); color: #8a5a1c; display: block; margin-bottom: 4px; }
  .dread .recall div + div { margin-top: 4px; }
  .dread .pages { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .dread .gap { margin-top: 6px; font-size: 12px; color: var(--trap); }
  .dread .go { margin-top: 0; width: 100%; min-height: 46px; border-radius: 10px; border: 0; background: var(--blue); color: #fff; font-weight: 600; cursor: pointer; font-size: 16px; }
  .dread .go:hover { background: #1f56ae; }
  .dread .go2 { margin-top: 6px; width: 100%; min-height: 40px; border-radius: 10px; border: 1.5px dashed #8ea6ae; background: #fff; color: #33505a; cursor: pointer; font-size: 15px; }
  .dread .go2:hover { border-color: #33505a; }
  .where .skip { margin-left: 8px; background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-size: 13px; text-decoration: underline; }

  /* Reading path: only the cards a drill set needs, then a ready slide. */
  .pathbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: #fff4cc; border-bottom: 1px solid #f1d27a; flex-wrap: wrap; }

  .doneslide .recall b { display: block; font: 600 14px/1 var(--sans); color: #8a5a1c; margin-bottom: 6px; }

  .doneslide .btns button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  @media (max-width: 1099px) {
    .chapslide { flex: 1 1 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; }
  }

  /* ---- Concept checks, on the card they test: one tap per item, no calculation ---- */
  .ck-dots { display: flex; gap: 8px; margin-left: auto; }
  .ck-dots i { width: 12px; height: 12px; border-radius: 50%; background: #d5dbe5; display: block; }
  .ck-dots i.ok { background: var(--ok); } .ck-dots i.no { background: #d39e00; } .ck-dots i.cur { background: var(--navy); }
  .ck-prompt { margin: 0; font: 27px/1.45 var(--serif); color: var(--ink); text-align: justify; }

            font: 22px/1.3 var(--serif); color: var(--ink); transition: border-color .15s, background .15s, transform .15s; }

  /* Select-all: tap every sample that fits, then Check. A selected sample carries a filled tick, not just a colour. */
  .ck-opts.ck-tables { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .ck-opts.eq.ck-tables { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @container (max-width: 395px) { .ck-opts.eq.ck-tables { grid-template-columns: minmax(0, 1fr); } }
  .ck-opts.eq.ck-tables .ck-tabwrap { margin-bottom: .25em; }

  .ck-opt.pick { position: relative; }

                      transform: scale(.6); transition: opacity .15s, transform .2s cubic-bezier(.16,1,.3,1); }
  .ck-opt.pick[aria-pressed="true"] { border-color: var(--blue); background: #eef4fd; }
  .ck-opt.pick[aria-pressed="true"] .sel { opacity: 1; transform: none; }
  .ck-opt.pick.ok { border-color: var(--ok); background: var(--ok-bg); }
  .ck-opt.pick.no { border-color: var(--trap); background: var(--no-bg); }
  .ck-opt.pick.ok .sel { color: var(--ok); } .ck-opt.pick.no .sel { color: var(--trap); }
  .ck-opt.missed { border-color: var(--ok); border-style: dashed; background: #fff; }
  .ck-opt .note { display: block; margin-top: 4px; font: 14px/1.3 var(--sans); color: var(--muted); }
  .ck-opt.ok .note { color: var(--ok); } .ck-opt.no .note { color: var(--trap); }
  /* A table of values, in the book's layout (x, y, then the ratio row). The ratio row's space is kept from the
     start and filled in once answered, so the reveal never moves anything. */
  .ck-tabwrap { overflow-x: auto; }

  .ck-tab th, .ck-tab td { border: 1px solid var(--line); padding: .32em .75em; text-align: center; min-width: 2.6em; }
  .ck-tab th { background: #f1f4f8; font-weight: 400; }
  .ck-tab tr.rev td, .ck-tab tr.rev th { background: var(--ok-bg); }
  .ck-tab tr.rev td.odd { background: #fbf0d2; color: #7a4e12; font-weight: 700; }

  .ck-opt .ck-tab { font-size: 17px; }
  .ck-opt .ck-tab th, .ck-opt .ck-tab td { min-width: 1.7em; padding: .22em .42em; }
  /* Classify each: one row per sample, a two- or three-way chip group on the right. */
  .ck-sort { display: flex; flex-direction: column; gap: 10px; }
  .ck-sort.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .ck-row { display: flex; align-items: center; gap: 14px; justify-content: space-between; border: 1.5px solid var(--line);
            border-radius: 14px; padding: 8px 10px 8px 16px; background: #fff; }

  .ck-row .note { display: block; font: 14px/1.3 var(--sans); color: var(--muted); }
  .ck-row.ok .note { color: var(--ok); } .ck-row.no .note { color: var(--trap); }
  .ck-row.ok { border-color: var(--ok); } .ck-row.no { border-color: var(--trap); }
  .ck-chips { display: inline-flex; flex: none; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 3px; background: #f6f8fb; }
  .ck-sort.tiles .ck-chips { justify-content: stretch; }

             font: 600 16px/1 var(--sans); transition: background .15s, color .15s; }

  .ck-pre .hint { font: 15px/1.3 var(--sans); color: var(--muted); }
  .ck-check { font: 600 16px/1 var(--sans); background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 13px 24px; cursor: pointer; }
  .ck-check:disabled { background: #b9c6dc; cursor: default; }
  .ck-fb { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-radius: 14px; padding: 12px 16px; font: 20px/1.4 var(--serif); }
  .ck-fb.ok { background: var(--ok-bg); } .ck-fb.no { background: var(--no-bg); }
  .ck-fb .ico { width: 28px; height: 28px; flex: none; }
  .ck-fb.ok .ico { color: var(--ok); } .ck-fb.no .ico { color: var(--trap); }
  .ck-fb .fbtext { flex: 1; min-width: 220px; }
  .ck-fb .goon { font: 600 16px/1 var(--sans); background: var(--blue); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
  .st { flex: none; margin-left: auto; width: 16px; height: 16px; align-self: center; }
  .st.secure { color: var(--navy-soft); } .st.slip { color: #d39e00; } .st.faded { color: #a7b0bd; }
  .st.bulb, .st.pencil { color: var(--blue); }

  .mnode .st { position: absolute; right: -7px; top: -7px; width: 18px; height: 18px; background: #fff; border-radius: 50%; }
  /* The idea's revision line on its tree slide: where the checks stand, when, and a fresh start. */
  .ideacheck { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; margin: 2px 0 0; font: 14px/1.3 var(--sans); color: var(--muted); }
  .ic-counts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
  .ic-part { display: inline-flex; align-items: center; gap: 6px; }
  .ic-part .st { margin: 0; width: 15px; height: 15px; }
  .st.todo { color: #a7b0bd; }
  .ic-when { color: var(--faint); }
  .ic-refresh { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; border: 1.5px solid var(--line); background: #fff;
                color: var(--navy-soft); border-radius: 999px; padding: 7px 14px 7px 11px; font: 600 14px/1 var(--sans); cursor: pointer;
                transition: border-color .15s, color .15s; }
  .ic-refresh:hover:not(:disabled) { border-color: var(--navy-soft); color: var(--navy); }
  .ic-refresh:disabled { cursor: default; color: var(--faint); background: transparent; }
  .ic-refresh svg { width: 16px; height: 16px; flex: none; }
  .ic-note { color: var(--navy-soft); }
  .ic-undo { margin-left: auto; background: none; border: 0; padding: 4px 2px; color: var(--blue); font: 600 14px/1 var(--sans);
             cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 1099px) {
    .ck-opts.pics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ck-sort.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* A card with check questions carries a clear Check button beside its title. */
  .ctitle { display: flex; align-items: flex-start; gap: 16px; }
  .ctitle h3 { flex: 1; min-width: 0; }
  .ckbtn { flex: none; display: inline-flex; align-items: center; gap: 8px; margin-top: 2px; border: 1.5px solid var(--blue); color: var(--blue);
           background: #fff; border-radius: 999px; padding: 9px 18px; font: 600 16px/1 var(--sans); cursor: pointer; }
  .ckbtn:hover { background: #eef4fd; }
  .ckbtn svg { width: 18px; height: 18px; }
  .ckbtn .st { margin-left: 2px; }
  /* The quick-check band: always at the bottom of the card, where reading ends. */
  .ckband { margin-top: auto; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border-radius: 14px;
            padding: 12px 14px 12px 18px; background: #e9f1fd; border: 1.5px solid #bcd3f5; cursor: pointer; color: var(--ink);
          }
  .ckband.arrive { animation: bandIn .55s cubic-bezier(.16,1,.3,1) .35s both; }
  .ckband:hover { border-color: var(--blue); }
  .ckband .qi { width: 30px; height: 30px; flex: none; color: var(--blue); }
  .ckband .ckt { min-width: 0; }
  .ckband .ckt b { display: block; font: 700 19px/1.2 var(--sans); color: var(--navy); }
  .ckband .ckt span { display: block; font: 15px/1.3 var(--sans); color: var(--muted); margin-top: 2px; }
  .ckband .go { margin-left: auto; flex: none; background: var(--blue); color: #fff; border-radius: 10px; padding: 12px 24px; font: 600 17px/1 var(--sans); }
  .ckband.secure { background: var(--ok-bg); border-color: #b9dcc6; }
  .ckband.secure .qi { color: var(--ok); }
  .ckband.secure .go { background: #fff; color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
  .ckband.slip { background: #fff4d6; border-color: #f1d27a; }
  .ckband.slip .qi { color: #b8860b; }
  .ckband.slip .go { background: #c99400; }
  .ckband + .foot { margin-top: 10px; }
  @keyframes bandIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .ckband { animation: none; } }
  .card.checking .ck-dots { margin: 0; }
  .ck-tools { display: flex; align-items: center; gap: 14px; flex: none; }
  @media (max-width: 590px) {
    .summary-check .ctitle { flex-direction: column; gap: 8px; }
    .summary-check .ck-tools { width: 100%; justify-content: space-between; flex-wrap: wrap; }
  }
  .ck-fresh { background: none; border: 0; padding: 4px 2px; color: var(--muted); font: 15px/1 var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .ck-fresh:hover { color: var(--blue); }
  .ck-slot { min-height: 74px; }
  .card.checking .ck-body { display: flex; flex-direction: column; gap: 18px; }
  .card.checking .ck-result { font: 700 28px/1.2 var(--serif); color: var(--navy); margin: 0; }
  .card.checking .ck-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .card.checking .ck-actions button { font: 600 16px/1 var(--sans); border-radius: 10px; padding: 13px 20px; cursor: pointer; border: 1.5px solid var(--blue); background: #fff; color: var(--blue); }
  .card.checking .ck-actions button.primary { background: var(--blue); color: #fff; }
  /* In check mode the card shrinks as a whole too (fitCard sets --fit), so nothing is clipped. */
  .card.checking .ck-prompt { font-size: calc(27px * var(--fit)); }
  .card.checking .ck-show { font-size: calc(34px * var(--fit)); padding: calc(8px * var(--fit)) 0; }
  .card.checking .ck-opt { font-size: calc(22px * var(--fit)); min-height: calc(60px * var(--fit)); }
  .card.checking .ck-fb { font-size: calc(20px * var(--fit)); }
  .card.checking .ck-result { font-size: calc(28px * var(--fit)); }
  .card.checking .ck-body { gap: calc(18px * var(--fit)); }
  .card.checking .ck-slot { min-height: calc(74px * var(--fit)); }
  .card.checking .ck-tab { font-size: calc(22px * var(--fit)); }
  .card.checking .ck-opt .ck-tab { font-size: calc(17px * var(--fit)); }
  .card.checking .ck-row .lab { font-size: calc(22px * var(--fit)); }

  .card.checking .ck-chip { padding: calc(8px * var(--fit)) calc(16px * var(--fit)); }

  .card.checking .ck-body { container-type: inline-size; }

  /* Four across only when each working has about 220px; with the tree open on a landscape iPad they stay two by two. */

  .card.checking .ck-opts.steps .ck-opt { overflow-x: auto; }

  /* ---- Card ---- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
          display: flex; flex-direction: column; gap: 10px; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 12px/1.4 var(--sans); color: var(--muted); }
  .kind { color: var(--kc); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }

     equation is set flush left instead (see raggedMath). */
  .statement, .ex > span, .box > span, .mapslide .lede { text-align: justify; text-justify: inter-word; text-wrap: pretty; }
  /* Emphasis: bold = term being defined; highlight = small logic word not to miss;
     underline = the word that tells two things apart; italic = the book's set wording. */
  .card strong, .mapslide strong { font-weight: 700; }
  .nw, .card mark, .mapslide mark { white-space: nowrap; }
  /* Equations stay whole; a paragraph with a long one is set flush left (raggedMath). */
  .card .katex, .mapslide .lede .katex, .doneslide .katex, .tnode .katex, .mnode .katex, .navbar .katex,
  .crumbs .katex { white-space: nowrap; }
  .statement.ragged, .ex > span.ragged, .box > span.ragged, .mapslide .lede.ragged, .ck-prompt.ragged { text-align: left; }
  /* Justified text stays justified (the teacher's choice; flush left looked untidy, 9 October 2026). The browser
     balances the line breaks instead, so no line has to stretch far. */
  .card .statement, .card .ex > span, .card .box > span { text-wrap: pretty; }
  .card mark, .mapslide mark, .dread mark, .doneslide mark { background: linear-gradient(transparent 52%, #fde68a 52%); color: inherit; padding: 0 1px; }
  .card u, .mapslide u { text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font-size: 15px; color: var(--muted); }
  .crumbs button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font: inherit; }
  .crumbs button:hover { color: var(--navy); text-decoration: underline; }
  .crumbs .sep { color: var(--faint); }
  .exs { display: grid; gap: 10px; }
  .ex { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: start; font-size: 14px; padding: 10px 12px; border-radius: 10px; }
  .ex .ico { grid-row: 1 / span 4; width: 22px; height: 22px; margin-top: 1px; }
  .ex > :not(.ico) { grid-column: 2; }  /* every line of text stays in the text column */
  .ex b { font-size: 13px; }
  .ex .why { color: #3a4556; display: block; }
  .ex .exsrc { font-size: 11px; color: var(--muted); }
  .ex.pos { background: var(--ok-bg); } .ex.pos b, .ex.pos .ico { color: var(--ok); }
  .ex.neg { background: var(--no-bg); } .ex.neg b, .ex.neg .ico { color: var(--trap); }
  .box { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: #f3f5f8; }
  .box b { display: block; font-size: 13px; color: var(--muted); }
  .box.watch { background: var(--warm-bg); }
  .box.watch b { color: #8a5a1c; }
  .box.fig { background: #f0f7f8; }
  .box.mem { background: #edf3fc; }
  .box.mem b { color: var(--blue); }
  .box.dropped { background: var(--no-bg); font-family: var(--sans); }
  .box.dropped b { color: var(--trap); }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .src { font-size: 12px; color: var(--faint); }
  .src a { color: var(--blue); text-decoration: none; }
  /* The textbook pages (teacher, 7 October 2026: students must see them clearly). Its own line under a hairline,
     below everything on the card, so it never covers or squeezes the content above it. */
  .bookref { display: flex; flex-wrap: wrap; align-items: center; gap: .3em .4em; padding-top: .5em; border-top: 1px solid var(--line);
             font: 600 13px/1.35 var(--sans); color: var(--navy-soft); }
  .bookref svg { width: 1.3em; height: 1.3em; color: var(--blue); flex: none; margin-right: .1em; }
  .bookref .bk-lab { color: var(--muted); }
  .bookref .bk-p { background: #eaf1fc; border: 1px solid #c3d5f1; color: var(--navy); border-radius: 6px; padding: .04em .5em;
                   font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bookref .bk-nf { border: 1px solid var(--edge); color: var(--muted); border-radius: 999px; padding: .02em .65em; font-weight: 500; margin-left: .25em; }
  .bookref .bk-added { background: var(--blue); color: #fff; border-radius: 999px; padding: .04em .65em; margin-right: .15em; }
  /* The textbook pages of one big card: a tab on the card's top edge, at its right (teacher, 9 October 2026, option B of
     the design board). Beside the title, where every eye starts; the same place in every layout; the top of a big
     screen stays visible from the back of a room. As easy to see as the card: 22px, dark, outlined page chips. */
  .bookref .bk-body { display: contents; }
  .stage.with-tab { flex-direction: column; padding-top: 10px; }
  .stage.with-tab.tight-tab { padding-top: 3px; }
  .stage > .tabrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 12px; flex: none; position: relative; z-index: 2; margin-bottom: -1px; }
  .card-reference { margin-right: auto; padding: 4px 2px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px;
                    font: 600 15px/1.3 var(--sans); color: var(--navy); font-variant-numeric: tabular-nums; }
  .card-number, .card-reference-id { white-space: nowrap; }
  .card-reference-id { font-size: 12px; font-weight: 500; color: var(--muted); }
  .booktab { position: relative; display: flex; align-items: center; gap: .4em; padding: .36em .85em .34em .7em; max-width: 100%;
             background: var(--card); border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0;
             font: 600 22px/1.3 var(--sans); color: var(--ink); white-space: nowrap; }
  .booktab.small { font-size: 18px; } .booktab.smaller { font-size: 15px; }
  .booktab svg { width: 1.35em; height: 1.35em; color: var(--navy); flex: none; }
  .booktab .bk-p { display: inline-block; min-width: 4.3em; box-sizing: border-box; text-align: center; padding: .04em .45em;
                   background: #fff; border: 2px solid var(--navy); border-radius: 8px; color: var(--navy); font-weight: 700;
                   font-variant-numeric: tabular-nums; }
  .booktab .bk-added { background: var(--blue); color: #fff; border-radius: 999px; padding: .1em .65em; font-size: .82em; font-weight: 700; }
  .booktab .bk-nf { border: 1.5px solid var(--muted); color: var(--ink); border-radius: 999px; padding: .04em .65em; font-size: .82em; }
  .booktab .bt-more { font: inherit; font-weight: 700; padding: .02em .5em; border: 2px dashed var(--navy-soft); border-radius: 8px;
                      background: #eef3fb; color: var(--navy); cursor: pointer; }
  .booktab .bt-all { display: none; }
  .booktab.open .bt-all { display: flex; flex-wrap: wrap; gap: .35em .4em; position: absolute; top: 100%; right: -1px; z-index: 5;
                          width: max-content; max-width: min(30em, 92vw); padding: .6em .7em; white-space: normal; background: var(--card);
                          border: 1px solid var(--line); border-radius: 14px 0 14px 14px; box-shadow: 0 12px 28px rgba(27,34,48,.16); }
  .card.big.tabbed { border-top-right-radius: 0; }
  @media (min-width: 1100px) {
    .stage.with-tab > .card.big { flex: 1 1 auto; min-height: 0; }
  }
  details.note { font: 12px/1.45 var(--sans); color: #975a16; }
  details.note summary { cursor: pointer; color: var(--muted); }

  /* ---- Visuals ---- */
  .vis { position: relative; margin: 2px 0; }
  .vis > svg { display: block; width: 100%; height: auto; }  /* only the graph itself, never KaTeX's own svgs */
  .vlab { position: absolute; font-size: 12px; white-space: nowrap; line-height: 1.1; background: rgba(255,255,255,.85); padding: 0 2px; border-radius: 3px; }
  .vlab.bare { background: none; }
  /* Live graphs (teacher, 7 October 2026): one point to drag, or choices to switch; coordinates and images follow. */
  .pstage { position: relative; }
  .pstage > svg { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
  .vis.plot.live.dragging .pstage > svg { cursor: grabbing; }
  .vis.plot.live:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 8px; }
  .knob-halo { fill: var(--blue); opacity: .16; transition: opacity .15s; }
  .vis.plot.live.dragging .knob-halo, .vis.plot.live:focus-visible .knob-halo { opacity: .32; }
  .vis.plot.live.invite .knob-halo { animation: kc-invite 1.5s ease-out 3; transform-box: fill-box; transform-origin: center; }
  @keyframes kc-invite { 0% { transform: scale(.7); opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .vis.plot.live.invite .knob-halo { animation: none; } }
  .livechips { display: flex; flex-wrap: wrap; justify-content: center; gap: .35em; margin: .35em 0 .1em; }
  .livechips button { font: inherit; font-size: .78em; line-height: 1.3; border: 1px solid var(--edge); background: #fff; color: var(--ink);
                      border-radius: 999px; padding: .22em .85em; cursor: pointer; }
  .livechips button:hover { border-color: var(--navy-soft); }
  .livechips button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .livebar { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: .15em .9em; font-size: .74em;
             line-height: 1.4; margin-top: .2em; min-height: 1.4em; }
  .livebar .rd { color: var(--ink); text-align: center; }
  .livebar .hint { display: inline-flex; align-items: center; gap: .35em; color: var(--muted); font-family: var(--sans); font-size: .82em; }
  .livebar .hint svg { width: 1.15em; height: 1.15em; flex: none; color: var(--blue); }
  .vtab { border-collapse: collapse; width: 100%; font-size: 13px; }
  .vtab td, .vtab th { border: 1px solid var(--line); padding: 4px 6px; text-align: center; vertical-align: middle; }
  .vtab th { background: #f1f4f8; font-weight: 600; }
  .vtab.words td:first-child { text-align: center; }

  /* ---- Big card sizing: the content is the main character ---- */
  /* --fit (1 down to about .7) shrinks the whole card together when its content would overflow. */
  .card.big { --fit: 1; font-size: calc(26px * var(--fit)); padding: calc(22px * var(--fit)) calc(36px * var(--fit)) 14px; gap: .55em;
              border-radius: 18px; min-height: 0; overflow: hidden; box-shadow: 0 1px 2px rgba(27,34,48,.05), 0 10px 30px rgba(27,34,48,.06); }
  .with-rail .card.big { font-size: calc(24px * var(--fit)); }
  .card.big.scrolly { overflow-y: auto; }
  .card.big .meta { font-size: 14px; gap: 8px; }
  .card.big .lvl, .card.big .flag { font-size: 13px; padding: 1px 8px; }
  .card.big .crumbs { font-size: max(13px, .6em); }
  .card.big h3 { font-size: 1.24em; line-height: 1.2; }
  .card.big .statement { font-size: 1em; line-height: 1.55; }
  .card.big .cbody { display: flex; flex-direction: column; gap: .6em; }
  .card.big .vis { width: 100%; margin: 0 auto; }
  .card.big .vis.plot { max-width: calc(560px * var(--fit)); }
  .card.big .vis.plot.ck-plot { max-width: calc(380px * var(--fit)); }
  .card.big .vis.figure { max-width: calc(var(--fw, 420px) * var(--fit)); }
  .card.big .vis.table { max-width: 820px; }
  /* A table of short cells (numbers, symbols) sits centred at its own width, not stretched across the card. */
  .card.big .vis.table:has(> .vtab:not(.words)) { width: auto; max-width: 100%; }
  .card.big .vtab:not(.words) { width: auto; min-width: min(100%, 14em); margin: 0 auto; }
  .card.big .vtab:not(.words) td, .card.big .vtab:not(.words) th { padding: .42em 1.05em; }
  /* Spare height on a short card (teacher, 7 October 2026): some above the content and some between the text and its
     visual, set by settleCard(), so the free space is not all left under the content. */
  .card.big .cbody { margin-top: 0; }   /* the content stays under its title (teacher, 9 October 2026) */
  /* A graph label follows the card's text, but never grows past 4.6% of the graph's width (--pw, set by plotEl):
     in portrait the card's text is larger while the graph is not, and labels began to cover one another. */
  .card.big .vlab { font-size: min(.74em, calc(var(--pw, 1000px) * .046)); }
  .card.big .vtab { font-size: .78em; }
  .card.big .vtab td, .card.big .vtab th { padding: .38em .55em; }
  .card.big .exs { grid-template-columns: 1fr; gap: .45em; }
  .card.big .ex, .card.big .box { font-size: .88em; padding: .55em .75em; border-radius: 12px; }
  .card.big .ex .ico { width: 1.15em; height: 1.15em; }
  .card.big .ex b, .card.big .box b { font-size: .78em; margin-bottom: .1em; }
  .card.big .src { font-size: max(12px, .55em); }
  .card.big .bookref { font-size: max(13px, .58em); }
  /* Side by side: on a wide card the text runs on the left and the graph or table sits on the right. */
  .card.big .cbody.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .95fr); column-gap: 1.1em; row-gap: .6em; align-content: start; }
  .card.big .cbody.split > * { grid-column: 1; }
  .card.big .cbody.split > .vis { grid-column: 2; align-self: start; }

  /* ---- Student version: no top panel; everything below is the card and its tree ---- */
  body.student > header, body.student .filters { display: none; }
  /* The teacher's debug switch: small and quiet in the bottom-left corner. */
  .dbg { position: fixed; left: 6px; bottom: calc(8px + env(safe-area-inset-bottom)); width: 24px; height: 24px; padding: 0; border-radius: 50%;
         border: 1px solid var(--line); background: rgba(255,255,255,.75); color: var(--faint); opacity: .5; z-index: 20;
         display: grid; place-items: center; cursor: pointer; }
  .dbg:hover, .dbg:focus-visible { opacity: 1; }
  .dbg.on { background: var(--navy); border-color: var(--navy); color: #fff; opacity: .9; }
  .dbg svg { width: 13px; height: 13px; }
  body.has-dbg .navbar { padding-left: 40px; }
  body.student .stage { padding-top: 16px; }
  body.student .workspace.with-rail { grid-template-columns: 280px minmax(0, 1fr); }
  .workspace.with-rail.rail-closed, body.student .workspace.with-rail.rail-closed { grid-template-columns: 52px minmax(0, 1fr); }
  .railtoggle { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 6px; margin: -4px 0 6px -6px;
                color: var(--muted); cursor: pointer; font-size: 13px; border-radius: 8px; }
  .railtoggle:hover { color: var(--navy); background: rgba(29,43,69,.06); }
  .railtoggle svg { width: 18px; height: 18px; }
  .rail-closed .rail-inner { padding: 14px 6px; display: flex; justify-content: center; }
  .rail-closed .railtoggle { margin: 0; flex-direction: column; padding: 8px 4px; }
  .rail-closed .railtoggle span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 13px; }

  /* Direction-aware arrival: Next slides in from the right, Back from the left. */
  @keyframes inFwd { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: none; } }
  @keyframes inBack { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: none; } }
  .stage > .enter-fwd { animation: inFwd .26s cubic-bezier(.16,1,.3,1); }
  .stage > .enter-back { animation: inBack .26s cubic-bezier(.16,1,.3,1); }
  @media (prefers-reduced-motion: reduce) { .stage > .enter-fwd, .stage > .enter-back { animation: none; } }

  /* ---- Bottom bar ---- */
  .navbar { position: relative; background: rgba(238,241,245,.97); border-top: 1px solid var(--line); z-index: 3;
            display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 14px;
            padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); }
  .navbar .nb-map { min-width: 0; padding: 6px 14px; color: var(--navy); flex-direction: row; gap: 8px; }
  .navbar .nb-map svg { width: 24px; height: 16px; }
  .navbar .nb-map span { font-size: 16px; }
  .navbar .dir { display: inline-flex; align-items: center; gap: 6px; }
  .navbar .dir svg { width: 16px; height: 16px; }
  .navbar .nb-back { min-width: 200px; max-width: 300px; }
  .navbar .nb-next { min-width: 220px; }
  .where { min-width: 0; }
  .where .wt { display: block; color: var(--ink); font: 600 15px/1.25 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .where .ws { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where .prog { height: 4px; border-radius: 2px; background: #dbe1ea; margin-top: 6px; overflow: hidden; }
  .where .prog i { display: block; width: 100%; height: 100%; background: var(--navy-soft); border-radius: 2px; transform-origin: 0 50%;
                   transition: transform .26s cubic-bezier(.16,1,.3,1); }
  .where .prog.path i { background: #d39e00; }
  .navbar button { min-width: 132px; min-height: 54px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--blue);
                   font-size: 18px; font-weight: 600; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 18px; }
  .navbar button:hover:not(:disabled) { border-color: var(--blue); }
  .navbar button.primary { background: var(--blue); border-color: var(--blue); color: #fff; max-width: 380px; }
  .navbar button.primary:hover:not(:disabled) { background: #1f56ae; }
  .navbar button .to { font: 400 14px/1.25 var(--serif); opacity: .92; max-width: min(340px, 100%); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .navbar button:disabled { opacity: .35; cursor: default; }


  /* ---- Overview grid ---- */
  main.overview { padding: 6px 20px 40px; }
  .ki { margin: 26px 0 12px; }
  .ki h2, h2.sec { font-size: 17px; margin: 0; color: var(--navy); }
  h2.sec { margin: 22px 0 10px; }
  .ki p { margin: 4px 0 0; color: var(--muted); font: 15px/1.5 var(--serif); max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .grid .card { cursor: pointer; }
  .grid .card:hover { border-color: var(--blue); }
  .grid .card.isdropped { opacity: .6; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; width: 100%; }

  /* ---- Home: choose a form, then a chapter (teacher, 7 October: concise, ready for the whole S1 to S6 course) ---- */
  .home { width: 100%; max-width: 980px; margin: 0 auto; height: 100%; min-height: 0; display: flex; flex-direction: column;
          gap: 24px; padding: 30px 24px 16px; }
  .home h2 { margin: 0; font: 700 40px/1.1 var(--serif); color: var(--navy); }
  .home .lede { margin: 8px 0 0; font: 18px/1.4 var(--sans); color: var(--muted); }
  .home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
  .subject-link { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 10px 14px;
                  border: 1px solid var(--line); border-radius: 12px; color: var(--blue); background: #fff;
                  font: 600 15px/1.3 var(--sans); text-decoration: none; }
  .subject-link:hover, .subject-link:focus-visible { border-color: var(--blue); outline-offset: 3px; }
  .home.m2-home .forms { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .forms { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .form-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 14px 6px 12px; cursor: pointer;
              background: #fff; color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px;
              transition: border-color .15s, background .15s, color .15s; }
  .form-btn b { font: 700 28px/1 var(--serif); }
  .form-btn small { font: 13px/1.2 var(--sans); color: var(--muted); }
  .form-btn.none b { color: #98a3b3; }
  .form-btn:hover { border-color: var(--navy-soft); }
  .form-btn[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .form-btn[aria-pressed="true"] b { color: #fff; }
  .form-btn[aria-pressed="true"] small { color: #c9d4e8; }
  .chap-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 2px 2px 8px; }
  .chap-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 18px; width: 100%;
              text-align: left; cursor: pointer; background: #fff; border: 1.5px solid var(--line); border-radius: 16px;
              padding: 16px 22px 16px 14px; box-shadow: 0 1px 2px rgba(27,34,48,.05), 0 6px 18px rgba(27,34,48,.05);
              transition: border-color .15s, box-shadow .15s; }
  .chap-row:hover { border-color: var(--navy-soft); box-shadow: 0 1px 2px rgba(27,34,48,.06), 0 8px 22px rgba(27,34,48,.08); }
  .chap-row .num { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--navy); }
  .chap-row .num small { font: 600 12px/1 var(--sans); color: var(--muted); }
  .chap-row .num b { font: 700 32px/1 var(--serif); }
  .chap-row .t { min-width: 0; }
  .chap-row .t b { display: block; font: 700 23px/1.25 var(--serif); color: var(--ink); }
  .chap-row .t span { display: block; margin-top: 5px; font: 15px/1.3 var(--sans); color: var(--muted); }
  .chap-row .prog { font: 600 14px/1.25 var(--sans); color: var(--muted); text-align: right; white-space: nowrap; }
  .chap-row .prog.some { color: var(--ok); }
  .chap-row .hold { display: inline-block; margin-top: 6px; font: 600 12px/1 var(--sans); color: #8a6400; background: #fff3cd;
                    border-radius: 999px; padding: 4px 8px; }
  .home-none { margin: 0; padding: 26px 4px; font: 18px/1.5 var(--sans); color: var(--muted); }
  @media (max-width: 700px) {
    .home { padding: 20px 14px 12px; gap: 18px; }
    .home h2 { font-size: 32px; }
    .home-top { flex-wrap: wrap; gap: 12px; }
    .forms { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .chap-row { grid-template-columns: 48px minmax(0, 1fr); padding: 14px 16px 14px 10px; }
    .chap-row .prog { grid-column: 2; text-align: left; }
  }

  @media (max-width: 1099px) {
    .navbar .nb-back { min-width: 150px; max-width: 220px; }
    .navbar .nb-next { min-width: 170px; max-width: 260px; }
    .stage { flex-direction: column; }
    .stage > .card.big { flex: 0 1 auto; }
  }
  @media (max-width: 700px) {
    header, .filters, .kstrip, .stage, main.overview, .navbar { padding-left: 16px; padding-right: 16px; }
    .seg { margin-left: 0; }
    .card.big { font-size: calc(20px * var(--fit)); padding: 16px 16px 12px; }
    .mapslide h2 { font-size: 26px; }
    .mapslide .lede { font-size: 18px; }
    .navbar { gap: 8px; }
    .navbar .nb-back, .navbar .nb-next { min-width: 120px; }
    .navbar .nb-map span { display: none; }
    .grid { grid-template-columns: 1fr; }
  }
/* Scoped to the quiz: incumbent cards, trees and maps retain their layout. */
.quiz-screen { flex: 1; min-height: 0; width: 100%; max-width: 1040px; margin: 0 auto; padding: 18px 24px 12px; display: flex; flex-direction: column; gap: 14px; }
.quiz-screen h2 { margin: 0; color: var(--navy); font: 700 34px/1.2 var(--serif); }
.quiz-screen h2:focus { outline: none; }
.quiz-screen h3 { margin: 26px 0 12px; font: 700 25px/1.25 var(--serif); }
.qz-top, .qz-footer, .qz-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.qz-top { flex: none; }
.qz-button, .qz-primary { min-height: 44px; padding: 9px 16px; border: 1px solid var(--edge); border-radius: 8px; background: white; color: var(--navy); cursor: pointer; }
.qz-primary { background: var(--navy); border-color: var(--navy); color: white; font-weight: 600; }
.qz-button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
.qz-primary:hover:not(:disabled) { background: var(--navy-soft); }
.qz-primary:disabled { opacity: .5; cursor: default; }
.qz-scroll { position: relative; min-height: 0; flex: 1 1 0; overflow-y: auto; overflow-x: hidden; padding: 0 4px 10px 0; }
.qz-scroll > p { margin: 0 0 12px; }
.qz-lede { font-size: 18px; max-width: 70ch; }
.qz-muted { color: var(--muted); font-size: 15px; }
.qz-chapter { margin: 24px 0 12px; padding: 14px 0 0; border: 0; border-top: 1px solid var(--line); min-width: 0; }
.qz-chapter legend { padding: 0 12px 0 0; max-width: 100%; font-weight: 600; }
.qz-chapter legend label { display: flex; align-items: center; gap: 10px; }
.quiz-screen input { width: 20px; height: 20px; flex: none; accent-color: var(--navy); }
.quiz-screen input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.qz-topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
.qz-topic { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; min-height: 52px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.qz-topic small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.qz-topic span { min-width: 0; }
.qz-footer { flex: none; border-top: 1px solid var(--line); padding: 12px 0 0; }
.qz-footer p { margin: 0; }

<script>
const DATA = [{"key":"ch3","label":"Ch3 More about Graphs of Functions","pageDir":"../S5 Ch3 pages/","form":"S5","book":"5A","number":3,"title":"More about Graphs of Functions","pageExt":".jpg","origin":"merged","cards":[{"id":"S5C3-001","section":"Opener","sectionTitle":"More about Graphs of Functions","kind":"link","title":"Graphs can be reflected like mirror images","statement":"Reflection (mirror) images are common in daily life. In mathematics, the graph of a function can also be reflected with respect to a straight line in a rectangular coordinate plane.","example":"The opening Q&A asks students to sketch the image of a line segment $AB$ after it is reflected with respect to the $y$-axis.","figure":"A line segment $AB$ lies above the $x$-axis, rising from $A$ (left of the $y$-axis) to $B$ (right of the $y$-axis). In the teacher's edition the image is drawn in magenta: the mirror segment, sloping the opposite way and crossing $AB$ at a point on the $y$-axis.","sources":[{"page":"Page001","printed":"3.1","where":"main text"},{"page":"Page001","printed":"3.1","where":"Q&A"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-10","level":"extra","hidden":true,"hiddenWhy":"Chapter-opener motivation, not a knowledge point to revise."},{"id":"S5C3-002","section":"Opener","sectionTitle":"More about Graphs of Functions","kind":"notation","title":"Scissors symbol marks Non-foundation content","statement":"The scissors symbol ✂ marks Non-foundation content. In this chapter it marks exponential functions, logarithmic functions and the whole of §3.4 Transformations of Functions. It also appears beside some single examples and exercise items, such as Example 4(b) on an exponential equation.","sources":[{"page":"Page001","printed":"3.1","where":"main text"},{"page":"Page007","printed":"3.7","where":"margin note"},{"page":"Page035","printed":"3.35","where":"margin note"},{"page":"Page093","printed":"T3.92a","where":"teacher note"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"inferred":"The meaning of the symbol is stated in words only in the teacher's Chapter Highlight (T3.92a). The student pages show it by printing a vertical 'Non-foundation' bar beside the scissors, as on P.3.7 and P.3.35, so the card is not teacher-only. The list of marked items comes from our check of the pages.","keyIdea":"K3-1","level":"extra","hidden":true,"hiddenWhy":"A convention of the book's printing, not a knowledge point."},{"id":"S5C3-003","section":"3.0 A","sectionTitle":"Review","kind":"definition","title":"Function, independent and dependent variable","statement":"Suppose the ranges of values of two variables $x$ and $y$ are known. If each value of $x$ has one (and ==only== one) corresponding value of $y$, then $y$ is a function of $x$. Here $x$ is called the independent variable and $y$ is called the dependent variable.","sources":[{"page":"Page002","printed":"3.2","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Background from earlier work (the 3.0 review of Book 4 and junior forms), not new knowledge here."},{"id":"S5C3-004","section":"3.0 A","sectionTitle":"Review","kind":"definition","title":"Domain of a function","statement":"The range of values of $x$ (the independent variable) is called the domain of the function.","sources":[{"page":"Page002","printed":"3.2","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Background from earlier work (the 3.0 review of Book 4 and junior forms), not new knowledge here."},{"id":"S5C3-005","section":"3.0 A","sectionTitle":"Review","kind":"definition","title":"Co-domain of a function","statement":"The range of values of $y$ (the dependent variable) is called the co-domain of the function.","sources":[{"page":"Page002","printed":"3.2","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"inferred":"Kept as the book words it on P.3.2. In wider mathematical usage the set of values that y actually takes is usually called the range, and the co-domain is a set that contains it. The teacher may wish to be aware of this.","keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Background from earlier work (the 3.0 review of Book 4 and junior forms), not new knowledge here."},{"id":"S5C3-006","section":"3.0 A","sectionTitle":"Review","kind":"notation","title":"Values of a function $f(x)$","statement":"Substituting a value of $x$ into a function $f(x)$ gives the corresponding value of the function. An expression such as $m+1$ or $3x$ can be substituted for $x$ in the same way as a number.","example":"If $f(x)=2x^2-3$, then $f(2)=2(2)^2-3=5$, $f(m+1)=2(m+1)^2-3=2m^2+4m-1$, and $f(3x)+4=[2(3x)^2-3]+4=18x^2+1$. In the last one, $3x$ is put into $f$ first and then 4 is added.","sources":[{"page":"Page002","printed":"3.2","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Background from earlier work (the 3.0 review of Book 4 and junior forms), not new knowledge here."},{"id":"S5C3-007","section":"3.0 B","sectionTitle":"Review","kind":"property","title":"Translating a point left or right","statement":"When a point $P(x, y)$ is translated $n$ units to the right, its image is $(x+n, y)$. When it is translated $n$ units to the left, its image is $(x-n, y)$. The $y$-coordinate does not change.","sources":[{"page":"Page003","printed":"3.3","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-9","level":"supporting","hidden":true,"hiddenWhy":"Junior-form transformation of a point; kept for the drill guide's recall line."},{"id":"S5C3-008","section":"3.0 B","sectionTitle":"Review","kind":"property","title":"Translating a point up or down","statement":"When a point $P(x, y)$ is translated $n$ units upwards, its image is $(x, y+n)$. When it is translated $n$ units downwards, its image is $(x, y-n)$. The $x$-coordinate does not change.","sources":[{"page":"Page003","printed":"3.3","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-9","level":"supporting","hidden":true,"hiddenWhy":"Junior-form transformation of a point; kept for the drill guide's recall line."},{"id":"S5C3-009","section":"3.0 B","sectionTitle":"Review","kind":"property","title":"Reflecting a point with respect to the $x$-axis","statement":"When a point $P(x, y)$ is reflected with respect to the $x$-axis, its image is $(x, -y)$. The point and its image are both $y$ units from the $x$-axis, on opposite sides of it.","figure":"Point $P(x, y)$ above the $x$-axis and its image $(x, -y)$ directly below it, with braces marking $y$ units on each side of the $x$-axis.","sources":[{"page":"Page003","printed":"3.3","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-10","level":"supporting","hidden":true,"hiddenWhy":"Junior-form transformation of a point; kept for the drill guide's recall line."},{"id":"S5C3-010","section":"3.0 B","sectionTitle":"Review","kind":"property","title":"Reflecting a point with respect to the $y$-axis","statement":"When a point $P(x, y)$ is reflected with respect to the $y$-axis, its image is $(-x, y)$. The point and its image are both $x$ units from the $y$-axis, on opposite sides of it.","figure":"Point $P(x, y)$ to the right of the $y$-axis and its image $(-x, y)$ at the same height on the left, with braces marking $x$ units on each side of the $y$-axis.","sources":[{"page":"Page003","printed":"3.3","where":"review"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-10","level":"supporting","hidden":true,"hiddenWhy":"Junior-form transformation of a point; kept for the drill guide's recall line."},{"id":"S5C3-011","section":"3.1","sectionTitle":"Common Functions and Their Graphs","kind":"link","title":"Six common functions from Books 4A, 4B","statement":"Constant functions, linear functions, quadratic functions, trigonometric functions, exponential functions and logarithmic functions were learnt in Books 4A and 4B. Section 3.1 reviews and compares these functions and their graphs, and sketches the graphs from their features.","sources":[{"page":"Page005","printed":"3.5","where":"main text"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"A signpost to section 3.1, not a knowledge point."},{"id":"S5C3-012","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"definition","title":"Constant function","statement":"A **constant function** is a function of the form $f(x) = c$ or $y = c$, where $c$ is a constant.","sources":[{"page":"Page005","printed":"3.5","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-1","level":"core","term":"constant function","positive":{"example":"$y = 5$","why":"It has the form $y = c$: every $x$ gives the same value, 5.","source":"authored"},"negative":{"example":"$x = 5$","why":"It is a vertical line, not of the form $y = c$.","source":"authored"},"check":{"pages":["3.5","3.66"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass"},"parent":"S5C3-043","role":"extends","short":"Constant function $y = c$","treeOrder":2},{"id":"S5C3-013","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"graph-feature","title":"Graph of y = c","statement":"The graph of $y=c$ is a horizontal line with $y$-intercept $c$. When $c>0$ the line lies above the $x$-axis; when $c<0$ it lies below the $x$-axis.","example":"$y=2$ is a horizontal line through $(0, 2)$; $y=-4$ is a horizontal line through $(0, -4)$.","figure":"Two panels: the line $y=2$ drawn horizontally above the $x$-axis, cutting the $y$-axis at 2; the line $y=-4$ drawn horizontally below the $x$-axis, cutting the $y$-axis at $-4$.","sources":[{"page":"Page005","printed":"3.5","where":"main text"},{"page":"Page008","printed":"3.8","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Junior-form graph basics of y = c and y = mx + c; the comparison cards carry what matters here."},{"id":"S5C3-014","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"definition","title":"Linear function","statement":"A **linear function** is a function of the form $f(x) = mx + c$ or $y = mx + c$, where $m$ and $c$ are constants and ==$m \\neq 0$==.","sources":[{"page":"Page005","printed":"3.5","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-1","level":"core","term":"linear function","positive":{"example":"$y = 2x + 3$","why":"It has the form $y = mx + c$ with $m = 2$, which is not 0.","source":"authored"},"negative":{"example":"$y = 3$","why":"Here $m = 0$, so it is a constant function.","source":"authored"},"check":{"pages":["3.5","3.66"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass","markers":"2026-10-07"},"parent":"S5C3-043","role":"extends","short":"Linear $y = mx + c$, $m \\neq 0$","treeOrder":4},{"id":"S5C3-015","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"condition","title":"$m = 0$ gives a constant function","statement":"When $m = 0$, $y = mx + c$ becomes $y = c$: a constant function, whose graph is a horizontal line.","sources":[{"page":"Page005","printed":"3.5","where":"teacher note"}],"teacherOnly":true,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-1","level":"core","check":{"pages":["3.5"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass","markers":"2026-10-07","enrich":"2026-10-09","enrichNotes":""},"parent":"S5C3-014","role":"warning","short":"$m = 0$: a constant function","treeOrder":5},{"id":"S5C3-016","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"graph-feature","title":"Graph of y = mx + c","statement":"The graph of $y=mx+c$ is a straight line with slope $m$ and $y$-intercept $c$.","example":"$y=2x+1$ has $y$-intercept 1 and $x$-intercept $-\\frac{1}{2}$. $y=-x+2$ has $y$-intercept 2 and $x$-intercept 2.","figure":"$y=2x+1$: a line rising from lower left to upper right, crossing the $x$-axis at $-\\frac{1}{2}$ and the $y$-axis at 1. $y=-x+2$: a line falling from upper left to lower right, crossing the $y$-axis at 2 and the $x$-axis at 2.","sources":[{"page":"Page005","printed":"3.5","where":"main text"},{"page":"Page008","printed":"3.8","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Junior-form graph basics of y = c and y = mx + c; the comparison cards carry what matters here."},{"id":"S5C3-017","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"graph-feature","title":"Sign of the slope of a line","statement":"When $m>0$, the graph of $y=mx+c$ ascends from left to right. When $m<0$, the graph of $y=mx+c$ descends from left to right.","example":"$y=2x+1$ ($m>0$) ascends; $y=-x+2$ ($m<0$) descends.","sources":[{"page":"Page005","printed":"3.5","where":"main text"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-1","level":"supporting","hidden":true,"hiddenWhy":"Junior-form graph basics of y = c and y = mx + c; the comparison cards carry what matters here."},{"id":"S5C3-018","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"definition","title":"Quadratic function","statement":"A **quadratic function** is a function of the form $f(x) = ax^2 + bx + c$ or $y = ax^2 + bx + c$, where $a$, $b$ and $c$ are constants and ==$a \\neq 0$==.","sources":[{"page":"Page006","printed":"3.6","where":"main text"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"keyIdea":"K3-2","level":"core","check":{"pages":["3.6"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass","markers":"2026-10-07"},"example":"$y = 2x^2 - 3x + 1$, where $a = 2$, $b = -3$ and $c = 1$.","parent":null,"role":null,"short":"Quadratic $y = ax^2 + bx + c$, $a \\neq 0$","treeOrder":7},{"id":"S5C3-019","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"property","title":"Writing a quadratic as $a(x - h)^2 + k$","statement":"$y = ax^2 + bx + c$ can be rewritten as $y = a(x - h)^2 + k$, where $h = -\\frac{b}{2a}$ and $k = c - \\frac{b^2}{4a}$.","example":"$y = 2x^2 + 16x + 35$ is $y = 2(x + 4)^2 + 3$.","sources":[{"page":"Page006","printed":"3.6","where":"main text"},{"page":"Page006","printed":"3.6","where":"margin note"},{"page":"Page011","printed":"3.11","where":"exercise"},{"page":"Page014","printed":"3.14","where":"exercise"}],"teacherOnly":false,"nonFoundation":false,"inSummary":false,"inferred":"P.3.6 gives only the formulas for h and k and carries no Non-foundation mark. The items that ask for this form 'by the method of completing the square' (Exercise 3A Q22(a) and Q23(b)), and Class Practice 3.1 Q3 (express y = x^2 - 4x in this form), each carry the scissors mark. The card is kept foundation because the book does not mark the statement itself.","keyIdea":"K3-2","level":"supporting","check":{"pages":["3.11","3.14","3.6"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass"},"parent":"S5C3-018","role":"notation","short":"The form $a(x - h)^2 + k$","treeOrder":8},{"id":"S5C3-020","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"graph-feature","title":"Vertex and axis of symmetry","statement":"For a quadratic function (==$a \\neq 0$==), the graph of $y = a(x - h)^2 + k$ is a parabola with vertex $(h, k)$. Its axis of symmetry is the vertical line $x = h$, which passes through the vertex.","example":"$y = -3(x + 1)^2 - 1$ has $h = -1$ and $k = -1$: vertex $(-1, -1)$, axis of symmetry $x = -1$.","sources":[{"page":"Page006","printed":"3.6","where":"main text"},{"page":"Page008","printed":"3.8","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-2","level":"core","visual":{"type":"plot","x":[-0.6,4.6],"y":[-2,4],"curves":[{"f":"f(x)","style":"main","dom":[-0.1,4.1],"label":"$y = (x - 2)^2 - 1$","lx":2,"ly":3.25,"pos":"above"}],"points":[{"x":2,"y":-1,"on":0},{"x":"4-t","y":"f(t)","label":"$P'$","pos":"=t >= 1 ? 'above-left' : 'right'","show":"t < 2","on":0}],"segments":[{"x1":2,"y1":-2,"x2":2,"y2":3.2,"style":"dashed"},{"x1":"t","y1":"f(t)","x2":"4-t","y2":"f(t)","style":"dashed","show":"t < 2"}],"texts":[{"x":2,"y":2.3,"tex":"$x = 2$","pos":"right"},{"x":2,"y":-1,"tex":"vertex $(2, -1)$","pos":"below-right"}],"live":{"t":0.5,"handle":{"x":"t","y":"f(t)","label":"$P$","pos":"=t >= 1 ? 'above-right' : 'left'","on":0},"hint":"Drag $P$ along the graph","snap":[0,0.5,1,2],"readout":"[[t === 2 ? \"$P(2, -1)$ is the vertex: it lies on the axis of symmetry $x = 2$, so it is its own mirror image\" : \"$P(\" + N(t) + \", \" + N(f(t)) + \")$ and $P'(\" + N(4 - t) + \", \" + N(f(t)) + \")$ are mirror images in $x = 2$\"]]","fns":{"f":"(x-2)*(x-2)-1"}}},"check":{"pages":["3.6","3.66","3.8"],"date":"2026-10-07","result":"fixed","notes":"(condition) The card stands alone, so '$y = a(x - h)^2 + k$ is a parabola' loses the book's context $a \\neq 0$ (the sentence follows the quadratic definition on P.3.6). With $a = 0$ the graph is a horizontal line, not a parabola.","final":"pass","markers":"2026-10-07","enrich":"2026-10-09 (after fix)","enrichNotes":"(graph, every t) The top-left end of the parabola runs through the axis letter y. Fix: dom [-0.1, 4.1] on the curve. It then ends at $(-0.1, 3.41)$, below the letter, and P at t = 0, $(0, 3)$, is still on it.; (graph, every t) The text 'vertex $(2, -1)$' (pos below) is printed across the dashed axis of symmetry $x = 2$, the line the card is about. Fix: pos \"below-right\".; Both fixes were checked on the current graph (label above at (2, 3.25), snap [0, 0.5, 1, 2], changed while I checked) by rendering every t: all labels, points and lines are clear. Text passes. The example is the book's own fi"},"parent":"S5C3-019","role":"graph","short":"Vertex and axis of symmetry","treeOrder":9},{"id":"S5C3-021","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"graph-feature","title":"Which way a parabola opens","statement":"When $a > 0$, the graph of $y = a(x - h)^2 + k$ opens upwards. When $a < 0$, it opens downwards.","example":"$y = (x - 2)^2 - 1$ opens upwards; $y = -3(x + 1)^2 - 1$ opens downwards.","sources":[{"page":"Page006","printed":"3.6","where":"main text"},{"page":"Page008","printed":"3.8","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-2","level":"core","visual":{"type":"plot","x":[-3.4,4.6],"y":[-5,4],"curves":[{"f":"(x-2)*(x-2)-1","style":"main","label":"$a > 0$","lx":3.6,"ly":1.56,"pos":"right"},{"f":"-3*(x+1)*(x+1)-1","style":"main","label":"$a < 0$","lx":-2.1,"ly":-4.63,"pos":"left"}]},"check":{"pages":["3.6","3.66","3.8"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass"},"parent":"S5C3-019","role":"graph","short":"Opens upwards or downwards","treeOrder":10},{"id":"S5C3-022","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"property","title":"Quadratic function: maximum or minimum value","statement":"The domain of a quadratic function is all real numbers. For $y = a(x - h)^2 + k$, $k$ is the minimum value when $a > 0$ and the maximum value when $a < 0$.","example":"$y = (x - 2)^2 - 1$ has minimum value $-1$; $y = -3(x + 1)^2 - 1$ has maximum value $-1$.","sources":[{"page":"Page006","printed":"3.6","where":"main text"},{"page":"Page008","printed":"3.8","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-2","level":"core","check":{"pages":["3.6","3.66","3.8"],"date":"2026-10-07","result":"equivalent","notes":"","final":"pass"},"parent":"S5C3-019","role":"property","short":"Minimum or maximum value $k$","treeOrder":11},{"id":"S5C3-023","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"definition","title":"Three trigonometric functions","statement":"The sine function $f(x) = \\sin x$, the cosine function $f(x) = \\cos x$ and the tangent function $f(x) = \\tan x$ are **three basic trigonometric functions**. They are periodic functions.","sources":[{"page":"Page006","printed":"3.6","where":"main text"},{"page":"Page066","printed":"3.66","where":"summary"}],"teacherOnly":false,"nonFoundation":false,"inSummary":true,"keyIdea":"K3-3","level":"core","check":{"pages":["3.6","3.66"],"date":"2026-10-07","result":"fixed","notes":"(term) The bold term is dropped. The book says these are 'three basic trigonometric functions', and then that they are periodic; the card says only that sine, cosine and tangent are periodic, so the term 'trigonometric functions' appears only in the title.","final":"pass"},"example":"$\\sin 30^\\circ = \\sin 390^\\circ = 0.5$: the values of $\\sin x$ repeat every $360^\\circ$.","parent":null,"role":null,"short":"Sine, cosine and tangent","treeOrder":12},{"id":"S5C3-024","section":"3.1 A","sectionTitle":"Common Functions and Their Graphs","kind":"graph-feature","title":"Graph of $y = \\sin x$","statement":"The graph of $y = \\sin x$ repeats once in every $360^\\circ$, so its period is $360^\\circ$. Its domain is all angles, its maximum value is 1 and its minimum value is $-1$.","sources":[{"page":"Page006","printed":"3.6","wh
