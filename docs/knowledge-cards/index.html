hich fits a combination just as well ('taken $r$ at a time' is also the combination phrase, P.5.28). The card is about arranging the $r$ objects. It also drops 'distinct'.","final":"fixed","confirmed":"2026-10-08 (after fix)"},"inferred":"The example puts the numbers of Example 7, $P^6_4 = 6 \\times 5 \\times 4 \\times 3 = 360$ (P.5.17), into the book's setting of friends selected and then arranged in a row (P.5.16); the 6 friends are ours.","parent":null,"role":null,"short":"$P^n_r=n$ $(n-1)$ $\\cdots$ $(n-r+1)$","treeOrder":25},{"id":"S5C5-035","section":"5.2 B","sectionTitle":"Concept of Permutation","kind":"condition","title":"$r \\leqslant n$ in $P^n_r$","statement":"You can arrange at most $n$ objects from a set of $n$ distinct objects without repetition, so $r \\leqslant n$ in $P^n_r$.","sources":[{"page":"Page16","printed":"5.16","where":"main text"},{"page":"Page17","printed":"5.17","where":"definition box"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book writes '$r$ friends ($r \\leqslant n$) are selected' among $n$ friends; the word 'because' is mine.","keyIdea":"K5-5","level":"core","example":"From 5 friends, you can choose at most 5 to arrange in a row, so $r \\leqslant 5$.","check":{"pages":["5.16","5.17"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-034","role":"condition","short":"$r \\leqslant n$ in $P^n_r$","treeOrder":27},{"id":"S5C5-036","section":"5.2 B","sectionTitle":"Concept of Permutation","kind":"notation","title":"Other ways to write $P^n_r$","statement":"We write $P^n_r$ for the number of permutations of $n$ distinct objects taken $r$ at a time without repetition, where $r \\leqslant n$. The same number can be written ${}^nP_r$ or ${}_nP_r$.","sources":[{"page":"Page17","printed":"5.17","where":"main text"},{"page":"Page17","printed":"5.17","where":"margin note"},{"page":"Page42","printed":"5.42","where":"summary"}],"teacherOnly":false,"nonFoundation":true,"inSummary":true,"keyIdea":"K5-5","level":"core","example":"$P^9_4$ is the number of permutations of 9 distinct objects taken 4 at a time.","check":{"pages":["5.17","5.42"],"date":"2026-10-08","result":"fixed","notes":"(condition) drops 'without repetition' and '($r \\leqslant n$)' from the book's description of $P^n_r$; (modality) drops 'usually' ('usually denoted by'), which is what makes the other forms in the second sentence fit","final":"pass"},"parent":"S5C5-034","role":"notation","short":"Written $P^n_r$, ${}^nP_r$ or ${}_nP_r$","treeOrder":26},{"id":"S5C5-037","section":"5.2 B","sectionTitle":"Concept of Permutation","kind":"method-idea","title":"From the product to factorials","statement":"Start with the $r$ descending factors $n\\times(n-1)\\times(n-2)$ ${}\\times\\cdots\\times(n-r+1)$. Multiplying by $\\frac{(n-r)!}{(n-r)!}=1$ completes the numerator to $n!$ by counting the orders of the $n-r$ objects left, so $P^n_r=\\frac{n!}{(n-r)!}$.","sources":[{"page":"Page17","printed":"5.17","where":"main text"},{"page":"Page17","printed":"5.17","where":"margin note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"keyIdea":"K5-5","level":"supporting","example":"Arrange 4 of 6 distinct objects in a row. $$\\begin{aligned}P^6_4&=6\\times5\\times4\\times3\\\\&=\\frac{6\\times5\\times4\\times3\\times2!}{2!}\\\\&=\\frac{6!}{2!}=360\\end{aligned}$$","check":{"pages":["5.17"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass","enrich":"2026-10-08","enrichNotes":""},"parent":"S5C5-034","role":"method","short":"Complete the product to $n!$","treeOrder":28},{"id":"S5C5-038","section":"5.2 B","sectionTitle":"Concept of Permutation","kind":"property","title":"Factorial formula for $P^n_r$","statement":"To count arrangements of $r$ of $n$ distinct objects without repetition, use $P^n_r=\\frac{n!}{(n-r)!}$, where $1\\leqslant r\\leqslant n$.","example":"Choose 4 of 6 different photos and display them in a row. In $P^6_4=\\frac{6!}{2!}$, cancel $2!$ to get $6 inted answers: for example, 4 320 for Q24(c), 'not all male speakers give speeches successively', equals $7! - 3! \\times 5!$, the 'not all next to each other' count.","keyIdea":"K5-8","level":"supporting","visual":{"type":"table","head":"row","rows":[["Words in the question","Meaning"],["Put together","Next to each other"],["Give speeches successively","Speak in consecutive positions"],["A female speaker is not immediately followed by another female speaker","No two female speakers speak in succession"],["Books stacked up","Books arranged one above another"]],"words":true},"check":{"pages":["5.26","5.27"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-053","role":"wording","short":"Wording for arrangement restrictions","treeOrder":50,"cluster":"Next to each other"},{"id":"S5C5-063","section":"5.2 C","sectionTitle":"Problems on Permutations under Different Restrictions","kind":"method-idea","title":"Which orders are allowed within a unit?","statement":"Count ==only== the orders inside the unit that the restriction allows. If a unit contains two people and one must be to the right of the other, there is just 1 order for that unit.","sources":[{"page":"Page27","printed":"5.27","where":"exercise"},{"page":"Page49","printed":"5.51","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book tests this in an exercise but does not state it in the text. The exercises are Ex 5B Q28(a) on P.5.27 (printed answer 120 $= 5!$) and Exam-type Question 5 on P.5.51 (three people next to each other with one particular person in the middle; printed answer 48 $= 4! \\times 2$). The text always multiplies by all the arrangements inside the unit (Examples 12 and 13).","keyIdea":"K5-8","level":"supporting","example":"Joey, May and Jess stand together in a row with 3 friends, with Jess in the middle of the three. Arrange the block and the 3 friends in $4!$ ways. Joey and May can take either order around Jess, giving $4!\\times2=48$ rows.","check":{"pages":["5.27","5.51"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass","markers":"2026-10-08"},"parent":"S5C5-053","role":"condition","short":"Inside a unit: allowed orders only","treeOrder":48,"cluster":"Next to each other"},{"id":"S5C5-064","section":"5.2 C","sectionTitle":"Problems on Permutations under Different Restrictions","kind":"method-idea","title":"Two restrictions that can both hold","statement":"To count arrangements that meet at least one of two restrictions, add the two counts and subtract the count that meets both. To count arrangements that meet neither, subtract the result from the total.","sources":[{"page":"Page27","printed":"5.27","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book tests this in an exercise but does not state it in the text. The exercise is Ex 5B Q28(b) and (c) on P.5.27 (printed answers 216 $= 5! + 5! - 4!$ and 504 $= 6! - 216$). The text subtracts an overlap only in Example 2 (P.5.4) and states no general rule (see the addition rule cards); this wording is ours, read from the printed answers, and the teacher may want to check it together with the addition rule ruling.","keyIdea":"K5-7","level":"supporting","example":"Elim and Flora sit with 4 friends in a row. There are $5! + 5! - 4! = 216$ ways for Elim to sit at the right end or Flora to sit at the left end, including when both do. There are $6! - 216 = 504$ ways for neither to sit at the specified end.","check":{"pages":["5.27"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-048","role":"method","short":"Add, then subtract the overlap","treeOrder":46},{"id":"S5C5-065","section":"5.2 C","sectionTitle":"Problems on Permutations under Different Restrictions","kind":"method-idea","title":"Which group goes first when alternating?","statement":"If one group has one more member, an alternating row must begin and end with that group. For equal-sized groups, either can start, so count both starting orders.","sources":[{"page":"Page27","printed":"5.27","where":"exercise"},{"page":"Page44","printed":"5.46","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book tests this in an exercise but does not state it in the text. The exercises are Ex 5B Q25(c) on P.5.27 (4 boys and 5 girls; printed answer 2 880 $= 5! \\times 4!$) and Supplementary Exercise 5 Q19(a) on P.5.46 (4 male and 4 female judges; printed answer 1 152 $= 2 \\times 4! \\times 4!$). The table of restrictions (row (g), P.5.23) shows only 4 girls with 3 boys.","keyIdea":"K5-7","level":"supporting","visual":{"type":"table","head":"row","rows":[["People to arrange","Alternating pattern","Ways to arrange the row"],["5 girls (G), 4 boys (B)","GBGBGBGBG","$5!\\times4!=2\\,880$"],["4 male (M), 4 female (F) judges","MFMFMFMF or FMFMFMFM","$2\\times4!\\times4!=1\\,152$"]],"words":true},"check":{"pages":["5.27","5.46"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-059","role":"extends","short":"Who can go first?","treeOrder":45},{"id":"S5C5-066","section":"5.3","sectionTitle":"Combination","kind":"condition","title":"Not required: identical objects or repetitions","statement":"Solving problems involving combination of identical objects, or of distinct objects with repetitions, is not required in the curriculum.","sources":[{"page":"Page28","printed":"5.28","where":"teacher note"}],"teacherOnly":true,"nonFoundation":true,"inSummary":false,"inferred":"Teacher note N8 (magenta), beside the 5.3 heading on P.5.28. The student text says the same in the margin of P.5.14: 'In this chapter, we only discuss distinct objects taken without repetition.'","keyIdea":"K5-9","level":"extra","hidden":true,"hiddenWhy":"A teacher-only scope note (identical objects and repetitions are not required)."},{"id":"S5C5-067","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"definition","title":"What is a combination?","statement":"A **combination** is a selection of objects regardless of the order in which they are picked. Choosing the same objects in a different order gives the same combination.","example":"From yellow (Y), green (G), red (R) and blue (B), choosing yellow and green in either order gives $\\{Y,G\\}$.","sources":[{"page":"Page28","printed":"5.28","where":"main text"},{"page":"Page42","printed":"5.42","where":"summary"}],"teacherOnly":false,"nonFoundation":true,"inSummary":true,"inferred":"The second sentence restates the book's remark that the 2 permutations in each case 'can be regarded as the same selection' (P.5.28). The summary (P.5.42) adds: 'The order of objects is not important in combination.'","keyIdea":"K5-9","level":"core","term":"combination","positive":{"example":"Choosing 2 members of a committee from 6 people","why":"The same 2 people in either order make the same committee.","source":"authored"},"negative":{"example":"Choosing a president and a vice president from 6 people","why":"Swapping the two people changes who holds each role, so the choice is a permutation.","source":"authored (adapted from Quick Quiz 5.2 No. 5, P.5.33, which has 8 people)"},"check":{"pages":["5.28","5.42"],"date":"2026-10-08","result":"equivalent","notes":" | final: Authored pair checked: the positive (2 committee members from 6 people) truly is a selection regardless of order, and the negative (a president and a vice president from 6 people) truly fails it. Both are correct.; (unmarked) The negative's source says 'book (exercise, 5.3 C)', but the book's item is Quick Quiz 5.2 No. 5 (P.5.33) with 8 people, not 6, and it is a quiz, not an exercise. Mark it as adapted.","final":"fixed","confirmed":"2026-10-08"},"parent":null,"role":null,"short":"Combination: selection regardless of order","treeOrder":54},{"id":"S5C5-068","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"method-idea","title":"Permutation or combination: does order matter?","statement":"A different order gives a different permutation. If only the objects chosen matter, every order of the same objects gives the same combination.","example":"There are $P^{12}_3=1\\,320$ ways to choose 3 of 12 boy scouts and arrange them in a row, and $C^{12}_3=220$ ways to choose 3 of them for a group.","sources":[{"page":"Page28","printed":"5.28","where":"margin note"},{"page":"Page28","printed":"5.28","where":"main text"},{"page":"Page33","printed":"5.33","where":"main text"},{"page":"Page33","printed":"5.33","where":"exercise"},{"page":"Page42","printed":"5.42","where":"summary"},{"page":"Page43","printed":"5.43","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":true,"inferred":"The second sentence of the statement is our wording of the two summary notes and Fig. 3. Section 5.3 C opens with practice in telling the two apart (Quick Quiz 5.2, P.5.33), and the Checkpoint Nos. 5 to 10 (P.5.43) repeat it.","keyIdea":"K5-9","level":"core","check":{"pages":["5.28","5.33","5.42","5.43"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass","markers":"2026-10-08"},"parent":"S5C5-067","role":"contrast","short":"Permutation or combination?","treeOrder":62},{"id":"S5C5-069","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"notation","title":"Writing a combination and an arrangement","statement":"Use braces for an unordered selection, such as $\\{Y,G\\}$ for yellow and green. An arrangement is written in order, so $YG$ and $GY$ are different permutations.","sources":[{"page":"Page28","printed":"5.28","where":"margin note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"keyIdea":"K5-9","level":"supporting","example":"Kenny and Fanny choose different phone colours. In $YG$, Kenny chooses yellow and Fanny chooses green. In $GY$, Kenny chooses green and Fanny chooses yellow.","check":{"pages":["5.28"],"date":"2026-10-08","result":"fixed","notes":"(context) Kenny and Fanny appear with no introduction; the card never says they are the two buyers, each selecting one phone colour, so 'Kenny selects yellow' has no setting. The fix moves their setting into an example line. | final: (modality) 'A combination is written in braces' and 'A permutation is written as letters in order' state a required notation. The book shows these as ways of writing in one example: 'We can simply write ABC to represent such arrangement' (P.5.14), and the braces appear only in the colour example (Fig. 3, P.5.28; table, P.5.29). Use 'can be written'.","final":"fixed","confirmed":"2026-10-08"},"parent":"S5C5-068","role":"notation","short":"$\\{Y, G\\}$ versus $YG$","treeOrder":63},{"id":"S5C5-070","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"notation","title":"The notation $C^n_r$","statement":"We write $C^n_r$ for the number of ways to select $r$ of $n$ distinct objects without repetition, regardless of order. The number available, $n$, is above the number chosen, $r$.","sources":[{"page":"Page28","printed":"5.28","where":"main text"},{"page":"Page42","printed":"5.42","where":"summary"}],"teacherOnly":false,"nonFoundation":true,"inSummary":true,"keyIdea":"K5-9","level":"core","example":"There are $C^4_2 = 6$ ways to choose 2 of the 4 colours yellow, green, red and blue.","check":{"pages":["5.28","5.42"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-067","role":"notation","short":"Written $C^n_r$","treeOrder":55},{"id":"S5C5-071","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"notation","title":"Other ways to write $C^n_r$","statement":"$C^n_r$ can also be written as ${}^nC_r$, ${}_nC_r$ or $\\binom{n}{r}$.","sources":[{"page":"Page28","printed":"5.28","where":"margin note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"keyIdea":"K5-9","level":"supporting","example":"$C^8_3$, ${}^8C_3$, ${}_8C_3$ and $\\binom{8}{3}$ all stand for the same number, 56.","check":{"pages":["5.28"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-070","role":"notation","short":"${}^nC_r$, ${}_nC_r$ or $\\binom{n}{r}$","treeOrder":56},{"id":"S5C5-072","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"link","title":"Derive $C^n_r$ from $P^n_r$","statement":"Pick two different colours from Y, G, R and B. Group the $P^4_2=4\\times3=12$ ordered picks by colour pair.","example":"$C^4_2=\\frac{P^4_2}{2!}=\\frac{12}{2}=6$.","sources":[{"page":"Page28","printed":"5.28","where":"main text"},{"page":"Page29","printed":"5.29","where":"main text"},{"page":"Page29","printed":"5.29","where":"margin note"},{"page":"Page29","printed":"5.29","where":"teacher note"},{"page":"Page42","printed":"5.42","where":"summary"}],"teacherOnly":false,"nonFoundation":true,"inSummary":true,"inferred":"The general statement $C^n_r \\times r! = P^n_r$ is printed in teacher note N9 ('for more able students'); the student text gives the margin note 'Each combination involves r objects and there are r! permutations of these r objects' and the formula $C^n_r = \\frac{P^n_r}{r!}$.","keyIdea":"K5-9","level":"core","visual":{"type":"table","words":true,"rows":[["$YG,\\ GY\\to\\{Y,G\\}$","$YR,\\ RY\\to\\{Y,R\\}$"],["$YB,\\ BY\\to\\{Y,B\\}$","$GR,\\ RG\\to\\{G,R\\}$"],["$GB,\\ BG\\to\\{G,B\\}$","$RB,\\ BR\\to\\{R,B\\}$"]]},"check":{"pages":["5.28","5.29","5.42"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"remember":"Choose $r$ of $n$ distinct objects without repetition ($1\\leqslant r\\leqslant n$). Each of the $C^n_r$ selections gives $r!$ orders of its $r$ objects. Every order belongs to exactly one selection, so $P^n_r=C^n_r\\times r!$. Divide by $r!$ and substitute: $C^n_r=\\frac{P^n_r}{r!}=\\frac{n!}{r!(n-r)!}$.","parent":"S5C5-073","role":"property","short":"Derive $C^n_r$ from $P^n_r$","treeOrder":59,"summaryLabel":"Count the selections"},{"id":"S5C5-073","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"property","title":"Formula for $C^n_r$","statement":"For $n$ distinct objects taken $r$ at a time without repetition, the number of combinations is $C^n_r = \\frac{P^n_r}{r!} = \\frac{n!}{r!(n-r)!}$, where $r \\leqslant n$.","example":"To choose 3 of 8 distinct objects, use $C^8_3=\\frac{8!}{3!(8-3)!}=\\frac{8!}{3!\\,5!}=56$.","sources":[{"page":"Page29","printed":"5.29","where":"definition box"},{"page":"Page29","printed":"5.29","where":"example"},{"page":"Page37","printed":"5.37","where":"margin note"},{"page":"Page42","printed":"5.42","where":"summary"}],"teacherOnly":false,"nonFoundation":true,"inSummary":true,"inferred":"The P.5.37 source is the 'Formulae Station' margin box at the start of Exercise 5C.","keyIdea":"K5-9","level":"core","check":{"pages":["5.29","5.37","5.42"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-067","role":"property","short":"$C^n_r = \\frac{n!}{r!(n - r)!}$","treeOrder":58},{"id":"S5C5-074","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"condition","title":"$r \\leqslant n$ in $C^n_r$","statement":"You can choose at most $n$ objects from $n$ distinct objects without repetition, so $r \\leqslant n$ in $C^n_r$.","sources":[{"page":"Page29","printed":"5.29","where":"definition box"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The box prints '$r \\leqslant n$' without a reason; the word 'because' is ours, as on the card for $P^n_r$.","keyIdea":"K5-9","level":"core","check":{"pages":["5.29"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-070","role":"condition","short":"$r \\leqslant n$ in $C^n_r$","treeOrder":57},{"id":"S5C5-075","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"property","title":"Product form of $C^n_r$","statement":"For $1 \\leqslant r \\leqslant n$, substitute the product for $P^n_r$ into $C^n_r = \\frac{P^n_r}{r!}$ to get $C^n_r = \\frac{n \\times (n-1) \\times \\cdots \\times (n-r+1)}{r!}$.","example":"$C^8_3 = \\frac{8 \\times 7 \\times 6}{3!} = 56$.","sources":[{"page":"Page29","printed":"5.29","where":"note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The example applies Note (a) to the $C^8_3$ of Example 14; the book itself works Example 14 with factorials.","keyIdea":"K5-9","level":"supporting","check":{"pages":["5.29"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-073","role":"extends","short":"Product form of $C^n_r$","treeOrder":60},{"id":"S5C5-076","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"property","title":"$C^n_r = C^n_{n-r}$","statement":"$C^n_r = C^n_{n-r}$, because $C^n_{n-r} = \\frac{n!}{(n-r)![n-(n-r)]!} = \\frac{n!}{(n-r)!\\,r!}$, which is $C^n_r$.","example":"A chef can choose 5 types of fruit out of 8 in $C^8_5 = 56$ ways. Each choice of 5 leaves 3 out, so the same count is $C^8_3 = 56$.","sources":[{"page":"Page29","printed":"5.29","where":"note"},{"page":"Page30","printed":"5.30","where":"example"},{"page":"Page37","printed":"5.37","where":"margin note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book does not link Examples 14 and 15; the example is ours, built from the two printed results. The P.5.37 source is the 'Formulae Station' margin box.","keyIdea":"K5-9","level":"core","check":{"pages":["5.29","5.30","5.37"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-067","role":"property","short":"$C^n_r = C^n_{n-r}$","treeOrder":64},{"id":"S5C5-W01","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"explanation","keyIdea":"K5-9","level":"core","sources":[{"page":"Page29","printed":"5.29","where":"note"}],"nonFoundation":true,"teacherOnly":false,"inSummary":false,"authored":true,"explains":"S5C5-076","title":"Why $C^5_2 = C^5_3$","statement":"Choosing 2 of Amy, Ben, Dan, Eva and Kim fixes the 3 students left out, and each group of 3 left out fixes the pair. This gives $C^5_2=C^5_3=10$.","remember":"From $n$ distinct objects, choosing which $r$ to take also fixes which $n-r$ to leave out, so $C^n_r = C^n_{n-r}$.","visual":{"type":"table","head":"row","rows":[["Choose 2 students","Leave out 3 students"],["Amy, Ben","Dan, Eva, Kim"],["Amy, Dan","Ben, Eva, Kim"],["$\\vdots$","$\\vdots$"],["Eva, Kim","Amy, Ben, Dan"],["10 ways","10 ways"]],"words":false},"check":{"pages":["5.29"],"date":"2026-10-08","result":"added explanation","notes":"","enrich":"2026-10-08","enrichNotes":"(earlier item fixed) The only source is now Page29, printed 5.29, where 'note'. The rendered footer at 820x1180 reads 'Explains textbook P.5.29'. P.5.29 is the page where Note (b) prints the derivation ending 'C^n_r = C^n_{n-r}', and it is the first source page of the card it explains, S5C5-076.; Re-checked in full, nothing else wrong. Title, short label and breadcrumb all read 'Why C^5_2 = C^5_3'. Statement correct: choosing 2 of the 5 students to join leaves 3 out, so each choice of the 2 in matches exactly one choice of the 3 out, and C^5_2 = C^5_3 = 10. The table is correct: each '3 studen"},"parent":"S5C5-076","role":"why","short":"Why $C^5_2 = C^5_3$","treeOrder":65},{"id":"S5C5-077","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"notation","title":"Calculator key for $C^n_r$","statement":"On the calculator, the keying sequence of $C^8_5$ is 8 SHIFT $\\div$ 5 EXE, because nCr is the second function of the $\\div$ key.","sources":[{"page":"Page30","printed":"5.30","where":"margin note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"From the 'Calculator' box beside Example 15; the nCr label is printed above the ÷ key.","keyIdea":"K5-9","level":"extra","hidden":true,"hiddenWhy":"Calculator keying, not a knowledge point."},{"id":"S5C5-078","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"method-idea","title":"Choosing from separate groups","statement":"When the groups have no members in common, choose the required number from each group using combinations. Multiply the counts for the individual groups.","example":"A club has 5 men and 25 women. Choose 1 man and 5 women for a committee, giving $C^5_1 \\times C^{25}_5 = 265\\,650$ possible committees.","sources":[{"page":"Page30","printed":"5.30","where":"example"},{"page":"Page30","printed":"5.30","where":"exercise","note":"Instant Drill 16(a): a quota of zero"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book shows this with a Step 1 / Step 2 Key table ('Select 1 man regardless of the order', 'Select 5 women regardless of the order'); it does not name the multiplication rule on that page.","keyIdea":"K5-10","level":"core","check":{"pages":["5.30"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"remember":"A quota of zero contributes one choice: take nobody from that group. A two-person committee from this club with no men can be formed in $C^5_0 \\times C^{25}_2 = 300$ ways.","parent":null,"role":null,"short":"Choose from each group","treeOrder":70,"cluster":"From several groups"},{"id":"S5C5-079","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"property","title":"$C^n_n = 1$","statement":"$C^n_n = 1$ because choosing all $n$ objects always gives the same selection.","example":"When the tallest 3 players must all be selected, these 3 are selected in $C^3_3 = 1$ way.","sources":[{"page":"Page29","printed":"5.29","where":"exercise"},{"page":"Page31","printed":"5.31","where":"margin note"},{"page":"Page37","printed":"5.37","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book states only the case $C^3_3 = 1$, in a margin note beside Example 17 (P.5.31). The book tests this in an exercise but does not state it in the text. Ex 5C Q1(d) and Q3(b) (P.5.37) ask for $C^{11}_{11}$ and $C^n_n$, and Instant Drill 14(b) (P.5.29) uses $C^9_9$. The reason 'only one way' is our wording. $C^n_0$ does not appear anywhere in the chapter, so it has no card.","keyIdea":"K5-9","level":"supporting","check":{"pages":["5.29","5.31","5.37"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass","markers":"2026-10-08"},"parent":"S5C5-073","role":"property","short":"$C^n_n = 1$","treeOrder":61},{"id":"S5C5-080","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"definition","title":"Collinear points","statement":"Points are **collinear** if they all lie on the same straight line.","sources":[{"page":"Page38","printed":"5.38","where":"note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The definition is a note inside Ex 5C Q11, with an e.g. box beside it.","keyIdea":"K5-10","level":"supporting","visual":{"type":"figure","w":310,"h":100,"shapes":[{"line":[[20,62],[140,32]],"style":"muted"},{"poly":[[43.2134,54.1],[44.7866,54.1],[45.9,55.2134],[45.9,56.7866],[44.7866,57.9],[43.2134,57.9],[42.1,56.7866],[42.1,55.2134]],"fill":"tint"},{"poly":[[79.21340000000001,45.1],[80.78659999999999,45.1],[81.9,46.2134],[81.9,47.7866],[80.78659999999999,48.9],[79.21340000000001,48.9],[78.1,47.7866],[78.1,46.2134]],"fill":"tint"},{"poly":[[115.21340000000001,36.1],[116.78659999999999,36.1],[117.9,37.2134],[117.9,38.7866],[116.78659999999999,39.9],[115.21340000000001,39.9],[114.1,38.7866],[114.1,37.2134]],"fill":"tint"},{"line":[[170,62],[290,32]],"style":"muted"},{"poly":[[193.2134,54.1],[194.7866,54.1],[195.9,55.2134],[195.9,56.7866],[194.7866,57.9],[193.2134,57.9],[192.1,56.7866],[192.1,55.2134]],"fill":"tint"},{"poly":[[229.2134,28.1],[230.7866,28.1],[231.9,29.2134],[231.9,30.7866],[230.7866,31.9],[229.2134,31.9],[228.1,30.7866],[228.1,29.2134]],"fill":"tint"},{"poly":[[265.2134,36.1],[266.7866,36.1],[267.9,37.2134],[267.9,38.7866],[266.7866,39.9],[265.2134,39.9],[264.1,38.7866],[264.1,37.2134]],"fill":"tint"}],"labels":[{"x":44,"y":56,"tex":"$X$","pos":"above-left"},{"x":80,"y":47,"tex":"$Y$","pos":"above-left"},{"x":116,"y":38,"tex":"$Z$","pos":"above-left"},{"x":194,"y":56,"tex":"$X$","pos":"above-left"},{"x":230,"y":30,"tex":"$Y$","pos":"above"},{"x":266,"y":38,"tex":"$Z$","pos":"above-left"},{"x":80,"y":74,"tex":"collinear","pos":"below"},{"x":230,"y":74,"tex":"not collinear","pos":"below"}],"maxw":420,"alt":"Left: points X, Y and Z on one straight line, so they are collinear. Right: X and Z on a line with Y above it, so they are not collinear."},"check":{"pages":["5.38"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":null,"role":null,"short":"Collinear points","treeOrder":68,"cluster":"Must be chosen, or left out"},{"id":"S5C5-081","section":"5.3 A","sectionTitle":"Concept of Combination","kind":"method-idea","title":"Counting lines and triangles from points","statement":"For $n\\geqslant3$ distinct points with no three collinear, each pair determines a different straight line and each triple determines a triangle. This gives $C^n_2$ straight lines and $C^n_3$ triangles.","sources":[{"page":"Page38","printed":"5.38","where":"exercise"},{"page":"Page44","printed":"5.46","where":"exercise"},{"page":"Page46","printed":"5.48","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book tests this in an exercise but does not state it in the text. The exercises are Ex 5C Q11 and Q12 (P.5.38) and Supplementary Exercise 5 Q23 (P.5.46) and Q34(b) (P.5.48). The printed answers to Ex 5C Q11 and Q12 are $C^{15}_2 = 105$ lines, $C^8_3 = 56$ triangles and $C^8_4 = 70$ quadrilaterals. Our check of the printed answer 70 to Supplementary Exercise 5 Q23(b) is $C^9_3 - C^4_3 - C^5_3 = 84 - 4 - 10 = 70$. The wording of the statement is ours.","keyIdea":"K5-10","level":"core","example":"Line segments $AB$ and $BC$ meet at an angle. There are 4 marked points on $AB$ and 5 on $BC$, none at $B$. To count triangles with three marked vertices, exclude collinear triples to get $C^9_3-C^4_3-C^5_3=70$.","check":{"pages":["5.38","5.46","5.48"],"date":"2026-1 ants","statement":"In these letter-counting questions, A, E, I, O and U count as vowels. The other letters count as consonants.","sources":[{"page":"Page33","printed":"5.33","where":"note"},{"page":"Page37","printed":"5.37","where":"exercise"},{"page":"Page39","printed":"5.39","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The note is printed inside Quick Quiz 5.2 Q6 (the word 'LEADING'); Class Practice 5.3 Q3 and Ex 5C Q21 use the terms.","keyIdea":"K5-11","level":"supporting","example":"'*LEADING*' has the vowels E, A and I and the consonants L, D, N and G.","check":{"pages":["5.33","5.37","5.39"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-088","role":"wording","short":"Vowels and consonants","treeOrder":78,"cluster":"Select and arrange"},{"id":"S5C5-091","section":"5.3 C","sectionTitle":"Solving Problems related to Both Permutations and Combinations","kind":"method-idea","title":"Select, then arrange in the gaps","statement":"Ann chooses 4 of 5 different travel videos and 3 of 6 different food videos to post, one a day. How many posting schedules can she make if no two food videos can be posted on consecutive days?","example":"Choose and order the 4 travel videos in $P^5_4$ ways. Choose the 3 food videos in $C^6_3$ ways, then put them in 3 separate spaces in $P^5_3$ ways. There are $P^5_4\\times C^6_3\\times P^5_3=144\\,000$ posting schedules.","sources":[{"page":"Page34","printed":"5.34","where":"example"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The 'places between and at the ends' idea is the one used for permutations in Example 13 (P.5.22); here the book adds a selection step.","keyIdea":"K5-11","level":"supporting","visual":{"type":"figure","w":272,"h":130,"shapes":[{"rect":[39,30,26,26],"fill":"soft"},{"rect":[95,30,26,26],"fill":"soft"},{"rect":[151,30,26,26],"fill":"soft"},{"rect":[207,30,26,26],"fill":"soft"},{"line":[[24,84],[24,62]],"arr ays to assign the same three pairs to groups A, B and C.","example":"Choose 2 of the 6 children for A, 2 of the 4 left for B and the last 2 for C. This gives $C^6_2\\times C^4_2\\times C^2_2=90$ assignments. With unnamed groups, the same split occurs in $3!$ assignments, so there are $90\\div3!=15$ ways to split the children into pairs.","sources":[{"page":"Page35","printed":"5.35","where":"example"},{"page":"Page35","printed":"5.35","where":"margin note"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"Uses textbook Example 20 (p. 5.35). The six label assignments show the same three pairs. This keeps Exercise 5C Q30 and Instant Drill 20 as fresh practice.","keyIdea":"K5-11","level":"core","visual":{"type":"table","head":"both","rows":[["Assignment","Pair in A","Pair in B","Pair in C"],["1","$\\{K_1,K_2\\}$","$\\{K_3,K_4\\}$","$\\{K_5,K_6\\}$"],["2","$\\{K_1,K_2\\}$","$\\{K_5,K_6\\}$","$\\{K_3,K_4\\}$"],["3","$\\{K_3,K_4\\}$","$\\{K_1,K_2\\}$","$\\{K_5,K_6\\}$"],["4","$\\{K_3,K_4\\}$","$\\{K_5,K_6\\}$","$\\{K_1,K_2\\}$"],["5","$\\{K_5,K_6\\}$","$\\{K_1,K_2\\}$","$\\{K_3,K_4\\}$"],["6","$\\{K_5,K_6\\}$","$\\{K_3,K_4\\}$","$\\{K_1,K_2\\}$"]],"words":true},"check":{"pages":["5.35"],"date":"2026-10-08","result":"fixed","notes":"(ambiguous) Example: 'the $3!$ ways in the table are one division, so $34\\,650 \\div 3!$' uses 'division' for a way of dividing the kids, right beside the arithmetic division; the book says the ways 'are the same'.; (unmarked) The 12-kid example is ours (it borrows the numbers of Ex 5C Q30; the book's Example 20 has 6 kids), but the inferred note does not say so. The note also quotes 'counted once for every order of the groups', which is not on the card.","final":"pass","markers":"2026-10-08"},"parent":null,"role":null,"short":"Named and unnamed groups","treeOrder":80,"cluster":"Dividing into groups"},{"id":"S5C5-W02","section":"5.3 C","sectionTitle":"Solving Problems related to Both Permutations and Combinations","kind":"explanation","keyIdea":"K5-11","level":"core","sources":[{"page":"Page35","printed":"5.35","where":"example"},{"page":"Page35","printed":"5.35","where":"margin note"}],"nonFoundation":true,"teacherOnly":false,"inSummary":false,"authored":true,"explains":"S5C5-092","title":"Why divide for unnamed groups?","statement":"Divide 6 children $K_1$ to $K_6$ into named groups $A$ and $B$ of 3 each, giving $C^6_3\\times C^3_3=20$ assignments. Without names, swapping the two groups gives the same split, so there are $20\\div 2!=10$ splits.","remember":"Each set of equal-sized, unnamed groups can swap among themselves without changing the split. Divide by $2!$ for 2 such groups or $3!$ for 3.","visual":{"type":"table","head":"row","rows":[["Choose 3 for group A","Choose 3 for group B","Split into unnamed groups"],["$K_1, K_2, K_3$","$K_4, K_5, K_6$","$\\{K_1, K_2, K_3\\}$ and $\\{K_4, K_5, K_6\\}$"],["$K_4, K_5, K_6$","$K_1, K_2, K_3$","Same split as above"],["$K_1, K_2, K_4$","$K_3, K_5, K_6$","$\\{K_1, K_2, K_4\\}$ and $\\{K_3, K_5, K_6\\}$"],["$K_3, K_5, K_6$","$K_1, K_2, K_4$","Same split as above"],["$\\vdots$","$\\vdots$","$\\vdots$"],["20 ways","","10 ways"]],"words":false},"check":{"pages":["5.35"],"date":"2026-10-08","result":"added explanation","notes":"","enrich":"2026-10-08","enrichNotes":"(earlier item fixed) The short label is now 'Why divide for groups without names' (structure.py line 140), the same as the title. It no longer says '2!' alone. The rendered breadcrumb reads 'Groups with or without names > Why divide for groups without names', and the parent S5C5-092's Next button reads 'Why divide for groups without names'.; Re-checked in full, nothing else wrong. Maths correct: C^6_3 x C^3_3 = 20 x 1 = 20; swapping the two groups gives no new way, so each way without group names is counted 2! = 2 times, and 20 / 2! = 10. The table rows are correct: each row's group B is the c"},"parent":"S5C5-092","role":"why","short":"Why divide for unnamed groups?","treeOrder":81,"cluster":"Dividing into groups"},{"id":"S5C5-093","section":"5.3 C","sectionTitle":"Solving Problems related to Both Permutations and Combinations","kind":"wording","title":"Recipients identify the groups","statement":"Recipients and group leaders distinguish the groups. Swapping what two people receive changes the distribution, so count each assignment separately.","example":"Give 10 distinct gifts to 2 guests, 5 each. Choose 5 for the first guest and give the rest to the second. There are $C^{10}_5\\times C^5_5=252$ ways to give out the gifts. To split the gifts into two unnamed groups of 5, divide by $2!$ to get 126 splits.","sources":[{"page":"Page35","printed":"5.35","where":"exercise"},{"page":"Page41","printed":"5.41","where":"exercise"},{"page":"Page52","printed":"5.54","where":"exercise"},{"page":"Page60","printed":"T5.56f","where":"example"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The recipient-versus-unnamed-group distinction is source-backed by Instant Drill 20 (P.5.35), Ex 5C Q29 and Q30 (P.5.41), and Supplementary Example 20 (T5.56f). The example shown here is authored for the private 29 October 2026 repair: 10 distinct gifts, 2 distinct guests, 5 gifts each, 252 ways; compare 2 unnamed groups of 5, 126 ways. It replaces the inherited 8-gift, 4-guest example to avoid revealing Instant Drill 20's answers. The printed Drill 20 answers 2 520 and 105 are correct and preserved in the untouched baseline and source records. Supplementary Example 20 uses 12 sweets and has printed answers 369 600 and 15 400; those values are not this authored example.","keyIdea":"K5-11","level":"supporting","check":{"pages":["5.35","5.41","5.54","T5.56f"],"date":"2026-10-29","result":"private authored example replacement; different independent confirmation pending","notes":"The original source distinction is retained. The new 10-gift example and revised grouping check await different independent confirmation. Historical whole-entry passes apply only to the baseline.","enrich":"not yet checked"},"parent":"S5C5-092","role":"wording","short":"Groups identified by recipients","treeOrder":82,"cluster":"Dividing into groups"},{"id":"S5C5-094","section":"5.3 C","sectionTitle":"Solving Problems related to Both Permutations and Combinations","kind":"method-idea","title":"Divide for equal-sized unnamed groups","statement":"Groups of different sizes are already distinguishable. For each size that occurs in $k$ unnamed groups, divide by $k!$ because swapping those groups leaves the same split.","sources":[{"page":"Page41","printed":"5.41","where":"exercise"},{"page":"Page45","printed":"5.47","where":"exercise"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The book tests this in an exercise but does not state it in the text. The exercises are Ex 5C Q31(a) (P.5.41) and Supplementary Exercise 5 Q29(a) and (b) (P.5.47). The rule and its reason are our reading of the printed answers 280 $= C^8_1 \\times C^7_3 \\times C^4_4$, 462 and 138 600. The example (10 people into 3 groups of 2 and 1 group of 4) is ours.","keyIdea":"K5-11","level":"supporting","example":"Divide 10 people into 3 unnamed groups of 2 and 1 group of 4. Choose the groups in turn, then divide by $3!$ for the three groups of 2. There are $C^{10}_2\\times C^8_2\\times C^6_2\\times C^4_4\\div3!=3\\,150$ ways to split the ten people.","check":{"pages":["5.41","5.47"],"date":"2026-10-08","result":"fixed","notes":"(unmarked) The example (10 people into 3 groups of 2 and 1 group of 4, 3 150 ways) is ours and is not in the book, but the inferred note does not say so. The number and the rule are correct.","final":"pass","markers":"2026-10-08"},"parent":"S5C5-092","role":"condition","short":"Divide only for equal sizes","treeOrder":83,"cluster":"Dividing into groups"},{"id":"S5C5-095","section":"Extra DSE Support","sectionTitle":"Exam Get Set Go","kind":"method-idea","title":"Use examples to find what to fill first","statement":"Try a few arrangements that meet the restriction. They can help you see which positions to fill first.","example":"Use each of 1, 2, 4, 5, 7, 8 and 9 once in a password whose first two digits are even. Examples such as $24\\,15789$ and $48\\,12579$ show that the first two places take 2 of the 3 even digits in order. Arrange the other 5 digits freely to give $P^3_2 \\times 5! = 720$ passwords.","sources":[{"page":"Page48","printed":"5.50","where":"DSE support"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"From the Star Tips box. How the examples lead to $P^3_2 \\times 5!$ is our explanation; the Star Tips give only the examples.","keyIdea":"K5-11","level":"supporting","check":{"pages":["5.50"],"date":"2026-10-08","result":"equivalent","notes":"","final":"pass"},"parent":"S5C5-088","role":"method","short":"Write examples first","treeOrder":79,"cluster":"Select and arrange"},{"id":"S5C5-096","section":"Inquiry & Investigation","sectionTitle":"Using the concept of combination to find the number of rectangles in a grid","kind":"method-idea","title":"Counting rectangles in a grid","statement":"A rectangle in a grid is formed by 2 horizontal gridlines and 2 vertical gridlines, so counting rectangles means selecting 2 lines of each kind. A 2 × 3 grid has 3 horizontal and 4 vertical gridlines, so it has $C^3_2 \\times C^4_2 = 18$ rectangles.","example":"For an $m \\times n$ grid, the extension gives $C^{m+1}_2 \\times C^{n+1}_2$ rectangles.","figure":"Fig. I (P.5.53): a rectangle divided into 2 rows and 3 columns of equal small rectangles, so there are 3 horizontal and 4 vertical gridlines.","sources":[{"page":"Page51","printed":"5.53","where":"activity"}],"teacherOnly":false,"nonFoundation":true,"inSummary":false,"inferred":"The student page asks the investigation questions; the values (2 lines of each kind, 3 and 4 gridlines, 18, 150 and $C^{m+1}_2 \\times C^{n+1}_2$) are printed only as magenta answers in the teacher's edition.","keyIdea":"K5-11","level":"extra","hidden":true,"hiddenWhy":"The Inquiry & Investigation page (rectangles in a grid): an application, not a knowledge point."},{"id":"S5C5-097","section":"Chapter Highlight","sectionTitle":"Chapter Highlight","kind":"link","title":"Why count outcomes: probability","statement":"We often need to count the number of possible outcomes when calculating probabilities. Using the concepts of permutation and combination, we can find the number of possible outcomes more quickly.","sources":[{"page":"Page55","printed":"T5.56a","where":"teacher note"}],"teacherOnly":true,"nonFoundation":false,"inSummary":false,"inferred":"This paragraph of the Chapter Highlight carries no scissors mark.","keyIdea":"K5-11","level":"extra","hidden":true,"hiddenWhy":"Chapter Highlight for the teacher (purpose, prerequisites, scope), not a knowledge point."},{"id":"S5C5-098","section":"Chapter Highlight","sectionTitle":"Chapter Highlight","kind":"link","title":"Prerequisite: listing outcomes by table and tree","statement":"Before starting this chapter, students should be able to list all the possible outcomes of an activity by using a table and a tree diagram. Teachers ==may== ask students to complete the Review Exercise in §5.0 Review (P.5.2) if they need better preparation.","sources":[{"page":"Page55","printed":"T5.56a","where":"teacher note"}],"teacherOnly":true,"nonFoundation":false,"inSummary":false,"keyIdea":"K5-11","level":"extra","hidden":true,"hiddenWhy":"Chapter Highlight for the teacher (purpose, prerequisites, scope), not a knowledge point."},{"id":"S5C5-099","section":"Chapter Highlight","sectionTitle":"Chapter Highlight","kind":"link","title":"Learning points and curriculum objectives","statement":"Students are expected to grasp: (1) the concepts of the addition rule (P.5.3) and the multiplication rule in the counting principle (P.5.5); (2) factorial notation (P.5.13); (3) the concept and notation of permutation (P.5.14); (4) the method of solving problems on the permutation of distinct objects without repetition (P.5.15); (5) the concept and notation of combination (P.5.28); (6) the method of solving problems on the combination of distinct objects without repetition (P.5.29). The curriculum objectives follow the same points section by section: §5.1 the addition rule and multiplication rule, §5.2 the concept, notation and problems of permutation, and §5.3 the same for combination.","sources":[{"page":"Page55","printed":"T5.56a","where":"teacher note"}],"teacherOnly":true,"nonFoundation":true,"inSummary":false,"inferred":"Each of the six learning points and the five curriculum objectives carries the scissors (Non-foundation) mark. The curriculum table does not list factorial notation on its own.","keyIdea":"K5-11","level":"extra","hidden":true,"hiddenWhy":"Chapter Highlight for the teacher (purpose, prerequisites, scope), not a knowledge point."},{"id":"S5C5-100","section":"Chapter Highlight","sectionTitle":"Chapter Highlight","kind":"link","title":"This chapter prepares for Chapter 6","statement":"The contents and concepts learnt in this chapter are the prerequisite knowledge for Chapter 6 More about Probability in this book.","sources":[{"page":"Page55","printed":"T5.56a","where":"teacher note"}],"teacherOnly":true,"nonFoundation":false,"inSummary":false,"keyIdea":"K5-11","level":"extra","hidden":true,"hiddenWhy":"Chapter Highlight for the teacher (purpose, prerequisites, scope), not a knowledge point."},{"id":"S5C5-101","section":"Chapter Highlight","sectionTitle":"Chapter Highlight","kind":"notation","title":"Scissors symbol marks Non-foundation topics","statement":"The scissors symbol ✂ indicates a Non-foundation topic. All six learning points and all five curriculum objectives of this chapter carry it, so the whole chapter except §5.0 Review is Non-foundation.","sources":[{"page":"Page55","printed":"T5.56a","where":"teacher note"}],"teacherOnly":true,"nonFoundation":false,"inSummary":false,"inferred":"The legend line itself carries no scissors mark. 'The whole chapter except §5.0 Review' is our reading: T5.56a marks §5.1 to §5.3, and pages 5.3 to 5.49 carry the Non-foundation margin bar, while 5.2 (Review) does not.","keyIdea":"K5-11","level":"extra","hidden":true,"hiddenWhy":"Chapter Highlight for the teacher (purpose, prerequisites, scope), not a knowledge point."}],"keyIdeas":[{"id":"K5-1","title":"The addition rule","summary":"If a task can be completed in several ways, group the possible outcomes by method. Add the counts when the methods have ==no outcomes in common==.","shape":"tree"},{"id":"K5-2","title":"The multiplication rule","summary":"When a task is done in steps, multiply the numbers of choices if each step has the same count regardless of the choices made earlier.","shape":"tree"},{"id":"K5-3","title":"Factorial","summary":"For a positive integer $n$, $n!$ is the product of the first $n$ positive integers. Also, $0! = 1$.","shape":"tree"},{"id":"K5-4","title":"Permutation","summary":"A permutation is an arrangement of objects in a specific order. There are $n!$ ways to arrange all $n$ distinct objects without repetition.","shape":"tree"},{"id":"K5-5","title":"The number of permutations $P^n_r$","summary":"For $n$ distinct objects taken $r$ at a time without repetition, the number of permutations is $P^n_r=\\frac{n!}{(n-r)!}$, where $r \\leqslant n$.","shape":"tree"},{"id":"K5-6","title":"Using permutations","summary":"Some tasks require an arrangement at each step. If the number of ways at each step stays fixed, multiply the arrangement counts.","shape":"tree"},{"id":"K5-7","title":"Restrictions: specific places","summary":"Fill the positions with restrictions first. Then arrange the remaining objects in the positions left.","shape":"tree"},{"id":"K5-8","title":"Objects together or apart","summary":"Treat objects that must stay together as one unit. To keep objects apart, arrange the others first and put the restricted objects in different gaps or end positions.","shape":"clusters"},{"id":"K5-9","title":"Combination and $C^n_r$","summary":"A combination is a selection made regardless of order. For $n$ distinct objects taken $r$ at a time without repetition, $C^n_r = \\frac{n!}{r!(n-r)!}$, where $r \\leqslant n$.","shape":"tree"},{"id":"K5-10","title":"Combinations with restrictions","summary":"Put required objects in first and remove excluded objects. For '*at least*' and '*at most*', count and add the allowed cases or subtract the excluded cases from the total.","shape":"clusters"},{"id":"K5-11","title":"Choosing, arranging and grouping","summary":"Choose the objects before arranging them. When dividing objects into groups, count which objects go together and whether swapping groups changes the result.","shape":"clusters"}],"chapter":{"title":"Permutations and combinations","w":1000,"h":672,"nodes":[{"k":"K5-1","label":"Addition rule","sub":"e.g. 1 pet from 5 dogs or 7 cats","x":300,"y":56,"part":"kind"},{"k":"K5-2","label":"Multiplication rule","sub":"e.g. 1 of 8 boys and 1 of 12 girls","x":700,"y":56,"part":"kind"},{"k":"K5-3","label":"Factorial","sub":"e.g. $4! = 4 \\times 3 \\times 2 \\times 1$","x":300,"y":176,"part":"kind"},{"k":"K5-4","label":"Permutation","sub":"an arrangement in a specific order","x":700,"y":176,"part":"kind"},{"k":"K5-5","label":"Number of permutations","sub":"e.g. 3 of 6 people in a row: $P^6_3$","x":500,"y":300,"part":"kind"},{"k":"K5-9","label":"Combination","sub":"e.g. 3 of 6 people in a group: $C^6_3$","x":840,"y":300,"part":"kind"},{"k":"K5-6","label":"Arrangements in steps","sub":"e.g. 3 different letters, then 5 different digits","x":180,"y":476,"part":"step"},{"k":"K5-7","label":"Specific places","sub":"e.g. $A$ must be first in the row","x":500,"y":476,"part":"step"},{"k":"K5-8","label":"Together or apart","sub":"e.g. $A$ and $B$ next to each other","x":820,"y":476,"part":"step"},{"k":"K5-10","label":"Combinations with restrictions","sub":"must, must not, at least, at most","x":340,"y":604,"part":"s   const FILL = { none: "none", tint: "#dce7f8", soft: "#eef1f5", warm: "#f6e7c8" };

// ---- The branch rail beside a card (wide screens) ----
function roleTag(role, cls) {

  return t;

function summaryNeeds(ch, id) {
  const slots=(ch.checks || {})[id] || [];
  return [...new Set(slots.flatMap(s => s.needs || [id]))];
}
function isSummaryCheck(ch, id) { return summaryNeeds(ch,id).length > 1; }
function summaryBranches(ch, tree) {
  const ids=new Set(tree.order.map(n=>n.c.id));
  return tree.order.filter(n=>isSummaryCheck(ch,n.c.id)).map(n=>({owner:n.c,needs:summaryNeeds(ch,n.c.id)}));
}
// Place after all covered material in the tree's reading order, even when the owner comes earlier.
function summaryAnchors(ch, tree) {
  const anchors=new Map();
  for(const branch of summaryBranches(ch,tree)){
    const covered=new Set(branch.needs);
    const anchor=branch.owner.summaryAtEnd ? tree.order.at(-1) : tree.order.filter(n=>covered.has(n.c.id)).at(-1);
    if(anchor){if(!anchors.has(anchor.c.id))anchors.set(anchor.c.id,[]);anchors.get(anchor.c.id).push(branch);}
  }
  return anchors;
}
function summaryActionEl(ch, {owner,needs}) {
  const button=el("button","summary-start");button.type="button";button.dataset.checkOwner=owner.id;
  const label=el("span","summary-label","Summary challenge");label.appendChild(el("small","",owner.summaryLabel || `${needs.length} cards`));
  button.append(stateIcon(cardState(ch,owner.id)||waitMark(ch,owner)||"bulb"),label);
  const scope=needs.map(id=>plain(shortOf(ch.cards.find(c=>c.id===id)))).join("; ");
  button.title=`Covers: ${scope}`;button.setAttribute("aria-label",`Summary challenge across ${needs.length} cards. Covers: ${scope}`);
  button.onclick=e=>{e.stopPropagation();jumpTo(owner.summaryAtEnd ? "map-" + owner.keyIdea : owner.id);openCheck(ch,owner.id,false);};
  return button;
}

    if (onPath) li.classList.add("path");
    const b = el("button", "tnode" + (n === item.node ? " current" : pathIds.has(n.c.id) ? " path" : ""));
    if (n.c.role) b.appendChild(roleTag(n.c.role, "role"));
    else if (n.joins && n.joins.length) { b.appendChild(roleTag("joins", "role")); li.classList.add("join"); }
    b.appendChild(rich("span", "lab", shortOf(n.c)));
    const st = isSummaryCheck(DATA[state.ch],n.c.id) ? "" : cardState(DATA[state.ch], n.c.id, rec) || waitMark(DATA[state.ch], n.c);
    if (st) b.appendChild(stateIcon(st));
    else if (state.seen.has(n.c.id) && n !== item.node) b.appendChild(icon("seen", "seen"));
    b.onclick = () => jumpTo(n.c.id);
    if (n === item.node) b.setAttribute("aria-current", "true");
    li.appendChild(b);
    for(const branch of summaries.get(n.c.id)||[])li.appendChild(summaryActionEl(DATA[state.ch],branch));
    if (n.kids.length) {
      const ol = el("ol");
      n.kids.forEach(m => ol.appendChild(nodeEl(m)));
      li.appendChild(ol);
    }
    return li;
  };
  let lastCluster;
  let ol = null;
  tree.roots.forEach(r => {
    if (r.c.cluster !== lastCluster || !ol) {
      if (r.c.cluster) rail.appendChild(el("div", "cluster-label", r.c.cluster));
      ol = el("ol", "tree");
      rail.appendChild(ol);
      lastCluster = r.c.cluster;
    }
    ol.appendChild(nodeEl(r));
  });

  const foot = checking ? null : railRefreshEl(DATA[state.ch], k, tree);
  if (foot) outer.appendChild(foot);
  return outer;
}

// ---- The map slide: a group's whole tree, laid out left to right ----
function mapSlideEl(item, host) {
  const { tree, k } = item;
  const sec = el("section", "mapslide");
  sec.appendChild(el("h2", "", k.title));
  sec.appendChild(rich("p", "lede", k.summary || ""));
  // The idea's revision line: where its checks stand, when, and a fresh start for the whole group.
  const recMap = recLoad(DATA[state.ch]);
  const line = ideaCheckEl(DATA[state.ch], k, tree);
  if (line) sec.appendChild(line);
  const wrap = el("div", "tmap-wrap");
  const map = el("div", "tmap");
  wrap.appendChild(map);
  sec.appendChild(wrap);
  const summaries=summaryAnchors(DATA[state.ch],tree);
  sec.appendChild(el("p", "maphint", "Tap any branch to open it, or press Next to start at the root."));

  // Rows: each leaf takes a row; a parent sits level with the middle of its children.
  let row = 0, maxDepth = 0;
  const clusters = [];
  const place = n => {
    n.x0 = 0;   // the column offset of a cluster placed side by side (below); a tree is laid out afresh each time
    maxDepth = Math.max(maxDepth, n.depth);
    if (n.joins && n.joins.length && !n.kids.length) n.row = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length;
    else if (n.joins && n.joins.length) {
      // A converging card with children sits level with the cards it joins: its children use the rows beside them
      // (the columns to its right are empty up there), so the arrows run straight across instead of dropping down.
      const leaves = m => (m.kids.length ? m.kids.reduce((a, k) => a + leaves(k), 0) : 1);
      const mid = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length, saved = row;
      row = Math.max(Math.min(...n.joins.map(j => j.row)), mid - (leaves(n) - 1) / 2);
      n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2;
      row = Math.max(saved, row);
    }
    else if (!n.kids.length) n.row = row++;
    else { n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; }
  };
  let lastCluster;
  tree.roots.forEach(r => {
    if (r.c.cluster && r.c.cluster !== lastCluster) {
      if (clusters.length) row += 0.6;
      clusters.push({ label: r.c.cluster, start: row, nodes: [] });
      row += 0.75;
      lastCluster = r.c.cluster;
    }
    place(r);
    if (clusters.length) {
      const walk = n => { clusters[clusters.length - 1].nodes.push(n); n.kids.forEach(walk); };
      walk(r);
      clusters[clusters.length - 1].end = row;
    }
  });
  let ROW = 90;
  const GAP = 56;
  // The slide's content is capped at 1040px, so size the columns to that, not to the stage.
  const avail = Math.max(320, Math.min(1040, (host.clientWidth || 900) - 40) - 8);
  const COL = Math.max(170, Math.min(270, Math.floor((avail + GAP) / (maxDepth + 1)) - GAP));
  map.style.width = ((maxDepth + 1) * (COL + GAP) - GAP) + "px";
  map.style.height = (row * ROW + 10) + "px";
  const els = new Map();
  tree.order.forEach(n => {
    // A branch that feeds a converging card holds its details: its root is an ordinary box, and the converging card
    // is the major (dark) card. One rule for every such root, so equal branches look equal (checker, 9 October 2026).
    const joined = new Set(tree.order.flatMap(m => m.joins || []));
    const under = m => joined.has(m) || m.kids.some(under);
    const tops = tree.roots.filter(m => !(m.joins && m.joins.length));
    const feeds = !n.parent && !(n.joins && n.joins.length) && under(n) && (!n.kids.length || tops.every(under));
    const challenges=summaries.get(n.c.id)||[];
    const b = el(challenges.length ? "div" : "button", "mnode" + (!n.parent && !feeds ? " root" : "") + (n.joins && n.joins.length ? " join" : ""));
    if (n.c.role) b.appendChild(roleTag(n.c.role, "role"));
    else if (n.joins && n.joins.length) b.appendChild(roleTag("joins", "role"));
    b.appendChild(rich("span", "", shortOf(n.c)));
    const st = isSummaryCheck(DATA[state.ch],n.c.id) ? "" : cardState(DATA[state.ch], n.c.id, recMap) || waitMark(DATA[state.ch], n.c);
    if (st) b.appendChild(stateIcon(st));
    else if (state.seen.has(n.c.id)) b.appendChild(icon("seen", "seen"));
    b.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";
    b.style.top = (n.row * ROW + ROW / 2) + "px";
    b.style.maxWidth = COL + "px";
    b.style.transitionDelay = (n.depth * 110) + "ms";
    if(challenges.length){
      const open=el("button","map-open");open.type="button";
      while(b.firstChild)open.appendChild(b.firstChild);
      open.onclick=()=>jumpTo(n.c.id);b.appendChild(open);
      challenges.forEach(branch=>b.appendChild(summaryActionEl(DATA[state.ch],branch)));
    }else b.onclick = () => jumpTo(n.c.id);
    map.appendChild(b);
    els.set(n, b);
  });
  clusters.forEach(cl => {
    const lab = el("div", "cl-label", cl.label);
    lab.style.left = "0px";
    lab.style.top = (cl.start * ROW) + "px";
    map.appendChild(lab);
  });
  const svgEl = svg("svg", { class: "edges" });
  map.prepend(svgEl);

  // Once laid out: draw the edges between measured boxes, frame clusters, and fit to the width.
  requestAnimationFrame(() => {
    // Rows tighten before anything is scaled, so labels stay full-size where possible, but a row is never
    // shorter than the tallest box plus a gap: on short laptop screens squeezed rows piled boxes on top of
    // each other and buried the bottom branch. Past that point the whole map scales down instead.
    const hint = sec.querySelector(".maphint");
    const freeH = host.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top - (hint ? hint.offsetHeight : 20) - 24;
    // A formula cannot wrap: a box with nothing to its right (a leaf) widens to hold it, so no label spills out of its
    // box and no arrow starts inside the formula (9 October 2026, "sin^2 x + cos^2 x = 1").
    tree.order.forEach(n => { const e = els.get(n); if (!n.kids.length && e.scrollWidth > e.clientWidth + 1) e.style.maxWidth = (e.scrollWidth + 2) + "px"; });
    // The height a row needs (9 October 2026): a box only needs room across the rows it spans. A parent between two
    // rows may be twice as tall as a leaf, so one tall root no longer makes every row tall (trees ran out of height
    // in landscape while half the width stayed empty).
    const span = n => { if (n._lo === undefined) { const ks = n.kids.length ? n.kids : (n.joins || []);
                          const lo = ks.length ? Math.min(...ks.map(k => span(k)[0])) : n.row, hi = ks.length ? Math.max(...ks.map(k => span(k)[1])) : n.row;
                          n._lo = lo; n._hi = hi; } return [n._lo, n._hi]; };
    const rowNeed = () => { tree.order.forEach(n => { delete n._lo; delete n._hi; });
                            return Math.max(...tree.order.map(n => { const [lo, hi] = span(n); return (els.get(n).offsetHeight + 14) / (hi - lo + 1); })); };
    let nodeH = rowNeed() - 14;
    // Clusters side by side (8 October 2026): stacked clusters made a tall, narrow map that drew at about half size
    // on the iPad while most of the slide's width stayed empty. With two or more clusters, also try two columns of
    // clusters, and keep the layout that draws larger. A tree without clusters is unchanged.
    if (clusters.length > 1) {
      // Each column of clusters is only as wide as its own deepest branch (9 October 2026): a three-column cluster
      // beside a two-column one no longer reserves six columns of width.
      const spanOf = cls => (Math.max(...cls.map(cl => Math.max(...cl.nodes.map(n => n.depth)))) + 1) * (COL + GAP) - GAP;
      const span = (maxDepth + 1) * (COL + GAP) - GAP;
      const fit = (rows, w) => { const R = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, rows)));
                                 return Math.min(1.4, avail / (w + 16), freeH / (rows * R + 10)); };
      let best = 1, bestFit = 0, X2 = 0, wide = 0, bestRows = row;
      for (let i = 1; i < clusters.length; i++) {
        const rows = Math.max(clusters[i - 1].end, row - clusters[i].start);
        const a = spanOf(clusters.slice(0, i)), b = spanOf(clusters.slice(i)), f = fit(rows, a + 48 + b);
        if (f > bestFit) { best = i; bestFit = f; bestRows = rows; X2 = a + 48; wide = a + 48 + b; }
      }
      if (bestFit > fit(row, span) + 0.05) {
        const shift = clusters[best].start;
        clusters.slice(best).forEach(cl => {
          cl.start -= shift; cl.x0 = X2;
          cl.nodes.forEach(n => { n.row -= shift; n.x0 = X2; });
        });
        row = bestRows;
        map.style.width = wide + "px";   // first, or the second column's boxes are squeezed and wrap
        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";
                                  e.style.top = (n.row * ROW + ROW / 2) + "px"; });
        clusters.forEach((cl, i) => { const lab = map.querySelectorAll(".cl-label")[i];
                                      lab.style.left = (cl.x0 || 0) + "px"; lab.style.top = (cl.start * ROW) + "px"; });
        map.style.height = (row * ROW + 10) + "px";
        nodeH = rowNeed() - 14;
      }
    }
    // Two lanes (9 October 2026): a tall tree with one root ran out of height while half the slide's width stayed
    // empty. When it draws clearly larger, the root sits on top and its branches run in two lanes side by side, in
    // reading order (the first lane, then the second); a trunk line joins the root to each branch. Trees with
    // clusters or converging cards keep their own layout.
    let lanes = null;
    const LTOP = 1.15, INDENT = 30;
    if (!clusters.length && tree.roots.length === 1 && !tree.order.some(m => m.joins && m.joins.length) && tree.roots[0].kids.length >= 2) {
      const root = tree.roots[0], kids = root.kids;
      const leaves = n => (n.kids.length ? n.kids.reduce((a, k) => a + leaves(k), 0) : 1);
      const depthOf = n => Math.max(n.depth, ...n.kids.map(depthOf));
      const fitOf = (rows, w) => { const R = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, rows)));
                                   return Math.min(1.4, avail / (w + 16), freeH / (rows * R + 10)); };
      let best = null;
      for (let i = 1; i < kids.length; i++) {
        const A = kids.slice(0, i), B = kids.slice(i);
        const la = A.reduce((a, k) => a + leaves(k), 0), lb = B.reduce((a, k) => a + leaves(k), 0);
        const wa = Math.max(...A.map(depthOf)) * (COL + GAP) - GAP, wb = Math.max(...B.map(depthOf)) * (COL + GAP) - GAP;
        const w = Math.max(els.get(root).offsetWidth, INDENT + wa + 56 + INDENT + wb), rows = LTOP + Math.max(la, lb);
        const f = fitOf(rows, w);
        if (!best || f > best.f) best = { A, B, rows, w, f, xb: INDENT + wa + 56 };
      }
      if (best && best.f > fitOf(row, (maxDepth + 1) * (COL + GAP) - GAP) + 0.08) {
        lanes = { root, laneOf: new Map(), trunk: [INDENT / 2, best.xb + INDENT / 2] };
        root.row = 0; root.x0 = 0;
        [[best.A, 0], [best.B, best.xb]].forEach(([group, lx], li) => {
          let r = LTOP;
          const put = n => { n.x0 = lx + INDENT - (COL + GAP); lanes.laneOf.set(n, li);
                             if (!n.kids.length) n.row = r++; else { n.kids.forEach(put); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; } };
          group.forEach(put);
        });
        row = best.rows;
        map.style.width = best.w + "px";
        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px"; e.style.top = (n.row * ROW + ROW / 2) + "px"; });
        map.style.height = (row * ROW + 10) + "px";
        nodeH = Math.max(rowNeed(), (els.get(root).offsetHeight + 14) / LTOP) - 14;
      }
    }
    const tight = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, row)));
    if (Math.abs(tight - ROW) > 0.5) {
      ROW = tight;
      tree.order.forEach(n => els.get(n).style.top = (n.row * ROW + ROW / 2) + "px");
      clusters.forEach((cl, i) => map.querySelectorAll(".cl-label")[i].style.top = (cl.start * ROW) + "px");
      map.style.height = (row * ROW + 10) + "px";
    }
    // Edges come from the layout numbers (column from the depth, centre from the row, as the boxes are placed),
    // never from measured positions: right after the rows tightened, Chrome still reported the old positions of the
    // deeper boxes, and the edges of a tall tree were drawn about 20% short of them (2026-10-07).
    const box = n => { const e = els.get(n), x = (n.x0 || 0) + n.depth * (COL + GAP), y = n.row * ROW + ROW / 2, h = e.offsetHeight;
                        return { l: x, r: x + e.offsetWidth, t: y - h / 2, b: y + h / 2 }; };
    let mw = 0;
    // Arrows into a converging card: level from each joined card (a leaf, so its row is clear to the right), then a
    // curve into the card.
    if (tree.order.some(n => n.joins && n.joins.length)) {
      const defs = svg("defs", {}, svgEl), mk = svg("marker", { id: "kc-join-" + k.id, viewBox: "0 0 10 10", refX: 9, refY: 5,
        markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
      svg("path", { d: "M0,0 L10,5 L0,10 z", class: "joinhead" }, mk);
    }
    tree.order.forEach(n => (n.joins || []).forEach(j => {
      const a = box(j), b = box(n), x1 = a.r, y1 = (a.t + a.b) / 2, x2 = b.l - 2, y2 = (b.t + b.b) / 2;
      const xs = Math.max(x1, x2 - GAP), dx = (x2 - xs) / 2;   // level across the columns (each leaf's row is clear to its right), then an S-curve in the last gap
      const path = svg("path", { class: "join", "marker-end": `url(#kc-join-${k.id})`,
        d: `M${x1},${y1} L${xs},${y1} C${xs + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}` }, svgEl);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = state.grown.has(k.id) ? 0 : len;
      path.style.transitionDelay = (n.depth * 110 - 60) + "ms";
    }));
    tree.order.forEach(n => {
      const bx = box(n);
      mw = Math.max(mw, bx.r);
      if (!n.parent) return;
      const p = box(n.parent);
      if (lanes && n.parent === lanes.root) {
        const li = lanes.laneOf.get(n), tx = lanes.trunk[li], y2 = (bx.t + bx.b) / 2, r = 8;
        const d = li === 0
          ? `M${tx},${p.b} V${y2 - r} Q${tx},${y2} ${tx + r},${y2} L ${bx.l},${y2}`
          : `M${p.r},${(p.t + p.b) / 2} H${tx - r} Q${tx},${(p.t + p.b) / 2} ${tx},${(p.t + p.b) / 2 + r} V${y2 - r} Q${tx},${y2} ${tx + r},${y2} L ${bx.l},${y2}`;   // ends on a point, as every edge does (QA reads it)
        const path = svg("path", { d }, svgEl);
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = state.grown.has(k.id) ? 0 : len;
        path.style.transitionDelay = (n.depth * 110 - 60) + "ms";
        return;
      }
      const x1 = p.r, y1 = (p.t + p.b) / 2, x2 = bx.l, y2 = (bx.t + bx.b) / 2, dx = (x2 - x1) / 2;
      const path = svg("path", { d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}` }, svgEl);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = state.grown.has(k.id) ? 0 : len;
      path.style.transitionDelay = (n.depth * 110 - 60) + "ms";
    });
    clusters.forEach(cl => {
      const bs = cl.nodes.map(n => box(n));
      const l = Math.min(...bs.map(b => b.l)) - 14, t = Math.min(...bs.map(b => b.t)) - 34;
      const r = Math.max(...bs.map(b => b.r)) + 14, bt = Math.max(...bs.map(b => b.b)) + 12;
      svg("rect", { x: l, y: t, width: r - l, height: bt - t, rx: 16 }, svgEl);
    });
    map.style.width = Math.ceil(mw + 16) + "px";
    // Cluster frames extend 14px left of the first node, plus a 0.6px half-stroke.
    // Reserve that painted extent in the fit, then move the whole map together.
    const clusterInset = clusters.length ? 15 : 0;
    const scale = Math.min(1.4, avail / (mw + 16 + clusterInset), freeH / map.offsetHeight);
    map.style.transform = scale !== 1 ? `scale(${scale})` : "";
    map.style.marginLeft = (clusterInset * scale) + "px";
    wrap.style.height = (map.offsetHeight * scale) + "px";
    // Grow the tree once per group per visit; later visits show it whole.
    if (!state.grown.has(k.id)) {
      sec.classList.add("grow");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        sec.classList.add("grown");
        svgEl.querySelectorAll("path").forEach(p => p.style.strokeDashoffset = 0);
      }));
      state.grown.add(k.id);
    } else {
      sec.classList.add("grown");
    }
  });
  return sec;
}

// ---- Revision record: kept on this device, per chapter ----
const FADE_DAYS = 120;
function recKey(ch) { return "kc-rec-" + ch.key; }
// Kept in memory, and saved on the device whenever the browser allows it (some previews block storage).
const REC = {};
function recLoad(ch) {
  if (!REC[ch.key]) { try { REC[ch.key] = JSON.parse(localStorage.getItem(recKey(ch)) || "{}"); } catch (e) { REC[ch.key] = {}; } }
  return REC[ch.key];
}
function recSave(ch, r) { REC[ch.key] = r; try { localStorage.setItem(recKey(ch), JSON.stringify(r)); } catch (e) {} }
function recMark(ch, id, ok) {
  const r = recLoad(ch), e = r[id] || { n: 0 };
  e.n += 1; e.ok = ok; e.t = Date.now();
  r[id] = e; recSave(ch, r);
}
// secure: last check right; slip: last check wrong; faded: right, but long ago.
// A refresh starts a new round for a key idea: checks made before it no longer count as secure or slipped.
// Nothing is deleted; each card keeps how many times (n) and when (t) it was checked.
function ideaOfCard(ch, id) {
  const m = ch._ideaOf || (ch._ideaOf = Object.fromEntries(ch.cards.map(c => [c.id, c.keyIdea])));
  return m[id];
}
function cardState(ch, id, rec) {
  rec = rec || recLoad(ch);
  const e = rec[id];
  const round = rec["idea:" + ideaOfCard(ch, id)];
  if (!e || (round && e.t <= round.refreshed)) return "";
  if (!e.ok) return "slip";
  return Date.now() - e.t > FADE_DAYS * 864e5 ? "faded" : "secure";
}
// "today", "yesterday", "3 days ago", "5 months ago"
function sinceText(t) {
  const d = Math.floor((Date.now() - t) / 864e5);
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  if (d < 31) return `${d} days ago`;
  const m = Math.round(d / 30.4);
  return m < 12 ? `${m} month${m === 1 ? "" : "s"} ago` : `${Math.round(m / 12)} year${m < 18 ? "" : "s"} ago`;
}
// The cards of an idea that have quick checks, and whether any of them has been checked (or opened) this round.
function ideaCheckIds(ch, tree) { return tree.order.map(n => n.c.id).filter(id => ((ch.checks || {})[id] || []).length); }
function ideaTouched(ch, ids, rec) { return ids.some(id => cardState(ch, id, rec) || RUNS[id]); }
// A refresh starts a new round for the whole idea: new questions, marks cleared, Undo offered until you move on.
function refreshBtn(ch, k, ids) {
  const b = el("button", "ic-refresh");
  b.append(icon("refresh"), "Refresh checks");
  b.setAttribute("aria-label", `Refresh the quick checks in ${k.title}: new questions, marks cleared`);
  b.onclick = () => {
    const rec = recLoad(ch), key = "idea:" + k.id, prev = rec[key];
    rec[key] = { refreshed: Date.now(), rounds: ((prev && prev.rounds) || 0) + 1 };
    ids.forEach(id => { delete RUNS[id]; });
    recSave(ch, rec);
    state.refreshUndo = { kid: k.id, prev };
    renderBody();
  };
  return b;
}
function undoBtn(ch, k, undo) {
  const b = el("button", "ic-undo", "Undo");
  b.onclick = () => {
    const rec = recLoad(ch), key = "idea:" + k.id;
    if (undo.prev) rec[key] = undo.prev; else delete rec[key];
    recSave(ch, rec);
    state.refreshUndo = null;
    renderBody();
  };
  return b;
}
const freshText = n => `Fresh start: the ${n} quick check${n === 1 ? "" : "s"} in this idea will ask new questions.`;
// The foot of the tree beside a card: the idea's Refresh, always in sight below the branches (they scroll, it does not).
function railRefreshEl(ch, k, tree) {
  const ids = ideaCheckIds(ch, tree);
  if (!ids.length) return null;
  const foot = el("div", "rail-foot");
  const undo = state.refreshUndo && state.refreshUndo.kid === k.id ? state.refreshUndo : null;
  if (undo) {
