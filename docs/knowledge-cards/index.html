  const pathIds = new Set(ancestors(item.node).map(n => n.c.id));
  const rec = recLoad(DATA[state.ch]);
  const nodeEl = n => {
    const li = el("li");
    const onPath = pathIds.has(n.c.id) || n === item.node;
    if (onPath) li.classList.add("path");
    const b = el("button", "tnode" + (n === item.node ? " current" : pathIds.has(n.c.id) ? " path" : ""));
    if (n.c.role) b.appendChild(roleTag(n.c.role, "role"));
    else if (n.joins && n.joins.length) { b.appendChild(roleTag("joins", "role")); li.classList.add("join"); }
    b.appendChild(rich("span", "lab", shortOf(n.c)));
    const st = cardState(DATA[state.ch], n.c.id, rec) || waitMark(DATA[state.ch], n.c);
    if (st) b.appendChild(stateIcon(st));
    else if (state.seen.has(n.c.id) && n !== item.node) b.appendChild(icon("seen", "seen"));
    b.onclick = () => jumpTo(n.c.id);
    if (n === item.node) b.setAttribute("aria-current", "true");
    li.appendChild(b);
    if (n.kids.length) {
      const ol = el("ol");
      n.kids.forEach(m => ol.appendChild(nodeEl(m)));
      li.appendChild(ol);
    }
    return li;
  };
  let lastCluster;
  let ol = null;
  tree.roots.forEach(r => {
    if (r.c.cluster !== lastCluster || !ol) {
      if (r.c.cluster) rail.appendChild(el("div", "cluster-label", r.c.cluster));
      ol = el("ol", "tree");
      rail.appendChild(ol);
      lastCluster = r.c.cluster;
    }
    ol.appendChild(nodeEl(r));
  });
  const checking = state.cardCheck && state.cardCheck.id === item.c.id;
  const foot = checking ? null : railRefreshEl(DATA[state.ch], k, tree);
  if (foot) outer.appendChild(foot);
  return outer;
}

// ---- The map slide: a group's whole tree, laid out left to right ----
function mapSlideEl(item, host) {
  const { tree, k } = item;
  const sec = el("section", "mapslide");
  sec.appendChild(el("h2", "", k.title));
  sec.appendChild(rich("p", "lede", k.summary || ""));
  // The idea's revision line: where its checks stand, when, and a fresh start for the whole group.
  const recMap = recLoad(DATA[state.ch]);
  const line = ideaCheckEl(DATA[state.ch], k, tree);
  if (line) sec.appendChild(line);
  const wrap = el("div", "tmap-wrap");
  const map = el("div", "tmap");
  wrap.appendChild(map);
  sec.appendChild(wrap);
  sec.appendChild(el("p", "maphint", "Tap any branch to open it, or press Next to start at the root."));

  // Rows: each leaf takes a row; a parent sits level with the middle of its children.
  let row = 0, maxDepth = 0;
  const clusters = [];
  const place = n => {
    n.x0 = 0;   // the column offset of a cluster placed side by side (below); a tree is laid out afresh each time
    maxDepth = Math.max(maxDepth, n.depth);
    if (n.joins && n.joins.length && !n.kids.length) n.row = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length;
    else if (n.joins && n.joins.length) {
      // A converging card with children sits level with the cards it joins: its children use the rows beside them
      // (the columns to its right are empty up there), so the arrows run straight across instead of dropping down.
      const leaves = m => (m.kids.length ? m.kids.reduce((a, k) => a + leaves(k), 0) : 1);
      const mid = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length, saved = row;
      row = Math.max(Math.min(...n.joins.map(j => j.row)), mid - (leaves(n) - 1) / 2);
      n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2;
      row = Math.max(saved, row);
    }
    else if (!n.kids.length) n.row = row++;
    else { n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; }
  };
  let lastCluster;
  tree.roots.forEach(r => {
    if (r.c.cluster && r.c.cluster !== lastCluster) {
      if (clusters.length) row += 0.6;
      clusters.push({ label: r.c.cluster, start: row, nodes: [] });
      row += 0.75;
      lastCluster = r.c.cluster;
    }
    place(r);
    if (clusters.length) {
      const walk = n => { clusters[clusters.length - 1].nodes.push(n); n.kids.forEach(walk); };
      walk(r);
      clusters[clusters.length - 1].end = row;
    }
  });
  let ROW = 90;
  const GAP = 56;
  // The slide's content is capped at 1040px, so size the columns to that, not to the stage.
  const avail = Math.max(320, Math.min(1040, (host.clientWidth || 900) - 40) - 8);
  const COL = Math.max(170, Math.min(270, Math.floor((avail + GAP) / (maxDepth + 1)) - GAP));
  map.style.width = ((maxDepth + 1) * (COL + GAP) - GAP) + "px";
  map.style.height = (row * ROW + 10) + "px";
  const els = new Map();
  tree.order.forEach(n => {
    // A branch that feeds a converging card holds its details: its root is an ordinary box, and the converging card
    // is the major (dark) card. One rule for every such root, so equal branches look equal (checker, 9 October 2026).
    const joined = new Set(tree.order.flatMap(m => m.joins || []));
    const under = m => joined.has(m) || m.kids.some(under);
    const tops = tree.roots.filter(m => !(m.joins && m.joins.length));
    const feeds = !n.parent && !(n.joins && n.joins.length) && under(n) && (!n.kids.length || tops.every(under));
    const b = el("button", "mnode" + (!n.parent && !feeds ? " root" : "") + (n.joins && n.joins.length ? " join" : ""));
    if (n.c.role) b.appendChild(roleTag(n.c.role, "role"));
    else if (n.joins && n.joins.length) b.appendChild(roleTag("joins", "role"));
    b.appendChild(rich("span", "", shortOf(n.c)));
    const st = cardState(DATA[state.ch], n.c.id, recMap) || waitMark(DATA[state.ch], n.c);
    if (st) b.appendChild(stateIcon(st));
    else if (state.seen.has(n.c.id)) b.appendChild(icon("seen", "seen"));
    b.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";
    b.style.top = (n.row * ROW + ROW / 2) + "px";
    b.style.maxWidth = COL + "px";
    b.style.transitionDelay = (n.depth * 110) + "ms";
    b.onclick = () => jumpTo(n.c.id);
    map.appendChild(b);
    els.set(n, b);
  });
  clusters.forEach(cl => {
    const lab = el("div", "cl-label", cl.label);
    lab.style.left = "0px";
    lab.style.top = (cl.start * ROW) + "px";
    map.appendChild(lab);
  });
  const svgEl = svg("svg", { class: "edges" });
  map.prepend(svgEl);

  // Once laid out: draw the edges between measured boxes, frame clusters, and fit to the width.
  requestAnimationFrame(() => {
    // Rows tighten before anything is scaled, so labels stay full-size where possible, but a row is never
    // shorter than the tallest box plus a gap: on short laptop screens squeezed rows piled boxes on top of
    // each other and buried the bottom branch. Past that point the whole map scales down instead.
    const hint = sec.querySelector(".maphint");
    const freeH = host.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top - (hint ? hint.offsetHeight : 20) - 24;
    // A formula cannot wrap: a box with nothing to its right (a leaf) widens to hold it, so no label spills out of its
    // box and no arrow starts inside the formula (9 October 2026, "sin^2 x + cos^2 x = 1").
    tree.order.forEach(n => { const e = els.get(n); if (!n.kids.length && e.scrollWidth > e.clientWidth + 1) e.style.maxWidth = (e.scrollWidth + 2) + "px"; });
    // The height a row needs (9 October 2026): a box only needs room across the rows it spans. A parent between two
    // rows may be twice as tall as a leaf, so one tall root no longer makes every row tall (trees ran out of height
    // in landscape while half the width stayed empty).
    const span = n => { if (n._lo === undefined) { const ks = n.kids.length ? n.kids : (n.joins || []);
                          const lo = ks.length ? Math.min(...ks.map(k => span(k)[0])) : n.row, hi = ks.length ? Math.max(...ks.map(k => span(k)[1])) : n.row;
                          n._lo = lo; n._hi = hi; } return [n._lo, n._hi]; };
    const rowNeed = () => { tree.order.forEach(n => { delete n._lo; delete n._hi; });
                            return Math.max(...tree.order.map(n => { const [lo, hi] = span(n); return (els.get(n).offsetHeight + 14) / (hi - lo + 1); })); };
    let nodeH = rowNeed() - 14;
    // Clusters side by side (8 October 2026): stacked clusters made a tall, narrow map that drew at about half size
    // on the iPad while most of the slide's width stayed empty. With two or more clusters, also try two columns of
    // clusters, and keep the layout that draws larger. A tree without clusters is unchanged.
    if (clusters.length > 1) {
      // Each column of clusters is only as wide as its own deepest branch (9 October 2026): a three-column cluster
      // beside a two-column one no longer reserves six columns of width.
      const spanOf = cls => (Math.max(...cls.map(cl => Math.max(...cl.nodes.map(n => n.depth)))) + 1) * (COL + GAP) - GAP;
      const span = (maxDepth + 1) * (COL + GAP) - GAP;
      const fit = (rows, w) => { const R = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, rows)));
                                 return Math.min(1.4, avail / (w + 16), freeH / (rows * R + 10)); };
      let best = 1, bestFit = 0, X2 = 0, wide = 0, bestRows = row;
      for (let i = 1; i < clusters.length; i++) {
        const rows = Math.max(clusters[i - 1].end, row - clusters[i].start);
        const a = spanOf(clusters.slice(0, i)), b = spanOf(clusters.slice(i)), f = fit(rows, a + 48 + b);
        if (f > bestFit) { best = i; bestFit = f; bestRows = rows; X2 = a + 48; wide = a + 48 + b; }
      }
      if (bestFit > fit(row, span) + 0.05) {
        const shift = clusters[best].start;
        clusters.slice(best).forEach(cl => {
          cl.start -= shift; cl.x0 = X2;
          cl.nodes.forEach(n => { n.row -= shift; n.x0 = X2; });
        });
        row = bestRows;
        map.style.width = wide + "px";   // first, or the second column's boxes are squeezed and wrap
        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";
                                  e.style.top = (n.row * ROW + ROW / 2) + "px"; });
        clusters.forEach((cl, i) => { const lab = map.querySelectorAll(".cl-label")[i];
                                      lab.style.left = (cl.x0 || 0) + "px"; lab.style.top = (cl.start * ROW) + "px"; });
        map.style.height = (row * ROW + 10) + "px";
        nodeH = rowNeed() - 14;
      }
    }
    // Two lanes (9 October 2026): a tall tree with one root ran out of height while half the slide's width stayed
    // empty. When it draws clearly larger, the root sits on top and its branches run in two lanes side by side, in
    // reading order (the first lane, then the second); a trunk line joins the root to each branch. Trees with
    // clusters or converging cards keep their own layout.
    let lanes = null;
    const LTOP = 1.15, INDENT = 30;
    if (!clusters.length && tree.roots.length === 1 && !tree.order.some(m => m.joins && m.joins.length) && tree.roots[0].kids.length >= 2) {
      const root = tree.roots[0], kids = root.kids;
      const leaves = n => (n.kids.length ? n.kids.reduce((a, k) => a + leaves(k), 0) : 1);
      const depthOf = n => Math.max(n.depth, ...n.kids.map(depthOf));
      const fitOf = (rows, w) => { const R = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, rows)));
                                   return Math.min(1.4, avail / (w + 16), freeH / (rows * R + 10)); };
      let best = null;
      for (let i = 1; i < kids.length; i++) {
        const A = kids.slice(0, i), B = kids.slice(i);
        const la = A.reduce((a, k) => a + leaves(k), 0), lb = B.reduce((a, k) => a + leaves(k), 0);
        const wa = Math.max(...A.map(depthOf)) * (COL + GAP) - GAP, wb = Math.max(...B.map(depthOf)) * (COL + GAP) - GAP;
        const w = Math.max(els.get(root).offsetWidth, INDENT + wa + 56 + INDENT + wb), rows = LTOP + Math.max(la, lb);
        const f = fitOf(rows, w);
        if (!best || f > best.f) best = { A, B, rows, w, f, xb: INDENT + wa + 56 };
      }
      if (best && best.f > fitOf(row, (maxDepth + 1) * (COL + GAP) - GAP) + 0.08) {
        lanes = { root, laneOf: new Map(), trunk: [INDENT / 2, best.xb + INDENT / 2] };
        root.row = 0; root.x0 = 0;
        [[best.A, 0], [best.B, best.xb]].forEach(([group, lx], li) => {
          let r = LTOP;
          const put = n => { n.x0 = lx + INDENT - (COL + GAP); lanes.laneOf.set(n, li);
                             if (!n.kids.length) n.row = r++; else { n.kids.forEach(put); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; } };
          group.forEach(put);
        });
        row = best.rows;
        map.style.width = best.w + "px";
        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px"; e.style.top = (n.row * ROW + ROW / 2) + "px"; });
        map.style.height = (row * ROW + 10) + "px";
        nodeH = Math.max(rowNeed(), (els.get(root).offsetHeight + 14) / LTOP) - 14;
      }
    }
    const tight = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, row)));
    if (Math.abs(tight - ROW) > 0.5) {
      ROW = tight;
      tree.order.forEach(n => els.get(n).style.top = (n.row * ROW + ROW / 2) + "px");
      clusters.forEach((cl, i) => map.querySelectorAll(".cl-label")[i].style.top = (cl.start * ROW) + "px");
      map.style.height = (row * ROW + 10) + "px";
    }
    // Edges come from the layout numbers (column from the depth, centre from the row, as the boxes are placed),
    // never from measured positions: right after the rows tightened, Chrome still reported the old positions of the
    // deeper boxes, and the edges of a tall tree were drawn about 20% short of them (2026-10-07).
    const box = n => { const e = els.get(n), x = (n.x0 || 0) + n.depth * (COL + GAP), y = n.row * ROW + ROW / 2, h = e.offsetHeight;
                        return { l: x, r: x + e.offsetWidth, t: y - h / 2, b: y + h / 2 }; };
    let mw = 0;
    // Arrows into a converging card: level from each joined card (a leaf, so its row is clear to the right), then a
    // curve into the card.
    if (tree.order.some(n => n.joins && n.joins.length)) {
      const defs = svg("defs", {}, svgEl), mk = svg("marker", { id: "kc-join-" + k.id, viewBox: "0 0 10 10", refX: 9, refY: 5,
        markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
      svg("path", { d: "M0,0 L10,5 L0,10 z", class: "joinhead" }, mk);
    }
    tree.order.forEach(n => (n.joins || []).forEach(j => {
      const a = box(j), b = box(n), x1 = a.r, y1 = (a.t + a.b) / 2, x2 = b.l - 2, y2 = (b.t + b.b) / 2;
      const xs = Math.max(x1, x2 - GAP), dx = (x2 - xs) / 2;   // level across the columns (each leaf's row is clear to its right), then an S-curve in the last gap
      const path = svg("path", { class: "join", "marker-end": `url(#kc-join-${k.id})`,
        d: `M${x1},${y1} L${xs},${y1} C${xs + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}` }, svgEl);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = state.grown.has(k.id) ? 0 : len;
      path.style.transitionDelay = (n.depth * 110 - 60) + "ms";
    }));
    tree.order.forEach(n => {
      const bx = box(n);
      mw = Math.max(mw, bx.r);
      if (!n.parent) return;
      const p = box(n.parent);
      if (lanes && n.parent === lanes.root) {
        const li = lanes.laneOf.get(n), tx = lanes.trunk[li], y2 = (bx.t + bx.b) / 2, r = 8;
        const d = li === 0
          ? `M${tx},${p.b} V${y2 - r} Q${tx},${y2} ${tx + r},${y2} L ${bx.l},${y2}`
          : `M${p.r},${(p.t + p.b) / 2} H${tx - r} Q${tx},${(p.t + p.b) / 2} ${tx},${(p.t + p.b) / 2 + r} V${y2 - r} Q${tx},${y2} ${tx + r},${y2} L ${bx.l},${y2}`;   // ends on a point, as every edge does (QA reads it)
        const path = svg("path", { d }, svgEl);
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = state.grown.has(k.id) ? 0 : len;
        path.style.transitionDelay = (n.depth * 110 - 60) + "ms";
        return;
      }
      const x1 = p.r, y1 = (p.t + p.b) / 2, x2 = bx.l, y2 = (bx.t + bx.b) / 2, dx = (x2 - x1) / 2;
      const path = svg("path", { d: `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}` }, svgEl);
      const len = path.getTotalLength();
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = state.grown.has(k.id) ? 0 : len;
      path.style.transitionDelay = (n.depth * 110 - 60) + "ms";
    });
    clusters.forEach(cl => {
      const bs = cl.nodes.map(n => box(n));
      const l = Math.min(...bs.map(b => b.l)) - 14, t = Math.min(...bs.map(b => b.t)) - 34;
      const r = Math.max(...bs.map(b => b.r)) + 14, bt = Math.max(...bs.map(b => b.b)) + 12;
      svg("rect", { x: l, y: t, width: r - l, height: bt - t, rx: 16 }, svgEl);
    });
    map.style.width = Math.ceil(mw + 16) + "px";
    const scale = Math.min(1.4, avail / (mw + 16), freeH / map.offsetHeight);
    map.style.transform = scale !== 1 ? `scale(${scale})` : "";
    wrap.style.height = (map.offsetHeight * scale) + "px";
    // Grow the tree once per group per visit; later visits show it whole.
    if (!state.grown.has(k.id)) {
      sec.classList.add("grow");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        sec.classList.add("grown");
        svgEl.querySelectorAll("path").forEach(p => p.style.strokeDashoffset = 0);
      }));
      state.grown.add(k.id);
    } else {
      sec.classList.add("grown");
    }
  });
  return sec;
}

// ---- Revision record: kept on this device, per chapter ----
const FADE_DAYS = 120;
function recKey(ch) { return "kc-rec-" + ch.key; }
// Kept in memory, and saved on the device whenever the browser allows it (some previews block storage).
const REC = {};
function recLoad(ch) {
  if (!REC[ch.key]) { try { REC[ch.key] = JSON.parse(localStorage.getItem(recKey(ch)) || "{}"); } catch (e) { REC[ch.key] = {}; } }
  return REC[ch.key];
}
function recSave(ch, r) { REC[ch.key] = r; try { localStorage.setItem(recKey(ch), JSON.stringify(r)); } catch (e) {} }
function recMark(ch, id, ok) {
  const r = recLoad(ch), e = r[id] || { n: 0 };
  e.n += 1; e.ok = ok; e.t = Date.now();
  r[id] = e; recSave(ch, r);
}
// secure: last check right; slip: last check wrong; faded: right, but long ago.
// A refresh starts a new round for a key idea: checks made before it no longer count as secure or slipped.
// Nothing is deleted; each card keeps how many times (n) and when (t) it was checked.
function ideaOfCard(ch, id) {
  const m = ch._ideaOf || (ch._ideaOf = Object.fromEntries(ch.cards.map(c => [c.id, c.keyIdea])));
  return m[id];
}
function cardState(ch, id, rec) {
  rec = rec || recLoad(ch);
  const e = rec[id];
  const round = rec["idea:" + ideaOfCard(ch, id)];
  if (!e || (round && e.t <= round.refreshed)) return "";
  if (!e.ok) return "slip";
  return Date.now() - e.t > FADE_DAYS * 864e5 ? "faded" : "secure";
}
// "today", "yesterday", "3 days ago", "5 months ago"
function sinceText(t) {
  const d = Math.floor((Date.now() - t) / 864e5);
  if (d < 1) return "today";
  if (d < 2) return "yesterday";
  if (d < 31) return `${d} days ago`;
  const m = Math.round(d / 30.4);
  return m < 12 ? `${m} month${m === 1 ? "" : "s"} ago` : `${Math.round(m / 12)} year${m < 18 ? "" : "s"} ago`;
}
// The cards of an idea that have quick checks, and whether any of them has been checked (or opened) this round.
function ideaCheckIds(ch, tree) { return tree.order.map(n => n.c.id).filter(id => ((ch.checks || {})[id] || []).length); }
function ideaTouched(ch, ids, rec) { return ids.some(id => cardState(ch, id, rec) || RUNS[id]); }
// A refresh starts a new round for the whole idea: new questions, marks cleared, Undo offered until you move on.
function refreshBtn(ch, k, ids) {
  const b = el("button", "ic-refresh");
  b.append(icon("refresh"), "Refresh checks");
  b.setAttribute("aria-label", `Refresh the quick checks in ${k.title}: new questions, marks cleared`);
  b.onclick = () => {
    const rec = recLoad(ch), key = "idea:" + k.id, prev = rec[key];
    rec[key] = { refreshed: Date.now(), rounds: ((prev && prev.rounds) || 0) + 1 };
    ids.forEach(id => { delete RUNS[id]; });
    recSave(ch, rec);
    state.refreshUndo = { kid: k.id, prev };
    renderBody();
  };
  return b;
}
function undoBtn(ch, k, undo) {
  const b = el("button", "ic-undo", "Undo");
  b.onclick = () => {
    const rec = recLoad(ch), key = "idea:" + k.id;
    if (undo.prev) rec[key] = undo.prev; else delete rec[key];
    recSave(ch, rec);
    state.refreshUndo = null;
    renderBody();
  };
  return b;
}
const freshText = n => `Fresh start: the ${n} quick check${n === 1 ? "" : "s"} in this idea will ask new questions.`;
// The foot of the tree beside a card: the idea's Refresh, always in sight below the branches (they scroll, it does not).
function railRefreshEl(ch, k, tree) {
  const ids = ideaCheckIds(ch, tree);
  if (!ids.length) return null;
  const foot = el("div", "rail-foot");
  const undo = state.refreshUndo && state.refreshUndo.kid === k.id ? state.refreshUndo : null;
  if (undo) {
    foot.append(el("span", "ic-note", freshText(ids.length)), undoBtn(ch, k, undo));
    return foot;
  }
  const rec = recLoad(ch);
  const b = refreshBtn(ch, k, ids);
  const touched = ideaTouched(ch, ids, rec);
  if (!touched) { b.disabled = true; b.title = "Nothing checked in this idea yet"; }
  const last = Math.max(0, ...ids.map(id => (cardState(ch, id, rec) && rec[id] ? rec[id].t : 0)));
  foot.append(b, el("span", "rf-sub", last ? `Last checked ${sinceText(last)}`
                                              : `${ids.length} quick check${ids.length === 1 ? "" : "s"} in this idea`));
  return foot;
}

             options: all.map(s => opt(`$f(x) ${s} ${k}$`, s === sign)) };
  },

  // Card "Each result also works backwards" (teacher, 7 October, g2): the opposite move brings the original graph back.
  "undo": () => {
    const k = rnd([2, 4, 5, 6]), up = rnd([true, false]);   // review: 3 upwards is the card's own example
    return { type: "choice", prompt: `$g(x) = f(x) ${up ? "+" : "-"} ${k}$. Which move always takes the graph of $y = g(x)$ back to the graph of $y = f(x)$?`,
             why: `The graph of $y = g(x)$ is the graph of $y = f(x)$ translated ${up ? "upwards" : "downwards"} by ${k} units, so the opposite move, ${up ? "downwards" : "upwards"} by ${k} units, brings it back: $g(x) ${up ? "-" : "+"} ${k} = f(x)$.`,
             options: shuffle([opt(`Translate it downwards by ${k} units`, up), opt(`Translate it upwards by ${k} units`, !up),
                               opt(`Translate it to the left by ${k} units`, false), opt(`Translate it to the right by ${k} units`, false)]) };
  },

  // ---- Transformations of functions ----
  // Card "Write g(x) in terms of f(x)".
  "write-g": () => {
    // quality pass (12 Oct): never f(x) = x^2 + 1 or g(x) = x^2 + 8, the card's own example (S5C3-078): a is 2 to 5
    // (5 replaces 1, so the choice stays four-wide), and a + d is never 8
    let a, d; do { a = rnd([2, 3, 4, 5]); d = rnd([2, 3, 5, 6]); } while (a + d === 8);
    if (rnd([0, 1])) {
      return { type: "choice", prompt: `$f(x) = x^2 + ${a}$ and $g(x) = x^2 + ${a + d}$. Then $g(x) =$`, eq: true,
               why: `$g(x) = (x^2 + ${a}) + ${d} = f(x) + ${d}$.`,
               options: shuffle([opt(`$f(x) + ${d}$`, true), opt(`$f(x + ${d})$`, false), opt(`$f(x) + ${a + d}$`, false), opt(`$${d}f(x)$`, false)]) };
    }
    return { type: "choice", prompt: `$f(x) = x^2 + ${a}$ and $g(x) = (x - ${d})^2 + ${a}$. Then $g(x) =$`, eq: true,
             why: `$x - ${d}$ is put in place of $x$ in $f(x)$, so $g(x) = f(x - ${d})$.`,
             options: shuffle([opt(`$f(x - ${d})$`, true), opt(`$f(x) - ${d}$`, false), opt(`$f(x + ${d})$`, false), opt(`$f(x) + ${d}$`, false)]) };
  },

  // ---- Translation ----
  // Card "Vertical or horizontal" (the root).
  "trans-sort": () => {
    // Never 3: the card's own example and negative sample are $f(x) + 3$ and $f(x + 3)$ (check 2c, 8 October).
    const [a, b, c, d] = [rnd([2, 4, 5]), rnd([1, 5, 6]), rnd([2, 5, 7]), rnd([1, 4, 5])];
    return { type: "sort", prompt: "Which translation rule is represented by each expression?",
             chips: ["Vertical", "Horizontal"],
             rows: sortRows([`$y = f(x) + ${a}$`, `$y = f(x) - ${b}$`], [`$y = f(x + ${c})$`, `$y = f(x - ${d})$`]),
             why: "$f(x) \\pm k$ moves the graph up or down; $f(x \\pm k)$ moves it to the left or right." };
  },
  // Card "Why left gives f(x + 2)": where a point goes.
  "point-move": () => {
    const a = rnd([1, 2, 3, 4, 6]), b = rnd([2, 3, 5, 7, 8]), k = rnd([2, 3, 5]);
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on the graph of $y = f(x)$. Which point must lie on the graph of $y = f(x + ${k})$?`,
             why: `$f(x + ${k})$ is the graph translated to the left by ${k} units: $(${a}, ${b})$ moves to $(${a - k}, ${b})$.`,
             options: shuffle([opt(pt(a - k, b), true), opt(pt(a + k, b), false), opt(pt(a, b + k), false), opt(pt(a, b - k), false)]) };
  },
  // Card "To the right by k".
  "trans-direction": () => {
    // Audit (8 October): not 2, 3 or 4, the needed cards' examples ($f(x) + 3$, $f(x) - 4$, $f(x \pm 2)$, $f(x + 3)$);
    // not 6 or 7 either, the forms $f(x) + 7$ and $f(x - 6)$ on the card "Write g(x) in terms of f(x)".
    const k = rnd([5, 8, 9]);
    const forms = [[`f(x) + ${k}`, 0], [`f(x) - ${k}`, 1], [`f(x + ${k})`, 2], [`f(x - ${k})`, 3]];
    const [f, i] = rnd(forms);
    const dirs = [`upwards by ${k} units`, `downwards by ${k} units`, `to the left by ${k} units`, `to the right by ${k} units`];
    return { type: "choice", prompt: `For every function $f$, the graph of $y = ${f}$ is obtained from $y = f(x)$ by translating …`,
             why: "$f(x) + k$: upwards; $f(x) - k$: downwards; $f(x + k)$: to the left; $f(x - k)$: to the right ($k > 0$).",
             options: dirs.map((d, j) => opt(d, j === i)) };
  },

  // ---- Reflection ----
  // Card "-f(x) versus f(-x)": where a point goes.
  "reflect-point": () => {
    let a, b; do { a = rnd([1, 2, 3, 4, 5, 6]); b = rnd([2, 3, 4, 7, 8, 9]); } while (a === b);
    const neg = rnd([true, false]);
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on the graph of $y = f(x)$. Which point must lie on the graph of $y = ${neg ? "-f(x)" : "f(-x)"}$?`,
             why: neg ? "$-f(x)$ multiplies each $y$-coordinate by $-1$." : "$f(-x)$ multiplies each $x$-coordinate by $-1$.",
             options: shuffle([opt(pt(a, -b), neg), opt(pt(-a, b), !neg), opt(pt(-a, -b), false), opt(pt(b, a), false)]) };
  },

  // ---- Enlargement and reduction along the y-axis ----
  // Card "Along the y-axis: what it means" (the definition, with 2 and 1/2 only).
  "yscale-point": () => {
    // values panel (15 Oct): a and b both even, so every option is a pair of whole numbers (no decimal to rule out by its looks)
    let a, b; do { a = rnd([2, 4, 6, 8]); b = rnd([2, 4, 6, 8]); } while (a === b);
    const up = rnd([true, false]);
    const img = up ? pt(a, 2 * b) : pt(a, b / 2);
    const wrong = up ? [pt(2 * a, b), pt(2 * a, 2 * b), pt(a, b / 2)] : [pt(a / 2, b), pt(a, 2 * b), pt(2 * a, b)];
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on a graph. The graph is ${up ? "enlarged to 2 times" : "reduced to $\\frac{1}{2}$ of"} the original along the $y$-axis. Where does the point go?`,
             why: up ? "Along the $y$-axis, each $y$-coordinate is multiplied by 2; the $x$-coordinate stays." : "Along the $y$-axis, each $y$-coordinate is multiplied by $\\frac{1}{2}$; the $x$-coordinate stays.",
             options: shuffle([opt(img, true), ...wrong.map(w => opt(w, false))]) };
  },
  // Card "Reduced along the y-axis": sort kf(x).
  "enlarge-reduce": () => {
    // Not 2 or 1/2: the cards' own examples (audit, 8 October).
    const big = [3, 4, 5].map(k => `$y = ${k}f(x)$`);
    const small = ["\\frac{1}{3}", "\\frac{2}{3}", "0.4"].map(k => `$y = ${k}f(x)$`);
    return { type: "sort", prompt: "Along the $y$-axis, is the graph of $y = f(x)$ enlarged or reduced?", chips: ["Enlarged", "Reduced"],
             rows: sortRows(big, small), why: "$y = kf(x)$ is an enlargement when $k > 1$ and a reduction when $0 < k < 1$." };
  },

  // ---- Enlargement and reduction along the x-axis ----
  // Card "Enlarged along the x-axis": where a point goes under f(kx).
  "xscale-point": () => {
    // values panel (15 Oct): b even too, so the option (a, b/2) is a whole-number pair like the others, not a lone fraction
    let a, b; do { a = rnd([2, 4, 6, 8]); b = rnd([2, 4, 6, 8]); } while (a === b);
    const red = rnd([true, false]);
    const g = red ? "f(2x)" : "f\\left(\\frac{1}{2}x\\right)";
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on the graph of $y = f(x)$. Which point must lie on the graph of $y = ${g}$?`,
             why: red ? "$f(2x)$ reduces the graph to $\\frac{1}{2}$ of the original along the $x$-axis: each $x$-coordinate is halved."
                      : "$f\\left(\\frac{1}{2}x\\right)$ enlarges the graph to 2 times the original along the $x$-axis: each $x$-coordinate is doubled.",
             options: shuffle([opt(pt(a / 2, b), red), opt(pt(2 * a, b), !red), opt(pt(a, 2 * b), false), opt(pt(a, b / 2), false)]) };
  },
  // Card "kf(x) versus f(kx)": sort by axis.
  "axis-sort": () => {
    // None of the card's own four ($2f(x)$, $f\left(\frac{1}{2}x\right)$, $\frac{1}{3}f(x)$, $f(3x)$), and not $f(2x)$,
    // the example of "Reduced along the x-axis" (audit, 8 October).
    const yAx = ["$y = 3f(x)$", "$y = 4f(x)$", "$y = \\frac{1}{4}f(x)$"];
    const xAx = ["$y = f(4x)$", "$y = f(5x)$", "$y = f\\left(\\frac{1}{3}x\\right)$"];
    return { type: "sort", prompt: "Using the transformation rules, along which axis is each enlargement or reduction?",
             chips: ["Along the $y$-axis", "Along the $x$-axis"], rows: sortRows(yAx, xAx),
             why: "$kf(x)$ multiplies the $y$-coordinates (along the $y$-axis); $f(kx)$ changes the $x$-coordinates (along the $x$-axis)." };
  },
  // Card "Along the x-axis: y-intercept unchanged": which intercepts move.
  "intercept-sort": () => {
    // values panel (15 Oct): five values of k, so a refresh changes the question
    const k = rnd(["2", "3", "4", "\\frac{1}{2}", "\\frac{1}{3}"]);
    const inv = { "2": "\\frac{1}{2}", "3": "\\frac{1}{3}", "4": "\\frac{1}{4}", "\\frac{1}{2}": "2", "\\frac{1}{3}": "3" }[k];   // never a fraction inside a fraction
    const same = [`$y = ${k}f(x)$: the $x$-intercepts`, `$y = f\\left(${k}x\\right)$: the $y$-intercept`];
    const times = [`$y = ${k}f(x)$: the $y$-intercept`, `$y = f\\left(${k}x\\right)$: the $x$-intercepts`];
    return { type: "sort", prompt: "The graph of $y = f(x)$ has non-zero $x$- and $y$-intercepts. Compare each original intercept with its corresponding transformed intercept. Is the indicated intercept unchanged or changed?",
             chips: ["Unchanged", "Changed"], rows: shuffle([...same.map(label => ({ label, answer: 0 })), ...times.map(label => ({ label, answer: 1 }))]),
             why: `$y = ${k}f(x)$ keeps the $x$-intercepts and multiplies the $y$-intercept by $${k}$; $y = f\\left(${k}x\\right)$ keeps the $y$-intercept and multiplies each $x$-intercept by $${inv}$.` };
  },

  // ---- Two transformations ----
  // Card "One change, one transformation".
  "two-read": () => {
    // not (2, 4): the card's own $f(x - 2) + 4$ (audit, 8 October)
    let h, v; do { h = rnd([2, 3, 4, -2, -3, -1]); v = rnd([1, 4, 5, -2, -3, -4]); } while (h === 2 && v === 4);
    const u = n => (n === 1 ? "1 unit" : `${n} units`);   // the book writes "1 unit"
    const hx = h > 0 ? `to the right by ${u(h)}` : `to the left by ${u(-h)}`, hw = h > 0 ? `to the left by ${u(h)}` : `to the right by ${u(-h)}`;
    const vx = v > 0 ? `upwards by ${u(v)}` : `downwards by ${u(-v)}`, vw = v > 0 ? `downwards by ${u(v)}` : `upwards by ${u(-v)}`;
    return { type: "choice", prompt: `$g(x) = f(${inX(h)}) ${signed(v)}$. For every function $f$, $y = g(x)$ is obtained from $y = f(x)$ by translating …`,
             why: `$${inX(h)}$ in place of $x$: ${hx}. Then $${signed(v)}$: ${vx}.`,
             options: shuffle([opt(`${hx}, and then ${vx}`, true), opt(`${hw}, and then ${vx}`, false),
                               opt(`${hx}, and then ${vw}`, false), opt(`${hw}, and then ${vw}`, false)]) };
  },
  // Card "Apply in order to write g(x)": the book's order only (reflect, then translate), as in Example 18.
  // The other order is the worked case of the later card "Sometimes the order matters".
  "two-write": () => {
    // never 3: $-f(x) - 3$ is the card's own (audit, 8 October)
    const c = rnd([2, 4, 5]), up = rnd([true, false]), s = up ? "+" : "-", t = up ? "-" : "+";
    return { type: "choice", prompt: `The graph of $y = f(x)$ is reflected with respect to the $x$-axis, and then translated ${up ? "upwards" : "downwards"} by ${c} units, giving the graph of $y = g(x)$. Which expression for $g(x)$ is valid for every function $f$?`, eq: true,
             why: `Reflecting gives $-f(x)$; translating that ${up ? "upwards" : "downwards"} by ${c} units gives $-f(x) ${s} ${c}$.`,
             options: shuffle([opt(`$-f(x) ${s} ${c}$`, true), opt(`$-f(x) ${t} ${c}$`, false),
                               opt(`$f(-x) ${s} ${c}$`, false), opt(`$-f(x ${s} ${c})$`, false)]) };
  },

  // ---- Questions that were fixed in the first build, now fresh on every visit (teacher, 7 October 2026) ----
  // Card "Constant function: maximum and minimum both c".
  "const-maxmin": () => {
    const c = rnd([3, 4, 5, 7, -1, -2, -3, -6]);   // not 2: the card's own example
    return { type: "choice", prompt: `$y = ${c}$ has …`,
             why: `For a constant function $y = c$, the maximum value and the minimum value are both $c$: here both are $${c}$.`,
             options: shuffle([opt(`maximum value $${c}$ and minimum value $${c}$`, true), opt(`maximum value $${Math.abs(c)}$ and minimum value $${-Math.abs(c)}$`, false),
                               opt("no maximum value and no minimum value", false)]) };
  },
  // Card "Linear function: no maximum or minimum".
  // Audit (8 October): only named functions, whose domain is not stated (so it is all real numbers). A statement about
  // "a linear function" in general could be argued "sometimes" for one drawn on a stated range.
  "linear-asn": () => {
    const m = rnd([2, 3, -2, -3]), c = rnd([1, 4, -5]), f = `$y = ${m}x ${signed(c)}$`;
    return rnd([
      () => asn(`${f} has a minimum value.`, "never", "A linear function has no maximum value and no minimum value."),
      () => asn(`${f} has a maximum value.`, "never", "A linear function has no maximum value and no minimum value."),
      () => asn(`The domain of ${f} is all real numbers.`, "always", "The domain of a linear function is all real numbers.")])();
  },
  // Card "Vertex and axis of symmetry".
  "axis-asn": () => rnd([
    () => asn("For $a \\neq 0$, the graph of $y = a(x - h)^2 + k$ is symmetric about the $y$-axis.", "sometimes", "Its axis of symmetry is $x = h$: the $y$-axis only when $h = 0$."),
    () => asn("For $a \\neq 0$, the axis of symmetry of the graph of $y = a(x - h)^2 + k$ passes through its vertex.", "always", "The axis of symmetry is the vertical line $x = h$, which passes through the vertex $(h, k)$."),
    () => asn("For $a \\neq 0$, the axis of symmetry of the graph of $y = a(x - h)^2 + k$ is a horizontal line.", "never", "The axis of symmetry is the vertical line $x = h$.")])(),
  // Cards "y = sin x" and "y = cos x": the domain.
  "trig-domain": () => {
    // Coordinator (15 Oct): more forms; the cards also state the maximum value 1 and the minimum value -1.
    const f = rnd(["\\sin", "\\cos"]), y = rnd(["y", "f(x)"]);
    if (rnd([true, false])) {
      return { type: "choice", prompt: `$${y} = ${f} x$ has …`,
               why: `The values of $${f} x$ lie from $-1$ to $1$: its maximum value is $1$ and its minimum value is $-1$.`,
               options: shuffle([opt("maximum value $1$ and minimum value $-1$", true), opt("maximum value $1$ and minimum value $0$", false),
                                 opt("no maximum value and no minimum value", false)]) };
    }
    return { type: "choice", prompt: `The domain of $${y} = ${f} x$ is …`,
             why: `$${f} x$ is defined for every angle. Its values lie from $-1$ to $1$.`,
             options: shuffle([opt("all angles", true), opt("$0^\\circ \\leq x$ and $x \\leq 360^\\circ$", false), opt("$-1 \\leq x \\leq 1$", false),
                               opt("all angles except $\\pm 90^\\circ$, $\\pm 270^\\circ$, $\\dots$", false)]) };
  },
  // Cards "sin, cos, tan": the period of each.
  "period-sort": () => {
    const why = "Sine and cosine repeat every $360^\\circ$; tangent repeats every $180^\\circ$.";
    if (rnd([true, false])) {
      const form = t => rnd([`$y = ${t} x$`, `$f(x) = ${t} x$`]);
      return { type: "sort", prompt: "What is the period of each function?", chips: ["$360^\\circ$", "$180^\\circ$"], why,
               rows: shuffle([{ label: form("\\sin"), answer: 0 }, { label: form("\\cos"), answer: 0 }, { label: form("\\tan"), answer: 1 }]) };
    }
    // x-range to 840, as on the card's own graph: at 760 the label 720° sat on the axis letter x (audit, 8 October).
    // Sheet (8 October): each angle label sits where its curve is not; all below the axis, they sat on the curves.
    const POS = { sin: ["below-left", "above-left", "below-left", "above"], cos: ["above", "below", "above", "below"],
                  tan: ["below-right", "below-right", "below-right", "above"] };
    const tile = fn => ({ type: "plot", x: [0, 840], y: [-2.5, 2.5], curves: [{ f: `Math.${fn}(x*Math.PI/180)`, dom: [0, 720], style: "main" }],
                          texts: [180, 360, 540, 720].map((d, i) => ({ x: d, y: 0, tex: `$${d}^\\circ$`, pos: POS[fn][i] })) });
    return { type: "sort", prompt: "What is the period of each graph?", chips: ["$360^\\circ$", "$180^\\circ$"], why,
             rows: shuffle([{ plot: tile("sin"), answer: 0 }, { plot: tile("cos"), answer: 0 }, { plot: tile("tan"), answer: 1 }]) };
  },
  // Card "y = tan x".
  "tan-asn": () => rnd([
    () => asn("$y = \\tan x$ has a maximum value.", "never", "$y = \\tan x$ has no maximum value and no minimum value."),
    () => asn("$y = \\tan x$ has a minimum value.", "never", "$y = \\tan x$ has no maximum value and no minimum value."),
    () => asn("The graph of $y = \\tan x$ is discontinuous at $x = 90^\\circ$.", "always", "$\\tan x$ is not defined at $x = \\pm 90^\\circ, \\pm 270^\\circ, \\dots$, so the graph breaks there."),
    () => asn("The graph of $y = \\tan x$ is discontinuous at $x = 180^\\circ$.", "never", "The graph breaks only at $x = \\pm 90^\\circ, \\pm 270^\\circ, \\dots$; at $x = 180^\\circ$ it crosses the $x$-axis.")])(),
  // Cards "Every y = a^x passes (0, 1)", "a > 1", "0 < a < 1": which graph can show y = a^x?
  "exp-picture": () => {
    const a = rnd(["2", "3", "0.5", "1/3"]);
    const P = curves => ({ type: "plot", x: [-3, 3], y: [-1, 5], curves: curves.map(f => (Array.isArray(f) ? { f: f[0], dom: f[1], style: "main" } : { f, style: "main" })), points: [] });
    const wrong = pickN([P([["Math.log(x)/Math.log(2)", [0.02, 3]]]), P(["x*x+1"]), P(["x+1"]), P(["1-x"])], 3);
    // Coordinator (15 Oct): two more forms, each with its condition on a; the other exponential curve is then a wrong option.
    const form = rnd([0, 1, 2]);
    if (form > 0) {
      const big = form === 1, a2 = big ? rnd(["3", "4"]) : rnd(["1/3", "0.4"]), other = big ? rnd(["1/3", "0.4"]) : rnd(["3", "4"]);   // not 2 or 1/2, the cards' own
      const w2 = [P([`Math.pow(${other},x)`]), ...pickN([P([["Math.log(x)/Math.log(2)", [0.02, 3]]]), P(["x*x+1"]), P([big ? "x+1" : "1-x"])], 2)];
      return { type: "pics", prompt: `Which graph can show $y = a^x$ with ${big ? "$a > 1$" : "$0 < a < 1$"}?`,
               why: big ? "For $a > 1$, the graph of $y = a^x$ passes through $(0, 1)$, lies above the $x$-axis and slopes upwards from left to right."
                        : "For $0 < a < 1$, the graph of $y = a^x$ passes through $(0, 1)$, lies above the $x$-axis and slopes downwards from left to right.",
               options: shuffle([{ plot: P([`Math.pow(${a2},x)`]), ok: true }, ...w2.map(w => ({ plot: w, ok: false }))]) };
    }
    return { type: "pics", prompt: "Which graph can show $y = a^x$?",
             why: "The graph of $y = a^x$ passes through $(0, 1)$, lies above the $x$-axis, and keeps rising (when $a > 1$) or keeps falling (when $0 < a < 1$).",
             options: shuffle([{ plot: P([`Math.pow(${a},x)`]), ok: true }, ...wrong.map(w => ({ plot: w, ok: false }))]) };
  },
  // Card "Every y = a^x passes (0, 1)".
  // Audit (8 October): every statement carries the card's condition on a; without it, $a = -2$ or $a = 0$ makes "sometimes".
  "exp-asn": () => rnd([
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ cuts the $x$-axis.", "never", "For $a > 0$ and $a \\neq 1$, the graph lies above the $x$-axis and does not cut it."),
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ passes through $(0, 1)$.", "always", "For $a > 0$ and $a \\neq 1$, $a^0 = 1$: the $y$-intercept is 1."),
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ lies above the $x$-axis.", "always", "For $a > 0$ and $a \\neq 1$, $a^x$ is always positive."),
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ passes through $(1, 0)$.", "never", "At $x = 1$, $y = a$, which is not 0. The point $(0, 1)$ is on every graph of $y = a^x$.")])(),
  // Card "Domain of y = log_a x".
  "log-domain": () => {
    const [b] = rnd(BASES);
    return { type: "choice", prompt: `The domain of $y = \\log_{${b}} x$ is …`,
             why: "$\\log_a x$ is defined only for positive $x$.",
             options: shuffle([opt("all positive real numbers", true), opt("all real numbers", false), opt("all non-zero real numbers", false), opt("$x > 1$", false)]) };
  },
  // Card "Every y = log_a x passes (1, 0)".
  "log-point": () => {
    const b = rnd(["3", "4", "5", "10", "\\frac{1}{2}", "\\frac{1}{4}", "0.4"]);   // not 2 or 1/3: the card's own example (coordinator, 15 Oct: more bases)
    return { type: "choice", prompt: `The graph of $y = \\log_{${b}} x$ passes through the point …`, eq: true,
             why: `$\\log_{${b}} 1 = 0$. For $a > 0$ and $a \\neq 1$, the $x$-intercept of the graph of $y = \\log_a x$ is 1, and the graph does not cut the $y$-axis.`,
             options: shuffle([opt("$(1, 0)$", true), opt("$(0, 1)$", false), opt("$(1, 1)$", false)]) };
  },
  // Card "log_a x and log_(1/a) x: mirrored in the x-axis".

// never a power: y = 3x^2 is a direct variation between y and x^2, not between y and x (a student's answer, reported
// by the teacher on 8 October 2026; the rising-direct and falling-inverse checks already say "x^2, not x").
function formOf(kind) {
  if (kind === "direct") {
    const [y, x] = rnd(LET2), X = x, c = rnd([...NUM, -2, -3, -5]);
    return { tex: `${y} = ${c}${X}`, vars: [y, x], why: `$${y} = ${c}${X}$: a constant times $${X}$, so $${y}$ varies directly as $${X}$.` };
  }
  if (kind === "inverse") {
    const [y, x] = rnd(LET2), X = x, c = rnd([...NUM, -4, -6]);
    return { tex: `${y} = \\frac{${c}}{${X}}`, vars: [y, x], why: `$${y} = \\frac{${c}}{${X}}$: a constant divided by $${X}$, so $${y}$ varies inversely as $${X}$.` };
  }
  if (kind === "joint") {
    const [z, x, w] = rnd(LET3), c = rnd(NUM);
    const f = rnd([`${z} = ${c}${x}${w}`, `${z} = \\frac{${c}${x}}{${w}}`]);
    return { tex: f, vars: [z, x, w], why: `$${f}$: one constant with a product or quotient of two variables, so it is a joint variation.` };
  }
  // partial: two constants with no common factor, so no whole number factors out of the sum
  const [c1, c2] = coprimePair();
  const [y, x] = rnd(LET2), [z, a, b] = rnd(LET3);
  const pick = rnd([[`${y} = ${c1} + ${c2}${x}`, [y, x]], [`${y} = ${c1}${x} + \\frac{${c2}}{${x}}`, [y, x]],
                    [`${z} = ${c1}${a} + ${c2}${b}`, [z, a, b]]]);
  return { tex: pick[0], vars: pick[1], why: `$${pick[0]}$: a sum of two parts, each with its own constant, so it is a partial variation.` };
}

// The book's own question (Supplementary Exercise 4 Q18(a), Q19(a)): "What type of variation is the relation
// between/among ...?". A bare "which kind" lets a joint or inverse form be argued as direct.
function kindItem(kinds) {
  const kind = rnd(kinds), f = formOf(kind);
  const vs = f.vars.map(v => `$${v}$`);
  const prompt = vs.length === 2 ? `What type of variation is the relation between ${vs[0]} and ${vs[1]}?`
                                 : `What type of variation is the relation among ${vs[0]}, ${vs[1]} and ${vs[2]}?`;
  return { type: "choice", prompt, show: f.tex, why: f.why, options: kinds.map(k => ({ label: KIND_NAME[k], ok: k === kind })) };
}


// ---- Tables, samples and sorting (added 2026-10-07 at the teacher's request) ----
// The teacher asked for hands-on judgement: tables where y/x really is constant and near misses where it is
// not, positive and negative samples to pick from, and lists to sort. The numbers stay small, so the
// judgement is about the idea (is y/x the same in every column?), not the arithmetic. After answering, the
// table shows its y/x (or xy) row, as the book does in Class Activity 4.1 (P.4.5), with any column that breaks it marked.
const pickN = (a, n) => shuffle(a).slice(0, n);
const fracTex = (p, q) => {                       // p/q in lowest terms, as KaTeX
  const g = gcd(p, q) || 1; let a = p / g, b = q / g;
  if (b < 0) { a = -a; b = -b; }
  if (b === 1) return `${a}`;
  return a < 0 ? `-\\frac{${-a}}{${b}}` : `\\frac{${a}}{${b}}`;
};
const num = v => Number.isInteger(v) ? `${v}` : `${v}`.replace(/^(-?)0\./, "$10.");
// A table of x and y in the book's layout, with the ratio row (y/x) or the product row (xy) kept for the reveal.
function valueTable(xs, ys, by) {
  const cells = xs.map((x, i) => by === "ratio" ? fracTex(2 * ys[i], 2 * x) : fracTex(ys[i] * x, 1));
  const count = {}; cells.forEach(c => { count[c] = (count[c] || 0) + 1; });
  const mode = Object.keys(count).reduce((m, c) => count[c] > count[m] ? c : m, cells[0]);
  const constant = count[mode] === cells.length;
  // Mark the columns that break a clear majority; with no majority every column differs, so mark them all.
  const major = count[mode] * 2 > cells.length;
  const odd = constant ? [] : cells.map((c, i) => (major && c === mode) ? -1 : i).filter(i => i >= 0);
  return { constant, value: mode, xs, ys,
           table: { rows: [["$x$", ...xs.map(num)], ["$y$", ...ys.map(num)]],
                    reveal: { label: by === "ratio" ? "$\\frac{y}{x}$" : "$xy$", cells: cells.map(c => `$${c}$`), odd } } };
}
const XSETS = [[1, 2, 3, 4, 5], [2, 4, 6, 8, 10], [1, 2, 4, 5, 8], [3, 4, 6, 9], [1, 3, 5, 7]];
// want: "yes" (y = kx), "add" (y = kx + c), "off" (y = kx except in one column), "square" (y = x^2)
function directTable(want) {
  const xs = rnd(XSETS);
  if (want === "yes") {
    const half = xs.every(x => x % 2 === 0) && Math.random() < 0.4;
    const k = half ? 0.5 : rnd([2, 3, 4, 5, 6]);   // positive only: "need not increase" comes four cards later
    const kt = half ? "\\frac{1}{2}" : `${k}`;
    return { ...valueTable(xs, xs.map(x => k * x), "ratio"), why: `$\\frac{y}{x} = ${kt}$ in every column, so $y = ${kt}x$.` };
  }
  if (want === "add") {
    const k = rnd([2, 3, 4, 5]), c = rnd([1, 2, 3, 4]);
    return { ...valueTable(xs, xs.map(x => k * x + c), "ratio"),
             why: `Here $y = ${k}x + ${c}$, so $\\frac{y}{x}$ changes from column to column.` };
  }
  if (want === "off") {
    const k = rnd([2, 3, 4, 5]), j = 1 + Math.floor(Math.random() * (xs.length - 1));
    const ys = xs.map((x, i) => i === j ? k * x + rnd([1, 2]) : k * x);
    return { ...valueTable(xs, ys, "ratio"),
             why: `$\\frac{y}{x} = ${k}$ in every column except one, so $y$ does not vary directly as $x$.` };
  }
  const sq = xs.every(x => x <= 6) ? xs : [1, 2, 3, 4, 5];
  return { ...valueTable(sq, sq.map(x => x * x), "ratio"), why: `Here $y = x^2$, so $\\frac{y}{x}$ grows as $x$ grows.` };
}
const KX = [[12, [1, 2, 3, 4, 6]], [24, [2, 3, 4, 6, 8]], [36, [2, 3, 4, 6, 9]], [60, [3, 4, 5, 6, 10]], [12, [2, 3, 4, 6, 12]]];
// want: "yes" (y = k/x), "line" (y = c - mx), "off" (y = k/x except in one column), "square" (y = k/x^2).
// In every case y falls as x rises, so falling together never gives the answer away.
function inverseTable(want) {
  if (want === "yes" || want === "off") {
    const [k, xs] = rnd(KX);
    let ys = xs.map(x => k / x);
    if (want === "yes") return { ...valueTable(xs, ys, "product"), why: `$xy = ${k}$ in every column, so $y = \\frac{${k}}{x}$.` };
    const spots = [];
    for (let j = 1; j < xs.length - 1; j++) for (let v = ys[j + 1] + 1; v < ys[j - 1]; v++) if (v !== ys[j]) spots.push([j, v]);
    const [j, v] = rnd(spots);
    ys = ys.slice(); ys[j] = v;
    return { ...valueTable(xs, ys, "product"),
             why: `$xy = ${k}$ in every column except one, so $y$ does not vary inversely as $x$.` };
  }
  if (want === "line") {
    const xs = rnd([[1, 2, 3, 4, 5], [1, 3, 5, 7], [2, 4, 6, 8]]), m = rnd([1, 2, 3]);
    const c = m * xs[xs.length - 1] + rnd([1, 2, 3, 4]);
    return { ...valueTable(xs, xs.map(x => c - m * x), "product"),
             why: `Here $y = ${c} - ${m === 1 ? "" : m}x$: $y$ falls, but $xy$ changes from column to column.` };
  }
  const [k, xs] = rnd([[36, [1, 2, 3, 6]], [64, [1, 2, 4, 8]], [144, [2, 3, 4, 6, 12]], [100, [1, 2, 5, 10]]]);
  return { ...valueTable(xs, xs.map(x => k / (x * x)), "product"),
           why: `Here $y = \\frac{${k}}{x^2}$: $y$ falls, but $xy$ changes from column to column.` };
}
function distinctTables(make, kinds) {
  for (;;) {
    const ts = kinds.map(make);
    if (new Set(ts.map(t => JSON.stringify(t.table.rows))).size === ts.length) return ts;
  }
}
const lineOf = (m, c) => ({ type: "plot", x: [-3, 3], y: [-3, 3], curves: [{ f: `${m}*x+(${c})`, style: "main" }], points: [] });
const curveOf = (f, dom) => ({ type: "plot", x: [-3, 3], y: [-3, 3], curves: [{ f, style: "main", ...(dom ? { dom } : {}) }], points: [] });

  typeset(main);
}

// ---- Remember the place in the URL, so a reload or bookmark returns to the same card ----
function saveHash(it) {
  if (state.path !== null || state.home) return;
  try { history.replaceState(null, "", `#${DATA[state.ch].key}/${itemKey(it)}`); } catch (e) {}
}
function readHash() {
  if (/^#quiz(?:\/|$)/.test(location.hash)) {
    state.quizScreen = quizRun ? (quizRun.finished ? "results" : "run") : "setup";
    if (location.hash === "#quiz/setup" || location.hash === "#quiz") state.quizScreen = "setup";
    state.home = false; return true;
  }
  const m = /^#([^/]+)\/(.+)$/.exec(location.hash || "");
  if (!m) return false;
  const ci = DATA.findIndex(c => c.key === m[1]);
  if (ci < 0) return false;
  state.ch = ci;
  const i = buildItems(DATA[ci]).findIndex(x => itemKey(x) === decodeURIComponent(m[2]));
  state.idx = Math.max(0, i);
  return true;
}

function renderAll() { applyMode(); renderHeader(); renderFilters(); renderBody(); }
// Student view: clean, finished chapters only. Debug view: everything, including the top panel.
function applyMode() {
  const student = studentView();
  document.body.classList.toggle("student", student);
  if (student) {
    state.teacher = false;
    state.mode = "one";
    if (!live(DATA[state.ch])) state.ch = Math.max(0, DATA.findIndex(live));
  }
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
}
const refilter = () => { state.idx = 0; renderBody(); };
document.getElementById("view").onchange = e => { state.view = e.target.value; refilter(); };
document.getElementById("lvl").onchange = e => { state.lvl = e.target.value; refilter(); };
document.getElementById("sec").onchange = e => { state.sec = e.target.value; refilter(); };
document.getElementById("sum").onchange = e => { state.sum = e.target.value; refilter(); };
document.getElementById("nf").onchange = e => { state.nf = e.target.value; refilter(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; refilter(); };
document.getElementById("ttoggle").onclick = e => {
  state.teacher = !state.teacher;
  try { localStorage.setItem("kc-teacher", state.teacher ? "1" : "0"); } catch (err) {}
  e.currentTarget.classList.toggle("on", state.teacher);
  renderHeader();
  renderBody();
};
document.getElementById("ftoggle").onclick = e => {
  const f = document.getElementById("filters");
  f.classList.toggle("open");
  e.currentTarget.classList.toggle("on", f.classList.contains("open"));
};
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; renderHeader(); renderBody(); });
document.addEventListener("keydown", e => {
  if (state.quizScreen) return;
  if (state.mode !== "one" || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "Escape") {
    if (state.home) return;
    const at = buildItems(DATA[state.ch])[state.idx];
    if (state.path !== null) exitPath("chapter"); else if (at && at.type === "chapter") goHome(); else jumpTo("chapter");
  }
});
// Rotating the iPad switches between the rail and the path line.
WIDE.addEventListener("change", () => renderBody());
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.mode === "one") renderBody(); }, 200); });
window.addEventListener("DOMContentLoaded", () => {
  quizRestore();
  // Open on the card in the URL, otherwise on the first chapter that has key ideas.
  state.teacher = false; // Public export always opens the student view.
  try { state.railOpen = localStorage.getItem("kc-rail") !== "0"; } catch (err) {}
  state.debug = false; // No debug switch in the public export.
  applyMode();
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
  // Open on the card in the address; otherwise on the home screen (choose a form, then a chapter).
  if (!readHash()) { state.ch = Math.max(0, DATA.findIndex(MODE === "student" ? live : c => c.chapter), 0); state.home = true; }
  renderAll();
});
// KaTeX loads after this script; typeset again once it is ready.
window.addEventListener("load", () => typeset(document.getElementById("body")));
</script>
</body>
</html>
