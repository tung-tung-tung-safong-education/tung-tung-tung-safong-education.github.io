                     points: [{ x: p, y: k, hollow: !incl }, { x: q, y: k, hollow: !incl }, { x: p, y: 0, hollow: !incl }, { x: q, y: 0, hollow: !incl }],
                     segments: segs,
                     texts: [{ x: p, y: 0, tex: `$${p}$`, pos: "below" }, { x: q, y: 0, tex: `$${q}$`, pos: "below" }] },
             why: `The graph is ${above ? "above" : "below"} the line $y = ${k}$ there, and the ${incl ? "filled dots show that" : "hollow circles show that"} $x = ${p}$ and $x = ${q}$ are ${incl ? "" : "not "}included: $f(x) ${sign} ${k}$.`,
             options: all.map(s => opt(`$f(x) ${s} ${k}$`, s === sign)) };
  },

  // Card "Each result also works backwards" (teacher, 7 October, g2): the opposite move brings the original graph back.
  "undo": () => {
    const k = rnd([2, 4, 5, 6]), up = rnd([true, false]);   // review: 3 upwards is the card's own example
    return { type: "choice", prompt: `$g(x) = f(x) ${up ? "+" : "-"} ${k}$. Which move always takes the graph of $y = g(x)$ back to the graph of $y = f(x)$?`,
             why: `The graph of $y = g(x)$ is the graph of $y = f(x)$ translated ${up ? "upwards" : "downwards"} by ${k} units, so the opposite move, ${up ? "downwards" : "upwards"} by ${k} units, brings it back: $g(x) ${up ? "-" : "+"} ${k} = f(x)$.`,
             options: shuffle([opt(`Translate it downwards by ${k} units`, up), opt(`Translate it upwards by ${k} units`, !up),
                               opt(`Translate it to the left by ${k} units`, false), opt(`Translate it to the right by ${k} units`, false)]) };
  },

  // ---- Transformations of functions ----
  // Card "Write g(x) in terms of f(x)".
  "write-g": () => {
    // quality pass (12 Oct): never f(x) = x^2 + 1 or g(x) = x^2 + 8, the card's own example (S5C3-078): a is 2 to 5
    // (5 replaces 1, so the choice stays four-wide), and a + d is never 8
    let a, d; do { a = rnd([2, 3, 4, 5]); d = rnd([2, 3, 5, 6]); } while (a + d === 8);
    if (rnd([0, 1])) {
      return { type: "choice", prompt: `$f(x) = x^2 + ${a}$ and $g(x) = x^2 + ${a + d}$. Then $g(x) =$`, eq: true,
               why: `$g(x) = (x^2 + ${a}) + ${d} = f(x) + ${d}$.`,
               options: shuffle([opt(`$f(x) + ${d}$`, true), opt(`$f(x + ${d})$`, false), opt(`$f(x) + ${a + d}$`, false), opt(`$${d}f(x)$`, false)]) };
    }
    return { type: "choice", prompt: `$f(x) = x^2 + ${a}$ and $g(x) = (x - ${d})^2 + ${a}$. Then $g(x) =$`, eq: true,
             why: `$x - ${d}$ is put in place of $x$ in $f(x)$, so $g(x) = f(x - ${d})$.`,
             options: shuffle([opt(`$f(x - ${d})$`, true), opt(`$f(x) - ${d}$`, false), opt(`$f(x + ${d})$`, false), opt(`$f(x) + ${d}$`, false)]) };
  },

  // ---- Translation ----
  // Card "Vertical or horizontal" (the root).
  "trans-sort": () => {
    // Never 3: the card's own example and negative sample are $f(x) + 3$ and $f(x + 3)$ (check 2c, 8 October).
    const [a, b, c, d] = [rnd([2, 4, 5]), rnd([1, 5, 6]), rnd([2, 5, 7]), rnd([1, 4, 5])];
    return { type: "sort", prompt: "Which translation rule is represented by each expression?",
             chips: ["Vertical", "Horizontal"],
             rows: sortRows([`$y = f(x) + ${a}$`, `$y = f(x) - ${b}$`], [`$y = f(x + ${c})$`, `$y = f(x - ${d})$`]),
             why: "$f(x) \\pm k$ moves the graph up or down; $f(x \\pm k)$ moves it to the left or right." };
  },
  // Card "Why left gives f(x + 2)": where a point goes.
  "point-move": () => {
    const a = rnd([1, 2, 3, 4, 6]), b = rnd([2, 3, 5, 7, 8]), k = rnd([2, 3, 5]);
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on the graph of $y = f(x)$. Which point must lie on the graph of $y = f(x + ${k})$?`,
             why: `$f(x + ${k})$ is the graph translated to the left by ${k} units: $(${a}, ${b})$ moves to $(${a - k}, ${b})$.`,
             options: shuffle([opt(pt(a - k, b), true), opt(pt(a + k, b), false), opt(pt(a, b + k), false), opt(pt(a, b - k), false)]) };
  },
  // Card "To the right by k".
  "trans-direction": () => {
    // Audit (8 October): not 2, 3 or 4, the needed cards' examples ($f(x) + 3$, $f(x) - 4$, $f(x \pm 2)$, $f(x + 3)$);
    // not 6 or 7 either, the forms $f(x) + 7$ and $f(x - 6)$ on the card "Write g(x) in terms of f(x)".
    const k = rnd([5, 8, 9]);
    const forms = [[`f(x) + ${k}`, 0], [`f(x) - ${k}`, 1], [`f(x + ${k})`, 2], [`f(x - ${k})`, 3]];
    const [f, i] = rnd(forms);
    const dirs = [`upwards by ${k} units`, `downwards by ${k} units`, `to the left by ${k} units`, `to the right by ${k} units`];
    return { type: "choice", prompt: `For every function $f$, the graph of $y = ${f}$ is obtained from $y = f(x)$ by translating …`,
             why: "$f(x) + k$: upwards; $f(x) - k$: downwards; $f(x + k)$: to the left; $f(x - k)$: to the right ($k > 0$).",
             options: dirs.map((d, j) => opt(d, j === i)) };
  },

  // ---- Reflection ----
  // Card "-f(x) versus f(-x)": where a point goes.
  "reflect-point": () => {
    let a, b; do { a = rnd([1, 2, 3, 4, 5, 6]); b = rnd([2, 3, 4, 7, 8, 9]); } while (a === b);
    const neg = rnd([true, false]);
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on the graph of $y = f(x)$. Which point must lie on the graph of $y = ${neg ? "-f(x)" : "f(-x)"}$?`,
             why: neg ? "$-f(x)$ multiplies each $y$-coordinate by $-1$." : "$f(-x)$ multiplies each $x$-coordinate by $-1$.",
             options: shuffle([opt(pt(a, -b), neg), opt(pt(-a, b), !neg), opt(pt(-a, -b), false), opt(pt(b, a), false)]) };
  },

  // ---- Enlargement and reduction along the y-axis ----
  // Card "Along the y-axis: what it means" (the definition, with 2 and 1/2 only).
  "yscale-point": () => {
    // values panel (15 Oct): a and b both even, so every option is a pair of whole numbers (no decimal to rule out by its looks)
    let a, b; do { a = rnd([2, 4, 6, 8]); b = rnd([2, 4, 6, 8]); } while (a === b);
    const up = rnd([true, false]);
    const img = up ? pt(a, 2 * b) : pt(a, b / 2);
    const wrong = up ? [pt(2 * a, b), pt(2 * a, 2 * b), pt(a, b / 2)] : [pt(a / 2, b), pt(a, 2 * b), pt(2 * a, b)];
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on a graph. The graph is ${up ? "enlarged to 2 times" : "reduced to $\\frac{1}{2}$ of"} the original along the $y$-axis. Where does the point go?`,
             why: up ? "Along the $y$-axis, each $y$-coordinate is multiplied by 2; the $x$-coordinate stays." : "Along the $y$-axis, each $y$-coordinate is multiplied by $\\frac{1}{2}$; the $x$-coordinate stays.",
             options: shuffle([opt(img, true), ...wrong.map(w => opt(w, false))]) };
  },
  // Card "Reduced along the y-axis": sort kf(x).
  "enlarge-reduce": () => {
    // Not 2 or 1/2: the cards' own examples (audit, 8 October).
    const big = [3, 4, 5].map(k => `$y = ${k}f(x)$`);
    const small = ["\\frac{1}{3}", "\\frac{2}{3}", "0.4"].map(k => `$y = ${k}f(x)$`);
    return { type: "sort", prompt: "Along the $y$-axis, is the graph of $y = f(x)$ enlarged or reduced?", chips: ["Enlarged", "Reduced"],
             rows: sortRows(big, small), why: "$y = kf(x)$ is an enlargement when $k > 1$ and a reduction when $0 < k < 1$." };
  },

  // ---- Enlargement and reduction along the x-axis ----
  // Card "Enlarged along the x-axis": where a point goes under f(kx).
  "xscale-point": () => {
    // values panel (15 Oct): b even too, so the option (a, b/2) is a whole-number pair like the others, not a lone fraction
    let a, b; do { a = rnd([2, 4, 6, 8]); b = rnd([2, 4, 6, 8]); } while (a === b);
    const red = rnd([true, false]);
    const g = red ? "f(2x)" : "f\\left(\\frac{1}{2}x\\right)";
    return { type: "choice", prompt: `The point ${pt(a, b)} lies on the graph of $y = f(x)$. Which point must lie on the graph of $y = ${g}$?`,
             why: red ? "$f(2x)$ reduces the graph to $\\frac{1}{2}$ of the original along the $x$-axis: each $x$-coordinate is halved."
                      : "$f\\left(\\frac{1}{2}x\\right)$ enlarges the graph to 2 times the original along the $x$-axis: each $x$-coordinate is doubled.",
             options: shuffle([opt(pt(a / 2, b), red), opt(pt(2 * a, b), !red), opt(pt(a, 2 * b), false), opt(pt(a, b / 2), false)]) };
  },
  // Card "kf(x) versus f(kx)": sort by axis.
  "axis-sort": () => {
    // None of the card's own four ($2f(x)$, $f\left(\frac{1}{2}x\right)$, $\frac{1}{3}f(x)$, $f(3x)$), and not $f(2x)$,
    // the example of "Reduced along the x-axis" (audit, 8 October).
    const yAx = ["$y = 3f(x)$", "$y = 4f(x)$", "$y = \\frac{1}{4}f(x)$"];
    const xAx = ["$y = f(4x)$", "$y = f(5x)$", "$y = f\\left(\\frac{1}{3}x\\right)$"];
    return { type: "sort", prompt: "Using the transformation rules, along which axis is each enlargement or reduction?",
             chips: ["Along the $y$-axis", "Along the $x$-axis"], rows: sortRows(yAx, xAx),
             why: "$kf(x)$ multiplies the $y$-coordinates (along the $y$-axis); $f(kx)$ changes the $x$-coordinates (along the $x$-axis)." };
  },
  // Card "Along the x-axis: y-intercept unchanged": which intercepts move.
  "intercept-sort": () => {
    // values panel (15 Oct): five values of k, so a refresh changes the question
    const k = rnd(["2", "3", "4", "\\frac{1}{2}", "\\frac{1}{3}"]);
    const inv = { "2": "\\frac{1}{2}", "3": "\\frac{1}{3}", "4": "\\frac{1}{4}", "\\frac{1}{2}": "2", "\\frac{1}{3}": "3" }[k];   // never a fraction inside a fraction
    const same = [`$y = ${k}f(x)$: the $x$-intercepts`, `$y = f\\left(${k}x\\right)$: the $y$-intercept`];
    const times = [`$y = ${k}f(x)$: the $y$-intercept`, `$y = f\\left(${k}x\\right)$: the $x$-intercepts`];
    return { type: "sort", prompt: "The graph of $y = f(x)$ has non-zero $x$- and $y$-intercepts. Compare each original intercept with its corresponding transformed intercept. Is the indicated intercept unchanged or changed?",
             chips: ["Unchanged", "Changed"], rows: shuffle([...same.map(label => ({ label, answer: 0 })), ...times.map(label => ({ label, answer: 1 }))]),
             why: `$y = ${k}f(x)$ keeps the $x$-intercepts and multiplies the $y$-intercept by $${k}$; $y = f\\left(${k}x\\right)$ keeps the $y$-intercept and multiplies each $x$-intercept by $${inv}$.` };
  },

  // ---- Two transformations ----
  // Card "One change, one transformation".
  "two-read": () => {
    // not (2, 4): the card's own $f(x - 2) + 4$ (audit, 8 October)
    let h, v; do { h = rnd([2, 3, 4, -2, -3, -1]); v = rnd([1, 4, 5, -2, -3, -4]); } while (h === 2 && v === 4);
    const u = n => (n === 1 ? "1 unit" : `${n} units`);   // the book writes "1 unit"
    const hx = h > 0 ? `to the right by ${u(h)}` : `to the left by ${u(-h)}`, hw = h > 0 ? `to the left by ${u(h)}` : `to the right by ${u(-h)}`;
    const vx = v > 0 ? `upwards by ${u(v)}` : `downwards by ${u(-v)}`, vw = v > 0 ? `downwards by ${u(v)}` : `upwards by ${u(-v)}`;
    return { type: "choice", prompt: `$g(x) = f(${inX(h)}) ${signed(v)}$. For every function $f$, $y = g(x)$ is obtained from $y = f(x)$ by translating …`,
             why: `$${inX(h)}$ in place of $x$: ${hx}. Then $${signed(v)}$: ${vx}.`,
             options: shuffle([opt(`${hx}, and then ${vx}`, true), opt(`${hw}, and then ${vx}`, false),
                               opt(`${hx}, and then ${vw}`, false), opt(`${hw}, and then ${vw}`, false)]) };
  },
  // Card "Apply in order to write g(x)": the book's order only (reflect, then translate), as in Example 18.
  // The other order is the worked case of the later card "Sometimes the order matters".
  "two-write": () => {
    // never 3: $-f(x) - 3$ is the card's own (audit, 8 October)
    const c = rnd([2, 4, 5]), up = rnd([true, false]), s = up ? "+" : "-", t = up ? "-" : "+";
    return { type: "choice", prompt: `The graph of $y = f(x)$ is reflected with respect to the $x$-axis, and then translated ${up ? "upwards" : "downwards"} by ${c} units, giving the graph of $y = g(x)$. Which expression for $g(x)$ is valid for every function $f$?`, eq: true,
             why: `Reflecting gives $-f(x)$; translating that ${up ? "upwards" : "downwards"} by ${c} units gives $-f(x) ${s} ${c}$.`,
             options: shuffle([opt(`$-f(x) ${s} ${c}$`, true), opt(`$-f(x) ${t} ${c}$`, false),
                               opt(`$f(-x) ${s} ${c}$`, false), opt(`$-f(x ${s} ${c})$`, false)]) };
  },

  // ---- Questions that were fixed in the first build, now fresh on every visit (teacher, 7 October 2026) ----
  // Card "Constant function: maximum and minimum both c".
  "const-maxmin": () => {
    const c = rnd([3, 4, 5, 7, -1, -2, -3, -6]);   // not 2: the card's own example
    return { type: "choice", prompt: `$y = ${c}$ has …`,
             why: `For a constant function $y = c$, the maximum value and the minimum value are both $c$: here both are $${c}$.`,
             options: shuffle([opt(`maximum value $${c}$ and minimum value $${c}$`, true), opt(`maximum value $${Math.abs(c)}$ and minimum value $${-Math.abs(c)}$`, false),
                               opt("no maximum value and no minimum value", false)]) };
  },
  // Card "Linear function: no maximum or minimum".
  // Audit (8 October): only named functions, whose domain is not stated (so it is all real numbers). A statement about
  // "a linear function" in general could be argued "sometimes" for one drawn on a stated range.
  "linear-asn": () => {
    const m = rnd([2, 3, -2, -3]), c = rnd([1, 4, -5]), f = `$y = ${m}x ${signed(c)}$`;
    return rnd([
      () => asn(`${f} has a minimum value.`, "never", "A linear function has no maximum value and no minimum value."),
      () => asn(`${f} has a maximum value.`, "never", "A linear function has no maximum value and no minimum value."),
      () => asn(`The domain of ${f} is all real numbers.`, "always", "The domain of a linear function is all real numbers.")])();
  },
  // Card "Vertex and axis of symmetry".
  "axis-asn": () => rnd([
    () => asn("For $a \\neq 0$, the graph of $y = a(x - h)^2 + k$ is symmetric about the $y$-axis.", "sometimes", "Its axis of symmetry is $x = h$: the $y$-axis only when $h = 0$."),
    () => asn("For $a \\neq 0$, the axis of symmetry of the graph of $y = a(x - h)^2 + k$ passes through its vertex.", "always", "The axis of symmetry is the vertical line $x = h$, which passes through the vertex $(h, k)$."),
    () => asn("For $a \\neq 0$, the axis of symmetry of the graph of $y = a(x - h)^2 + k$ is a horizontal line.", "never", "The axis of symmetry is the vertical line $x = h$.")])(),
  // Cards "y = sin x" and "y = cos x": the domain.
  "trig-domain": () => {
    // Coordinator (15 Oct): more forms; the cards also state the maximum value 1 and the minimum value -1.
    const f = rnd(["\\sin", "\\cos"]), y = rnd(["y", "f(x)"]);
    if (rnd([true, false])) {
      return { type: "choice", prompt: `$${y} = ${f} x$ has …`,
               why: `The values of $${f} x$ lie from $-1$ to $1$: its maximum value is $1$ and its minimum value is $-1$.`,
               options: shuffle([opt("maximum value $1$ and minimum value $-1$", true), opt("maximum value $1$ and minimum value $0$", false),
                                 opt("no maximum value and no minimum value", false)]) };
    }
    return { type: "choice", prompt: `The domain of $${y} = ${f} x$ is …`,
             why: `$${f} x$ is defined for every angle. Its values lie from $-1$ to $1$.`,
             options: shuffle([opt("all angles", true), opt("$0^\\circ \\leq x$ and $x \\leq 360^\\circ$", false), opt("$-1 \\leq x \\leq 1$", false),
                               opt("all angles except $\\pm 90^\\circ$, $\\pm 270^\\circ$, $\\dots$", false)]) };
  },
  // Cards "sin, cos, tan": the period of each.
  "period-sort": () => {
    const why = "Sine and cosine repeat every $360^\\circ$; tangent repeats every $180^\\circ$.";
    if (rnd([true, false])) {
      const form = t => rnd([`$y = ${t} x$`, `$f(x) = ${t} x$`]);
      return { type: "sort", prompt: "What is the period of each function?", chips: ["$360^\\circ$", "$180^\\circ$"], why,
               rows: shuffle([{ label: form("\\sin"), answer: 0 }, { label: form("\\cos"), answer: 0 }, { label: form("\\tan"), answer: 1 }]) };
    }
    // x-range to 840, as on the card's own graph: at 760 the label 720° sat on the axis letter x (audit, 8 October).
    // Sheet (8 October): each angle label sits where its curve is not; all below the axis, they sat on the curves.
    const POS = { sin: ["below-left", "above-left", "below-left", "above"], cos: ["above", "below", "above", "below"],
                  tan: ["below-right", "below-right", "below-right", "above"] };
    const tile = fn => ({ type: "plot", x: [0, 840], y: [-2.5, 2.5], curves: [{ f: `Math.${fn}(x*Math.PI/180)`, dom: [0, 720], style: "main" }],
                          texts: [180, 360, 540, 720].map((d, i) => ({ x: d, y: 0, tex: `$${d}^\\circ$`, pos: POS[fn][i] })) });
    return { type: "sort", prompt: "What is the period of each graph?", chips: ["$360^\\circ$", "$180^\\circ$"], why,
             rows: shuffle([{ plot: tile("sin"), answer: 0 }, { plot: tile("cos"), answer: 0 }, { plot: tile("tan"), answer: 1 }]) };
  },
  // Card "y = tan x".
  "tan-asn": () => rnd([
    () => asn("$y = \\tan x$ has a maximum value.", "never", "$y = \\tan x$ has no maximum value and no minimum value."),
    () => asn("$y = \\tan x$ has a minimum value.", "never", "$y = \\tan x$ has no maximum value and no minimum value."),
    () => asn("The graph of $y = \\tan x$ is discontinuous at $x = 90^\\circ$.", "always", "$\\tan x$ is not defined at $x = \\pm 90^\\circ, \\pm 270^\\circ, \\dots$, so the graph breaks there."),
    () => asn("The graph of $y = \\tan x$ is discontinuous at $x = 180^\\circ$.", "never", "The graph breaks only at $x = \\pm 90^\\circ, \\pm 270^\\circ, \\dots$; at $x = 180^\\circ$ it crosses the $x$-axis.")])(),
  // Cards "Every y = a^x passes (0, 1)", "a > 1", "0 < a < 1": which graph can show y = a^x?
  "exp-picture": () => {
    const a = rnd(["2", "3", "0.5", "1/3"]);
    const P = curves => ({ type: "plot", x: [-3, 3], y: [-1, 5], curves: curves.map(f => (Array.isArray(f) ? { f: f[0], dom: f[1], style: "main" } : { f, style: "main" })), points: [] });
    const wrong = pickN([P([["Math.log(x)/Math.log(2)", [0.02, 3]]]), P(["x*x+1"]), P(["x+1"]), P(["1-x"])], 3);
    // Coordinator (15 Oct): two more forms, each with its condition on a; the other exponential curve is then a wrong option.
    const form = rnd([0, 1, 2]);
    if (form > 0) {
      const big = form === 1, a2 = big ? rnd(["3", "4"]) : rnd(["1/3", "0.4"]), other = big ? rnd(["1/3", "0.4"]) : rnd(["3", "4"]);   // not 2 or 1/2, the cards' own
      const w2 = [P([`Math.pow(${other},x)`]), ...pickN([P([["Math.log(x)/Math.log(2)", [0.02, 3]]]), P(["x*x+1"]), P([big ? "x+1" : "1-x"])], 2)];
      return { type: "pics", prompt: `Which graph can show $y = a^x$ with ${big ? "$a > 1$" : "$0 < a < 1$"}?`,
               why: big ? "For $a > 1$, the graph of $y = a^x$ passes through $(0, 1)$, lies above the $x$-axis and slopes upwards from left to right."
                        : "For $0 < a < 1$, the graph of $y = a^x$ passes through $(0, 1)$, lies above the $x$-axis and slopes downwards from left to right.",
               options: shuffle([{ plot: P([`Math.pow(${a2},x)`]), ok: true }, ...w2.map(w => ({ plot: w, ok: false }))]) };
    }
    return { type: "pics", prompt: "Which graph can show $y = a^x$?",
             why: "The graph of $y = a^x$ passes through $(0, 1)$, lies above the $x$-axis, and keeps rising (when $a > 1$) or keeps falling (when $0 < a < 1$).",
             options: shuffle([{ plot: P([`Math.pow(${a},x)`]), ok: true }, ...wrong.map(w => ({ plot: w, ok: false }))]) };
  },
  // Card "Every y = a^x passes (0, 1)".
  // Audit (8 October): every statement carries the card's condition on a; without it, $a = -2$ or $a = 0$ makes "sometimes".
  "exp-asn": () => rnd([
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ cuts the $x$-axis.", "never", "For $a > 0$ and $a \\neq 1$, the graph lies above the $x$-axis and does not cut it."),
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ passes through $(0, 1)$.", "always", "For $a > 0$ and $a \\neq 1$, $a^0 = 1$: the $y$-intercept is 1."),
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ lies above the $x$-axis.", "always", "For $a > 0$ and $a \\neq 1$, $a^x$ is always positive."),
    () => asn("For $a > 0$ and $a \\neq 1$, the graph of $y = a^x$ passes through $(1, 0)$.", "never", "At $x = 1$, $y = a$, which is not 0. The point $(0, 1)$ is on every graph of $y = a^x$.")])(),
  // Card "Domain of y = log_a x".
  "log-domain": () => {
    const [b] = rnd(BASES);
    return { type: "choice", prompt: `The domain of $y = \\log_{${b}} x$ is …`,
             why: "$\\log_a x$ is defined only for positive $x$.",
             options: shuffle([opt("all positive real numbers", true), opt("all real numbers", false), opt("all non-zero real numbers", false), opt("$x > 1$", false)]) };
  },
  // Card "Every y = log_a x passes (1, 0)".
  "log-point": () => {
    const b = rnd(["3", "4", "5", "10", "\\frac{1}{2}", "\\frac{1}{4}", "0.4"]);   // not 2 or 1/3: the card's own example (coordinator, 15 Oct: more bases)

const LET2 = [["y", "x"], ["P", "Q"], ["m", "n"], ["s", "t"], ["V", "r"]];
const LET3 = [["z", "x", "w"], ["P", "Q", "R"], ["u", "v", "w"]];   // no "d": "4d" beside numbers reads badly
const NUM = [2, 3, 4, 5, 6, 7, 8, 9, 12];
const KIND_NAME = { direct: "Direct", inverse: "Inverse", joint: "Joint", partial: "Partial" };

// Two partial-variation constants with no common factor, so the sum never factors into one direct variation.
function coprimePair() { let a, b; do { [a, b] = shuffle(NUM).slice(0, 2); } while (gcd(a, b) !== 1); return [a, b]; }

// The question names the variables ("the relation between y and x"), so every form uses the variables themselves,
// never a power: y = 3x^2 is a direct variation between y and x^2, not between y and x (a student's answer, reported
// by the teacher on 8 October 2026; the rising-direct and falling-inverse checks already say "x^2, not x").
function formOf(kind) {
  if (kind === "direct") {
    const [y, x] = rnd(LET2), X = x, c = rnd([...NUM, -2, -3, -5]);
    return { tex: `${y} = ${c}${X}`, vars: [y, x], why: `$${y} = ${c}${X}$: a constant times $${X}$, so $${y}$ varies directly as $${X}$.` };
  }
  if (kind === "inverse") {
    const [y, x] = rnd(LET2), X = x, c = rnd([...NUM, -4, -6]);
    return { tex: `${y} = \\frac{${c}}{${X}}`, vars: [y, x], why: `$${y} = \\frac{${c}}{${X}}$: a constant divided by $${X}$, so $${y}$ varies inversely as $${X}$.` };
  }
  if (kind === "joint") {
    const [z, x, w] = rnd(LET3), c = rnd(NUM);
    const f = rnd([`${z} = ${c}${x}${w}`, `${z} = \\frac{${c}${x}}{${w}}`]);
    return { tex: f, vars: [z, x, w], why: `$${f}$: one constant with a product or quotient of two variables, so it is a joint variation.` };
  }
  // partial: two constants with no common factor, so no whole number factors out of the sum
  const [c1, c2] = coprimePair();
  const [y, x] = rnd(LET2), [z, a, b] = rnd(LET3);
  const pick = rnd([[`${y} = ${c1} + ${c2}${x}`, [y, x]], [`${y} = ${c1}${x} + \\frac{${c2}}{${x}}`, [y, x]],
                    [`${z} = ${c1}${a} + ${c2}${b}`, [z, a, b]]]);
  return { tex: pick[0], vars: pick[1], why: `$${pick[0]}$: a sum of two parts, each with its own constant, so it is a partial variation.` };
}

// The book's own question (Supplementary Exercise 4 Q18(a), Q19(a)): "What type of variation is the relation
// between/among ...?". A bare "which kind" lets a joint or inverse form be argued as direct.
function kindItem(kinds) {
  const kind = rnd(kinds), f = formOf(kind);
  const vs = f.vars.map(v => `$${v}$`);
  const prompt = vs.length === 2 ? `What type of variation is the relation between ${vs[0]} and ${vs[1]}?`
                                 : `What type of variation is the relation among ${vs[0]}, ${vs[1]} and ${vs[2]}?`;
  return { type: "choice", prompt, show: f.tex, why: f.why, options: kinds.map(k => ({ label: KIND_NAME[k], ok: k === kind })) };
}


// ---- Tables, samples and sorting (added 2026-10-07 at the teacher's request) ----
// The teacher asked for hands-on judgement: tables where y/x really is constant and near misses where it is
// not, positive and negative samples to pick from, and lists to sort. The numbers stay small, so the
// judgement is about the idea (is y/x the same in every column?), not the arithmetic. After answering, the
// table shows its y/x (or xy) row, as the book does in Class Activity 4.1 (P.4.5), with any column that breaks it marked.
const pickN = (a, n) => shuffle(a).slice(0, n);
const fracTex = (p, q) => {                       // p/q in lowest terms, as KaTeX
  const g = gcd(p, q) || 1; let a = p / g, b = q / g;
  if (b < 0) { a = -a; b = -b; }
  if (b === 1) return `${a}`;
  return a < 0 ? `-\\frac{${-a}}{${b}}` : `\\frac{${a}}{${b}}`;
};
const num = v => Number.isInteger(v) ? `${v}` : `${v}`.replace(/^(-?)0\./, "$10.");
// A table of x and y in the book's layout, with the ratio row (y/x) or the product row (xy) kept for the reveal.
function valueTable(xs, ys, by) {
  const cells = xs.map((x, i) => by === "ratio" ? fracTex(2 * ys[i], 2 * x) : fracTex(ys[i] * x, 1));
  const count = {}; cells.forEach(c => { count[c] = (count[c] || 0) + 1; });
  const mode = Object.keys(count).reduce((m, c) => count[c] > count[m] ? c : m, cells[0]);
  const constant = count[mode] === cells.length;
  // Mark the columns that break a clear majority; with no majority every column differs, so mark them all.
  const major = count[mode] * 2 > cells.length;
  const odd = constant ? [] : cells.map((c, i) => (major && c === mode) ? -1 : i).filter(i => i >= 0);
  return { constant, value: mode, xs, ys,
           table: { rows: [["$x$", ...xs.map(num)], ["$y$", ...ys.map(num)]],
                    reveal: { label: by === "ratio" ? "$\\frac{y}{x}$" : "$xy$", cells: cells.map(c => `$${c}$`), odd } } };
}
const XSETS = [[1, 2, 3, 4, 5], [2, 4, 6, 8, 10], [1, 2, 4, 5, 8], [3, 4, 6, 9], [1, 3, 5, 7]];
// want: "yes" (y = kx), "add" (y = kx + c), "off" (y = kx except in one column), "square" (y = x^2)
function directTable(want) {
  const xs = rnd(XSETS);
  if (want === "yes") {
    const half = xs.every(x => x % 2 === 0) && Math.random() < 0.4;
    const k = half ? 0.5 : rnd([2, 3, 4, 5, 6]);   // positive only: "need not increase" comes four cards later
    const kt = half ? "\\frac{1}{2}" : `${k}`;
    return { ...valueTable(xs, xs.map(x => k * x), "ratio"), why: `$\\frac{y}{x} = ${kt}$ in every column, so $y = ${kt}x$.` };
  }
  if (want === "add") {
    const k = rnd([2, 3, 4, 5]), c = rnd([1, 2, 3, 4]);
    return { ...valueTable(xs, xs.map(x => k * x + c), "ratio"),
             why: `Here $y = ${k}x + ${c}$, so $\\frac{y}{x}$ changes from column to column.` };
  }
  if (want === "off") {
    const k = rnd([2, 3, 4, 5]), j = 1 + Math.floor(Math.random() * (xs.length - 1));
    const ys = xs.map((x, i) => i === j ? k * x + rnd([1, 2]) : k * x);
    return { ...valueTable(xs, ys, "ratio"),
             why: `$\\frac{y}{x} = ${k}$ in every column except one, so $y$ does not vary directly as $x$.` };
  }
  const sq = xs.every(x => x <= 6) ? xs : [1, 2, 3, 4, 5];
  return { ...valueTable(sq, sq.map(x => x * x), "ratio"), why: `Here $y = x^2$, so $\\frac{y}{x}$ grows as $x$ grows.` };
}
const KX = [[12, [1, 2, 3, 4, 6]], [24, [2, 3, 4, 6, 8]], [36, [2, 3, 4, 6, 9]], [60, [3, 4, 5, 6, 10]], [12, [2, 3, 4, 6, 12]]];
// want: "yes" (y = k/x), "line" (y = c - mx), "off" (y = k/x except in one column), "square" (y = k/x^2).
// In every case y falls as x rises, so falling together never gives the answer away.
function inverseTable(want) {
  if (want === "yes" || want === "off") {
    const [k, xs] = rnd(KX);
    let ys = xs.map(x => k / x);
    if (want === "yes") return { ...valueTable(xs, ys, "product"), why: `$xy = ${k}$ in every column, so $y = \\frac{${k}}{x}$.` };
    const spots = [];
    for (let j = 1; j < xs.length - 1; j++) for (let v = ys[j + 1] + 1; v < ys[j - 1]; v++) if (v !== ys[j]) spots.push([j, v]);
    const [j, v] = rnd(spots);
    ys = ys.slice(); ys[j] = v;
    return { ...valueTable(xs, ys, "product"),
             why: `$xy = ${k}$ in every column except one, so $y$ does not vary inversely as $x$.` };
  }
  if (want === "line") {
    const xs = rnd([[1, 2, 3, 4, 5], [1, 3, 5, 7], [2, 4, 6, 8]]), m = rnd([1, 2, 3]);
    const c = m * xs[xs.length - 1] + rnd([1, 2, 3, 4]);
    return { ...valueTable(xs, xs.map(x => c - m * x), "product"),
             why: `Here $y = ${c} - ${m === 1 ? "" : m}x$: $y$ falls, but $xy$ changes from column to column.` };
  }
  const [k, xs] = rnd([[36, [1, 2, 3, 6]], [64, [1, 2, 4, 8]], [144, [2, 3, 4, 6, 12]], [100, [1, 2, 5, 10]]]);
  return { ...valueTable(xs, xs.map(x => k / (x * x)), "product"),
           why: `Here $y = \\frac{${k}}{x^2}$: $y$ falls, but $xy$ changes from column to column.` };
}
function distinctTables(make, kinds) {
  for (;;) {
    const ts = kinds.map(make);
    if (new Set(ts.map(t => JSON.stringify(t.table.rows))).size === ts.length) return ts;
  }
}
const lineOf = (m, c) => ({ type: "plot", x: [-3, 3], y: [-3, 3], curves: [{ f: `${m}*x+(${c})`, style: "main" }], points: [] });
const curveOf = (f, dom) => ({ type: "plot", x: [-3, 3], y: [-3, 3], curves: [{ f, style: "main", ...(dom ? { dom } : {}) }], points: [] });

return {
  // S5C4-022: the variation constant multiplies the whole quantity named after "as".
  "whole-expression": () => {
    const [y, x] = rnd([["p", "q"], ["y", "x"], ["s", "t"]]);
    const k = rnd([2, 3, 4, 5]), a = rnd([2, 3, 4]), sign = rnd([1, -1]);
    const term = n => `${sign > 0 ? "+" : "-"} ${n}`;
    return { type: "choice", eq: true,
      prompt: `$${y}$ varies directly as $(${x} ${term(a)})$, with variation constant $${k}$. Which equation expresses this relation?`,
      why: `The constant $${k}$ multiplies the whole bracket: $${y}=${k}(${x} ${term(a)})$.`,
      options: shuffle([
        { label: `$${y}=${k}(${x} ${term(a)})$`, ok: true },
        { label: `$${y}=${k}${x} ${term(a)}$`, ok: false },
        { label: `$${y}=${x} ${term(k * a)}$`, ok: false }
      ]), _audit: { y, x, k, a, sign } };
  },

  // On the joint-variation card that names direct, inverse or both; partial is not taught yet.
  "kind3": () => kindItem(["direct", "inverse", "joint"]),
  // On the "Joint or partial?" card, once all four kinds are known.
  "kind4": () => kindItem(["direct", "inverse", "joint", "partial"]),

  // Only what the Direct variation card itself teaches: y = cx and y = x/c are; y = cx + d is not.
  "yesno-direct": () => {
    const [y, x] = rnd(LET2), c = rnd(NUM), d = rnd(NUM);
    const k = rnd([
      { tex: `${y} = ${c}${x}`, ok: true, why: `$${y}$ is a constant times $${x}$.` },
      { tex: `${y} = \\frac{${x}}{${c}}`, ok: true, why: `$${y} = \\frac{1}{${c}}${x}$, a constant times $${x}$.` },
      { tex: `${y} = ${c}${x} + ${d}`, ok: false, why: `The added $${d}$ means $${y}$ is not a constant times $${x}$.` },
    ]);
    return { type: "choice", prompt: `Does $${y}$ vary directly as $${x}$?`, show: k.tex, why: k.why,
             options: [{ label: "Yes", ok: k.ok }, { label: "No", ok: !k.ok }] };
  },

  // Only what the Inverse variation card teaches (and direct variation, taught before it).
  "yesno-inverse": () => {
    const [y, x] = rnd(LET2), c = rnd(NUM);
    const k = rnd([
      { tex: `${y} = \\frac{${c}}{${x}}`, ok: true, why: `$${y}$ is a constant divided by $${x}$.` },
      { tex: `${y} = ${c}${x}`, ok: false, why: `A constant times $${x}$: $${y}$ varies directly as $${x}$.` },
    ]);
    return { type: "choice", prompt: `Does $${y}$ vary inversely as $${x}$?`, show: k.tex, why: k.why,
             options: [{ label: "Yes", ok: k.ok }, { label: "No", ok: !k.ok }] };
  },

  // On the Variation constant card, before any powers or inverse forms are taught. The prompt names
  // the variation, so the constant is not arguable.
  "const": () => {
    const [y, x] = rnd(LET2), c = rnd(NUM);
    const tex = `${y} = ${c}${x}`;
    return { type: "choice", prompt: `$${y}$ varies directly as $${x}$. Which is the variation constant?`, show: tex,
             why: `$k = ${c}$ in $${tex}$.`,
             options: shuffle([{ label: `$${c}$`, ok: true }, { label: `$${y}$`, ok: false }, { label: `$${x}$`, ok: false }]) };
  },

  // Needs partial variation, so it waits for that card even though it is about variation constants.
  "const-partial": () => {
    const [y, x] = rnd(LET2), [c1, c2] = coprimePair();
    const tex = `${y} = ${c1} + ${c2}${x}`;
    return { type: "choice", prompt: `$${y}$ is partly constant and partly varies directly as $${x}$. Which are the variation constants?`,
             show: tex, why: `Each part has its own constant: $${c1}$ and $${c2}$.`,
             options: shuffle([{ label: `$${c1}$ and $${c2}$`, ok: true }, { label: `$${c2}$ only`, ok: false },
                               { label: `$${c1}$ only`, ok: false }, { label: `$${x}$`, ok: false }]) };
  },
  // Positive and negative tables side by side: tap every one that is a direct variation.
  "tables-direct": () => {
    const nYes = rnd([1, 2]);
    const ts = distinctTables(directTable, [...Array(nYes).fill("yes"), ...pickN(["add", "off", "square"], 3 - nYes)]);
    return { type: "multi", prompt: "In which tables does $y$ vary directly as $x$?", ask: "Tap every one, then Check.",
             why: "$y$ varies directly as $x$ only when $\\frac{y}{x}$ is the same in every column.",
             options: shuffle(ts.map(t => ({ table: t.table, ok: t.constant }))) };
  },
  // Card "Rising together is not enough": every sample rises; only some are direct variations.
  "rising-direct": () => {
    const [a, b, c] = pickN([2, 3, 4, 5, 6, 7, 8], 3);
    const yes = pickN([
      { label: `$y = ${a}x$`, note: "a constant times $x$" },
      { label: `$y = \\frac{x}{${rnd([2, 3, 4])}}$`, note: "a constant times $x$" },
      { label: `$y = ${b}x$`, note: "a constant times $x$" }], rnd([2, 3]));
    const no = pickN([
      { label: `$y = x + ${rnd([1, 2, 3, 5])}$`, note: "a constant is added" },
      { label: `$y = ${c}x + ${rnd([1, 2, 3])}$`, note: "a constant is added" },
      { label: "$y = x^2$", note: "$x^2$, not $x$" },
      { label: "$y = \\sqrt{x}$", note: "$\\sqrt{x}$, not $x$" },
      { label: "$y = x^3$", note: "$x^3$, not $x$" }], 5 - yes.length);
    return { type: "multi", prompt: "For $x > 0$, $y$ increases as $x$ increases in every relation below. In which of them does $y$ vary directly as $x$?",
             ask: "Tap every one, then Check.", why: "Rising together is not enough: $y$ must be a constant times $x$.",
             options: shuffle([...yes.map(o => ({ ...o, ok: true })), ...no.map(o => ({ ...o, ok: false }))]) };
  },
  // Card "A line through O": two straight lines through O against a line that misses O and a curve through O.
  "graphs-direct": () => {
    const yes = pickN([0.5, 0.8, 1.2, 2], 2).map(m => ({ plot: lineOf(m, 0), ok: true, note: "straight, through $O$" }));
    const miss = rnd([{ plot: lineOf(rnd([0.6, 1]), rnd([1, 1.5, -1.5])), ok: false, note: "misses $O$" },
                      { plot: lineOf(0, rnd([1.2, -1.2])), ok: false, note: "misses $O$" }]);
    const bend = rnd([{ plot: curveOf("0.45*x*x"), ok: false, note: "through $O$, but not straight" },
                      { plot: curveOf("1.6*Math.sqrt(x)", [0, 3]), ok: false, note: "through $O$, but not straight" }]);
    return { type: "multi", prompt: "Which graphs can show $y$ varying directly as $x$?", ask: "Tap every one, then Check.",
             why: "The graph of $y = kx$ is a straight line through the origin.", options: shuffle([...yes, miss, bend]) };
  },
  // Card "Need not increase": sort direct variations by what y does.
  "sign-direct": () => {
    const up = [`y = ${rnd([2, 3, 4, 5])}x`, `y = \\frac{x}{${rnd([2, 3, 4])}}`, `y = ${rnd([0.5, 1.5, 2.5])}x`];
    const down = [`y = -${rnd([2, 3, 4, 5])}x`, `y = -\\frac{x}{${rnd([2, 3, 4])}}`, `y = -${rnd([0.5, 1.5])}x`];
    const nUp = rnd([1, 2, 3]);
    return { type: "sort", prompt: "Each relation is a direct variation. As $x$ increases, does $y$ increase or decrease?",
             chips: ["Increases", "Decreases"], why: "In $y = kx$, $y$ increases when $k > 0$ and decreases when $k < 0$.",
             rows: shuffle([...pickN(up, nUp).map(l => ({ label: `$${l}$`, answer: 0 })), ...pickN(down, 4 - nUp).map(l => ({ label: `$${l}$`, answer: 1 }))]) };
  },
  // The same three ideas for inverse variation, with the xy row.
  "table-inverse": () => {
    const t = inverseTable(rnd(["yes", "yes", "yes", "line", "off", "square"]));
    return { type: "choice", prompt: "From the table, does $y$ vary inversely as $x$?", table: t.table, why: t.why,
             options: [{ label: "Yes", ok: t.constant }, { label: "No", ok: !t.constant }] };
  },
  // Card "Falling together is not enough": every relation falls for x > 0; only some are inverse variations.
  // (Equations, not tables: the parent card "xy is constant" already asks with a table.)
  "falling-inverse": () => {
    const [a, b] = pickN([6, 8, 10, 12, 20], 2);
    const yes = pickN([
      { label: `$y = \\frac{${a}}{x}$`, note: "a constant divided by $x$" },
      { label: `$xy = ${b}$`, note: "$xy$ is constant" },
      { label: `$y = \\frac{1}{${rnd([2, 3, 4])}x}$`, note: "a constant divided by $x$" }], rnd([2, 3]));
    const no = pickN([
      { label: `$y = ${rnd([10, 12, 15])} - x$`, note: "minus a multiple of $x$" },
      { label: `$y = ${rnd([5, 7, 9])} - ${rnd([2, 3])}x$`, note: "minus a multiple of $x$" },
      { label: `$y = \\frac{${rnd([4, 9, 16])}}{x^2}$`, note: "$x^2$, not $x$" },
      { label: `$y = \\frac{${rnd([2, 3, 6])}}{\\sqrt{x}}$`, note: "$\\sqrt{x}$, not $x$" }], 5 - yes.length);
    return { type: "multi", prompt: "For $x > 0$, $y$ decreases as $x$ increases in every relation below. In which of them does $y$ vary inversely as $x$?",
             ask: "Tap every one, then Check.", why: "$y$ falling as $x$ rises is not enough: $xy$ must stay the same, that is, $y = \\frac{k}{x}$.",
             options: shuffle([...yes.map(o => ({ ...o, ok: true })), ...no.map(o => ({ ...o, ok: false }))]) };
  },
  "sign-inverse": () => {
    const [a, b] = pickN([6, 8, 10, 12, 20], 2), [c, d] = pickN([3, 5, 8, 15], 2);
    const down = [`y = \\frac{${a}}{x}`, `xy = ${b}`, `y = \\frac{1}{${rnd([2, 3, 4])}x}`];
    const up = [`y = -\\frac{${c}}{x}`, `xy = -${d}`, `y = -\\frac{1}{${rnd([2, 3, 5])}x}`];
    const nDown = rnd([1, 2, 3]);
    return { type: "sort", prompt: "Each relation is an inverse variation, and $x > 0$. As $x$ increases, does $y$ increase or decrease?",
             chips: ["Increases", "Decreases"], why: "For $x > 0$, $y = \\frac{k}{x}$ decreases when $k > 0$ and increases when $k < 0$.",
             rows: shuffle([...pickN(down, nDown).map(l => ({ label: `$${l}$`, answer: 1 })), ...pickN(up, 4 - nDown).map(l => ({ label: `$${l}$`, answer: 0 }))]) };
  },
  // The teacher's own idea (2 Oct): find the one that does not fit.
  "odd-joint": () => {
    const [z, x, w] = rnd(LET3), [c1, c2] = coprimePair();
    const joint = pickN([`${z} = ${rnd(NUM)}${x}${w}`, `${z} = ${rnd(NUM)}${x}^2${w}`, `${z} = \\frac{1}{2}${x}${w}`,
                         `${z} = ${rnd(NUM)}${x}${w}^2`], 3);
    const odd = `${z} = ${c1}${x} + ${c2}${w}`;
    return { type: "choice", prompt: "Three of these are joint variations.", ask: "Which one does not fit?", eq: true,
             why: `$${odd}$ is a sum of two parts, each with its own constant. A joint variation is one constant times a product.`,
             options: shuffle([...joint.map(l => ({ label: `$${l}$`, ok: false })), { label: `$${odd}$`, ok: true }]) };
  },
  // Card "Fixing one variable": complete each statement.
  "fixing-joint": () => {
    const forms = pickN([
      { tex: "z = kxy", y: 0, x: 0 }, { tex: "z = \\frac{kx}{y}", y: 0, x: 1 },
      { tex: "z = \\frac{ky}{x}", y: 1, x: 0 }, { tex: "z = \\frac{k}{xy}", y: 1, x: 1 }], 2);
    const note = (a, v) => a === 0 ? `a constant times $${v}$` : `a constant divided by $${v}$`;
    const rows = [];
    forms.forEach(f => {
      rows.push({ label: `$${f.tex}$, with $y$ fixed: $z$ varies … as $x$`, answer: f.y, note: note(f.y, "x") });
      rows.push({ label: `$${f.tex}$, with $x$ fixed: $z$ varies … as $y$`, answer: f.x, note: note(f.x, "y") });
    });
    return { type: "sort", prompt: "In each relation, $k$ is a non-zero constant, and any variable held fixed has a non-zero value. Complete each statement.",
             chips: ["directly", "inversely"], rows,
             why: "With one variable fixed, $z$ is a constant times the other variable (directly) or a constant divided by it (inversely)." };
  },
  // Card "Joint or partial?": classify each relation.
  "joint-or-partial": () => {
    const [z, x, w] = rnd(LET3);
    const J = [`${z} = ${rnd(NUM)}${x}${w}`, `${z} = \\frac{${rnd(NUM)}${x}}{${w}}`, `${z} = ${rnd(NUM)}${x}^2${w}`, `${z} = \\frac{${rnd(NUM)}}{${x}${w}}`];
    // Each partial row takes a different form, so the list is not the same pattern three times.
    const forms = [(c1, c2) => `${z} = ${c1}${x} + ${c2}${w}`, (c1, c2) => `${z} = ${c1} + ${c2}${x}`,
                   (c1, c2) => `${z} = ${c1}${x} + \\frac{${c2}}{${w}}`, (c1, c2) => `${z} = ${c1} + ${c2}${w}^2`];
    const nJ = rnd([1, 2, 3]);
    const P = pickN(forms, 4 - nJ).map(f => f(...coprimePair()));
    return { type: "sort", prompt: "Joint variation or partial variation?", chips: ["Joint", "Partial"],
             why: "One constant times a product (or quotient) is a joint variation. A sum of parts, each with its own constant, is a partial variation.",

  // Card "In general, 6!/2! is not (6/2)!": true or false, with the definition and 0! = 1 among the true rows.
  "fact-sort": () => {
    const n = between(5, 7), k = rnd([4, 5]);
    let a, b; do { [a, b] = two(2, 5); } while ((a === 3 && b === 4) || (a === 4 && b === 3));
    const [c, d] = rnd([[2, 4], [4, 2], [2, 5], [3, 3]]);
    const zeroTrue = rnd([true, false]);   // never 0! = 1 and 0! = 0 together: each gives the other away
    const tru = [
      { label: `$${n}! = ${n} \\times ${n - 1}!$`, note: `The factors after $${n}$ make $${n - 1}!$.` },
      { label: `$\\frac{${n}!}{${n - 1}!} = ${n}$`, note: `All the factors except $${n}$ cancel.` },
      { label: `$${n}! = ${n} \\times ${n - 1} \\times \\cdots \\times 2 \\times 1$`, note: `Multiply the positive integers up to $${n}$.` },
      ...(zeroTrue ? [{ label: "$0! = 1$", note: "This is the definition of $0!$." }] : [])];
    const fal = [
      { label: `$\\frac{${2 * k}!}{2!} = ${k}!$`, note: `Cancel $2\\times 1$ to get $${down(2 * k, 2 * k - 2)}$.` },
      { label: `$${a}! + ${b}! = ${a + b}!$`, note: `The sum is $${fact(a) + fact(b)}$, while $${a + b}!=${fact(a + b).toLocaleString("en-GB").replaceAll(",", "\\,")}$.` },
      { label: `$${c}! \\times ${d}! = ${c * d}!$`, note: `The product on the left is $${fact(c) * fact(d)}$.` },
      ...(zeroTrue ? [] : [{ label: "$0! = 0$", note: "By definition, $0!=1$." }])];
    return { type: "sort", prompt: "Is each statement true or false?", chips: ["True", "False"],
             why: "For a positive integer $n$, $n!$ is the product of the first $n$ positive integers. By definition, $0!=1$.",
             rows: sortRows(tru, fal) };
  },

  // Card 60: recognize the complete route from ordered picks to one count per selection.
  "c-formula": cycleCases([
    [5, 3, "Mia picks 3 of 5 different postcards to send to one friend. How many different sets of postcards can she send?"],
    [6, 4, "A baker picks 4 of 6 different pastries for a box. Each type can be picked once. How many different sets of pastries can go in the box?"],
    [7, 4, "Choose 4 of 7 players for a team. No positions are assigned. How many different teams can be chosen?"],
    [7, 3, "A library chooses 3 of 7 different books for a display. How many different sets of books can it choose?"],
    [8, 4, "A design club chooses 4 of 8 different designs to print. How many different sets of designs can it choose?"],
    [9, 4, "Zoe chooses 4 of 9 different pins to put in a gift bag. How many different sets of pins can she choose?"]
  ].map(([n, r, prompt]) => () => {
    const orders = Pn(n, r);
    const perSelection = fact(r);
    const ordered = P(n, r) + "&=" + down(n, r) + "=" + orders;
    const candidate = (count, ok, note) => ({
      label: "$\\begin{aligned}" + ordered + "\\\\" + Cc(n, r) + "&=" + count + "\\end{aligned}$",
      ok, note
    });
    const quotient = (denom, value) => "\\frac{" + orders + "}{" + denom + "}=" + value;
    const left = n - r;
    const mistake = r > left
      ? candidate(quotient(left + "!", orders / fact(left)), false,
          "The " + left + " objects left out are not being ordered. Arrange the " + r + " objects in the selection to find how many times it was counted.")
      : candidate(quotient(r, orders / r), false,
          "There are " + r + " choices for the first place, and the other places can still be filled in different orders. Each selection gives $" + r + "!$ orders.");
    return working(prompt,
      "Every selection of " + r + " objects occurs in exactly $" + r + "!$ orders. Divide the ordered count " + orders + " by $" + r + "!$ to get " + orders / perSelection + " selections.",
      [
        candidate(quotient(r + "!", orders / perSelection), true),
        candidate(String(orders), false, "This counts the same selection in all $" + r + "!$ of its orders."),
        mistake
      ], { n, r });
  })),

  "no-or-not-all": () => {
    const s = between(2, 4), no = rnd([true, false]);
    const ctx = rnd([["gold coins", "G", "silver coins", "S", "gold coin"], ["red flags", "R", "white flags", "W", "red flag"]]);
    const all = [];
    for (let m = 0; m < 1 << (s + 3); m++) {
      const bits = Array.from({ length: s + 3 }, (_, i) => (m >> i) & 1);
      if (bits.reduce((x, y) => x + y, 0) === 3) all.push(bits);
    }
    const run = bits => { let best = 0, cur = 0; for (const x of bits) { cur = x ? cur + 1 : 0; best = Math.max(best, cur); } return best; };
    const groups = [all.filter(r => run(r) === 1), all.filter(r => run(r) === 2), all.filter(r => run(r) === 3)];
    const notes = [`No two ${ctx[0]} are side by side.`, `Two ${ctx[0]} are side by side.`, `All three ${ctx[0]} are together.`];

    const rows = shuffle([...picked, rnd(rest)]).map(r => {
      const k = run(r) - 1;
      return { label: r.map(x => x ? ctx[1] : ctx[3]).join(" "), note: notes[k], answer: (no ? k >= 1 : k === 2) ? 1 : 0 };
    });
    const rule = no ? `No two ${ctx[0]} can be next to each other.` : `The three ${ctx[0]} must not occupy three consecutive places.`;
    return { type: "sort", prompt: `Arrange 3 ${ctx[0]} (${ctx[1]}) and ${s} ${ctx[2]} (${ctx[3]}) in a row. ${rule}`,
      ask: "Is each row allowed?", chips: ["Allowed", "Not allowed"],
      why: no ? `A row is allowed only when each ${ctx[4]} is separated from the others.`

  // Compare named groups, unnamed groups of different sizes, and interchangeable groups.
  "grouping": () => {
    // [prompt, group sizes (equal ones first), divisor k (0 = none), reason]
    const unnamed = "Only the members of each group matter.";
    const T = rnd([
      ["Split 9 students into 3 groups of 3. " + unnamed, [3, 3, 3], 3, "The same three groups can be picked in $3!$ orders. Divide by $3!$."],
      ["Split 8 students into 2 groups of 4. " + unnamed, [4, 4], 2, "Either group could be picked first. Divide by $2!$."],
      ["Assign 9 students to groups A, B and C, with 3 students in each.", [3, 3, 3], 0, "Swapping the students in two named groups gives a new assignment."],
      ["Assign 8 students to groups A and B, with 4 students in each.", [4, 4], 0, "Swapping the students in the named groups gives a new assignment."],
      ["Split 7 students into 2 groups of 2 and 1 group of 3. " + unnamed, [2, 2, 3], 2, "The two groups of 2 can be picked in either order. Divide by $2!$."],
      ["Split 8 students into 2 groups of 3 and 1 group of 2. " + unnamed, [3, 3, 2], 2, "The two groups of 3 can be picked in either order. Divide by $2!$."],
      ["Split 8 students into 2 groups of 2 and 1 group of 4. " + unnamed, [2, 2, 4], 2, "The two groups of 2 can be picked in either order. Divide by $2!$."],
      ["Split 7 students into a group of 3 and a group of 4. " + unnamed, [3, 4], 0, "The group sizes tell you which group is which. Keep the product as it is."],
      ["Split 9 students into a group of 4 and a group of 5. " + unnamed, [4, 5], 0, "The group sizes tell you which group is which. Keep the product as it is."],
      ["Split 9 students into groups of 2, 3 and 4. " + unnamed, [2, 3, 4], 0, "The group sizes tell you which group is which. Keep the product as it is."],
      ["Give 8 different books to two named students, 4 books each.", [4, 4], 0, "Swapping the sets of books changes who receives each book."],
      ["Give 9 different books to three named students, 3 books each.", [3, 3, 3], 0, "Swapping the sets of books changes who receives each book."]]);
    const [say, sizes, k, why] = T;
    let left = sizes.reduce((x, y) => x + y, 0);
    const factors = sizes.map(m => { const n = left; left -= m; return { tex: Cc(n, m), count: C(n, m) }; });
    const prod = factors.map(f => f.tex).join(" \\times ");
    const evaluated = factors.map(f => f.count).join(" \\times ");
    const labelled = factors.reduce((v, f) => v * f.count, 1);
    const corrections = sizes.length >= 3 ? [0, 2, 3] : [0, 2, -2];
    const result = d => d > 0 ? labelled / fact(d) : d < 0 ? labelled * fact(-d) : labelled;
    // A fractional final count would reveal a wrong option without judging the group symmetry.
    const credible = corrections.filter(d => Number.isInteger(result(d)));
    const groupFactor = d => d > 0 ? `\\frac{1}{${d}!}=\\frac{1}{${fact(d)}}` : d < 0 ? `${-d}!=${fact(-d)}` : `1`;
    const numericFactor = d => d > 0 ? `\\frac{1}{${fact(d)}}` : d < 0 ? `${fact(-d)}` : `1`;
    const correctionReason = d => d === k ? why
      : d < 0 ? (k === 0
          ? "The product already counts each assignment once. " + why
          : "The product already counts each split more than once. " + why)
      : d === 0 ? `The ${k} unnamed groups of the same size can be picked in $${k}!$ orders. Divide to count each split once.`
      : k === 0 ? "The division would combine different outcomes. " + why
      : `Only ${k} groups can be swapped without changing the split. Divide by $${k}!$.`;
    const options = credible.map(d => ({
      label: `$\\begin{gathered}${prod}\\\\=${evaluated}=${labelled}\\\\\\text{Adjustment: }${groupFactor(d)}\\\\${labelled}\\times ${numericFactor(d)}=${result(d)}\\text{ ways}\\end{gathered}$`,
      ok: d === k, note: correctionReason(d),
      _route: { correction: d, factors: factors.map(f => f.count), labelled, result: result(d) }
    }));
    return { type: "choice", eq: true, annotated: true,
      prompt: `${say} Which working counts the possible outcomes of this task?`,
      why,
      options: shuffle(options), _audit: { kind: "group", say, sizes, k } };
  },

  // Both symbols and arithmetic change between the four contexts. Each option treats both code blocks.
  "mixed-code-reuse": () => {
    const [letters, digits, L, D, reuse] = rnd([[3,4,2,2,true], [4,4,2,3,false], [3,4,2,2,false], [5,3,2,2,true]]);
    const ways = (pool, length, repeat) => repeat ? [ `${pool}^{${length}}`, pool ** length ]
      : [ `(${down(pool, length)})`, Pn(pool, length) ];
    const opt = (repeatL, repeatD, ok, note) => {
      const [x, a] = ways(letters, L, repeatL), [y, b] = ways(digits, D, repeatD);
      return countChoice(times([x, y]), a * b, ok, note);
    };
    return working(`Make a code with ${L} letters chosen from ${letters} letters, followed by ${D} digits chosen from ${digits} digits. Repetition is ${reuse ? "allowed" : "forbidden"} in both parts. How many codes can you make?`,
      reuse ? "Every slot uses the full supply for its part of the code."
        : "The count drops within each part. When the digit slots begin, the full digit supply is still available.", [
        opt(reuse, reuse, true),
        opt(!reuse, reuse, false, reuse ? "The letter choices do not decrease. Each letter may be used again."
          : "A used letter is no longer available for the next letter slot."),
        opt(reuse, !reuse, false, reuse ? "The digit choices do not decrease. Each digit may be used again."
          : "A used digit is no longer available for the next digit slot.")
      ], { letters, digits, L, D, reuse });
  },

  // Compare the three different pair models from the class table on S5C5-015.
  "class-pair": () => {
    const [a, b, d, e, mode] = rnd([[2,3,4,5,2], [3,2,5,6,1], [2,4,3,5,2], [3,5,6,2,1], [4,3,5,2,0]]);
    const tasks = ["How many ways can you choose one student from each class?",
      "How many ways can you choose a boy and a girl from the two classes? They may be from the same class.",
      "How many ways can you choose a boy and a girl from different classes?"];
    const counts = [
      [`(${a}+${b})(${d}+${e})`, (a+b)*(d+e)],
      [`(${a}+${d})(${b}+${e})`, (a+d)*(b+e)],
      [`${times([a,e])}+${times([d,b])}`, a*e+d*b]
    ];
    const why = ["Use the two class totals. Any student from X can be paired with any student from Y.",
      "Add the boys across classes and add the girls across classes. Then multiply the two totals.",
      "Pair an X boy with a Y girl, or a Y boy with an X girl. Multiply within each case and add the two counts."][mode];
    const notes = ["This pairs by class and allows pairs with two boys or two girls.",
      mode === 0 ? "This pairs by sex and allows students from the same class. The question needs one from each class."
        : "This includes same-class boy–girl pairs. The two students must be from different classes.",
      mode === 0 ? "This misses pairs of two boys or two girls from different classes. Both kinds of pair are allowed."
        : "This leaves out boy–girl pairs from the same class, which are allowed here."];
    return { ...working(tasks[mode], why,
      counts.map(([f, n], i) => countChoice(f, n, i === mode, i === mode ? undefined : notes[i])), { a,b,d,e,mode }),
      table: { head:"row", rows: [["Class", "Number of boys", "Number of girls"], ["X", String(a), String(b)], ["Y", String(d), String(e)]] } };
  },

  else if (it.path) { wt = it.k ? it.k.title : ""; wsub = (it.skill ? "Skill · optional · " : "") + `${cardItems.indexOf(it) + 1} of ${cardItems.length} for ${drillName(ch)} ${drillRange(ch.chapter.drillGroups[state.path].drills)}`; }
  else if (it.type === "map") { wt = it.k.title; wsub = `Idea ${maps.indexOf(it) + 1} of ${maps.length} · ${it.tree.order.length} cards`; }
  else if (it.tree) { wt = it.k.title; wsub = `${it.tree.order.indexOf(it.node) + 1} of ${it.tree.order.length} in this idea · card ${cardItems.indexOf(it) + 1} of ${cardItems.length}`; }
  else if (it.c) { wt = it.c.sectionTitle || ""; wsub = `Card ${cardItems.indexOf(it) + 1} of ${cardItems.length}`; }
  pos.appendChild(rich("span", "wt", wt));
  const wsEl = el("span", "ws", wsub);
  if (it.path && it.skill) {
    const skip = el("button", "skip", "Skip skills");
    skip.onclick = () => { state.idx = items.length - 1; state.step = 1; renderBody(); };
    wsEl.appendChild(skip);
  }
  pos.appendChild(wsEl);
  const prog = el("div", "prog" + (state.path !== null ? " path" : ""));
  const bar = el("i");
  bar.style.transform = `scaleX(${items.length > 1 ? state.idx / (items.length - 1) : 1})`;
  prog.appendChild(bar);
  pos.appendChild(prog);
  nav.append(mapBtn, back, pos, next);
  body.appendChild(nav);
  // Arrive from the side we moved towards.
  const arrived = stage.firstElementChild;
  if (arrived && state.step) arrived.classList.add(state.step > 0 ? "enter-fwd" : "enter-back");
  state.step = 0;
  state.arrived = false;

  typeset(body);
  const fitNow = () => {
    const card = stage.querySelector(".card.big");
    fitWithTab(card);
    // Portrait: a tree with too little room under the card folds away, but its Refresh row stays when it fits.
    const panel = stage.querySelector(".branchpanel");
    if (panel) {
      panel.classList.remove("foot-only");
      panel.style.display = "";
      const h = panel.getBoundingClientRect().height;
      if (h < 180) {
        if (h >= 64 && panel.querySelector(".rail-foot")) panel.classList.add("foot-only");
        else panel.style.display = "none";
      }
    }
    // A tree that does not fit tightens first (smaller rows), and only then scrolls inside its box.
    body.querySelectorAll(".rail-inner").forEach(ri => {
      // Measure the existing inline density before wrapping, so extra role rows never shrink the words.
      ri.classList.add("measure-density");
      ri.classList.remove("compact", "tight");
      if (ri.scrollHeight > ri.clientHeight + 1) ri.classList.add("compact");
      if (ri.scrollHeight > ri.clientHeight + 1) ri.classList.add("tight");
      ri.classList.remove("measure-density");
    });
    // Keep the current branch in view inside the rail or panel (they scroll; the page never does).
    const cur = body.querySelector(".tnode.current");
    const box = cur && cur.closest(".rail-inner");
    if (box && box.offsetParent) box.scrollTop += cur.getBoundingClientRect().top - box.getBoundingClientRect().top - box.clientHeight / 2;
  };
  requestAnimationFrame(fitNow);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (stage.isConnected) fitNow(); });
  const on = body.querySelector(".kchip.on");
  if (on) { const st = on.parentElement; st.scrollLeft = Math.max(0, on.offsetLeft - st.clientWidth / 2 + on.offsetWidth / 2); }
  saveHash(it);

  // Swipe left or right on the stage to move.
  // A media card reserves its entire stage for playback/scrolling. Native arrows
  // still navigate, including when a finger starts just outside the scrubber.
  /* PRIVATE-LIFECYCLE-BEGIN stageSwipeBinding */
  let swipeTouch = null;
  const hasPlayer = () => !!stage.querySelector('.vis.manim-web,.kc-manim-host,.kc-substitution-video,video,.kc-scoped-visual-host');
  const usesTouch = target => !!target?.closest?.('input,select,button,a,textarea,video,canvas,[contenteditable],.vis.plot.live,.kc-manim-controls,.kc-manim-timeline');
  const onStageTouchStart = e => {
    swipeTouch = null;
    if (hasPlayer() || e.touches.length !== 1 || usesTouch(e.target)) return;
    const t = e.touches[0];
    swipeTouch = { id: t.identifier, x: t.clientX, y: t.clientY };
  };
  const onStageTouchMove = e => {
    if (e.touches.length !== 1 || usesTouch(e.target) || hasPlayer()) swipeTouch = null;
  };
  const onStageTouchCancel = () => { swipeTouch = null; };
  const onStageTouchEnd = e => {
    const start = swipeTouch;
    swipeTouch = null;
    if (!start || hasPlayer() || usesTouch(e.target) || e.touches.length) return;
    const end = Array.from(e.changedTouches).find(t => t.identifier === start.id);
    if (!end) return;
    const dx = end.clientX - start.x, dy = end.clientY - start.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(dx < 0 ? 1 : -1);
  };
  const stageSwipeHandlers = [
    ["touchstart", onStageTouchStart], ["touchmove", onStageTouchMove],
    ["touchcancel", onStageTouchCancel], ["touchend", onStageTouchEnd]
  ];
  for (const [type, handler] of stageSwipeHandlers)
    stage.addEventListener(type, handler, { passive: true });
  let swipeReleased = false;
  releaseStageSwipe = () => {
    if (swipeReleased) return;
    swipeReleased = true;
    for (const [type, handler] of stageSwipeHandlers)
      stage.removeEventListener(type, handler, false);
    swipeTouch = null;
  };
  /* PRIVATE-LIFECYCLE-END stageSwipeBinding */
}
function go(step) {
  const items = buildItems(DATA[state.ch]);
  const i = state.idx + step;
  if (i < 0 || i >= items.length) return;
  state.idx = i;
  state.step = step;
  state.cardCheck = null;
  state.refreshUndo = null;
  state.arrived = true;
  renderBody();
}
function itemKey(it) { return it.type === "chapter" ? "chapter" : it.type === "done" ? "done" : it.type === "map" ? "map-" + it.k.id : it.c.id; }
function jumpTo(key) {
  let items = buildItems(DATA[state.ch]);
  let i = items.findIndex(x => itemKey(x) === key);
  if (i < 0 && state.path !== null) { state.path = null; items = buildItems(DATA[state.ch]); i = items.findIndex(x => itemKey(x) === key); }
  if (i < 0) return;
  state.home = false;
  state.mode = "one";
  state.idx = i;
  state.cardCheck = null;
  state.refreshUndo = null;
  state.arrived = true;
  renderHeader();
  renderBody();
  window.scrollTo({ top: 0 });
}
function renderOverview(body, ch, items) {
  const main = el("main", "overview");
  const addGrid = cards => {
    const grid = el("div", "grid");
    cards.forEach(c => {
      const e = cardEl(c, ch, false);
      if (c.hidden) e.classList.add("isdropped");
      else e.onclick = () => jumpTo(c.id);
      grid.appendChild(e);
    });
    main.appendChild(grid);
  };
  const cards = items.filter(x => x.type === "card").map(x => x.c);
  if (grouped(ch)) {
    ch.keyIdeas.forEach(k => {
      const inK = cards.filter(c => c.keyIdea === k.id);
      const dropped = state.teacher ? ch.cards.filter(c => c.keyIdea === k.id && c.hidden) : [];
      if (!inK.length && !dropped.length) return;
      const head = el("div", "ki");
      head.appendChild(el("h2", "", `${k.title}  ·  ${inK.length} cards`));
      head.appendChild(rich("p", "", k.summary || ""));
      main.appendChild(head);
      addGrid(inK);
      if (dropped.length) {
        main.appendChild(el("h2", "sec", `Dropped from revision (${dropped.length})`));
        addGrid(dropped);
      }
    });
  } else {
    let cur = null, buf = [];
    cards.forEach(c => {
      if (c.section !== cur) {
        if (buf.length) addGrid(buf);
        buf = [];
        cur = c.section;
        main.appendChild(el("h2", "sec", `${c.section || "?"}  ${c.sectionTitle || ""}`));
      }
      buf.push(c);
    });
    if (buf.length) addGrid(buf);
  }
  body.appendChild(main);
  typeset(main);
}

// ---- Remember the place in the URL, so a reload or bookmark returns to the same card ----
function saveHash(it) {
  if (state.path !== null || state.home) return;
  try { history.replaceState(null, "", `#${DATA[state.ch].key}/${itemKey(it)}`); } catch (e) {}
}
function readHash() {
  if (/^#quiz(?:\/|$)/.test(location.hash)) {
    state.quizScreen = quizRun ? (quizRun.finished ? "results" : "run") : "setup";
    if (location.hash === "#quiz/setup" || location.hash === "#quiz") state.quizScreen = "setup";
    state.home = false; return true;
  }
  const m = /^#([^/]+)\/(.+)$/.exec(location.hash || "");
  if (!m) return false;
  const ci = DATA.findIndex(c => c.key === m[1]);
  if (ci < 0) return false;
  state.ch = ci;
  const i = buildItems(DATA[ci]).findIndex(x => itemKey(x) === decodeURIComponent(m[2]));
  state.idx = Math.max(0, i);
  return true;
}

function renderAll() { applyMode(); renderHeader(); renderFilters(); renderBody(); }
// Student view: clean, finished chapters only. Debug view: everything, including the top panel.
function applyMode() {
  const student = studentView();
  document.body.classList.toggle("student", student);
  if (student) {
    state.teacher = false;
    state.mode = "one";
    if (!live(DATA[state.ch])) state.ch = Math.max(0, DATA.findIndex(live));
  }
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
}
const refilter = () => { state.idx = 0; renderBody(); };
document.getElementById("view").onchange = e => { state.view = e.target.value; refilter(); };
document.getElementById("lvl").onchange = e => { state.lvl = e.target.value; refilter(); };
document.getElementById("sec").onchange = e => { state.sec = e.target.value; refilter(); };
document.getElementById("sum").onchange = e => { state.sum = e.target.value; refilter(); };
document.getElementById("nf").onchange = e => { state.nf = e.target.value; refilter(); };
document.getElementById("q").oninput = e => { state.q = e.target.value; refilter(); };
document.getElementById("ttoggle").onclick = e => {
  state.teacher = !state.teacher;
  try { localStorage.setItem("kc-teacher", state.teacher ? "1" : "0"); } catch (err) {}
  e.currentTarget.classList.toggle("on", state.teacher);
  renderHeader();
  renderBody();
};
document.getElementById("ftoggle").onclick = e => {
  const f = document.getElementById("filters");
  f.classList.toggle("open");
  e.currentTarget.classList.toggle("on", f.classList.contains("open"));
};
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; renderHeader(); renderBody(); });
document.addEventListener("keydown", e => {
  if (state.quizScreen) return;
  if (state.mode !== "one" || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(1);
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "Escape") {
    if (state.home) return;
    const at = buildItems(DATA[state.ch])[state.idx];
    if (state.path !== null) exitPath("chapter"); else if (at && at.type === "chapter") goHome(); else jumpTo("chapter");
  }
});
// Rotating the iPad switches between the rail and the path line.
WIDE.addEventListener("change", () => { if (window.KCManimResize) (window.KCScopedVisuals ? window.KCScopedVisuals.resize(() => window.KCManimResize.render(renderBody)) : window.KCManimResize.render(renderBody)); else renderBody(); });
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.mode === "one") { if (window.KCManimResize) (window.KCScopedVisuals ? window.KCScopedVisuals.resize(() => window.KCManimResize.render(renderBody)) : window.KCManimResize.render(renderBody)); else renderBody(); } }, 200); });
window.addEventListener("DOMContentLoaded", () => {
  quizRestore();
  // Open on the card in the URL, otherwise on the first chapter that has key ideas.
  state.teacher = false;
  try { state.railOpen = localStorage.getItem("kc-rail") !== "0"; } catch (err) {}
  state.debug = false;
  applyMode();
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
  // Open on the card in the address; otherwise on the home screen (choose a form, then a chapter).
  if (!readHash()) { state.ch = 0; state.idx = 0; state.home = true; }
  renderAll();
});
// KaTeX loads after this script; typeset again once it is ready.
window.addEventListener("load", () => typeset(document.getElementById("body")));
</script>
