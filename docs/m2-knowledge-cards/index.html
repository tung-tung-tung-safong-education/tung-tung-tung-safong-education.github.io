e, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-1", "level": "core", "example": "In $\\int 2x\\,dx=x^2+C$, any constant value of $C$ gives a primitive function.", "check": {"pages": ["7.5"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-015", "role": "wording", "short": "Constant of integration", "treeOrder": 8, "cluster": "Notation"}, {"id": "M2C7-019", "section": "7.1", "sectionTitle": "Concept of Indefinite Integration", "kind": "common-mistake", "title": "Write the complete integral notation", "statement": "Write the integral sign, integrand and differential together as $\\int f(x)\\,dx$. Omitting the differential can make the notation ambiguous.", "sources": [{"page": "Page05", "printed": "7.5", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-1", "level": "core", "example": "Write $\\int f(x)\\,dx$, including $dx$.", "check": {"pages": ["7.5"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-015", "role": "warning", "short": "Write the whole integral", "treeOrder": 9, "cluster": "Notation"}, {"id": "M2C7-020", "section": "7.1", "sectionTitle": "Concept of Indefinite Integration", "kind": "common-mistake", "title": "Keep the arbitrary constant", "statement": "Do not omit the arbitrary constant $C$ when giving an indefinite integral.", "sources": [{"page": "Page05", "printed": "7.5", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-1", "level": "core", "example": "$\\int 5\\,dx=5x+C$ includes the constant of integration.", "check": {"pages": ["7.5"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-014", "role": "warning", "short": "Keep the constant", "treeOrder": 4, "cluster": "Meaning"}, {"id": "M2C7-021", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "property", "title": "Integral of a constant", "statement": "For a constant $k$, $\\int k\\,dx=kx+C$.", "sources": [{"page": "Page06", "printed": "7.6", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-2", "level": "core", "example": "$\\int dx=\\int 1\\,dx=x+C$.", "check": {"pages": ["7.55", "7.6"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Integrating a constant", "treeOrder": 10}, {"id": "M2C7-022", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "property", "title": "Integral of a power", "statement": "For a real number ==$n\\ne-1$==, $\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}+C$ on an interval where the real powers are differentiable.", "sources": [{"page": "Page06", "printed": "7.6", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}, {"page": "Page07", "printed": "7.7", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-2", "level": "core", "example": "For $x>0$, $\\int\\frac{dx}{\\sqrt x}=\\int x^{-1/2}\\,dx=2\\sqrt x+C$.", "watchOut": "When $n=-1$, the denominator $n+1$ is zero, so this formula ==cannot== be used.", "inferred": "The interval wording makes the real-power domain implicit in the formula explicit; the example is the teaching example on 7.7.", "check": {"pages": ["7.55", "7.6", "7.7"], "date": "2026-10-25", "result": "fixed", "notes": "(unmarked) The visible source-page list omits 7.7, where the displayed source-derived example appears.", "final": "pass"}, "parent": null, "role": null, "short": "Integrating a power", "treeOrder": 11}, {"id": "M2C7-023", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "property", "title": "Integral of the reciprocal", "statement": "For ==$x\\ne0$==, $\\int\\frac1x\\,dx=\\ln|x|+C$ on each interval of definition.", "sources": [{"page": "Page06", "printed": "7.6", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-2", "level": "core", "example": "For $x<0$, $\\ln|x|=\\ln(-x)$, which is real.", "check": {"pages": ["7.55", "7.6"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Integrating the reciprocal", "treeOrder": 12}, {"id": "M2C7-024", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "property", "title": "Integral of the exponential", "statement": "The exponential function is its own derivative, so $\\int e^x\\,dx=e^x+C$.", "sources": [{"page": "Page06", "printed": "7.6", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-2", "level": "core", "example": "$\\frac{d}{dx}(e^x+C)=e^x$.", "check": {"pages": ["7.55", "7.6"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Integrating the exponential", "treeOrder": 14}, {"id": "M2C7-025", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "property", "title": "Integral of a scaled exponential", "statement": "For a ==non-zero== constant $k$, $\\int e^{kx}\\,dx=\\frac1k e^{kx}+C$.", "sources": [{"page": "Page06", "printed": "7.6", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}, {"page": "Page08", "printed": "7.8", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-2", "level": "core", "example": "$\\int e^{2x}\\,dx=\\frac12 e^{2x}+C$.", "watchOut": "If $k=0$, the integrand is $1$, whose integral is $x+C$.", "inferred": "The k=0 case answers the question raised in magenta teaching note 4 on 7.6; the displayed example is the main teaching example on 7.8.", "check": {"pages": ["7.55", "7.6", "7.8"], "date": "2026-10-25", "result": "fixed", "notes": "(unmarked) The visible source-page list omits 7.8, where the displayed source-derived example appears.", "final": "pass"}, "parent": "M2C7-024", "role": "extends", "short": "A scaled exponent", "treeOrder": 15}, {"id": "M2C7-026", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "condition", "title": "Power rule excludes minus one", "statement": "The power integration formula excludes $n=-1$ because its denominator $n+1$ would be zero.", "sources": [{"page": "Page06", "printed": "7.6", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-2", "level": "extra", "hidden": true, "hiddenWhy": "The full n ≠ −1 condition is already on the power-rule card; the explanation is retained there and in enrichment."}, {"id": "M2C7-027", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "explanation", "title": "Why $\\ln|x|$ has absolute value", "statement": "For $x<0$, $\\ln|x|=\\ln(-x)$ and its derivative is $\\frac1{-x}(-1)=\\frac1x$. For $x>0$, $\\ln|x|=\\ln x$ has the same derivative.", "sources": [{"page": "Page06", "printed": "7.6", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-2", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["Interval", "Expression", "Derivative"], ["$x>0$", "$\\ln x$", "$\\frac1x$"], ["$x<0$", "$\\ln(-x)$", "$\\frac1x$"]], "words": false}, "check": {"pages": ["7.6"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "authored": true, "remember": "$\\ln|x|$ works on either side of zero; $x=0$ is excluded.", "inferred": "The book proof is rearranged into a two-case explanation table; its domain is unchanged.", "parent": "M2C7-023", "role": "why", "short": "Why $\\ln|x|$ works", "treeOrder": 13}, {"id": "M2C7-028", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "notation", "title": "Integral with integrand one", "statement": "$\\int dx$ means $\\int 1\\,dx$.", "sources": [{"page": "Page06", "printed": "7.6", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-2", "level": "extra", "hidden": true, "hiddenWhy": "Minor notation for integrand 1 is included with the constant formula."}, {"id": "M2C7-029", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "method-idea", "title": "Check by differentiation", "statement": "Differentiate a proposed primitive function and compare the result with the integrand. A match confirms that it is a primitive function.", "sources": [{"page": "Page06", "printed": "7.6", "where": "main text"}, {"page": "Page07", "printed": "7.7", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-2", "level": "core", "example": "$\\frac{d}{dx}\\left(\\frac{x^5}{5}+C\\right)=x^4$, so $\\int x^4\\,dx=\\frac{x^5}{5}+C$.", "check": {"pages": ["7.6", "7.7"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Differentiate to check", "treeOrder": 16}, {"id": "M2C7-030", "section": "7.2 A", "sectionTitle": "Basic Integration Formulas", "kind": "method-idea", "title": "Rewrite roots as powers", "statement": "Write a root or reciprocal power as $x^n$ before using the power integration formula.", "sources": [{"page": "Page07", "printed": "7.7", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inferred": "The worked example rewrites 1/sqrt(x) as x^(-1/2); this states the method idea without its calculation.", "inSummary": false, "keyIdea": "K7-2", "level": "extra", "hidden": true, "hiddenWhy": "Rewriting roots as powers is prerequisite algebra; the integration example shows the notation where needed."}, {"id": "M2C7-031", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "property", "title": "Constant multiple of an integrand", "statement": "For a ==non-zero== constant $k$, $\\int kf(x)\\,dx=k\\int f(x)\\,dx$.", "sources": [{"page": "Page08", "printed": "7.8", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}, {"page": "Page09", "printed": "7.9", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "inferred": "Theorem 7.2 (7.8) explicitly requires non-zero constant k, while summary 3(a) (7.55) says constant without that restriction. The theorem condition is retained; both source wordings remain recorded pending teacher judgement. The summary extraction’s k=0 interpretation is not adopted.", "keyIdea": "K7-3", "level": "core", "example": "$\\int\\frac6x\\,dx=6\\int\\frac1x\\,dx=6\\ln|x|+C$ for ==$x\\ne0$==.", "check": {"pages": ["7.55", "7.8", "7.9"], "date": "2026-10-25", "result": "fixed", "notes": "(unmarked) The visible source-page list omits 7.9, where the displayed source-derived example appears.", "final": "pass"}, "parent": "M2C7-033", "role": "property", "short": "A constant multiple", "treeOrder": 18}, {"id": "M2C7-032", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "property", "title": "Rescaling an arbitrary constant", "statement": "If $C$ is arbitrary and $k\\ne0$ is constant, then $\\frac Ck$ is also an arbitrary constant.", "sources": [{"page": "Page08", "printed": "7.8", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-3", "level": "extra", "hidden": true, "hiddenWhy": "The constant-multiple property already retains the non-zero condition; a separate proof-constant detail dilutes revision."}, {"id": "M2C7-033", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "property", "title": "Integrate sums and differences", "statement": "For functions $f$ and $g$ with primitive functions, integrate a sum or difference term by term.", "sources": [{"page": "Page09", "printed": "7.9", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-3", "level": "core", "example": "e.g. $\\int(x^2+e^x)\\,dx=\\int x^2\\,dx+\\int e^x\\,dx$.", "check": {"pages": ["7.55", "7.9"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "confirmed": "2026-10-25"}, "inferred": "An authored unevaluated sum-rule illustration was added after the student first-look review; the source property and its conditions are retained.", "parent": null, "role": null, "short": "Sums and differences", "treeOrder": 17}, {"id": "M2C7-034", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "property", "title": "Integral of a difference", "statement": "$\\int[f(x)-g(x)]\\,dx=\\int f(x)\\,dx-\\int g(x)\\,dx$.", "sources": [{"page": "Page09", "printed": "7.9", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-3", "level": "extra", "hidden": true, "hiddenWhy": "The sum-and-difference property is kept together on card 033, with both signs."}, {"id": "M2C7-035", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "property", "title": "Combining arbitrary constants", "statement": "A sum or difference of arbitrary constants can be written as one arbitrary constant $C$.", "sources": [{"page": "Page09", "printed": "7.9", "where": "margin note"}, {"page": "Page10", "printed": "7.10", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-3", "level": "core", "example": "$C_1-C_2=C$: write one $+C$ in the final result.", "check": {"pages": ["7.10", "7.9"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-033", "role": "consequence", "short": "One arbitrary constant", "treeOrder": 19}, {"id": "M2C7-036", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "property", "title": "Integrating several terms", "statement": "The sum and difference properties extend to more than two integrand terms.", "sources": [{"page": "Page09", "printed": "7.9", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "example": "$\\int[f(x)-g(x)+h(x)]\\,dx=\\int f(x)\\,dx-\\int g(x)\\,dx+\\int h(x)\\,dx$.", "inSummary": false, "keyIdea": "K7-3", "level": "extra", "hidden": true, "hiddenWhy": "The sum rule applies term by term; a separate three-term restatement adds no new distinction."}, {"id": "M2C7-037", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Expand before integrating", "statement": "Expand a product into simpler terms, then integrate the terms separately.", "sources": [{"page": "Page11", "printed": "7.11", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-3", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int e^{-x}(5e^{3x}-4)\\,dx$"], ["Expand", "$I=\\int(5e^{2x}-4e^{-x})\\,dx$"], ["Integrate", "$I=\\frac52e^{2x}+4e^{-x}+C$"]], "words": true}, "check": {"pages": ["7.11"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "inferred": "Source Example7.5(a), p7.11, placed in original-given-first order; no new example.", "parent": "M2C7-033", "role": "method", "short": "Expand the product", "treeOrder": 20}, {"id": "M2C7-038", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Split into simpler fractions", "statement": "Expand the numerator and split the fraction into terms whose primitives are known. Work on an interval that excludes zero.", "sources": [{"page": "Page11", "printed": "7.11", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-3", "level": "core", "check": {"pages": ["7.11"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int\\frac{(x^2-1)(2x+3)}{x^2}\\,dx$, $x\\ne0$"], ["Split", "$I=\\int(2x+3-\\frac2x-\\frac3{x^2})\\,dx$"], ["Integrate", "$I=x^2+3x-2\\ln|x|+\\frac3x+C$"]], "words": true}, "inferred": "Restores the complete source Example7.5(b), p7.11, including the logarithm absolute value and excluded zero.", "parent": "M2C7-037", "role": "contrast", "short": "Split the fraction", "treeOrder": 21}, {"id": "M2C7-039", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "common-mistake", "title": "Do not multiply the separate integrals", "statement": "==In general==, integrating a product ==does not mean== multiplying the separate integrals.", "sources": [{"page": "Page11", "printed": "7.11", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-3", "level": "core", "example": "$\\int f(x)g(x)\\,dx\\ne\\left[\\int f(x)\\,dx\\right]\\left[\\int g(x)\\,dx\\right]$ ==in general==.", "check": {"pages": ["7.11"], "date": "2026-10-25", "result": "fixed", "notes": "(scope) The title can deny a general integration identity for products, although integration by parts supplies one; the source only rejects multiplying separate integrals.", "final": "pass"}, "parent": "M2C7-033", "role": "warning", "short": "Do not multiply separate integrals", "treeOrder": 24}, {"id": "M2C7-040", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "common-mistake", "title": "Do not divide the separate integrals", "statement": "==In general==, integrating a quotient ==does not mean== dividing the separate integrals.", "sources": [{"page": "Page11", "printed": "7.11", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-3", "level": "core", "example": "$\\int\\frac{f(x)}{g(x)}\\,dx\\ne\\frac{\\int f(x)\\,dx}{\\int g(x)\\,dx}$ ==in general==, where the expressions are defined.", "check": {"pages": ["7.11"], "date": "2026-10-25", "result": "fixed", "notes": "(scope) The title is broader than the source warning; the source rejects dividing separate integrals rather than asserting that no general identity can exist.", "final": "pass"}, "parent": "M2C7-039", "role": "contrast", "short": "Do not divide separate integrals", "treeOrder": 25}, {"id": "M2C7-041", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Recovering a function from its derivative", "statement": "If $\\frac{dy}{dx}=f(x)$, recover $y$ by integrating $f(x)$ with respect to $x$.", "sources": [{"page": "Page12", "printed": "7.12", "where": "margin note"}, {"page": "Page46", "printed": "7.46", "where": "main text"}, {"page": "Page57", "printed": "7.57", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-11", "level": "core", "example": "$\\frac{dy}{dx}=3x^2+x-2$ gives $y=x^3+\\frac12x^2-2x+C$.", "check": {"pages": ["7.12", "7.46", "7.57"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Recover the function", "treeOrder": 85, "cluster": "From a slope"}, {"id": "M2C7-042", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Integrate an exponential with another base", "statement": "For $a>0$ and $a\\ne1$, write $a^x=e^{x\\ln a}$ and use the exponential integration formula.", "sources": [{"page": "Page14", "printed": "7.14", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. Exercise 7A Q41 scaffolds the arbitrary-base rewrite; the general positive-base conditions are stated explicitly.", "keyIdea": "K7-3", "level": "core", "example": "$\\int a^x\\,dx=\\frac{a^x}{\\ln a}+C$.", "check": {"pages": ["7.14"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-033", "role": "method", "short": "A different exponential base", "treeOrder": 26}, {"id": "M2C7-043", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Exponential functions with a linear exponent", "statement": "For $a>0$, $a\\ne1$ and a ==non-zero== constant $k$, rewrite $a^{kx}$ as $e^{kx\\ln a}$ before integrating.", "sources": [{"page": "Page61", "printed": "7.61", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in an exercise but does not state it in the text. Revision Exercise 7 Q65 uses base 2 in a time-rate model; this records the general method without its answer.", "keyIdea": "K7-3", "level": "core", "example": "$\\int a^{kx}\\,dx=\\frac{a^{kx}}{k\\ln a}+C$.", "check": {"pages": ["7.61"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-042", "role": "extends", "short": "A linear exponent", "treeOrder": 27}, {"id": "M2C7-044", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Rationalise before integrating", "statement": "For the denominator $\\sqrt{x-a}-\\sqrt{x-b}$, take real $a\\ne b$, $x\\ge a$ and $x\\ge b$. Multiplying by its conjugate gives denominator $b-a$.", "sources": [{"page": "Page62", "printed": "7.62", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Completes the source challenging-question1(a), p7.62; the original general identity 1/(sqrt(x-a)-sqrt(x-b))=(sqrt(x-a)+sqrt(x-b))/(b-a) and its real-root conditions are retained in the statement and this provenance. This is not Quick Practice.", "keyIdea": "K7-3", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int\\frac{dx}{\\sqrt{x-1}-\\sqrt{x-2}}$, $x>2$"], ["Conjugate", "$I=\\int(\\sqrt{x-1}+\\sqrt{x-2})\\,dx$"], ["Integrate", "$I=\\frac23(x-1)^{3/2}+\\frac23(x-2)^{3/2}+C$"]], "words": true}, "check": {"pages": ["7.62"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "parent": "M2C7-038", "role": "contrast", "short": "Rationalise a denominator", "treeOrder": 23}, {"id": "M2C7-045", "section": "7.2 B", "sectionTitle": "Properties of Indefinite Integrals", "kind": "method-idea", "title": "Divide a rational integrand first", "statement": "Divide first when the numerator degree is at least the denominator degree. Then integrate the resulting polynomial and proper fraction on a common interval.", "sources": [{"page": "Page62", "printed": "7.62", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Small authored linear-denominator illustration completes division using only prior power/logarithm knowledge. It is absent from Quick Practice7.5, p7.11, and every existing concept-check given. The source p7.62 identity (3x^3+12x-2)/(x^2+4)=3x-2/(x^2+4) remains the provenance for the method; its arctangent remainder is deliberately not imported into this early card.", "keyIdea": "K7-3", "level": "core", "check": {"pages": ["7.62"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int\\frac{x^2+1}{x+1}\\,dx$, $x\\ne-1$"], ["Divide", "$\\frac{x^2+1}{x+1}=x-1+\\frac2{x+1}$"], ["Integrate", "$I=\\frac{x^2}{2}-x+2\\ln|x+1|+C$"]], "words": true}, "parent": "M2C7-038", "role": "extends", "short": "Divide the polynomials", "treeOrder": 22}, {"id": "M2C7-046", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "property", "title": "Substitution formula", "statement": "For a differentiable function $u=g(x)$, $du=g^{\\prime}(x)\\,dx$, so $\\int f(g(x))g^{\\prime}(x)\\,dx=\\int f(u)\\,du$.", "sources": [{"page": "Page14", "printed": "7.14", "where": "definition box"}, {"page": "Page55", "printed": "7.55", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-4", "level": "core", "example": "e.g. $u=x^2$, $du=2x\\,dx$: $\\int2xe^{x^2}\\,dx=\\int e^u\\,du$.", "check": {"pages": ["7.14", "7.55"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "confirmed": "2026-10-25"}, "inferred": "An authored unevaluated substitution illustration was added after the student first-look review; it illustrates the variable and differential change without giving a Quick Practice answer.", "parent": null, "role": null, "short": "Change the variable", "treeOrder": 28}, {"id": "M2C7-047", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "method-idea", "title": "Integration by substitution", "statement": "Integration by substitution changes the variable to put an integral into a form with a known integral.", "sources": [{"page": "Page14", "printed": "7.14", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "extra", "hidden": true, "hiddenWhy": "The substitution formula and complete procedure on 046 and 049 cover this general method definition."}, {"id": "M2C7-048", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "link", "title": "Substitution reverses the chain rule", "statement": "The chain rule gives $\\frac{d}{dx}F(g(x))=f(g(x))g^{\\prime}(x)$ when $F^{\\prime}=f$; integration by substitution reverses this relation.", "sources": [{"page": "Page15", "printed": "7.15", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "extra", "hidden": true, "hiddenWhy": "The reverse-chain-rule reason is explained in enrichment; this separate proof link is redundant."}, {"id": "M2C7-049", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "method-idea", "title": "The complete substitution procedure", "statement": "Choose $u=g(x)$ and rewrite the whole integral using $du=g^{\\prime}(x)\\,dx$. Integrate in $u$, then substitute back.", "sources": [{"page": "Page15", "printed": "7.15", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int(3x+2)^7\\,dx$"], ["Choose", "$u=3x+2$, $dx=\\frac13\\,du$"], ["Rewrite", "$I=\\frac13\\int u^7\\,du$"], ["Integrate", "$I=\\frac{u^8}{24}+C$"], ["Return", "$I=\\frac{(3x+2)^8}{24}+C$"]], "words": true}, "check": {"pages": ["7.15"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "inferred": "Existing complete authored substitution illustration is reordered so its actual given appears before the choice.", "parent": "M2C7-046", "role": "method", "short": "The whole substitution", "treeOrder": 30}, {"id": "M2C7-050", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "common-mistake", "title": "Use one integration variable", "statement": "Use one integration variable in each rewritten integral. Do not leave a mixture of $x$ and $u$ when integrating with respect to $u$.", "sources": [{"page": "Page15", "printed": "7.15", "where": "teacher note"}, {"page": "Page17", "printed": "7.17", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "If $u=x+2$, rewrite $\\int x^2\\sqrt{x+2}\\,dx$ as $\\int(u-2)^2\\sqrt u\\,du$.", "check": {"pages": ["7.15", "7.17"], "date": "2026-10-25", "result": "fixed", "notes": "(unmarked) The visible source-page list omits 7.17, where the displayed source-derived example appears.", "final": "pass"}, "parent": "M2C7-049", "role": "warning", "short": "One integration variable", "treeOrder": 31}, {"id": "M2C7-051", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "common-mistake", "title": "Return to the original variable", "statement": "After integrating in the new variable, substitute back so that the final answer uses the original variable.", "sources": [{"page": "Page15", "printed": "7.15", "where": "margin note"}, {"page": "Page35", "printed": "7.35", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "With $u=3x+2$, $\\frac{u^8}{24}+C$ becomes $\\frac{(3x+2)^8}{24}+C$.", "check": {"pages": ["7.15", "7.35"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-049", "role": "warning", "short": "Restore the original variable", "treeOrder": 32}, {"id": "M2C7-052", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "common-mistake", "title": "Keep the inner derivative factor", "statement": "Knowing $\\int f(x)\\,dx=F(x)+C$ does not ==in general== give $\\int f(g(x))\\,dx=F(g(x))+C$.", "sources": [{"page": "Page16", "printed": "7.16", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "$\\frac{d}{dx}F(g(x))=f(g(x))g^{\\prime}(x)$ contains an extra factor $g^{\\prime}(x)$.", "check": {"pages": ["7.16"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-049", "role": "warning", "short": "Keep the derivative factor", "treeOrder": 33}, {"id": "M2C7-W02", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "explanation", "keyIdea": "K7-4", "level": "core", "sources": [{"page": "Page16", "printed": "7.16", "where": "teacher note"}], "nonFoundation": false, "teacherOnly": false, "inSummary": false, "authored": true, "explains": "M2C7-052", "title": "Why the factor is reversed", "statement": "To find a primitive of $e^{7x-2}$, undo the extra factor $7$ produced by differentiation. The factor $\\frac17$ cancels it.", "remember": "Differentiating $\\frac17e^{7x-2}$ returns $e^{7x-2}$.", "visual": {"type": "table", "head": "row", "rows": [["Candidate primitive", "Derivative"], ["$e^{7x-2}$", "$7e^{7x-2}$"], ["$\\frac17e^{7x-2}$", "$e^{7x-2}$"]], "words": false}, "inferred": "Authored coefficient example illustrating the reverse chain-rule issue; the table compares single primitive functions, not complete indefinite-integral families.", "check": {"pages": ["7.16"], "date": "2026-10-25", "result": "added explanation", "notes": "", "enrich": "2026-10-25", "enrichNotes": ""}, "parent": "M2C7-052", "role": "why", "short": "Why integrating $e^{7x-2}$ needs $\\frac17$", "treeOrder": 34}, {"id": "M2C7-053", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "common-mistake", "title": "Replace every original-variable expression", "statement": "Rewrite every original-variable expression in terms of the new variable before integrating.", "sources": [{"page": "Page17", "printed": "7.17", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "For $u=x+2$, replace $x^2$ by $(u-2)^2$ as well as replacing $\\sqrt{x+2}$ by $\\sqrt u$.", "check": {"pages": ["7.17"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-049", "role": "warning", "short": "Replace every expression", "treeOrder": 35}, {"id": "M2C7-054", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "property", "title": "Different substitutions can work", "statement": "Different suitable substitutions can evaluate the same integral. Each must change the whole integrand and differential consistently.", "sources": [{"page": "Page17", "printed": "7.17", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "For $\\int x^2\\sqrt{x+2}\\,dx$, either $u=x+2$ or $u=\\sqrt{x+2}$ can work.", "check": {"pages": ["7.17"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-049", "role": "contrast", "short": "Different choices can work", "treeOrder": 36}, {"id": "M2C7-055", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "method-idea", "title": "Choosing a suitable substitution", "statement": "There is no general mechanical rule for choosing a suitable substitution; several attempts ==may== be needed.", "sources": [{"page": "Page17", "printed": "7.17", "where": "teacher note"}], "teacherOnly": true, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "extra", "hidden": true, "hiddenWhy": "Choosing a simplifying new variable is already the first step on the complete substitution procedure."}, {"id": "M2C7-056", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "notation", "title": "Write the substitution as a differential", "statement": "The notation $d(g(x))=g^{\\prime}(x)\\,dx$ lets you show a substitution without introducing a new letter.", "sources": [{"page": "Page17", "printed": "7.17", "where": "main text"}, {"page": "Page18", "printed": "7.18", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "$\\int\\frac{dx}{(2x+1)^6}=\\frac12\\int(2x+1)^{-6}\\,d(2x+1)$.", "check": {"pages": ["7.17", "7.18"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-046", "role": "notation", "short": "Write the differential", "treeOrder": 29}, {"id": "M2C7-057", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "method-idea", "title": "Match the inner derivative", "statement": "Identify an inner function and rewrite the remaining factor as a constant multiple of its differential.", "sources": [{"page": "Page18", "printed": "7.18", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inferred": "Examples 7.9 and 7.10 use d(g(x))=g\\prime(x) dx and extract a compensating constant; this states their shared method idea.", "inSummary": false, "keyIdea": "K7-4", "level": "extra", "hidden": true, "hiddenWhy": "Matching the differential is taught in the substitution formula and procedure, and guarded explicitly on 052."}, {"id": "M2C7-058", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "condition", "title": "Positive logarithm arguments", "statement": "When the argument is known to be positive, $\\ln|g(x)|$ can be written as $\\ln g(x)$.", "sources": [{"page": "Page19", "printed": "7.19", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "example": "$e^x+1>0$, so $\\ln|e^x+1|=\\ln(e^x+1)$.", "inSummary": false, "keyIdea": "K7-4", "level": "extra", "hidden": true, "hiddenWhy": "The logarithm domains remain explicit on 023, 059 and 060; this repeated local condition adds no separate revision point."}, {"id": "M2C7-059", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "method-idea", "title": "Recognise a logarithmic primitive", "statement": "For differentiable $g$ with $g(x)\\ne0$, $\\int\\frac{g^{\\prime}(x)}{g(x)}\\,dx=\\ln|g(x)|+C$ on each interval of definition.", "sources": [{"page": "Page19", "printed": "7.19", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inferred": "Example 7.11(c) integrates the reciprocal of an inner expression multiplied by its derivative; the general pattern is made explicit here.", "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "$\\int\\frac{e^x}{e^x+1}\\,dx=\\ln(e^x+1)+C$, since $e^x+1>0$.", "check": {"pages": ["7.19"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-046", "role": "method", "short": "A logarithmic primitive", "treeOrder": 37}, {"id": "M2C7-060", "section": "7.3", "sectionTitle": "Integration by Substitution", "kind": "method-idea", "title": "Logarithms as substitution variables", "statement": "For $x>0$, use $u=\\ln x$ when its differential $du=\\frac1x\\,dx$ simplifies the whole integral.", "sources": [{"page": "Page19", "printed": "7.19", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-4", "level": "core", "example": "$\\int\\frac{\\ln x}{x}\\,dx=\\int u\\,du=\\frac12(\\ln x)^2+C$, where $u=\\ln x$.", "check": {"pages": ["7.19"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-059", "role": "extends", "short": "Substitute a logarithm", "treeOrder": 38}, {"id": "M2C7-061", "section": "7.4 A", "sectionTitle": "Integration Formulas for Trigonometric Functions", "kind": "property", "title": "Integral of cosine", "statement": "With $x$ in radians, $\\int\\cos x\\,dx=\\sin x+C$.", "sources": [{"page": "Page22", "printed": "7.22", "where": "definition box"}, {"page": "Page56", "printed": "7.56", "where": "summary"}], "teacherOnly": false, "nonFoundation": false, "inSummary": true, "keyIdea": "K7-5", "level": "core", "example": "$\\frac{d}{dx}(\\sin x+C)=\\cos x$.", "check": {"pages": ["7.22", "7.56"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "Integrate cosine", "treeOrder": 39, "cluster": "Basic formulas"}, {"id": "M2C7-062", "section": "7.4 A", "sectionTitle": "Integration Formulas for Trigonometric Functions", "kind": "property", "title": "Integral of sine", "statement": "With $x$ in radians, $\\int\\sin x\\,dx=-\\cos x+C$.", "sources": [{"page": "Page22", "printed": "7.22", "where": "definiti 2", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-5", "level": "extra", "hidden": true, "hiddenWhy": "The tangent quotient identity is earlier trigonometry and remains explicit in the tangent-integral method."}, {"id": "M2C7-066", "section": "7.4 A", "sectionTitle": "Integration Formulas for Trigonometric Functions", "kind": "link", "title": "Sine and cosine squared", "statement": "$\\sin^2A+\\cos^2A=1$.", "sources": [{"page": "Page22", "printed": "7.22", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-5", "level": "extra", "hidden": true, "hiddenWhy": "The Pythagorean identity is prerequisite recall and remains explicit in the power methods."}, {"id": "M2C7-067", "section": "7.4 A", "sectionTitle": "Integration Formulas for Trigonometric Functions", "kind": "link", "title": "Tangent and secant squared", "statement": "$1+\\tan^2A=\\sec^2A$.", "sources": [{"page": "Page22", "printed": "7.22", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-5", "level": "extra", "hidden": true, "hiddenWhy": "The tangent-secant identity is prerequisite recall and remains explicit in the secant-power method."}, {"id": "M2C7-068", "section": "7.4 A", "sectionTitle": "Integration Formulas for Trigonometric Functions", "kind": "link", "title": "Double-angle sine", "statement": "$\\sin2A=2\\sin A\\cos A$.", "sources": [{"page": "Page22", "printed": "7.22", "where": "main text"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-5", "level": "extra", "hidden": true, "hiddenWhy": "The double-angle sine identity is prerequisite recall rather than new integration knowledge."}, {"id": "M2C7-069", "section": "7.4 A", "sectionTitle": "Integration Formulas for Trigonometric Functions", "kind": "link", "title": "Reduce cosine squared", "statement": "$\\cos2A=2\\cos^2A-1$, so $\\cos^2A=\\frac12(1+\\ "sources": [{"page": "Page41", "printed": "7.41", "where": "teacher note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-9", "level": "core", "example": "For $\\int x\\cos x\\,dx$, taking $u=\\cos x$, $dv=x\\,dx$ introduces $\\frac12\\int x^2\\sin x\\,dx$.", "check": {"pages": ["7.41"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-112", "role": "warning", "short": "An unhelpful choice", "treeOrder": 76}, {"id": "M2C7-114", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "method-idea", "title": "Treating a logarithm as a product", "statement": "For $x>0$, write $\\ln x=(\\ln x)\\cdot1$, then choose $u=\\ln x$ and $dv=dx$.", "sources": [{"page": "Page42", "printed": "7.42", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inferred": "Restores the final integration in the source logarithm-as-product route, p7.42;115 remains the compact resulting formula.", "inSummary": false, "keyIdea": "K7-9", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int\\ln x\\,dx$, $x>0$"], ["Choose", "$u=\\ln x$, $dv=dx$; $du=\\frac{dx}{x}$, $v=x$"], ["Apply parts", "$I=x\\ln x-\\int dx$"], ["Integrate", "$I=x\\ln x-x+C$"]], "words": true}, "check": {"pages": ["7.42"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "parent": "M2C7-116", "role": "method", "short": "A logarithm times one", "treeOrder": 77}, {"id": "M2C7-115", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "property", "title": "The integral of the natural logarithm", "statement": "For $x>0$, $\\int\\ln x\\,dx=x\\ln x-x+C$.", "sources": [{"page": "Page42", "printed": "7.42", "where": "example"}], "teacherOnly": false, "nonFoundation": false, "inferred": "The formula follows from the worked example; its real logarithm domain is stated explicitly.", "inSummary": false, "keyIdea": "K7-9", "level": "core", "example": "$\\frac{d}{dx}(x\\ln x-x)=\\ln x$.", "check": {"pages": ["7.42"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-114", "role": "consequence", "short": "The logarithm integral", "treeOrder": 78}, {"id": "M2C7-116", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "method-idea", "title": "Matching $u\\,dv$ to the integrand", "statement": "The original integrand with its differential must equal $u\\,dv$. Find $v$ by integrating the factor assigned to $dv$.", "sources": [{"page": "Page42", "printed": "7.42", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inferred": "The Concept Check asks which pair u,v is suitable for integral x ln x dx. This states the underlying distinction rather than copying the question.", "inSummary": false, "keyIdea": "K7-9", "level": "core", "example": "For $\\int x\\ln x\\,dx$, $u=\\ln x$ and $dv=x\\,dx$ give $v=\\frac12x^2$ ($x>0$).", "check": {"pages": ["7.42"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-111", "role": "method", "short": "Match $u\\,dv$", "treeOrder": 74}, {"id": "M2C7-117", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "method-idea", "title": "Repeating integration by parts", "statement": "Repeat parts so that differentiating the polynomial eventually removes it. Choose representative primitives while working, then put one arbitrary constant in the final family.", "sources": [{"page": "Page43", "printed": "7.43", "where": "note"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "keyIdea": "K7-10", "level": "core", "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int x^2e^{2x}\\,dx$; let $J=\\int xe^{2x}\\,dx$"], ["Parts on $I$", "$u=x^2$, $dv=e^{2x}dx$: $I=\\frac12x^2e^{2x}-J$"], ["Parts on $J$", "$u=x$, $dv=e^{2x}dx$: $J=\\frac12xe^{2x}-\\frac12\\int e^{2x}dx$"], ["Integrate $J$", "$J=\\frac12xe^{2x}-\\fr  arbitrary constant when rearranging an indefinite integral. Rescaling that constant by a ==non-zero== number gives another arbitrary constant.", "sources": [{"page": "Page44", "printed": "7.44", "where": "margin note"}], "teacherOnly": false, "nonFoundation": false, "example": "$2I=H(x)+C^{\\prime}$ gives $I=\\frac12H(x)+C$, where $C=\\frac12C^{\\prime}$.", "inSummary": false, "keyIdea": "K7-10", "level": "core", "inferred": "The source rescaling step is written with a general function H and an indefinite integral I; this is an abstract restatement of its working, not a new formula.", "check": {"pages": ["7.44"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": "M2C7-120", "role": "warning", "short": "Keep an arbitrary constant", "treeOrder": 84, "cluster": "The integral returns"}, {"id": "M2C7-122", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "property", "title": "A different initial choice may also work", "statement": "More than one choice of parts can lead to the same indefinite integral.", "sources": [{"page": "Page44", "printed": "7.44", "where": "Q&A"}], "teacherOnly": false, "nonFoundation": false, "inferred": "Think Further confirms that integrating the sine factor first also works for integral e^x sin x dx.", "inSummary": false, "keyIdea": "K7-10", "level": "extra", "hidden": true, "hiddenWhy": "Choosing parts is not unique; that point remains on 112, so a separate general restatement is unnecessary."}, {"id": "M2C7-123", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "method-idea", "title": "Simplifying before choosing parts", "statement": "Use a trigonometric identity to simplify the integrand before choosing parts when that makes the remaining integral easier.", "sources": [{"page": "Page45", "printed": "7.45", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "Completes the existing identity-before-parts illustration, p7.45, through the remaining primitive and collection; J denotes a chosen representative.", "keyIdea": "K7-10", "level": "core", "check": {"pages": ["7.45"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass", "enrich": "2026-10-25", "enrichNotes": ""}, "visual": {"type": "table", "head": "col", "rows": [["Given", "$I=\\int x\\cos^2x\\,dx$"], ["Identity", "$I=\\frac12\\int x\\,dx+\\frac12J$, $J=\\int x\\cos2x\\,dx$"], ["Parts on $J$", "$u=x$, $dv=\\cos2x\\,dx$: $J=\\frac{x\\sin2x}{2}-\\frac12\\int\\sin2x\\,dx$"], ["Integrate $J$", "$J=\\frac{x\\sin2x}{2}+\\frac{\\cos2x}{4}$"], ["Collect", "$I=\\frac{x^2}{4}+\\frac{x\\sin2x}{4}+\\frac{\\cos2x}{8}+C$"]], "words": true}, "parent": null, "role": null, "short": "Simplify before parts", "treeOrder": 81, "cluster": "Repeat or combine"}, {"id": "M2C7-124", "section": "7.6", "sectionTitle": "Integration by Parts", "kind": "method-idea", "title": "Parts with an inverse trigonometric function", "statement": "An inverse trigonometric function can be treated as a product with $1$ when choosing parts.", "sources": [{"page": "Page62", "printed": "7.62", "where": "exercise"}], "teacherOnly": false, "nonFoundation": false, "inSummary": false, "inferred": "The book tests this in Challenging Question 2(b), after the inverse-square-root integral in 2(a); the displayed derivation makes that exercise-only method explicit. It is not a Quick Practice answer.", "keyIdea": "K7-10", "level": "core", "visual": {"type": "table", "head": "row", "rows": [["For $\\int\\sin^{-1}x\\,dx$", "On $-1<x<1$"], ["$u=\\sin^{-1}x$, $dv=dx$", "$du=\\frac{dx}{\\sqrt{1-x^2}}$, $v=x$"], ["Apply parts", "$x\\sin^{-1}x-\\int\\frac{x}{\\sqrt{1-x^2}}\\,dx$"], ["Integrate the remainder", "$x\\sin^{-1}x+\\sqrt{1-x^2}+C$"]], "words": true}, "check": {"pages": ["7.62"], "date": "2026-10-25", "result": "equivalent", "notes": "", "final": "pass"}, "parent": null, "role": null, "short": "An inverse trigonometric function", "treeOrder": 82, "cluster": "Rep   if (state.sum === "out" && inSummary(c)) return false;

  if (state.nf === "nf" && !c.nonFoundation) return false;

  if (c.level && state.lvl === "cs" && c.level === "extra") return false;

    const hay = [c.title, c.short, c.statement, c.example, c.watchOut, c.section, c.sectionTitle, ex("positive"), ex("negative")].join(" ").toLowerCase();

      list.sort((a, b) => (kpos[a.keyIdea] ?? 99) - (kpos[b.keyIdea] ?? 99) || LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level) || String(a.id).localeCompare(String(b.id)));

      if (L.handle.label) label(hx, hy, S.tpl(L.handle.label), S.pos(L.handle.pos) || "right");
    }
  }
  draw();
  if (!live) return wrap;

  // The controls: the choices to switch, then one line with the reading and the hint.
  let queued = false;
  const after = [];
  const redraw = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; draw(); after.forEach(f => f()); typeset(host); });
  };
  if (L.choices) {
    const row = el("div", "livechips");
    row.setAttribute("role", "group");
    const mark = () => row.querySelectorAll("button").forEach((b, j) => { b.classList.toggle("on", j === S.cur.c); b.setAttribute("aria-pressed", String(j === S.cur.c)); });
    L.choices.forEach((tex, i) => {
      const b = rich("button", "", tex);
      b.type = "button";
      b.onclick = e => { e.stopPropagation(); if (S.cur.c === i) return; S.cur.c = i; mark(); wrap.classList.remove("invite"); redraw(); };
      row.appendChild(b);
    });
    mark();
    wrap.appendChild(row);
  }
  if (L.readout || (L.handle && L.hint)) {
    const bar = el("div", "livebar");
    if (L.readout) {
      const rd = el("span", "rd");
      const fill = () => { rd.innerHTML = richHTML(S.tpl(L.readout)); };
      fill();
      after.push(() => { fill(); typeset(rd); });
      bar.appendChild(rd);
    }
    if (L.handle && L.hint) { const h = el("span", "hint"); h.append(icon("drag"), rich("span", "", L.hint)); bar.appendChild(h); }
    wrap.appendChild(bar);
  }
  if (L.handle) {
    // The handle moves only through its allowed values (snap, or min to max in steps), to the one nearest the finger.
    const cands = L.snap ? L.snap.slice() : (() => {
      const st = L.step || (L.max - L.min) / 240, a = [];
      for (let i = 0; L.min + i * st <= L.max + 1e-9; i++) a.push(+(L.min + i * st).toFixed(6));
      return a;
    })();
    const at = t => { const keep = S.cur.t; S.cur.t = t; const q = [X(S.num(L.handle.x)), Y(S.num(L.handle.y))]; S.cur.t = keep; return q; };
    const nearest = (px, py) => {
      let best = S.cur.t, bd = Infinity;
      cands.forEach(t => { const [hx, hy] = at(t), dd = Math.hypot(hx - px, hy - py); if (dd < bd) { bd = dd; best = t; } });
      return best;
    };
    const local = e => { const r = s.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
    const aria = () => wrap.setAttribute("aria-valuetext", plain(S.tpl(L.handle.label || L.readout || "")) || String(S.cur.t));
    const setT = t => { if (t === S.cur.t) return; S.cur.t = t; wrap.setAttribute("aria-valuenow", String(t)); redraw(); };

      wrap.classList.remove("invite");
      try { s.setPointerCapture(e.pointerId); } catch (err) {}
      setT(nearest(...local(e)));
      e.preventDefault();
      e.stopPropagation();
    });
    s.addEventListener("pointermove", e => { if (dragging) setT(nearest(...local(e))); });
    const end = () => { dragging = false; wrap.classList.remove("dragging"); };
    s.addEventListener("pointerup", end);
    s.addEventListener("pointercancel", end);
    // A drag on the graph is not a swipe to the next card.
    host.addEventListener("touchstart", e => e.stopPropagation(), { passive: true });
    host.addEventListener("touchend", e => e.stopPropagation());
    wrap.tabIndex = 0;
    wrap.setAttribute("role", "slider");
    wrap.setAttribute("aria-label", plain(L.hint || "Drag the point"));
    wrap.setAttribute("aria-valuemin", String(cands[0]));
    wrap.setAttribute("aria-valuemax", String(cands[cands.length - 1]));
    wrap.setAttribute("aria-valuenow", String(S.cur.t));
    aria();
    wrap.addEventListener("keydown", e => {
      const step = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key];
      if (!step && e.key !== "Home" && e.key !== "End") return;
      e.preventDefault();
      e.stopPropagation();
      wrap.classList.remove("invite");
      let i = 0, bd = Infinity;
      cands.forEach((t, j) => { if (Math.abs(t - S.cur.t) < bd) { bd = Math.abs(t - S.cur.t); i = j; } });
      i = e.key === "Home" ? 0 : e.key === "End" ? cands.length - 1 : Math.max(0, Math.min(cands.length - 1, i + step));
      setT(cands[i]);
    });
  }
  return wrap;
}

// A figure without axes: a bar model, a labelled fraction, a geometry shape. Shapes sit on a w × h canvas with
// y downwards; labels are KaTeX, placed like graph labels. Chapter-neutral, drawn in the graph's ink.
function figureEl(v) {
  const W = v.w || 300, H = v.h || 180;
  const wrap = el("div", "vis figure");
  if (v.maxw) wrap.style.setProperty("--fw", v.maxw + "px");
  wrap.dataset.need = Math.min(W, v.maxw || 420);   // the width its labels were placed for (fitCard)
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  if (v.alt) s.setAttribute("aria-label", v.alt);
  wrap.appendChild(s);
  const ink = "#1b2230", muted = "#8a96a8";
  const FILL = { none: "none", tint: "#dce7f8", soft: "#eef1f5", warm: "#f6e7c8" };
  // "bold": a flow-chart arrow, thicker and with a bigger head (teacher, 8 October 2026: thin arrows were not seen as a flow).
  const pen = st => ({ stroke: st === "fill-only" ? "none" : st === "muted" || st === "dashed" ? muted : ink,
                       "stroke-width": st === "fill-only" ? 0 : st === "muted" || st === "dashed" ? 1.2 : st === "bold" ? 2.6 : 1.6,
                       "stroke-dasharray": st === "dashed" ? "5 4" : "none", "stroke-linejoin": "round" });
  const head = (xa, ya, xb, yb, colour, L = 6) => {
    const a = Math.atan2(yb - ya, xb - xa);
    svg("path", { d: `M${xb},${yb} L${xb - L * Math.cos(a - 0.4)},${yb - L * Math.sin(a - 0.4)} L${xb - L * Math.cos(a + 0.4)},${yb - L * Math.sin(a + 0.4)} Z`, fill: colour }, s);
  };
  const pts = list => list.map(p => p.join(",")).join(" ");
  (v.shapes || []).forEach(g => {
    const fill = FILL[g.fill || "none"] || "none";
    if (g.rect) { const [x, y, w, h] = g.rect; svg("rect", { x, y, width: w, height: h, fill, ...pen(g.style) }, s); }
    else if (g.poly) svg("polygon", { points: pts(g.poly), fill, ...pen(g.style) }, s);
    else if (g.path) svg("polyline", { points: pts(g.path), fill: "none", ...pen(g.style) }, s);
    else if (g.line) {
      const [[x1, y1], [x2, y2]] = g.line, p = pen(g.style);
      svg("line", { x1, y1, x2, y2, ...p }, s);
      const L = g.style === "bold" ? 11 : 6;
      if (g.arrows === "end" || g.arrows === "both") head(x1, y1, x2, y2, p.stroke, L);
      if (g.arrows === "both") head(x2, y2, x1, y1, p.stroke, L);
    }
  });
  (v.labels || []).forEach(t => {
    const sp = el("span", "vlab" + (t.bare ? " bare" : ""), t.tex);
    sp.style.left = (t.x / W * 100) + "%";
    sp.style.top = (t.y / H * 100) + "%";
    sp.style.transform = LABEL_POS[t.pos] || "translate(-50%,-50%)";
    if (t.size) sp.style.fontSize = (0.74 * t.size) + "em";
    wrap.appendChild(sp);
  });
  return wrap;
}

function railEl(item) {

// ---- The map slide: a group's whole tree, laid out left to right ----
function mapSlideEl(item, host) {
  const { tree, k } = item;
  const sec = el("section", "mapslide");
  sec.appendChild(el("h2", "", k.title));
  sec.appendChild(rich("p", "lede", k.summary || ""));
  // The idea's revision line: where its checks stand, when, and a fresh start for the whole group.
  const recMap = recLoad(DATA[state.ch]);
  const line = ideaCheckEl(DATA[state.ch], k, tree);
  if (line) sec.appendChild(line);
  const wrap = el("div", "tmap-wrap");
  const map = el("div", "tmap");
  wrap.appendChild(map);
  sec.appendChild(wrap);
  sec.appendChild(el("p", "maphint", "Tap any branch to open it, or press Next to start at the root."));

  // Rows: each leaf takes a row; a parent sits level with the middle of its children.
  let row = 0, maxDepth = 0;
  const clusters = [];
  const place = n => {
    n.x0 = 0;   // the column offset of a cluster placed side by side (below); a tree is laid out afresh each time
    maxDepth = Math.max(maxDepth, n.depth);
    if (n.joins && n.joins.length && !n.kids.length) n.row = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length;
    else if (n.joins && n.joins.length) {
      // A converging card with children sits level with the cards it joins: its children use the rows beside them
      // (the columns to its right are empty up there), so the arrows run straight across instead of dropping down.
      const leaves = m => (m.kids.length ? m.kids.reduce((a, k) => a + leaves(k), 0) : 1);
      const mid = n.joins.reduce((a, j) => a + j.row, 0) / n.joins.length, saved = row;
      row = Math.max(Math.min(...n.joins.map(j => j.row)), mid - (leaves(n) - 1) / 2);
      n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2;
      row = Math.max(saved, row);
    }
    else if (!n.kids.length) n.row = row++;
    else { n.kids.forEach(place); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; }
  };
  let lastCluster;
  tree.roots.forEach(r => {
    if (r.c.cluster && r.c.cluster !== lastCluster) {
      if (clusters.length) row += 0.6;
      clusters.push({ label: r.c.cluster, start: row, nodes: [] });
      row += 0.75;
      lastCluster = r.c.cluster;
    }
    place(r);
    if (clusters.length) {
      const walk = n => { clusters[clusters.length - 1].nodes.push(n); n.kids.forEach(walk); };
      walk(r);
      clusters[clusters.length - 1].end = row;
    }
  });
  let ROW = 90;
  const GAP = 56;
  // The slide's content is capped at 1040px, so size the columns to that, not to the stage.
  const avail = Math.max(320, Math.min(1040, (host.clientWidth || 900) - 40) - 8);
  const COL = Math.max(170, Math.min(270, Math.floor((avail + GAP) / (maxDepth + 1)) - GAP));
  map.style.width = ((maxDepth + 1) * (COL + GAP) - GAP) + "px";
  map.style.height = (row * ROW + 10) + "px";
  const els = new Map();
  tree.order.forEach(n => {
    // A branch that feeds a converging card holds its details: its root is an ordinary box, and the converging card
    // is the major (dark) card. One rule for every such root, so equal branches look equal (checker, 9 October 2026).
    const joined = new Set(tree.order.flatMap(m => m.joins || []));
    const under = m => joined.has(m) || m.kids.some(under);
    const tops = tree.roots.filter(m => !(m.joins && m.joins.length));
    const feeds = !n.parent && !(n.joins && n.joins.length) && under(n) && (!n.kids.length || tops.every(under));
    const b = el("button", "mnode" + (!n.parent && !feeds ? " root" : "") + (n.joins && n.joins.length ? " join" : ""));
    if (n.c.role) b.appendChild(roleTag(n.c.role, "role"));
    else if (n.joins && n.joins.length) b.appendChild(roleTag("joins", "role"));
    b.appendChild(rich("span", "", shortOf(n.c)));
    const st = cardState(DATA[state.ch], n.c.id, recMap) || waitMark(DATA[state.ch], n.c);
    if (st) b.appendChild(stateIcon(st));
    else if (state.seen.has(n.c.id)) b.appendChild(icon("seen", "seen"));
    b.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";
    b.style.top = (n.row * ROW + ROW / 2) + "px";
    b.style.maxWidth = COL + "px";
    b.style.transitionDelay = (n.depth * 110) + "ms";
    b.onclick = () => jumpTo(n.c.id);
    map.appendChild(b);
    els.set(n, b);
  });
  clusters.forEach(cl => {
    const lab = el("div", "cl-label", cl.label);
    lab.style.left = "0px";
    lab.style.top = (cl.start * ROW) + "px";
    map.appendChild(lab);
  });
  const svgEl = svg("svg", { class: "edges" });
  map.prepend(svgEl);

  // Once laid out: draw the edges between measured boxes, frame clusters, and fit to the width.
  requestAnimationFrame(() => {
    // Rows tighten before anything is scaled, so labels stay full-size where possible, but a row is never
    // shorter than the tallest box plus a gap: on short laptop screens squeezed rows piled boxes on top of
    // each other and buried the bottom branch. Past that point the whole map scales down instead.
    const hint = sec.querySelector(".maphint");
    const freeH = host.getBoundingClientRect().bottom - wrap.getBoundingClientRect().top - (hint ? hint.offsetHeight : 20) - 24;
    // A formula cannot wrap: a box with nothing to its right (a leaf) widens to hold it, so no label spills out of its
    // box and no arrow starts inside the formula (9 October 2026, "sin^2 x + cos^2 x = 1").
    tree.order.forEach(n => { const e = els.get(n); if (!n.kids.length && e.scrollWidth > e.clientWidth + 1) e.style.maxWidth = (e.scrollWidth + 2) + "px"; });
    // The height a row needs (9 October 2026): a box only needs room across the rows it spans. A parent between two
    // rows may be twice as tall as a leaf, so one tall root no longer makes every row tall (trees ran out of height
    // in landscape while half the width stayed empty).
    const span = n => { if (n._lo === undefined) { const ks = n.kids.length ? n.kids : (n.joins || []);
                          const lo = ks.length ? Math.min(...ks.map(k => span(k)[0])) : n.row, hi = ks.length ? Math.max(...ks.map(k => span(k)[1])) : n.row;
                          n._lo = lo; n._hi = hi; } return [n._lo, n._hi]; };
    const rowNeed = () => { tree.order.forEach(n => { delete n._lo; delete n._hi; });
                            return Math.max(...tree.order.map(n => { const [lo, hi] = span(n); return (els.get(n).offsetHeight + 14) / (hi - lo + 1); })); };

    // on the iPad while most of the slide's width stayed empty. With two or more clusters, also try two columns of
    // clusters, and keep the layout that draws larger. A tree without clusters is unchanged.
    if (clusters.length > 1) {

      // beside a two-column one no longer reserves six columns of width.

      const span = (maxDepth + 1) * (COL + GAP) - GAP;
      const fit = (rows, w) => { const R = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, rows)));
                                 return Math.min(1.4, avail / (w + 16), freeH / (rows * R + 10)); };
      let best = 1, bestFit = 0, X2 = 0, wide = 0, bestRows = row;
      for (let i = 1; i < clusters.length; i++) {
        const rows = Math.max(clusters[i - 1].end, row - clusters[i].start);
        const a = spanOf(clusters.slice(0, i)), b = spanOf(clusters.slice(i)), f = fit(rows, a + 48 + b);
        if (f > bestFit) { best = i; bestFit = f; bestRows = rows; X2 = a + 48; wide = a + 48 + b; }
      }
      if (bestFit > fit(row, span) + 0.05) {
        const shift = clusters[best].start;
        clusters.slice(best).forEach(cl => {
          cl.start -= shift; cl.x0 = X2;
          cl.nodes.forEach(n => { n.row -= shift; n.x0 = X2; });
        });
        row = bestRows;
        map.style.width = wide + "px";   // first, or the second column's boxes are squeezed and wrap
        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px";
                                  e.style.top = (n.row * ROW + ROW / 2) + "px"; });
        clusters.forEach((cl, i) => { const lab = map.querySelectorAll(".cl-label")[i];
                                      lab.style.left = (cl.x0 || 0) + "px"; lab.style.top = (cl.start * ROW) + "px"; });
        map.style.height = (row * ROW + 10) + "px";
        nodeH = rowNeed() - 14;
      }
    }
    // Two lanes (9 October 2026): a tall tree with one root ran out of height while half the slide's width stayed
    // empty. When it draws clearly larger, the root sits on top and its branches run in two lanes side by side, in
    // reading order (the first lane, then the second); a trunk line joins the root to each branch. Trees with
    // clusters or converging cards keep their own layout.
    let lanes = null;
    const LTOP = 1.15, INDENT = 30;
    if (!clusters.length && tree.roots.length === 1 && !tree.order.some(m => m.joins && m.joins.length) && tree.roots[0].kids.length >= 2) {
      const root = tree.roots[0], kids = root.kids;
      const leaves = n => (n.kids.length ? n.kids.reduce((a, k) => a + leaves(k), 0) : 1);
      const depthOf = n => Math.max(n.depth, ...n.kids.map(depthOf));
      const fitOf = (rows, w) => { const R = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, rows)));
                                   return Math.min(1.4, avail / (w + 16), freeH / (rows * R + 10)); };
      let best = null;
      for (let i = 1; i < kids.length; i++) {
        const A = kids.slice(0, i), B = kids.slice(i);
        const la = A.reduce((a, k) => a + leaves(k), 0), lb = B.reduce((a, k) => a + leaves(k), 0);
        const wa = Math.max(...A.map(depthOf)) * (COL + GAP) - GAP, wb = Math.max(...B.map(depthOf)) * (COL + GAP) - GAP;
        const w = Math.max(els.get(root).offsetWidth, INDENT + wa + 56 + INDENT + wb), rows = LTOP + Math.max(la, lb);
        const f = fitOf(rows, w);
        if (!best || f > best.f) best = { A, B, rows, w, f, xb: INDENT + wa + 56 };
      }
      if (best && best.f > fitOf(row, (maxDepth + 1) * (COL + GAP) - GAP) + 0.08) {
        lanes = { root, laneOf: new Map(), trunk: [INDENT / 2, best.xb + INDENT / 2] };
        root.row = 0; root.x0 = 0;
        [[best.A, 0], [best.B, best.xb]].forEach(([group, lx], li) => {
          let r = LTOP;
          const put = n => { n.x0 = lx + INDENT - (COL + GAP); lanes.laneOf.set(n, li);
                             if (!n.kids.length) n.row = r++; else { n.kids.forEach(put); n.row = (n.kids[0].row + n.kids[n.kids.length - 1].row) / 2; } };
          group.forEach(put);
        });
        row = best.rows;
        map.style.width = best.w + "px";
        tree.order.forEach(n => { const e = els.get(n); e.style.left = ((n.x0 || 0) + n.depth * (COL + GAP)) + "px"; e.style.top = (n.row * ROW + ROW / 2) + "px"; });
        map.style.height = (row * ROW + 10) + "px";
        nodeH = Math.max(rowNeed(), (els.get(root).offsetHeight + 14) / LTOP) - 14;
      }
    }
    const tight = Math.max(nodeH + 14, Math.min(90, freeH / Math.max(1, row)));
    if (Math.abs(tight - ROW) > 0.5) {
      ROW = tight;

  // Open on the card in the URL, otherwise on the first chapter that has key ideas.
  state.teacher = false; // Public export always opens the student view.
  try { state.railOpen = localStorage.getItem("kc-rail") !== "0"; } catch (err) {}
  state.debug = false; // No debug switch in the public export.
  applyMode();
  document.getElementById("ttoggle").classList.toggle("on", state.teacher);
  // Open on the card in the address; otherwise on the home screen (choose a form, then a chapter).
  if (!readHash()) { state.ch = Math.max(0, DATA.findIndex(MODE === "student" ? live : c => c.chapter), 0); state.home = true; }
  renderAll();
});
// KaTeX loads after this script; typeset again once it is ready.
window.addEventListener("load", () => typeset(document.getElementById("body")));
</script>
</body>
</html>
